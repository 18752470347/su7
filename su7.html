*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100%;background:#F2F2F7}
html{-webkit-text-size-adjust:100%}
body{
min-height:100dvh;display:flex;flex-direction:column;align-items:center;
padding-bottom:calc(env(safe-area-inset-bottom,0px) + 2px);
font-family:-apple-system,BlinkMacSystemFont,"MiSans","PingFang SC","Noto Sans SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;
color:var(--text-main);overflow-x:hidden
}
:root{
--text-main:#1C1C1E;--text-sub:#3A3A3C;--text-muted:#8E8E93;
--bg-primary:#F2F2F7;--glass-bg:rgba(255,255,255,.28);--glass-border:rgba(255,255,255,.65);
--glass-shadow:0 8px 32px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.02);
--status-color:#1C1C1E;--toast-bg:rgba(20,22,28,.78);--viewer-bg:rgba(0,0,0,.85);
--name-gradient:linear-gradient(90deg,#FF1744,#FF6D00,#FFD600,#00E676,#00B0FF,#AA00FF,#FF1744);
--line1-gradient:linear-gradient(90deg,#FF3D71,#FF8A00,#FFD600,#00E5A0,#00B4FF,#B44CFF,#FF3D71);
--line2-gradient:linear-gradient(90deg,#00B4FF,#6A5CFF,#FF3D71,#FFD600,#00E676,#00B4FF);
--island-bg:rgba(255,255,255,.8);--island-text:#1C1C1E;--glow-color:#FF2E63;
--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.22,1,.36,1);
--card-radius:20px;--icon-radius:14px;--avatar-size:62px;--plate-size:74px;
--shadow-medium:0 12px 48px rgba(0,0,0,.10);--shadow-strong:0 20px 60px rgba(0,0,0,.15);
--transition-smooth:all .5s cubic-bezier(.34,1.56,.64,1);
--status-btn-size:30px;--status-btn-gap:6px;
--weather-temp-color:#0A0A0C;--weather-desc-color:#FF6B00;--weather-loc-color:#1C1C1E;
--weather-wind-color:#007AFF;--weather-minmax-color:#8E8E93;
--calendar-year-color:#0A0A0C;--calendar-weekday-color:#FF3B30;--calendar-lunar-color:#7B61FF;
--app-label-color:#1C1C1E
}
html.dark-mode{
--text-main:#F5F5F7;--text-sub:#A1A1A6;--text-muted:#6E6E73;--bg-primary:#0A0A0C;
--glass-bg:rgba(44,44,46,.25);--glass-border:rgba(255,255,255,.06);
--glass-shadow:0 8px 40px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.2);
--status-color:#F5F5F7;--toast-bg:rgba(60,60,66,.85);--viewer-bg:rgba(0,0,0,.92);
--name-gradient:linear-gradient(90deg,#FF4D8D,#FFA000,#FFEA00,#00FFB3,#00C3FF,#D04CFF,#FF4D8D);
--line1-gradient:linear-gradient(90deg,#FF6BA8,#FFB300,#FFEE58,#33FFC6,#33CCFF,#E066FF,#FF6BA8);
--line2-gradient:linear-gradient(90deg,#33CCFF,#8B7BFF,#FF6BA8,#FFEE58,#33FFC6,#33CCFF);
--island-bg:rgba(20,20,24,.8);--island-text:#fff;--glow-color:#00D4FF;
--shadow-medium:0 12px 48px rgba(0,0,0,.4);--shadow-strong:0 20px 60px rgba(0,0,0,.5);
--weather-temp-color:#FFFFFF;--weather-desc-color:#FFB84D;--weather-loc-color:#F5F5F7;
--weather-wind-color:#4DA3FF;--weather-minmax-color:#A1A1A6;
--calendar-year-color:#FFFFFF;--calendar-weekday-color:#FF6B6B;--calendar-lunar-color:#A78BFF;
--app-label-color:#F5F5F7;
background-color:#0A0A0C;color:#F5F5F7
}
html.dark-mode body{background:#0A0A0C;color:#F5F5F7}
html.transitioning body,html.transitioning .app-container,html.transitioning .top-card,
html.transitioning .video-player-container,html.transitioning .main-card,
html.transitioning .calendar-date-block,html.transitioning .dynamic-island,
html.transitioning .toast,html.transitioning .viewer,
html.transitioning .month-calendar-panel,html.transitioning .city-picker-panel{
transition:background-color .4s var(--ease),color .4s var(--ease),border-color .4s var(--ease),box-shadow .4s var(--ease),opacity .4s var(--ease)
}
button{font:inherit;cursor:pointer;background:none;border:none;outline:none;color:inherit}
.icon{display:block;width:1em;height:1em;fill:currentColor;flex-shrink:0;pointer-events:none}
img,video,button,.app-button,.plate-photo,.avatar-center{-webkit-touch-callout:none;-webkit-user-drag:none;user-select:none}
button,.app-button,.status-theme-toggle,.center-play-btn,.btn-expand{touch-action:manipulation}
.viewer-img{-webkit-touch-callout:default}
.app-container{
display:flex;flex-direction:column;align-items:center;width:100%;max-width:480px;
padding:calc(var(--safe-top) + 6px) 12px calc(var(--safe-bottom) + 2px);
margin:auto 0;gap:8px;position:relative;z-index:2
}
.status-bar-container{width:100%;flex-shrink:0;padding-bottom:2px}
.ios-status-bar{width:100%;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:600;color:var(--status-color);min-height:30px;padding:0 2px}
.ios-status-left{flex:1;display:flex;align-items:center;gap:var(--status-btn-gap);min-width:0;font-size:13px;letter-spacing:.2px}
.status-theme-toggle{
width:var(--status-btn-size);height:var(--status-btn-size);min-width:var(--status-btn-size);min-height:var(--status-btn-size);
border-radius:50%;background:var(--glass-bg);backdrop-filter:blur(16px) saturate(180%);
border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);color:var(--status-color);
display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:var(--transition-smooth)
}
.status-theme-toggle .icon{width:15px;height:15px;color:#FFB800}
.status-theme-toggle:active{transform:scale(.85)}
html.dark-mode .status-theme-toggle .icon{color:#FFD93D}
.dynamic-island{
display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 14px;min-width:50px;
background:var(--island-bg);border-radius:20px;color:var(--island-text);font-size:10px;font-weight:500;
backdrop-filter:blur(16px);border:1px solid var(--glass-border);flex-shrink:0;margin:0 var(--status-btn-gap);
overflow:hidden;pointer-events:none;box-shadow:0 4px 24px rgba(0,0,0,.06),inset 0 .5px 0 rgba(255,255,255,.5)
}
.island-text-scroll{
display:inline-block;font-weight:600;font-size:10px;white-space:nowrap;
background:linear-gradient(90deg,#FF6B9E,#FFD966,#6AA9FF,#FF6B9E);
-webkit-background-clip:text;background-clip:text;color:transparent
}
.ios-status-right{flex:1;display:flex;justify-content:flex-end;align-items:center;gap:var(--status-btn-gap)}
.signal-icon{width:16px;height:10px;fill:var(--status-color);flex-shrink:0;opacity:.8}
.top-card{
width:100%;flex-shrink:0;background:var(--glass-bg);backdrop-filter:blur(24px) saturate(180%);
border:1px solid var(--glass-border);border-radius:var(--card-radius);box-shadow:var(--glass-shadow);
padding:8px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:center;gap:4px;
transition:var(--transition-smooth);position:relative
}
.weather-widget{
display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-width:0;
cursor:pointer;border-radius:12px;padding:2px;transition:var(--transition-smooth)
}
.weather-widget:active{transform:scale(.97)}
.weather-icon{font-size:24px;line-height:1;color:#FF9500;flex-shrink:0;filter:drop-shadow(0 2px 14px rgba(255,149,0,.45))}
html.dark-mode .weather-icon{color:#FFD966}
.weather-info{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:0}
.weather-temp{font-size:17px;font-weight:900;color:var(--weather-temp-color);letter-spacing:-.5px;line-height:1.2}
.weather-minmax{font-size:10px;font-weight:800;color:var(--weather-minmax-color);display:flex;gap:3px;white-space:nowrap;line-height:1.2}
.weather-minmax .max-temp{color:#FF3B30}
html.dark-mode .weather-minmax .max-temp{color:#FF6B6B}
.weather-minmax .min-temp{color:#007AFF}
html.dark-mode .weather-minmax .min-temp{color:#4DA3FF}
.weather-desc{font-size:11px;font-weight:800;color:var(--weather-desc-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weather-location{font-size:10px;font-weight:800;color:var(--weather-loc-color);display:flex;align-items:center;gap:3px;margin-top:1px}
.weather-location .icon{width:10px;height:10px;color:#FF3B30}
html.dark-mode .weather-location .icon{color:#FF6B6B}
.weather-wind{font-size:10px;font-weight:800;color:var(--weather-wind-color);display:flex;align-items:center;gap:3px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.weather-wind .icon{width:10px;height:10px;color:var(--weather-wind-color)}
.avatar-center-wrap{display:flex;align-items:center;justify-content:center;flex-shrink:0;padding:0 2px}
.avatar-center{position:relative;width:var(--avatar-size);height:var(--avatar-size);border-radius:50%;cursor:zoom-in;flex-shrink:0}
.avatar-center::before{
content:'';position:absolute;inset:-12px;border-radius:50%;
background:radial-gradient(circle,var(--glow-color) 0%,transparent 70%);
opacity:.45;z-index:-1;filter:blur(24px);transform:scale(.7)
}
.avatar-ring{position:absolute;inset:-3px;border-radius:50%;z-index:-1;opacity:.85;
background:conic-gradient(from 0deg,var(--glow-color),#FFD046,#00D4FF,#7B61FF,var(--glow-color));filter:blur(4px)}
.avatar-ring-2{position:absolute;inset:-6px;border-radius:50%;z-index:-2;opacity:.4;
background:conic-gradient(from 180deg,#7B61FF,#00D4FF,#FF6B9E,#7B61FF);filter:blur(8px)}
.avatar-center img{width:100%;height:100%;border-radius:50%;object-fit:cover;position:relative;z-index:1;
border:2px solid rgba(255,255,255,.15);box-shadow:0 4px 24px rgba(0,0,0,.35);transition:var(--transition-smooth)}
html.dark-mode .avatar-center img{border-color:rgba(255,255,255,.25)}
.calendar-widget{
display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-width:0;
cursor:pointer;border-radius:12px;padding:2px;transition:var(--transition-smooth)
}
.calendar-widget:active{transform:scale(.97)}
.calendar-date-block{
display:flex;flex-direction:column;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;
background:linear-gradient(135deg,#FF2E63,#FF0055);color:#fff;flex-shrink:0;
box-shadow:0 4px 18px rgba(255,46,99,.45);position:relative;overflow:hidden
}
.calendar-date-block.holiday{background:linear-gradient(135deg,#00E676,#00B248);box-shadow:0 4px 18px rgba(0,230,118,.5)}
.calendar-date-block.workday{background:linear-gradient(135deg,#FF9100,#FF6D00);box-shadow:0 4px 18px rgba(255,145,0,.5)}
.calendar-day-num{font-size:18px;font-weight:900;line-height:1;letter-spacing:-.5px;text-shadow:0 1px 2px rgba(0,0,0,.15)}
.calendar-day-label{font-size:8px;font-weight:800;opacity:.95;letter-spacing:.5px}
.calendar-info{display:flex;flex-direction:column;gap:1px;min-width:0}
.calendar-year-month{font-size:12px;font-weight:900;color:var(--calendar-year-color);white-space:nowrap}
.calendar-weekday{font-size:10px;font-weight:800;color:var(--calendar-weekday-color);white-space:nowrap}
.calendar-lunar{font-size:9px;font-weight:800;color:var(--calendar-lunar-color);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calendar-holiday-tag{font-size:8px;font-weight:900;padding:1px 6px;border-radius:5px;margin-top:1px;width:fit-content;white-space:nowrap}
.calendar-holiday-tag.holiday{background:linear-gradient(135deg,#00E676,#00B248);color:#fff;box-shadow:0 2px 8px rgba(0,230,118,.4)}
.calendar-holiday-tag.workday{background:linear-gradient(135deg,#FF9100,#FF6D00);color:#fff;box-shadow:0 2px 8px rgba(255,145,0,.4)}
.calendar-holiday-tag.normal{background:rgba(142,142,147,.18);color:#636366}
html.dark-mode .calendar-holiday-tag.normal{background:rgba(142,142,147,.25);color:#AEAEB2}
.city-picker-overlay,.month-calendar-overlay{
position:fixed;inset:0;z-index:10100;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;
transition:opacity .3s var(--ease),visibility .3s var(--ease)
}
.city-picker-overlay.show,.month-calendar-overlay.show{opacity:1;visibility:visible}
.city-picker-panel,.month-calendar-panel{
width:100%;max-width:480px;background:var(--bg-primary);border-radius:24px 24px 0 0;
padding:20px 20px calc(20px + var(--safe-bottom));transform:translateY(100%);
transition:transform .4s var(--spring);overflow-y:auto
}
.city-picker-panel{max-height:70vh}
.month-calendar-panel{max-height:85vh}
.city-picker-overlay.show .city-picker-panel,.month-calendar-overlay.show .month-calendar-panel{transform:translateY(0)}
.city-picker-header,.month-calendar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.city-picker-title,.month-calendar-title{font-size:17px;font-weight:700;color:var(--text-main)}
.city-picker-close,.month-calendar-close,.month-calendar-nav button{
width:32px;height:32px;border-radius:50%;background:var(--glass-bg);border:1px solid var(--glass-border);
color:var(--text-sub);display:flex;align-items:center;justify-content:center;font-size:14px;transition:var(--transition-smooth)
}
.month-calendar-nav{display:flex;gap:8px}
.month-calendar-nav button{width:34px;height:34px}
.city-picker-close:active,.month-calendar-close:active,.month-calendar-nav button:active{transform:scale(.88)}
.city-search-input{
width:100%;padding:12px 16px;border-radius:14px;border:1px solid var(--glass-border);background:var(--glass-bg);
color:var(--text-main);font-size:15px;outline:none;margin-bottom:16px;transition:var(--transition-smooth)
}
.city-search-input:focus{border-color:#34C759;box-shadow:0 0 0 3px rgba(52,199,89,.15)}
.city-search-input::placeholder{color:var(--text-muted)}
.city-list{display:flex;flex-direction:column;gap:6px}
.city-item{
padding:12px 16px;border-radius:12px;background:var(--glass-bg);border:1px solid var(--glass-border);
color:var(--text-main);font-size:14px;font-weight:500;cursor:pointer;transition:var(--transition-smooth);
display:flex;align-items:center;justify-content:space-between
}
.city-item:active{transform:scale(.98);background:rgba(52,199,89,.1)}
.city-item .city-province{font-size:11px;color:var(--text-muted);font-weight:400}
.month-calendar-weekdays{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:8px}
.month-calendar-weekdays span{text-align:center;font-size:11px;font-weight:600;color:var(--text-muted);padding:4px 0}
.month-calendar-weekdays span.weekend{color:#FF6B9E}
.month-calendar-days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month-calendar-day{
aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-radius:10px;
font-size:14px;font-weight:500;color:var(--text-main);cursor:pointer;position:relative;
transition:var(--transition-smooth);border:1px solid transparent
}
.month-calendar-day:active{transform:scale(.92)}
.month-calendar-day.other-month{color:var(--text-muted);opacity:.35}
.month-calendar-day.festival{background:rgba(255,107,158,.10)}
.month-calendar-day.festival .day-festival{font-weight:800}
.month-calendar-day.today{background:rgba(52,199,89,.15);border-color:#34C759;font-weight:700;color:#34C759}
.month-calendar-day.selected{background:linear-gradient(135deg,#34C759,#28A745);color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(52,199,89,.35)}
.month-calendar-day.holiday{color:#34C759;font-weight:700}
.month-calendar-day.workday{color:#FF9500;font-weight:700}
.month-calendar-day .day-lunar{font-size:8px;color:var(--text-muted);margin-top:1px;line-height:1;white-space:nowrap;overflow:hidden;max-width:100%}
.month-calendar-day.selected .day-lunar{color:rgba(255,255,255,.85)}
.month-calendar-day .day-tag{position:absolute;top:1px;right:1px;font-size:8px;font-weight:800;line-height:1;padding:1px 3px;border-radius:4px;color:#fff}
.month-calendar-day .day-tag.rest{background:#34C759}
.month-calendar-day .day-tag.work{background:#FF9500}
.month-calendar-day.selected .day-tag.rest,.month-calendar-day.selected .day-tag.work{background:rgba(255,255,255,.35);color:#fff}
.month-calendar-day .day-festival{font-size:7px;font-weight:700;color:#FF6B9E;line-height:1;white-space:nowrap;overflow:hidden;max-width:100%}
.month-calendar-day.selected .day-festival{color:rgba(255,255,255,.9)}
.video-player-container{
width:100%;flex:0 0 auto;border-radius:var(--card-radius);overflow:hidden;background:#0A0A0C;
border:1px solid var(--glass-border);box-shadow:var(--shadow-medium);position:relative;transition:var(--transition-smooth)
}
.video-box{position:relative;width:100%;aspect-ratio:16/9;background:#0A0A0C;overflow:hidden;touch-action:pan-y;overscroll-behavior:contain}
.video-box video{display:block;width:100%;height:100%;object-fit:cover;background:#0A0A0C;transform:translateZ(0);backface-visibility:hidden}
.hidden{opacity:0!important;pointer-events:none!important;transform:translateY(12px)!important}
.video-controls{
position:absolute;bottom:0;left:0;width:100%;padding:6px 10px 8px;z-index:3;
transition:opacity .4s var(--ease),transform .4s var(--ease)
}
.controls-row{display:flex;align-items:center;gap:10px}
.controls-row button,.btn-expand{
color:rgba(255,255,255,.95);font-size:16px;opacity:.95;transition:all .2s var(--ease);
min-width:26px;min-height:26px;display:flex;align-items:center;justify-content:center;
background:transparent;border:none;text-shadow:0 1px 6px rgba(0,0,0,.8)
}
.controls-row button:active,.btn-expand:active{opacity:.7;transform:scale(.88)}
.btn-expand{font-size:14px}
.controls-time{
margin-left:auto;color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;gap:6px;
letter-spacing:.3px;text-shadow:0 1px 4px rgba(0,0,0,.8)
}
.main-card-container{width:100%;flex:0 0 auto;position:relative;display:flex;flex-direction:column;justify-content:flex-start}
.main-card{
width:100%;padding:10px 12px 12px;border-radius:var(--card-radius);background:var(--glass-bg);
backdrop-filter:blur(24px) saturate(180%);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);
position:relative;display:flex;flex-direction:column;justify-content:center;align-items:stretch;
transition:var(--transition-smooth);gap:8px
}
.main-card::before{
content:'';position:absolute;top:0;left:10%;width:80%;height:1px;pointer-events:none;opacity:.5;
background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent)
}
.profile-row{display:flex;align-items:center;justify-content:center;gap:16px;width:100%;flex-shrink:0}
.profile-left{flex:0 1 auto;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.plate-photo{width:var(--plate-size);flex-shrink:0;border-radius:10px;cursor:zoom-in;position:relative}
.plate-photo-inner{
position:relative;width:100%;border-radius:10px;box-shadow:var(--shadow-medium);
aspect-ratio:9/16;overflow:hidden;border:1px solid var(--glass-border);transition:var(--transition-smooth);z-index:1
}
.stack-img{

const toastEl=$('#toast');
let toastTimer=0;
function toast(msg){
toastEl.textContent=msg;
toastEl.classList.add('show');
clearTimeout(toastTimer);
toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1600);
}

const root=document.documentElement;
const themeMeta=$('meta[name="theme-color"]');
const schemeMeta=$('meta[name="color-scheme"]');
const themeBtn=$('#statusThemeToggle');
const themeIcon=$('#statusThemeIcon');
let isDark=root.classList.contains('dark-mode');

function applyTheme(dark){
isDark=dark;
root.classList.toggle('dark-mode',dark);
const use=themeIcon.querySelector('use');if(use)use.setAttribute('href',dark?'#i-moon-fill':'#i-sun-fill');
if(themeMeta)themeMeta.setAttribute('content',dark?'#0A0A0C':'#F2F2F7');
if(schemeMeta)schemeMeta.setAttribute('content',dark?'dark':'light dark');
}
function setTheme(dark,notify){
applyTheme(dark);
LS.set('plate_theme_mode',dark?'dark':'light');
if(notify)toast(dark?'🌕 已切换到深色模式':'☀️ 已切换到浅色模式');
}
applyTheme(isDark);
let themeHoldTimer=0;
let themeHoldFired=false;
themeBtn.addEventListener('pointerdown',()=>{
themeHoldFired=false;
clearTimeout(themeHoldTimer);
themeHoldTimer=setTimeout(()=>{
themeHoldFired=true;
try{localStorage.removeItem('plate_theme_mode')}catch(e){}
toast('已恢复自动昼夜');
if(weatherData)applySunlightTheme(weatherData);
},900);
});
['pointerup','pointercancel','pointerleave'].forEach(ev=>themeBtn.addEventListener(ev,()=>clearTimeout(themeHoldTimer)));
themeBtn.addEventListener('click',()=>{
if(themeHoldFired){themeHoldFired=false;return}
root.classList.add('transitioning');
setTheme(!isDark,true);
setTimeout(()=>root.classList.remove('transitioning'),500);
});
const mqDark=window.matchMedia('(prefers-color-scheme: dark)');
mqDark.addEventListener('change',e=>{
if(LS.get('plate_theme_mode',''))return;
applyTheme(e.matches);
});

const statusClock=$('#statusClock');
function updateClock(){
const n=new Date();
statusClock.textContent=pad(n.getHours())+':'+pad(n.getMinutes());
}

const POEMS=[
'风乍起，吹皱一江春水',

},420);
}

const THUMB_PARAM='';
const stackList=slideList.map((u,i)=>i===0?HERO_WEBP:(THUMB_PARAM?u+THUMB_PARAM:u));
const photoInner=$('#photoInner');
const POOL=5;
const stackEls=[];
let slideStart=clampInt(LS.get('su7_slide',0),0,slideList.length-1);

function stackClass(pos){
if(pos===0)return'active';
if(pos===1)return'pile';
if(pos===2)return'pile2';
if(pos===3)return'pile3';
return'out';
}
function ensureStackImg(img){
if(!img||img.src||!img._url)return;
img.src=img._url;
}
function layoutStack(){
const len=slideList.length;
for(const img of stackEls){
img.className='stack-img '+stackClass((img._idx-slideStart+len)%len);
}
LS.set('su7_slide',slideStart);
}
function buildStack(){
const n=Math.min(POOL,slideList.length);
for(let i=0;i<n;i++){
const img=document.createElement('img');
img.className='stack-img out';
img.alt='';
img.draggable=false;
img.decoding='async';
img._idx=(slideStart+i)%slideList.length;
img._url=stackList[img._idx];
img.setAttribute('fetchpriority',i===0?'high':'low');
photoInner.appendChild(img);
stackEls.push(img);
}
ensureStackImg(stackEls[0]);
layoutStack();
let restLoaded=false;
const loadRest=()=>{
if(restLoaded)return;
restLoaded=true;
for(let i=1;i<stackEls.length;i++)ensureStackImg(stackEls[i]);
};
if(stackEls[0]){
if(stackEls[0].complete)setTimeout(loadRest,0);
else stackEls[0].addEventListener('load',()=>setTimeout(loadRest,0),{once:true});
}
setTimeout(loadRest,900);
if('requestIdleCallback' in window)requestIdleCallback(loadRest,{timeout:1800});
}
function nextSlide(){
if(document.hidden)return;
if(document.querySelector('.viewer.show,.city-picker-overlay.show,.month-calendar-overlay.show'))return;
const len=slideList.length;
if(len<2)return;
slideStart=(slideStart+1)%len;
if(len>POOL){
const stale=stackEls.find(img=>((img._idx-slideStart+len)%len)>=POOL);
if(stale){
stale._idx=(slideStart+POOL-1)%len;
stale._url=stackList[stale._idx];
stale.src=stale._url;
}
}
layoutStack();
for(const img of stackEls){
const pos=(img._idx-slideStart+len)%len;
if(pos<=3)ensureStackImg(img);
}
}
buildStack();
photoInner.addEventListener('click',()=>openViewer(slideList,slideStart,'图片原图'));
const avatarImg=$('#avatarImg');
const avatarEl=$('#avatar');
let avatarIdx=clampInt(LS.get('su7_avatar',0),0,avatarList.length-1);
function setAvatar(){
avatarImg.src=avatarList[avatarIdx];
LS.set('su7_avatar',avatarIdx);
}
setAvatar();
function nextAvatar(){
if(document.hidden)return;
if(document.querySelector('.viewer.show,.city-picker-overlay.show,.month-calendar-overlay.show'))return;
avatarIdx=(avatarIdx+1)%avatarList.length;
setAvatar();
}
avatarEl.addEventListener('click',()=>openViewer(avatarList,avatarIdx,'头像原图'));

const mainVideo=$('#mainVideo');
const videoCard=$('#videoCard');
const videoBox=$('#videoBox');
const videoControls=$('#videoControls');
const videoPlayBtn=$('#videoPlayBtn');
const videoPrevBtn=$('#videoPrevBtn');
const videoNextBtn=$('#videoNextBtn');
const videoMuteBtn=$('#videoMuteBtn');
const curTimeEl=$('#curTime');
const totTimeEl=$('#totTime');
const expandBtn=$('#expandBtn');
const videoOverlay=$('#videoOverlay');
const speedBadge=$('#speedBadge');
const seekbar=$('#seekbar');
const seekPlayed=$('#seekPlayed');
const seekBuffer=$('#seekBuffer');
const seekKnob=$('#seekKnob');

let videoIdx=clampInt(LS.get('su7_video',0),0,videoList.length-1);
let isMuted=LS.get('su7_muted','false')==='true';
let hideTimer=0;
let seeking=false;
let seekRatio=0;
let suppressClick=0;
let holdTimer=0;
let holdX=0;
let holdY=0;
let holdActive=false;
let muteSuppressed=false;
let volDrag=false;
let volMoved=false;
let volStartY=0;
let volStartVal=0;

function icon(name){
return '<svg class="icon" aria-hidden="true"><use href="#i-'+name+'"></use></svg>';
}
function updateMuteUI(){
videoMuteBtn.innerHTML=icon(isMuted?'volume-mute-fill':'volume-up-fill');
}
function applyMute(){
mainVideo.muted=isMuted;
if(!isMuted&&mainVideo.volume<=0.01)mainVideo.volume=1;
updateMuteUI();
}
function persistState(){
LS.set('su7_video',videoIdx);
LS.set('su7_avatar',avatarIdx);
LS.set('su7_slide',slideStart);
LS.set('su7_muted',isMuted);
}
function playMedia(el){
el.muted=isMuted;
if(!isMuted&&el.volume<=0.01)el.volume=1;
const p=el.play();
if(p&&p.catch)p.catch(()=>{toast('点击播放按钮开始播放');updateMuteUI()});
updateMuteUI();
}
function updatePlayIcon(){
videoPlayBtn.innerHTML=icon(mainVideo.paused?'play-fill':'pause-fill');
videoOverlay.classList.toggle('show',mainVideo.paused);
}
function showControls(){
videoControls.classList.remove('hidden');
clearTimeout(hideTimer);
if(!mainVideo.paused)hideTimer=setTimeout(()=>{
if(!seeking&&!holdActive)videoControls.classList.add('hidden');
},2600);
}
function duration(){
return isFinite(mainVideo.duration)?mainVideo.duration:0;
}
function paintSeek(){
const d=duration();
const ratio=d?(seeking?seekRatio:mainVideo.currentTime/d):0;
const pct=Math.max(0,Math.min(1,ratio))*100;
seekPlayed.style.width=pct+'%';
seekKnob.style.left=pct+'%';
seekbar.setAttribute('aria-valuenow',Math.round(pct));
if(seeking&&d)curTimeEl.textContent=fmt(seekRatio*d);
}
function paintBuffer(){
const d=duration();
if(!d||!mainVideo.buffered.length)return;
seekBuffer.style.width=Math.min(100,mainVideo.buffered.end(mainVideo.buffered.length-1)/d*100)+'%';
}
function seekTo(e){
const rect=seekbar.getBoundingClientRect();
if(!rect.width)return;
seekRatio=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
paintSeek();
}
function setSpeed(on){
mainVideo.playbackRate=on?2:1;
speedBadge.classList.toggle('show',on);
posStamp=0;
pushPositionState();
}
function updateMediaSession(){
if(!('mediaSession' in navigator))return;
try{
navigator.mediaSession.metadata=new MediaMetadata({
title:'视频 '+(videoIdx+1)+' / '+videoList.length,
artist:'苏FA36165 · 许红豆',
album:'去有风的地方'
});
}catch(e){}
}
function bindMediaSession(){
if(!('mediaSession' in navigator))return;
const ms=navigator.mediaSession;
const set=(name,fn)=>{try{ms.setActionHandler(name,fn)}catch(e){}};
set('play',()=>playMedia(mainVideo));
set('pause',()=>mainVideo.pause());
set('previoustrack',()=>loadVideo(videoIdx-1,true));
set('nexttrack',()=>loadVideo(videoIdx+1,true));
set('seekbackward',d=>{mainVideo.currentTime=Math.max(0,mainVideo.currentTime-((d&&d.seekOffset)||10))});
set('seekforward',d=>{mainVideo.currentTime=Math.min(duration(),mainVideo.currentTime+((d&&d.seekOffset)||10))});
set('seekto',d=>{if(d&&d.seekTime!=null)mainVideo.currentTime=d.seekTime});
}
function loadVideo(index,autoplay){
if(!videoList.length)return;
videoIdx=(index+videoList.length)%videoList.length;
curTimeEl.textContent='00:00';
totTimeEl.textContent='00:00';
seekPlayed.style.width='0%';
seekBuffer.style.width='0%';
seekKnob.style.left='0%';
setSpeed(false);
mainVideo.src=videoList[videoIdx];
if(autoplay)playMedia(mainVideo);
updatePlayIcon();
applyMute();
showControls();
persistState();
updateMediaSession();
}
function toggleVideo(){
if(mainVideo.paused)playMedia(mainVideo);
else mainVideo.pause();
updatePlayIcon();
showControls();
}
function toggleFullscreen(){
const target=videoCard;
if(document.fullscreenElement){
document.exitFullscreen().catch(()=>{});
return;
}
if(target.requestFullscreen){
target.requestFullscreen({navigationUI:'hide'}).then(()=>{
try{
const p=screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape');
if(p&&p.catch)p.catch(()=>{});
}catch(e){}
}).catch(()=>{
if(mainVideo.webkitEnterFullscreen){
try{mainVideo.webkitEnterFullscreen();return}catch(e){}
}
toast('无法进入全屏');
});
}else if(mainVideo.webkitEnterFullscreen){
mainVideo.webkitEnterFullscreen();
}else{
toast('当前浏览器不支持全屏');
}
}
document.addEventListener('fullscreenchange',()=>{
const on=!!document.fullscreenElement;
expandBtn.innerHTML=icon(on?'fullscreen-exit':'fullscreen');
expandBtn.setAttribute('aria-label',on?'退出全屏':'全屏');
if(!on){
try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock()}catch(e){}
}
showControls();
});

mainVideo.addEventListener('loadedmetadata',()=>{
totTimeEl.textContent=fmt(mainVideo.duration);
paintSeek();
pushPositionState();
});
mainVideo.addEventListener('timeupdate',()=>{
if(!seeking)curTimeEl.textContent=fmt(mainVideo.currentTime);
paintSeek();
pushPositionState();
});
mainVideo.addEventListener('progress',paintBuffer);
mainVideo.addEventListener('play',()=>{
mainVideo.muted=isMuted;
mainVideo.playbackRate=holdActive?2:1;
updatePlayIcon();
updateMuteUI();
showControls();
videoBox.classList.remove('buffering');
if('mediaSession' in navigator)navigator.mediaSession.playbackState='playing';
});
mainVideo.addEventListener('pause',()=>{
updatePlayIcon();
videoControls.classList.remove('hidden');
clearTimeout(hideTimer);
if('mediaSession' in navigator)navigator.mediaSession.playbackState='paused';
});
mainVideo.addEventListener('waiting',()=>videoBox.classList.add('buffering'));
mainVideo.addEventListener('playing',()=>{
videoBox.classList.remove('buffering');
paintBuffer();
});
mainVideo.addEventListener('ended',()=>loadVideo(videoIdx+1,true));
mainVideo.addEventListener('error',()=>{
videoBox.classList.remove('buffering');
if(mainVideo.src)toast('视频加载失败');
});

videoBox.addEventListener('click',e=>{
if(e.target.closest('.video-controls'))return;
if(Date.now()<suppressClick)return;
if(videoControls.classList.contains('hidden')){
showControls();
return;
}
toggleVideo();
});
videoPlayBtn.addEventListener('click',e=>{e.stopPropagation();toggleVideo()});
videoPrevBtn.addEventListener('click',e=>{e.stopPropagation();loadVideo(videoIdx-1,true)});
videoNextBtn.addEventListener('click',e=>{e.stopPropagation();loadVideo(videoIdx+1,true)});
expandBtn.addEventListener('click',e=>{e.stopPropagation();toggleFullscreen()});

seekbar.addEventListener('pointerdown',e=>{
if(!duration())return;
seeking=true;
try{seekbar.setPointerCapture(e.pointerId)}catch(err){}
seekTo(e);
showControls();
});
seekbar.addEventListener('pointermove',e=>{if(seeking)seekTo(e)});
function endSeek(){
if(!seeking)return;
seeking=false;
const d=duration();
if(d)mainVideo.currentTime=seekRatio*d;
paintSeek();
showControls();
}
seekbar.addEventListener('pointerup',endSeek);
seekbar.addEventListener('pointercancel',endSeek);

videoMuteBtn.addEventListener('click',e=>{
if(muteSuppressed){muteSuppressed=false;return}
e.stopPropagation();
isMuted=!isMuted;
applyMute();
LS.set('su7_muted',isMuted);
showControls();
});
videoMuteBtn.addEventListener('touchstart',e=>{
volDrag=true;
volMoved=false;
volStartY=e.touches[0].clientY;
volStartVal=mainVideo.volume;
},{passive:true});
videoMuteBtn.addEventListener('touchmove',e=>{
if(!volDrag)return;
const dy=volStartY-e.touches[0].clientY;
if(Math.abs(dy)>6)volMoved=true;
if(!volMoved)return;
if(e.cancelable)e.preventDefault();
const v=Math.max(0,Math.min(1,volStartVal+dy/200));
mainVideo.volume=v;
isMuted=v<=0.01;
mainVideo.muted=isMuted;
muteSuppressed=true;
updateMuteUI();
},{passive:false});
videoMuteBtn.addEventListener('touchend',()=>{
volDrag=false;

const viewer=$('#viewer');
const viewerContent=$('#viewerContent');
const viewerImg=$('#viewerImg');
const viewerCounter=$('#viewerCounter');
const viewerClose=$('#viewerClose');
const viewerShare=$('#viewerShare');
let gallery=[];
let galleryIdx=0;
let galleryTimer=0;
let vScale=1,vTx=0,vTy=0;
let pinchStart=0,pinchBase=1,pinchX=0,pinchY=0;
let swipeX=0,swipeY=0,dragX=0,dragY=0;
let lastTap=0,lastTapX=0,lastTapY=0;
let vPressTimer=0,vPressX=0,vPressY=0;
let pinched=false;

function applyZoom(animate){
viewerImg.style.transition=animate?'transform .22s var(--ease)':'none';
viewerImg.style.transform='translate3d('+vTx+'px,'+vTy+'px,0) scale('+vScale+')';
}
function clampZoom(){
if(vScale<=1){
vScale=1;vTx=0;vTy=0;
return;
}
const rect=viewerImg.getBoundingClientRect();
const baseW=rect.width/vScale;
const baseH=rect.height/vScale;
const maxX=Math.max(0,(baseW*vScale-viewer.clientWidth)/2);
const maxY=Math.max(0,(baseH*vScale-viewer.clientHeight)/2);
vTx=Math.max(-maxX,Math.min(maxX,vTx));
vTy=Math.max(-maxY,Math.min(maxY,vTy));
}
function resetZoom(animate){
vScale=1;vTx=0;vTy=0;
if(animate)applyZoom(true);
else{viewerImg.style.transition='';viewerImg.style.transform=''}
}
function zoomAt(x,y){
if(vScale>1.01){resetZoom(true);return}
const rect=viewerImg.getBoundingClientRect();
const ox=(x-(rect.left+rect.width/2))/vScale;
const oy=(y-(rect.top+rect.height/2))/vScale;
vScale=2.6;
vTx=-ox*(vScale-1);
vTy=-oy*(vScale-1);
clampZoom();
applyZoom(true);
}
function renderViewer(){
if(!gallery.length)return;
viewerImg.src=gallery[galleryIdx];
viewerCounter.textContent=(galleryIdx+1)+' / '+gallery.length;
resetZoom(false);
}
function stopGallery(){
clearInterval(galleryTimer);
galleryTimer=0;
}
function startGallery(){
stopGallery();
if(gallery.length<2)return;
galleryTimer=setInterval(()=>{
if(document.hidden||!viewer.classList.contains('show'))return;
stepViewer(1,false);
},8000);
}
function resetGallery(){
if(viewer.classList.contains('show'))startGallery();
}
function openViewer(list,idx){
if(!list||!list.length)return;
gallery=list;
galleryIdx=((idx%list.length)+list.length)%list.length;
renderViewer();
viewer.classList.add('show');
viewer.setAttribute('aria-hidden','false');
startGallery();
}
function closeViewer(){
stopGallery();
viewer.classList.remove('show');
viewer.setAttribute('aria-hidden','true');
resetZoom(false);
setTimeout(()=>{
if(!viewer.classList.contains('show'))viewerImg.removeAttribute('src');
},260);
}
function stepViewer(dir,reset){
if(!gallery.length)return;
galleryIdx=(galleryIdx+dir+gallery.length)%gallery.length;
renderViewer();
if(reset!==false)resetGallery();
}
viewerClose.addEventListener('click',closeViewer);
viewer.addEventListener('click',e=>{
if(e.target===viewer||e.target===viewerContent)closeViewer();
});

viewer.addEventListener('touchstart',e=>{
if(!viewer.classList.contains('show'))return;
if(e.target.closest('button')){
clearTimeout(vPressTimer);
return;
}
if(e.touches.length===2){
e.preventDefault();
pinched=true;
const a=e.touches[0],b=e.touches[1];
pinchStart=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1;
pinchBase=vScale;
pinchX=(a.clientX+b.clientX)/2;
pinchY=(a.clientY+b.clientY)/2;
clearTimeout(vPressTimer);
return;
}
if(e.touches.length===1){
const t=e.touches[0];
swipeX=t.clientX;swipeY=t.clientY;
dragX=t.clientX;dragY=t.clientY;
vPressX=t.clientX;vPressY=t.clientY;
clearTimeout(vPressTimer);
if(vScale<=1.01)vPressTimer=setTimeout(downloadCurrent,700);
}
},{passive:false});

viewer.addEventListener('touchmove',e=>{
if(!viewer.classList.contains('show'))return;
if(e.touches.length===2){
e.preventDefault();
clearTimeout(vPressTimer);
const a=e.touches[0],b=e.touches[1];
const dist=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1;
const cx=(a.clientX+b.clientX)/2;
const cy=(a.clientY+b.clientY)/2;
vTx+=cx-pinchX;
vTy+=cy-pinchY;
pinchX=cx;pinchY=cy;
vScale=Math.max(1,Math.min(4,pinchBase*dist/pinchStart));
clampZoom();
applyZoom(false);
return;
}
if(e.touches.length===1){
const t=e.touches[0];
const dx=t.clientX-dragX;
const dy=t.clientY-dragY;
if(Math.abs(t.clientX-swipeX)>8||Math.abs(t.clientY-swipeY)>8)clearTimeout(vPressTimer);
if(vScale>1.01){
e.preventDefault();
vTx+=dx;
vTy+=dy;
dragX=t.clientX;dragY=t.clientY;
clampZoom();
applyZoom(false);
}else if(Math.abs(dx)>Math.abs(dy)*1.2&&e.cancelable){
e.preventDefault();
}
}
},{passive:false});

viewer.addEventListener('touchend',e=>{
if(!viewer.classList.contains('show'))return;
clearTimeout(vPressTimer);
if(e.touches.length>0){
const t=e.touches[0];
dragX=t.clientX;dragY=t.clientY;
return;
}
if(pinched){
pinched=false;
clampZoom();
applyZoom(true);
return;
}
const t=e.changedTouches[0];
const dx=t.clientX-swipeX;
const dy=t.clientY-swipeY;
const now=Date.now();
if(Math.abs(dx)<10&&Math.abs(dy)<10){
if(now-lastTap<320&&Math.abs(t.clientX-lastTapX)<40&&Math.abs(t.clientY-lastTapY)<40){
zoomAt(t.clientX,t.clientY);
lastTap=0;
}else{
lastTap=now;
lastTapX=t.clientX;
lastTapY=t.clientY;
}
return;
}
if(vScale>1.01){
clampZoom();
applyZoom(true);
return;
}
if(dy>120&&Math.abs(dy)>Math.abs(dx)){closeViewer();return}
if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy))stepViewer(dx<0?1:-1,true);
},{passive:true});

viewer.addEventListener('wheel',e=>{
if(!viewer.classList.contains('show'))return;
if(vScale>1.01)return;
e.preventDefault();
stepViewer((e.deltaX||e.deltaY)>0?1:-1,true);
},{passive:false});

const WINDS=['北风','东北风','东风','东南风','南风','西南风','西风','西北风'];

async function loadWeather(lat,lon,city){
const airPromise=fetch('https://air-quality-api.open-meteo.com/v1/air-quality?latitude='+lat+'&longitude='+lon+'&current=pm2_5,us_aqi&timezone=auto',{signal:AbortSignal.timeout(7000)})
.then(r=>r.ok?r.json():null).then(j=>j&&j.current?j.current:null).catch(()=>null);
try{
const url='https://api.open-meteo.com/v1/forecast?latitude='+lat+'&longitude='+lon+
'&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,wind_direction_10m'+
'&hourly=temperature_2m,weather_code,precipitation_probability'+
'&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,sunrise,sunset'+
'&timezone=auto&forecast_days=4';
const res=await fetch(url,{signal:AbortSignal.timeout(9000)});
if(!res.ok)throw new Error('HTTP '+res.status);
const data=await res.json();
weatherData=data;
weatherCity=city||'当前位置';
const cur=data.current||data.current_weather||{};
const code=cur.weather_code!=null?cur.weather_code:cur.weathercode;
const temp=cur.temperature_2m!=null?cur.temperature_2m:cur.temperature;
const speed=cur.wind_speed_10m!=null?cur.wind_speed_10m:cur.windspeed;
const dir=cur.wind_direction_10m!=null?cur.wind_direction_10m:cur.winddirection;
const meta=WEATHER[code]||['sun-fill','未知'];
wxIcon.innerHTML='<svg class="icon" aria-hidden="true"><use href="#i-'+meta[0]+'"></use></svg>';
wxTemp.textContent=(temp!=null?Math.round(temp):'--')+'°C';
wxDesc.textContent=meta[1];
wxLoc.textContent=weatherCity;
const daily=data.daily||{};
const max=daily.temperature_2m_max&&daily.temperature_2m_max[0];
const min=daily.temperature_2m_min&&daily.temperature_2m_min[0];
wxMax.textContent=(max!=null?Math.round(max):'--')+'°';
wxMin.textContent=(min!=null?Math.round(min):'--')+'°';
const wd=dir!=null?WINDS[Math.round(((dir%360)/45))%8]:'';
wxWind.textContent=speed!=null?wd+' '+Math.round(speed)+' km/h':wd;
const air=await airPromise;
weatherAir=air;
renderWeatherSheet(data,weatherCity,air);
applySunlightTheme(data);
}catch(e){
wxDesc.textContent='获取失败';
wxWind.textContent='--';
wxMax.textContent='--°';
wxMin.textContent='--°';
}
}
function renderWeatherSheet(data,city,air){
if(!data)return;
const cur=data.current||data.current_weather||{};
const code=cur.weather_code!=null?cur.weather_code:cur.weathercode;
const meta=WEATHER[code]||['sun-fill','--'];
const temp=cur.temperature_2m!=null?cur.temperature_2m:cur.temperature;
wsTempEl.textContent=(temp!=null?Math.round(temp):'--')+'°';
wsDescEl.textContent=meta[1];
wsCityEl.textContent=city||'当前位置';
const daily=data.daily||{};
const feels=cur.apparent_temperature;
wsFeelsEl.textContent=(feels!=null?Math.round(feels):'--')+'°';
const uv=daily.uv_index_max&&daily.uv_index_max[0];
wsUvEl.textContent=uv!=null?Math.round(uv)+' '+uvLevel(uv):'--';
const pm=air&&air.pm2_5!=null?air.pm2_5:null;
wsAqiEl.textContent=pm!=null?Math.round(pm)+' '+pmLevel(pm):'--';
const sunrise=daily.sunrise&&daily.sunrise[0];
const sunset=daily.sunset&&daily.sunset[0];
wsSunriseEl.textContent=sunrise?sunrise.slice(11,16):'--:--';
wsSunsetEl.textContent=sunset?sunset.slice(11,16):'--:--';
const hourly=data.hourly||{};
const times=hourly.time||[];
const curHour=cur.time?cur.time.slice(0,13)+':00':(times[0]||'');
let start=times.findIndex(t=>t>=curHour);
if(start<0)start=0;
let hHtml='';
for(let i=start;i<Math.min(start+12,times.length);i++){
const t=new Date(times[i]);
const hh=pad(t.getHours())+':00';
const hc=WEATHER[hourly.weather_code[i]]||['sun-fill','--'];
const ht=hourly.temperature_2m&&hourly.temperature_2m[i]!=null?Math.round(hourly.temperature_2m[i]):'--';
const hp=hourly.precipitation_probability?hourly.precipitation_probability[i]:null;
hHtml+='<div class="hourly-item"><div class="hourly-time">'+hh+'</div>'+
'<svg class="icon" aria-hidden="true"><use href="#i-'+hc[0]+'"></use></svg>'+
'<div class="hourly-temp">'+ht+'°</div>'+
'<div class="hourly-rain">'+(hp!=null&&hp>0?hp+'%':'')+'</div></div>';
}
hourlyStrip.innerHTML=hHtml;
const dtime=daily.time||[];
let dHtml='';
for(let i=1;i<Math.min(4,dtime.length);i++){
const dt=new Date(dtime[i]+'T00:00:00');
const name=i===1?'明天':i===2?'后天':WEEK_SHORT[dt.getDay()];
const dc=WEATHER[daily.weather_code[i]]||['sun-fill','--'];
const mx=daily.temperature_2m_max&&daily.temperature_2m_max[i]!=null?Math.round(daily.temperature_2m_max[i]):'--';
const mn=daily.temperature_2m_min&&daily.temperature_2m_min[i]!=null?Math.round(daily.temperature_2m_min[i]):'--';
dHtml+='<div class="daily-row"><span class="daily-name">'+name+'</span>'+
'<svg class="icon" aria-hidden="true"><use href="#i-'+dc[0]+'"></use></svg>'+
'<span class="daily-temp"><b>'+mx+'°</b> / '+mn+'°</span></div>';
}
dailyList.innerHTML=dHtml;
}
function uvLevel(v){

if(v<8)return'强';

}
function pmLevel(v){
if(v<=35)return'优';
if(v<=75)return'良';
if(v<=115)return'轻度';
if(v<=150)return'中度';
if(v<=250)return'重度';
return'严重';
}
function applySunlightTheme(data){
if(LS.get('plate_theme_mode',''))return;
const d=data.daily||{};
const sr=d.sunrise&&d.sunrise[0];
const ss=d.sunset&&d.sunset[0];
const now=data.current&&data.current.time?data.current.time.slice(11,16):'';
if(!sr||!ss||!now)return;
const hm=s=>s.slice(11,16);
const night=now<hm(sr)||now>=hm(ss);
if(night!==isDark)applyTheme(night);
}

return data.locality||data.city||data.principalSubdivision||'当前位置';
}catch(e){
return '当前位置';

function locate(){
if(manualCity){loadWeather(current.lat,current.lon,current.name);return}
if(!navigator.geolocation){
wxLoc.textContent=DEFAULT_CITY.name;
wxDesc.textContent='定位不支持';

navigator.geolocation.getCurrentPosition(async pos=>{

const lon=pos.coords.longitude;

current={lat,lon,name};
loadWeather(lat,lon,name);
},()=>{

wxLoc.textContent=DEFAULT_CITY.name;

const cityRow=(c,remote)=>'<div class="city-item'+(remote?' remote':'')+'" data-lat="'+c.lat+'" data-lon="'+c.lon+'" data-name="'+c.name+'"><span>'+c.name+'</span><span class="city-province">'+(c.province||'')+'</span></div>';
function renderCityResults(local,remote,q){
let html=(local||[]).map(c=>cityRow(c,false)).join('');
if(remote&&remote.length)html+='<div class="city-sub">更多地点</div>'+remote.map(c=>cityRow(c,true)).join('');
if(!html)html='<div class="city-hint">'+(q?'未找到匹配的城市':'暂无城市')+'</div>';
cityList.innerHTML=html;
}
function localCities(q){
const key=(q||'').trim().toLowerCase();
if(!key)return CITIES;
return CITIES.filter(c=>c.name.toLowerCase().includes(key)||c.province.toLowerCase().includes(key));
}
let geoSeq=0;
let geoAbort=null;
let searchTimer=0;
async function lookupCities(q,seq,local){
if(geoAbort)geoAbort.abort();
geoAbort=new AbortController();
try{
const res=await fetch('https://nominatim.openstreetmap.org/search?q='+encodeURIComponent(q)+'&format=jsonv2&limit=6&accept-language=zh-CN&addressdetails=1',{signal:geoAbort.signal,headers:{'Accept':'application/json'}});
if(!res.ok)throw new Error('HTTP '+res.status);
const data=await res.json();
if(seq!==geoSeq)return;
const seen=new Set(local.map(c=>c.name));
const remote=[];
for(const it of data){
const a=it.address||{};
const name=it.name||(it.display_name||'').split(',')[0];
if(!name||seen.has(name))continue;
seen.add(name);
remote.push({name,province:[a.state,a.country].filter(Boolean).join(' · '),lat:+it.lat,lon:+it.lon});
if(remote.length>=5)break;
}
renderCityResults(local,remote,q);
}catch(err){
if(seq!==geoSeq)return;
if(err&&err.name==='AbortError')return;
renderCityResults(local,[],q);
}
}
citySearch.addEventListener('input',()=>{
const q=citySearch.value.trim();
clearTimeout(searchTimer);
const local=localCities(q);
if(!q){
geoSeq++;
if(geoAbort)geoAbort.abort();
renderCityResults(CITIES,[],'');
return;
}
renderCityResults(local,[],q);
if(q.length<2)return;
const seq=++geoSeq;
searchTimer=setTimeout(()=>lookupCities(q,seq,local),700);
});

const WEEK_CN=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const WEEK_SHORT=['周日','周一','周二','周三','周四','周五','周六'];

const HOLIDAYS=new Map();
(function parseHolidays(){
const raw=
'2026-01-01~2026-01-03|元旦|R\n'+
'2026-01-04|元旦调休|W\n'+
'2026-02-14|春节调休|W\n'+
'2026-02-15~2026-02-23|春节|R\n'+
'2026-02-28|春节调休|W\n'+
'2026-04-04~2026-04-06|清明节|R\n'+
'2026-05-01~2026-05-05|劳动节|R\n'+
'2026-05-09|劳动节调休|W\n'+
'2026-06-19~2026-06-21|端午节|R\n'+
'2026-09-20|中秋节调休|W\n'+
'2026-09-25~2026-09-27|中秋节|R\n'+
'2026-10-01~2026-10-07|国庆节|R\n'+
'2026-10-10|国庆节调休|W\n'+
'2027-01-01~2027-01-03|元旦|R\n'+
'2027-02-05|除夕|R\n'+
'2027-02-06~2027-02-13|春节|R\n'+
'2027-02-14|春节调休|W\n'+
'2027-02-28|春节调休|W\n'+
'2027-04-03~2027-04-05|清明节|R\n'+
'2027-05-01~2027-05-05|劳动节|R\n'+
'2027-05-08|劳动节调休|W\n'+
'2027-06-09|端午节|R\n'+
'2027-09-15|中秋节|R\n'+
'2027-09-26|国庆节调休|W\n'+
'2027-10-01~2027-10-07|国庆节|R\n'+
'2027-10-09|国庆节调休|W';
for(const line of raw.split('\n')){
const parts=line.split('|');
if(parts.length<3)continue;
const range=parts[0].split('~');
const start=toDate(range[0]);
const end=range[1]?toDate(range[1]):start;
const type=parts[2]==='R'?1:3;
for(let d=new Date(start);d<=end;d.setDate(d.getDate()+1)){
HOLIDAYS.set(ymd(d),{name:parts[1],type});
}
}
})();
function toDate(str){
const p=str.split('-').map(Number);
return new Date(p[0],p[1]-1,p[2]);
}
function ymd(date){
return date.getFullYear()+'-'+pad(date.getMonth()+1)+'-'+pad(date.getDate());
}
function holidayOf(date){
const hit=HOLIDAYS.get(ymd(date));
if(hit)return hit;
const dow=date.getDay();
if(dow===0||dow===6)return{name:'周末',type:2};
return{name:'工作日',type:0};
}
function lunarOf(date){
if(typeof Solar==='undefined')return null;
try{return Solar.fromDate(date).getLunar()}catch(e){return null}
}
function festivalOf(date){
const lunar=lunarOf(date);
if(!lunar)return'';
try{
return lunar.getJieQi()||(lunar.getFestivals()||[])[0]||(lunar.getOtherFestivals()||[])[0]||'';
}catch(e){return''}
}

let selectedDate=new Date();
let manualDate=false;

const calDayNum=$('#calendarDayNum');
const calDayLabel=$('#calendarDayLabel');
const calYearMonth=$('#calendarYearMonth');
const calWeekday=$('#calendarWeekday');
const calLunar=$('#calendarLunar');
const calTag=$('#calendarHolidayTag');
const calBlock=$('#calendarDateBlock');

function updateCalendar(){
const year=selectedDate.getFullYear();
const month=selectedDate.getMonth()+1;
const day=selectedDate.getDate();
const dow=selectedDate.getDay();
calDayNum.textContent=day;
calDayLabel.textContent=WEEK_SHORT[dow];
calYearMonth.textContent=year+'年'+month+'月';
calWeekday.textContent=WEEK_CN[dow];
const info=holidayOf(selectedDate);
calBlock.classList.remove('holiday','workday');
calTag.classList.remove('holiday','workday','normal');
if(info.type===1){
calBlock.classList.add('holiday');
calTag.classList.add('holiday');
calTag.textContent=info.name+' 休';
}else if(info.type===3){
calBlock.classList.add('workday');
calTag.classList.add('workday');
calTag.textContent=info.name+' 班';
}else if(info.type===2){
calTag.classList.add('holiday');
calTag.textContent='周末 休';
}else{
calTag.classList.add('normal');
calTag.textContent='工作日';
}
const lunar=lunarOf(selectedDate);
calLunar.textContent=lunar?'农历'+lunar.getMonthInChinese()+'月'+lunar.getDayInChinese():'农历 --';
}

const monthOverlay=$('#monthCalendarOverlay');
const monthTitle=$('#monthCalendarTitle');
const monthDays=$('#monthCalendarDays');
let monthYear=selectedDate.getFullYear();
let monthIndex=selectedDate.getMonth();

function renderMonth(){
monthTitle.textContent=monthYear+'年'+(monthIndex+1)+'月';
const first=new Date(monthYear,monthIndex,1);
const daysInMonth=new Date(monthYear,monthIndex+1,0).getDate();
const startDow=first.getDay();
const prevDays=new Date(monthYear,monthIndex,0).getDate();
const today=new Date();
let html='';
for(let i=startDow-1;i>=0;i--){
html+='<div class="month-calendar-day other-month"><span>'+(prevDays-i)+'</span></div>';
}
for(let d=1;d<=daysInMonth;d++){
const date=new Date(monthYear,monthIndex,d);
const info=holidayOf(date);
const isToday=date.getFullYear()===today.getFullYear()&&date.getMonth()===today.getMonth()&&date.getDate()===today.getDate();
const isSelected=date.getFullYear()===selectedDate.getFullYear()&&date.getMonth()===selectedDate.getMonth()&&date.getDate()===selectedDate.getDate();
const lunar=lunarOf(date);
const lunarText=lunar?lunar.getDayInChinese():'';
const tag=info.type===1?'<span class="day-tag rest">休</span>':info.type===3?'<span class="day-tag work">班</span>':'';
const fest=festivalOf(date);
let cls='month-calendar-day';
if(isToday)cls+=' today';
if(isSelected)cls+=' selected';
if(info.type===1)cls+=' holiday';
if(info.type===3)cls+=' workday';
if(fest)cls+=' festival';
html+='<div class="'+cls+'" data-ts="'+date.getTime()+'">'+tag+'<span>'+d+'</span>'+
'<span class="day-lunar">'+lunarText+'</span>'+
(fest?'<span class="day-festival">'+fest+'</span>':'')+'</div>';
}
const total=startDow+daysInMonth;
const tail=(7-(total%7))%7;
for(let i=1;i<=tail;i++){
html+='<div class="month-calendar-day other-month"><span>'+i+'</span></div>';
}
monthDays.innerHTML=html;
}
function openMonth(){
monthYear=selectedDate.getFullYear();
monthIndex=selectedDate.getMonth();
renderMonth();
monthOverlay.classList.add('show');
}
