<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#F2F2F7">
  <meta name="color-scheme" content="light">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>苏FA36165 · 许红豆</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --text-main: #1C1C1E;
      --text-sub: #3A3A3C;
      --text-muted: #8E8E93;
      --bg-primary: #F2F2F7;
      --bg-secondary: rgba(255, 255, 255, 0.75);
      --glass-bg: rgba(255, 255, 255, 0.48);
      --glass-border: rgba(255, 255, 255, 0.60);
      --glass-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      --icon-bg: rgba(255, 255, 255, 0.7);
      --status-color: #1C1C1E;
      --toast-bg: rgba(20, 22, 28, 0.78);
      --viewer-bg: rgba(0, 0, 0, 0.85);
      --plate-bg: linear-gradient(135deg, #34C759, #28A745);
      --name-gradient: linear-gradient(90deg, #FF5C93, #C84870, #4A8DFF, #FF5C93);
      --sub-gradient: linear-gradient(90deg, #FF6D9C, #558EFF);
      --liquid-gradient: radial-gradient(ellipse at 15% 10%, rgba(120, 170, 255, 0.30), transparent 55%),
        radial-gradient(ellipse at 85% 20%, rgba(255, 160, 200, 0.25), transparent 55%),
        radial-gradient(ellipse at 20% 85%, rgba(110, 230, 200, 0.22), transparent 55%),
        radial-gradient(ellipse at 80% 88%, rgba(190, 160, 255, 0.28), transparent 55%);
      --island-bg: rgba(255, 255, 255, 0.8);
      --island-text: #1C1C1E;
      --popup-overlay: rgba(0, 0, 0, 0.85);
      --glow-color: #FF2E63;
      --sakura-color: rgba(255, 80, 120, 0.55);
      --particle-light: rgba(40,40,60,0.5);
      --particle-dark: rgba(100,100,180,0.25);
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    /* 强制浅色模式，深色模式由手动切换 */
    html {
      width: 100%;
      min-height: 100%;
      background-color: #F2F2F7;
      color: #1C1C1E;
    }
    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
      background: #F2F2F7;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
      user-select: none;
      margin: 0;
      padding: 0;
      color: #1C1C1E;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }
    /* 手动深色模式 */
    html.dark-mode {
      --text-main: #F5F5F7;
      --text-sub: #A1A1A6;
      --text-muted: #6E6E73;
      --bg-primary: #0A0A0C;
      --bg-secondary: rgba(20, 20, 24, 0.75);
      --glass-bg: rgba(44, 44, 46, 0.45);
      --glass-border: rgba(255, 255, 255, 0.06);
      --glass-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      --icon-bg: rgba(60, 60, 66, 0.5);
      --status-color: #F5F5F7;
      --toast-bg: rgba(60, 60, 66, 0.85);
      --viewer-bg: rgba(0, 0, 0, 0.92);
      --plate-bg: linear-gradient(135deg, #00D4FF, #7B61FF);
      --name-gradient: linear-gradient(90deg, #FF7A9E, #D86A8A, #6A9EFF, #FF7A9E);
      --sub-gradient: linear-gradient(90deg, #FF8AAF, #7AA5FF);
      --liquid-gradient: radial-gradient(ellipse at 15% 10%, rgba(60, 100, 200, 0.25), transparent 55%),
        radial-gradient(ellipse at 85% 20%, rgba(180, 100, 140, 0.20), transparent 55%),
        radial-gradient(ellipse at 20% 85%, rgba(70, 180, 150, 0.18), transparent 55%),
        radial-gradient(ellipse at 80% 88%, rgba(130, 110, 200, 0.22), transparent 55%);
      --island-bg: rgba(20, 20, 24, 0.8);
      --island-text: #fff;
      --popup-overlay: rgba(0, 0, 0, 0.92);
      --glow-color: #00D4FF;
      --sakura-color: rgba(255, 200, 216, 0.45);
      --particle-light: rgba(255,255,255,0.6);
      --particle-dark: rgba(180,180,255,0.3);
      background-color: #0A0A0C;
      color: #F5F5F7;
    }
    html.dark-mode body {
      background: #0A0A0C;
      color: #F5F5F7;
    }
    html.dark-mode .sakura {
      background: rgba(255, 200, 216, 0.45);
      box-shadow: 0 0 20px rgba(255, 200, 216, 0.15);
    }
    html.dark-mode .liquid-gradient {
      background: radial-gradient(ellipse at 15% 10%, rgba(60, 100, 200, 0.25), transparent 55%),
        radial-gradient(ellipse at 85% 20%, rgba(180, 100, 140, 0.20), transparent 55%),
        radial-gradient(ellipse at 20% 85%, rgba(70, 180, 150, 0.18), transparent 55%),
        radial-gradient(ellipse at 80% 88%, rgba(130, 110, 200, 0.22), transparent 55%);
    }
    /* 炫酷过渡 */
    html.transitioning {
      transition: background-color 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    html.transitioning * {
      transition: background-color 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), 
                  color 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                  border-color 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                  fill 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                  opacity 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                  transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                  backdrop-filter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                  -webkit-backdrop-filter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    button, img, video { -webkit-user-drag: none; user-select: none; }
    button { font: inherit; cursor: pointer; background: none; border: none; outline: none; }

    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .liquid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateZ(0);
    }
    .liquid-gradient {
      position: absolute;
      width: 120vw;
      height: 120vh;
      top: -10vh;
      left: -10vw;
      background: var(--liquid-gradient);
      filter: blur(60px);
      -webkit-filter: blur(60px);
      will-change: transform;
      transform: translateZ(0);
      animation: liquidFlow 18s ease-in-out infinite alternate;
    }
    @keyframes liquidFlow {
      0% { transform: translate(0, 0) rotate(0deg) scale(1.02); }
      100% { transform: translate(-20px, 20px) rotate(-3deg) scale(1.02); }
    }
    .sakura-container {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
      overflow: hidden;
      transform: translateZ(0);
    }
    .sakura {
      position: absolute;
      background: var(--sakura-color);
      border-radius: 50% 0 50% 50%;
      opacity: 0.6;
      will-change: transform, opacity;
      transform: translateZ(0);
      box-shadow: 0 0 16px rgba(255, 180, 200, 0.15);
    }
    @keyframes sakuraFall {
      0% { transform: translateY(0) rotate(0deg) translateX(0px); opacity: 0.7; }
      100% { transform: translateY(105vh) rotate(720deg) translateX(0px); opacity: 0; }
    }
    @keyframes pageSpringIn {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes cardSpringIn {
      from { opacity: 0; transform: translateY(18px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 470px;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px 16px 16px;
      position: relative;
      z-index: 2;
      animation: pageSpringIn .7s var(--spring) both;
      gap: 12px;
    }
    .status-bar-container {
      width: 100%;
      flex-shrink: 0;
      padding: calc(var(--safe-top) + 2px) 0 4px;
    }
    .ios-status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--status-color);
      min-height: 36px;
    }
    .ios-status-left {
      flex: 1;
      text-align: left;
      font-weight: 600;
      letter-spacing: 0.2px;
      font-size: 14px;
    }
    .dynamic-island {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 32px;
      padding: 0 16px;
      min-width: 56px;
      background: var(--island-bg);
      border-radius: 20px;
      color: var(--island-text);
      font-size: 11px;
      font-weight: 500;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: none;
      flex-shrink: 0;
      margin: 0 6px;
      overflow: hidden;
      pointer-events: none;
      position: relative;
      transform: perspective(600px) rotateX(2deg) rotateY(-1deg) translateZ(4px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.08), inset 0 0.5px 0 rgba(255,255,255,0.5);
    }
    .dynamic-island::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      width: 80%;
      height: 40%;
      background: linear-gradient(180deg, rgba(255,255,255,0.3) 0%, transparent 100%);
      border-radius: 50%;
      pointer-events: none;
      z-index: 2;
    }
    .island-text-scroll {
      display: inline-block;
      font-weight: 600;
      font-size: 11px;
      background: linear-gradient(90deg, #FF6B9E, #FFD966, #6AA9FF, #FF6B9E);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: textShine 2.5s ease-in-out infinite;
      white-space: nowrap;
      position: relative;
      z-index: 1;
      animation: textShine 2.5s ease-in-out infinite, scrollUp 2s ease-in-out infinite;
    }
    @keyframes textShine {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes scrollUp {
      0% { transform: translateY(100%); opacity: 0; }
      10% { transform: translateY(0); opacity: 1; }
      90% { transform: translateY(0); opacity: 1; }
      100% { transform: translateY(-100%); opacity: 0; }
    }
    .ios-status-right {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 3px;
    }
    .signal-icon {
      width: 16px;
      height: 11px;
      fill: var(--status-color);
      flex-shrink: 0;
    }
    .video-player-container {
      width: 100%;
      flex-shrink: 0;
      border-radius: 24px;
      overflow: hidden;
      background: #0A0A0C;
      animation: cardSpringIn .6s var(--ease) 0.12s both;
      border: 0.5px solid rgba(255,255,255,0.04);
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      will-change: transform;
      position: relative;
    }
    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0A0A0C;
      overflow: hidden;
      touch-action: pan-y;
    }
    .video-box video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      -webkit-object-fit: cover;
      background: #0A0A0C;
    }
    .center-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20%;
      aspect-ratio: 1 / 1;
      max-width: 80px;
      min-width: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: clamp(18px, 5vw, 36px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: opacity 0.3s ease, transform 0.3s ease, background 0.3s ease;
      cursor: pointer;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }
    .center-play-btn:active { transform: translate(-50%, -50%) scale(0.88); }
    .center-play-btn.hidden { opacity: 0; pointer-events: none; }
    .video-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 10px 12px 12px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
      z-index: 3;
      opacity: 1;
      transition: opacity 0.35s ease;
      pointer-events: auto;
    }
    .video-controls.hidden { opacity: 0; pointer-events: none; }
    .progress-track {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 99px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #00D4FF, #7B61FF);
      width: 0%;
      transition: width 0.08s linear;
    }
    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .controls-row button {
      color: #fff;
      font-size: 15px;
      padding: 3px;
      opacity: 0.8;
      transition: opacity 0.15s;
    }
    .controls-row button:active { opacity: 0.4; }
    .controls-time {
      margin-left: auto;
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-expand {
      color: #fff;
      font-size: 13px;
      padding: 3px;
      opacity: 0.8;
    }
    .btn-expand:active { opacity: 0.4; transform: scale(0.9); }
    .main-card-container {
      width: 100%;
      flex-shrink: 0;
      animation: cardSpringIn .6s var(--ease) 0.18s both;
      position: relative;
    }
    .main-card {
      width: 100%;
      padding: 20px 16px 22px;
      border-radius: 24px;
      background: var(--bg-secondary);
      border: 0.5px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      overflow: visible;
      position: relative;
      transform: translateZ(0);
    }
    .main-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 25px;
      background: conic-gradient(from 0deg, #00D4FF, #7B61FF, #FF6B9E, #FFD966, #00D4FF);
      opacity: 0.06;
      z-index: -1;
      animation: borderGlow 8s linear infinite;
      filter: blur(6px);
    }
    @keyframes borderGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .theme-toggle {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 20;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--glass-border);
      box-shadow: 0 0 16px rgba(0, 212, 255, 0.12), inset 0 0 16px rgba(0, 212, 255, 0.04);
      color: var(--text-main);
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.4s var(--spring), box-shadow 0.3s, background 0.3s, border-color 0.3s, color 0.3s;
      will-change: transform;
      position: relative;
      overflow: hidden;
    }
    .theme-toggle::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, #00D4FF, #7B61FF, #FF6B9E, #FFD966, #00D4FF);
      opacity: 0.25;
      z-index: -1;
      animation: toggleRotate 3s linear infinite;
      filter: blur(6px);
    }
    @keyframes toggleRotate {
      0% { transform: rotate(0deg) scale(0.8); }
      50% { transform: rotate(180deg) scale(1.2); }
      100% { transform: rotate(360deg) scale(0.8); }
    }
    .theme-toggle::after {
      content: '';
      position: absolute;
      inset: 2px;
      border-radius: 50%;
      background: var(--bg-secondary);
      z-index: -1;
    }
    .theme-toggle:hover { transform: scale(1.1) rotate(15deg); }
    .theme-toggle:active { transform: scale(0.88); }
    .theme-toggle i { position: relative; z-index: 1; transition: transform 0.6s var(--spring); }
    .theme-toggle:hover i { transform: rotate(180deg); }
    .profile-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 8px;
      width: 100%;
      flex-shrink: 0;
      padding-top: 8px;
    }
    .profile-left {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .avatar {
      position: relative;
      width: 68px;
      height: 68px;
      border-radius: 50%;
      margin-bottom: 10px;
      cursor: zoom-in;
      flex-shrink: 0;
      perspective: 800px;
    }
    .avatar::before {
      content: '';
      position: absolute;
      inset: -16px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
      opacity: 0.5;
      z-index: -1;
      filter: blur(24px);
      animation: glowPulse 1.8s ease-in-out infinite alternate;
      transform: scale(0.8);
    }
    @keyframes glowPulse {
      0% { transform: scale(0.7); opacity: 0.3; filter: blur(20px); }
      100% { transform: scale(1.4); opacity: 0.8; filter: blur(35px); }
    }
    .avatar::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow-color) 0%, transparent 60%);
      opacity: 0.6;
      z-index: -1;
      filter: blur(40px);
      animation: glowPulse2 2.2s ease-in-out infinite alternate;
      transform: scale(0.6);
    }
    @keyframes glowPulse2 {
      0% { transform: scale(0.5); opacity: 0.2; filter: blur(30px); }
      100% { transform: scale(1.6); opacity: 0.7; filter: blur(50px); }
    }
    .avatar-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
      transform-style: preserve-3d;
    }
    .avatar-inner.flipping { transform: rotateY(180deg); }
    .avatar-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--glow-color), #FFD046, #00D4FF, #7B61FF, var(--glow-color));
      animation: ringRotate 2.5s linear infinite;
      filter: blur(3px);
      z-index: -1;
      opacity: 0.9;
      box-shadow: 0 0 30px rgba(0, 212, 255, 0.4);
    }
    @keyframes ringRotate {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(1); }
    }
    .avatar-ring-2 {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: conic-gradient(from 180deg, #7B61FF, #00D4FF, #FF6B9E, #7B61FF);
      animation: ringRotate2 3.2s linear infinite reverse;
      filter: blur(6px);
      z-index: -2;
      opacity: 0.5;
    }
    @keyframes ringRotate2 {
      0% { transform: rotate(0deg) scale(0.9); }
      50% { transform: rotate(180deg) scale(1.1); }
      100% { transform: rotate(360deg) scale(0.9); }
    }
    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2.5px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      position: relative;
      z-index: 1;
      backface-visibility: hidden;
    }
    .avatar img.back {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotateY(180deg);
      backface-visibility: hidden;
    }
    .plate-photo {
      width: 92px;
      flex-shrink: 0;
      border-radius: 12px;
      overflow: visible;
      cursor: zoom-in;
      perspective: 800px;
      position: relative;
      margin-right: -4px;
    }
    .plate-photo-inner {
      position: relative;
      width: 100%;
      border-radius: 12px;

    .floating-word {

      font-size: 52px;
      font-weight: 900;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
      cursor: pointer;
      z-index: 1000;
      pointer-events: auto;

      filter: drop-shadow(0 2px 12px rgba(0,0,0,0.05));

    .floating-word .char {

      background: linear-gradient(135deg, #FF6B9E, #FFD93D, #6BCB77, #4D96FF, #9B59B6, #FF6B9E);

      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }

    .floating-word .char:nth-child(2) { animation-delay: 0.4s; }
    .floating-word .char:nth-child(3) { animation-delay: 0.8s; }

    .floating-word .char.diff {
      animation: rainbowMoveDiff 3.2s ease-in-out infinite alternate;
    }
    @keyframes rainbowMoveDiff {
      0% { background-position: 0% 50%; filter: hue-rotate(0deg); }
      50% { background-position: 100% 50%; filter: hue-rotate(180deg); }
      100% { background-position: 0% 50%; filter: hue-rotate(360deg); }

      const allWords = [wordXu, wordHong, wordDou];

      // 每个字的随机速度
      const speeds = [
        { x: 0.6, y: 0.4 },
        { x: -0.5, y: 0.7 },
        { x: 0.8, y: -0.5 }
      ];

      let pos = [
        { x: 8, y: 18 },
        { x: 25, y: 55 },
        { x: 70, y: 35 }
      ];

      let isFollowing = false;
      let followTarget = null;
      let followOffsetX = 0;
      let followOffsetY = 0;
      let isDragging = false;

      // 随机颜色生成
      function randomGradient() {
        const colors = [
          ['#FF6B9E', '#FFD93D', '#6BCB77', '#4D96FF', '#9B59B6'],
          ['#FF4757', '#FF6B81', '#FFA502', '#2ED573', '#1E90FF'],
          ['#A29BFE', '#FD79A8', '#FDCB6E', '#00CEC9', '#6C5CE7'],
          ['#FF9FF3', '#54A0FF', '#5F27CD', '#FF6B6B', '#FECA57'],
          ['#00D2D3', '#FF9F43', '#EE5A24', '#0ABDE3', '#A29BFE']
        ];
        const c = colors[Math.floor(Math.random() * colors.length)];
        return `linear-gradient(135deg, ${c[0]}, ${c[1]}, ${c[2]}, ${c[3]}, ${c[4]})`;
      }

      // 为每个字符设置随机渐变
      function randomizeColors() {
        allWords.forEach(word => {
          const charEls = word.querySelectorAll('.char');
          charEls.forEach(el => {
            const grad = randomGradient();
            el.style.background = grad;
            el.style.backgroundSize = '300% 300%';
            el.style.webkitBackgroundClip = 'text';
            el.style.backgroundClip = 'text';
          });
        });
      }

      // 初始随机化
      randomizeColors();

      // 每5秒随机变换一次颜色
      setInterval(randomizeColors, 5000);

      // 无规律飘动
      let animFrameId = null;

      function startFloating() {
        if (isFollowing) return;
        function animate() {
          if (isFollowing) {
            animFrameId = requestAnimationFrame(animate);
            return;
          }
          allWords.forEach((word, idx) => {
            if (word.classList.contains('following')) return;
            // 随机改变方向
            if (Math.random() < 0.02) {
              speeds[idx].x = (Math.random() - 0.5) * 1.2;
              speeds[idx].y = (Math.random() - 0.5) * 1.2;
            }
            pos[idx].x += speeds[idx].x * 0.3;
            pos[idx].y += speeds[idx].y * 0.3;

            // 边界反弹
            if (pos[idx].x < 2) { pos[idx].x = 2; speeds[idx].x *= -1; }
            if (pos[idx].x > 88) { pos[idx].x = 88; speeds[idx].x *= -1; }
            if (pos[idx].y < 5) { pos[idx].y = 5; speeds[idx].y *= -1; }
            if (pos[idx].y > 88) { pos[idx].y = 88; speeds[idx].y *= -1; }

            word.style.left = pos[idx].x + '%';
            word.style.top = pos[idx].y + '%';
          });
          animFrameId = requestAnimationFrame(animate);
        }
        animate();
      }

      // 点击组合跟随
      function handleWordClick(e) {
        const word = e.currentTarget;
        if (isFollowing && !word.classList.contains('following')) {
          // 如果已经在跟随模式，点击其他字则切换
          allWords.forEach(w => w.classList.remove('following'));
          isFollowing = false;
          followTarget = null;
          // 让所有字回到飘动状态
          allWords.forEach((w, idx) => {
            w.style.transition = 'none';
            w.style.left = pos[idx].x + '%';
            w.style.top = pos[idx].y + '%';
            w.style.transform = '';
          });
          setTimeout(() => {
            allWords.forEach(w => w.style.transition = '');
          }, 50);
          return;
        }

        // 进入跟随模式
        isFollowing = true;
        isDragging = false;
        followTarget = word;

        // 所有字组合到点击的字附近
        const rect = word.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        // 计算偏移量，让三个字并排
        const wordWidth = rect.width;
        const spacing = wordWidth * 1.2;

        allWords.forEach((w, idx) => {
          w.classList.add('following');
          w.style.transition = 'all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1)';
          const offset = (idx - 1) * spacing;
          w.style.left = (cx - wordWidth/2 + offset) + 'px';
          w.style.top = (cy - rect.height/2) + 'px';
          w.style.transform = 'scale(1.05)';
          // 保存相对偏移用于拖动
          if (idx === 0) followOffsetX = -spacing;
          else if (idx === 1) followOffsetX = 0;
          else followOffsetX = spacing;
          followOffsetY = 0;
        });

        // 更新位置存储为像素
        const rects = allWords.map(w => w.getBoundingClientRect());
        allWords.forEach((w, idx) => {
          pos[idx].x = (rects[idx].left / window.innerWidth) * 100;
          pos[idx].y = (rects[idx].top / window.innerHeight) * 100;
        });

        // 添加拖动监听
        document.addEventListener('mousemove', onDragMove);
        document.addEventListener('touchmove', onDragMoveTouch, { passive: false });
        document.addEventListener('mouseup', onDragEnd);
        document.addEventListener('touchend', onDragEnd);
        document.addEventListener('touchcancel', onDragEnd);
      }

      function onDragMove(e) {
        if (!isFollowing || !followTarget) return;
        isDragging = true;
        const cx = e.clientX;
        const cy = e.clientY;

        const wordWidth = followTarget.getBoundingClientRect().width;
        const spacing = wordWidth * 1.2;

        allWords.forEach((w, idx) => {
          const offset = (idx - 1) * spacing;
          w.style.left = (cx - wordWidth/2 + offset) + 'px';
          w.style.top = (cy - 30) + 'px';
          w.style.transform = 'scale(1.05)';
          // 更新pos存储
          const rect = w.getBoundingClientRect();
          pos[idx].x = (rect.left / window.innerWidth) * 100;
          pos[idx].y = (rect.top / window.innerHeight) * 100;
        });
        e.preventDefault();
      }

      function onDragMoveTouch(e) {
        if (!isFollowing || !followTarget) return;
        isDragging = true;
        const touch = e.touches[0];
        const cx = touch.clientX;
        const cy = touch.clientY;

        const wordWidth = followTarget.getBoundingClientRect().width;
        const spacing = wordWidth * 1.2;

        allWords.forEach((w, idx) => {
          const offset = (idx - 1) * spacing;
          w.style.left = (cx - wordWidth/2 + offset) + 'px';
          w.style.top = (cy - 30) + 'px';
          w.style.transform = 'scale(1.05)';
          const rect = w.getBoundingClientRect();
          pos[idx].x = (rect.left / window.innerWidth) * 100;
          pos[idx].y = (rect.top / window.innerHeight) * 100;
        });
        e.preventDefault();
      }

      function onDragEnd() {
        if (!isFollowing) return;
        document.removeEventListener('mousemove', onDragMove);
        document.removeEventListener('touchmove', onDragMoveTouch);
        document.removeEventListener('mouseup', onDragEnd);
        document.removeEventListener('touchend', onDragEnd);
        document.removeEventListener('touchcancel', onDragEnd);

        // 如果拖动距离很小，视为点击取消跟随
        if (!isDragging) {
          // 取消跟随，回到飘动
          allWords.forEach(w => {
            w.classList.remove('following');
            w.style.transition = 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
          });
          setTimeout(() => {
            isFollowing = false;
            followTarget = null;
            allWords.forEach(w => w.style.transition = '');
            // 随机分散
            allWords.forEach((w, idx) => {
              pos[idx].x = 10 + Math.random() * 75;
              pos[idx].y = 10 + Math.random() * 75;
              w.style.left = pos[idx].x + '%';
              w.style.top = pos[idx].y + '%';
              w.style.transform = '';
            });
          }, 500);
        } else {
          // 保持跟随模式，但恢复过渡
          setTimeout(() => {
            allWords.forEach(w => {
              w.style.transition = 'all 0.08s ease-out';
            });
          }, 50);
        }
        isDragging = false;
      }

      // 绑定点击事件
      allWords.forEach(word => {
        word.addEventListener('click', handleWordClick);
        word.addEventListener('touchstart', (e) => {
          // 防止触发页面滚动
          e.preventDefault();
        }, { passive: false });
      });

      // 启动飘动
      startFloating();

      // 窗口改变时调整位置
      window.addEventListener('resize', () => {
        if (!isFollowing) {
          allWords.forEach((w, idx) => {
            w.style.left = pos[idx].x + '%';
            w.style.top = pos[idx].y + '%';

      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let w, h;
      let animFrameIdParticles = null;

      function resizeCanvas() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      class Particle {
        constructor() {
          this.x = Math.random() * w;
          this.y = Math.random() * h;
          this.size = Math.random() * 3 + 1;
          this.speedX = (Math.random() - 0.5) * 0.4;
          this.speedY = (Math.random() - 0.5) * 0.4;
          this.hue = Math.random() * 360;
          this.opacity = Math.random() * 0.3 + 0.15;
        }
        update() {
          this.x += this.speedX;
          this.y += this.speedY;
          this.hue = (this.hue + 0.2) % 360;
          if (this.x < 0) this.x = w;
          if (this.x > w) this.x = 0;
          if (this.y < 0) this.y = h;
          if (this.y > h) this.y = 0;
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${this.hue}, 60%, 50%, ${this.opacity})`;
          ctx.fill();
        }
      }
      for (let i = 0; i < 80; i++) particles.push(new Particle());

      function animateParticles() {
        ctx.clearRect(0, 0, w, h);
        for (let p of particles) { p.update(); p.draw(); }
        for (let i = 0; i < particles.length; i++) {
          for (let j = i+1; j < particles.length; j++) {
            const dx = particles[i].x - particles[j].x;
            const dy = particles[i].y - particles[j].y;
            const dist = Math.sqrt(dx*dx + dy*dy);
            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(particles[i].x, particles[i].y);
              ctx.lineTo(particles[j].x, particles[j].y);
              ctx.strokeStyle = `hsla(${(particles[i].hue+particles[j].hue)/2}, 50%, 50%, 0.06)`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }
        animFrameIdParticles = requestAnimationFrame(animateParticles);
      }

            popupControls.classList.add("hidden");
            popupClose.classList.add("hidden");
            popupControlsVisible = false;
          }, POPUP_HIDE_DELAY);
        }
      }, { passive: false });
      popupVideo.addEventListener('touchend', () => { isPopupSwiping = false; });
      popupVideo.addEventListener('touchcancel', () => { isPopupSwiping = false; });

      let volDrag = false, volStartY = 0, volStartVal = 0;
      videoMuteBtn.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        volDrag = true;
        volStartY = e.touches[0].clientY;
        volStartVal = mainVideo.volume;
      }, { passive: true });
      videoMuteBtn.addEventListener('touchmove', (e) => {
        if (!volDrag) return;
        e.preventDefault();
        const dy = volStartY - e.touches[0].clientY;
        let v = Math.max(0, Math.min(1, volStartVal + dy / 800));
        mainVideo.volume = v;
        updateMuteIcon();
      }, { passive: false });
      videoMuteBtn.addEventListener('touchend', () => { volDrag = false; });
      videoMuteBtn.addEventListener('touchcancel', () => { volDrag = false; });
      videoMuteBtn.onclick = (e) => {
        if (volDrag) return;
        e.stopPropagation();
        mainVideo.muted = !mainVideo.muted;
        updateMuteIcon();
        showControls();
      };

      mainVideo.addEventListener('loadedmetadata', () => {
        totTime.textContent = formatTime(mainVideo.duration);
        if (mainVideo.currentTime > 0) {
          const p = (mainVideo.currentTime / mainVideo.duration) * 100;
          progressFill.style.width = p + "%";
          curTime.textContent = formatTime(mainVideo.currentTime);
        }
        updateCenterPlayBtn();
      });
      mainVideo.addEventListener('timeupdate', () => {
        if (mainVideo.duration > 0) {
          const p = (mainVideo.currentTime / mainVideo.duration) * 100;
          progressFill.style.width = p + "%";
          curTime.textContent = formatTime(mainVideo.currentTime);
        }
      });
      progressTrack.addEventListener("click", (e) => {
        const rect = progressTrack.getBoundingClientRect();
        const r = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        mainVideo.currentTime = r * mainVideo.duration;
        showControls();
      });
      mainVideo.addEventListener("play", () => {
        updatePlayBtnIcon();
        updateCenterPlayBtn();
        showControls();
        if (videoPopup.classList.contains('active') && popupVideo.src === mainVideo.src) {
          popupVideo.play().catch(() => {});
        }
      });
      mainVideo.addEventListener("pause", () => {
        updatePlayBtnIcon();
        centerPlayBtn.classList.remove('hidden');
        centerPlayBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        videoControls.classList.remove("hidden");
        clearTimeout(hideControlTimer);
        if (videoPopup.classList.contains('active') && popupVideo.src === mainVideo.src) {
          popupVideo.pause();
        }
      });
      mainVideo.addEventListener("ended", function() { switchVideo(currentVideoIndex + 1); });

      // ===== 弹出播放器 =====
      function togglePopupControls() {
        popupControlsVisible = !popupControlsVisible;
        popupControls.classList.toggle("hidden", !popupControlsVisible);
        popupClose.classList.toggle("hidden", !popupControlsVisible);
        clearTimeout(popupHideTimer);
      }
      function openPopup() {
        const src = mainVideo.src;
        if (!src) return;
        popupVideo.src = src;
        popupVideo.currentTime = mainVideo.currentTime;
        mainVideo.muted = true;
        if (!mainVideo.paused) popupVideo.play().catch(() => {});
        else popupVideo.pause();
        videoPopup.classList.add('active');
        document.body.style.overflow = 'hidden';
        popupMuteBtn.innerHTML = popupVideo.muted ? `<i class="fa-solid fa-volume-xmark"></i>` : `<i class="fa-solid fa-volume-high"></i>`;
        popupTotTime.textContent = formatTime(popupVideo.duration);
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      }
      function closePopup() {
        videoPopup.classList.remove('active');
        document.body.style.overflow = '';
        mainVideo.muted = false;
        if (!popupVideo.paused) {
          mainVideo.currentTime = popupVideo.currentTime;
          mainVideo.play().catch(() => {});
        }
        popupVideo.pause();
        popupVideo.src = '';
        updateMuteIcon();
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        popupControlsVisible = true;
        clearTimeout(popupHideTimer);
      }
      popupVideo.removeAttribute('loop');
      popupVideo.addEventListener('ended', () => {
        if (videoList.length > 0) {
          switchVideo(currentVideoIndex + 1);
          popupVideo.src = videoList[currentVideoIndex];
          popupVideo.play().catch(() => {});
          popupControlsVisible = true;
          popupControls.classList.remove("hidden");
          popupClose.classList.remove("hidden");
          clearTimeout(popupHideTimer);
          popupHideTimer = setTimeout(() => {
            popupControls.classList.add("hidden");
            popupClose.classList.add("hidden");
            popupControlsVisible = false;
          }, POPUP_HIDE_DELAY);
        }
      });
      popupVideo.addEventListener('click', (e) => { e.stopPropagation(); togglePopupControls(); });
      popupClose.addEventListener('click', (e) => { e.stopPropagation(); closePopup(); });
      videoPopup.addEventListener('click', (e) => {
        if (e.target === videoPopup && popupControlsVisible) {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
          clearTimeout(popupHideTimer);
        }
      });
      popupPlayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (popupVideo.paused) popupVideo.play().catch(() => {});
        else popupVideo.pause();
        if (!popupVideo.paused) {
          mainVideo.currentTime = popupVideo.currentTime;
          mainVideo.play().catch(() => {});
          mainVideo.muted = true;
        } else mainVideo.pause();
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });
      popupPrevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        prevVideo();
        popupVideo.src = videoList[currentVideoIndex];
        popupVideo.play().catch(() => {});
        mainVideo.muted = true;
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });
      popupNextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        nextVideo();
        popupVideo.src = videoList[currentVideoIndex];
        popupVideo.play().catch(() => {});
        mainVideo.muted = true;
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });
      popupMuteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        popupVideo.muted = !popupVideo.muted;
        popupMuteBtn.innerHTML = popupVideo.muted ? `<i class="fa-solid fa-volume-xmark"></i>` : `<i class="fa-solid fa-volume-high"></i>`;
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });
      popupVideo.addEventListener('loadedmetadata', () => {
        popupTotTime.textContent = formatTime(popupVideo.duration);
      });
      popupVideo.addEventListener('timeupdate', () => {
        const p = (popupVideo.currentTime / popupVideo.duration) * 100;
        popupProgressBar.style.width = p + "%";
        popupCurTime.textContent = formatTime(popupVideo.currentTime);
        if (!popupVideo.paused) mainVideo.currentTime = popupVideo.currentTime;
      });
      popupProgressWrap.addEventListener('click', (e) => {
        const rect = popupProgressWrap.getBoundingClientRect();
        const r = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        popupVideo.currentTime = r * popupVideo.duration;
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });
      popupVideo.addEventListener('play', () => {
        popupPlayBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
        mainVideo.currentTime = popupVideo.currentTime;
        mainVideo.play().catch(() => {});
        mainVideo.muted = true;
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });
      popupVideo.addEventListener('pause', () => {
        popupPlayBtn.innerHTML = `<i class="fa-solid fa-play"></i>`;
        mainVideo.pause();
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      // ===== 图片查看器 =====
      function updateViewerCounter() {
        viewerCounter.textContent = viewerGallery && viewerGallery.length > 0 ? (viewerGalleryIndex + 1) + ' / ' + viewerGallery.length : '1 / 1';
      }
      function startViewerAutoPlay() {
        stopViewerAutoPlay();
        if (!viewerGallery || viewerGallery.length <= 1) return;
        viewerAutoPlayTimer = setInterval(() => {
          if (isViewerInteracting) return;
          viewerGalleryIndex = (viewerGalleryIndex + 1) % viewerGallery.length;
          viewerImg.src = viewerGallery[viewerGalleryIndex];
          updateViewerCounter();
        }, 3500);
      }
      function stopViewerAutoPlay() { if (viewerAutoPlayTimer) { clearInterval(viewerAutoPlayTimer); viewerAutoPlayTimer = null; } }
      function resetViewerAutoPlay() { stopViewerAutoPlay(); if (viewer.classList.contains('show') && viewerGallery && viewerGallery.length > 1) startViewerAutoPlay(); }
      function openViewer(gallery, idx, alt) {
        if (!gallery || gallery.length === 0) return;
        stopViewerAutoPlay();
        viewerGallery = gallery;
        viewerGalleryIndex = idx;
        viewerImg.src = viewerGallery[viewerGalleryIndex];
        viewerImg.alt = alt || "原图";
        viewer.classList.add("show");
        document.body.style.overflow = "hidden";
        viewerHint.textContent = '左右滑动切换 · 长按保存';
        updateViewerCounter();
        if (viewerGallery.length > 1) setTimeout(() => { if (viewer.classList.contains('show')) startViewerAutoPlay(); }, 1200);
        isViewerInteracting = false;
      }
      function closeViewer() { stopViewerAutoPlay(); viewer.classList.remove("show"); document.body.style.overflow = ""; isViewerInteracting = false; setTimeout(() => { if (!viewer.classList.contains("show")) viewerImg.src = ""; }, 250); }
      function viewerPrev() { if (!viewerGallery || viewerGallery.length === 0) return; isViewerInteracting = true; viewerGalleryIndex = (viewerGalleryIndex - 1 + viewerGallery.length) % viewerGallery.length; viewerImg.src = viewerGallery[viewerGalleryIndex]; updateViewerCounter(); resetViewerAutoPlay(); setTimeout(() => isViewerInteracting = false, 300); }
      function viewerNext() { if (!viewerGallery || viewerGallery.length === 0) return; isViewerInteracting = true; viewerGalleryIndex = (viewerGalleryIndex + 1) % viewerGallery.length; viewerImg.src = viewerGallery[viewerGalleryIndex]; updateViewerCounter(); resetViewerAutoPlay(); setTimeout(() => isViewerInteracting = false, 300); }
      let vStartX = 0, vStartY = 0, vIsHoriz = null;
      viewer.addEventListener("touchstart", (e) => { isViewerInteracting = true; vStartX = e.touches[0].clientX; vStartY = e.touches[0].clientY; vIsHoriz = null; }, { passive: true });
      viewer.addEventListener("touchmove", (e) => {
        if (!viewer.classList.contains('show')) return;
        const dx = e.touches[0].clientX - vStartX;
        const dy = e.touches[0].clientY - vStartY;
        if (vIsHoriz === null) vIsHoriz = Math.abs(dx) > Math.abs(dy);
        if (vIsHoriz) e.preventDefault();
      }, { passive: false });
      viewer.addEventListener("touchend", (e) => {
        if (!viewer.classList.contains('show')) return;
        const dx = e.changedTouches[0].clientX - vStartX;
        if (Math.abs(dx) > 40) { if (dx < 0) viewerNext(); else viewerPrev(); }
        setTimeout(() => { isViewerInteracting = false; resetViewerAutoPlay(); }, 400);
      }, { passive: true });
      viewer.addEventListener('wheel', (e) => {
        if (!viewer.classList.contains('show')) return;
        e.preventDefault();
        if (e.deltaX > 30 || e.deltaY > 30) viewerNext();
        else if (e.deltaX < -30 || e.deltaY < -30) viewerPrev();
        resetViewerAutoPlay();
      }, { passive: false });
      document.addEventListener('keydown', (e) => {
        if (!viewer.classList.contains('show')) return;
        if (e.key === 'ArrowLeft') { e.preventDefault(); viewerPrev(); resetViewerAutoPlay(); }
        else if (e.key === 'ArrowRight') { e.preventDefault(); viewerNext(); resetViewerAutoPlay(); }
        else if (e.key === 'Escape') closeViewer();
      });
      $("#avatar").addEventListener("click", (e) => { e.stopPropagation(); openViewer(avatarImages, avatarIndex, "头像原图"); });
      $("#platePhoto").addEventListener("click", (e) => { e.stopPropagation(); openViewer(slideImages, slideIndex, "图片原图"); });
      viewerClose.addEventListener("click", closeViewer);
      viewer.addEventListener("click", (e) => { if (e.target === viewer) closeViewer(); });
      let lpTimer = null;
      viewerImg.addEventListener('touchstart', () => { lpTimer = setTimeout(() => { const a = document.createElement('a'); a.href = viewerImg.src; a.download = 'preview-image'; document.body.appendChild(a); a.click(); a.remove(); showToastMsg("开始下载图片"); }, 600); }, { passive: true });
      viewerImg.addEventListener('touchend', () => { clearTimeout(lpTimer); });
      viewerImg.addEventListener('touchcancel', () => { clearTimeout(lpTimer); });

      // ===== APP跳转 =====
      function jumpToApp(key) {
        if (isJumping) return;
        const config = APP_CONFIG[key];
        if (!config) return;
        const item = document.querySelector(`[data-app="${key}"]`);
        if (!item || item.classList.contains("loading")) return;
        isJumping = true;
        item.classList.add("loading");
        const orig = item.innerHTML;
        item.innerHTML = `<div class="app-icon-wrap"><i class="fa-solid fa-spinner fa-spin"></i></div><span class="app-label">打开中</span>`;
        let unloaded = false;
        const onUnload = () => { unloaded = true; isJumping = false; window.removeEventListener('beforeunload', onUnload); document.removeEventListener('visibilitychange', onVis); };
        const onVis = () => {
          if (!document.hidden && !unloaded) {
            if (document.body.contains(item)) { item.classList.remove("loading"); item.innerHTML = orig; }
            isJumping = false;
            window.removeEventListener('beforeunload', onUnload);
            document.removeEventListener('visibilitychange', onVis);
          }
        };
        window.addEventListener('beforeunload', onUnload);
        document.addEventListener('visibilitychange', onVis);
        try {
          const win = window.open(config.scheme, '_blank');
          if (!win || win.closed) window.location.href = config.scheme;
        } catch (e) {
          item.classList.remove("loading"); item.innerHTML = orig; isJumping = false;
          window.removeEventListener('beforeunload', onUnload);
          document.removeEventListener('visibilitychange', onVis);
          return;
        }
        setTimeout(() => {
          if (!unloaded && isJumping) {
            if (document.body.contains(item)) { item.classList.remove("loading"); item.innerHTML = orig; }
            isJumping = false;
            window.removeEventListener('beforeunload', onUnload);
            document.removeEventListener('visibilitychange', onVis);
          }
        }, 2800);
      }
      $$(".app-button").forEach(el => {
        el.addEventListener("click", (e) => { e.stopPropagation(); jumpToApp(el.dataset.app); });
      });

      // ===== 复制车牌 =====
      $("#plate").addEventListener("click", async (e) => {
        e.stopPropagation();
        const txt = "苏FA36165";
        try { await navigator.clipboard.writeText(txt); } catch {
          const inp = document.createElement("input");
          inp.value = txt;
          inp.style.cssText = "position:fixed;opacity:0;";
          document.body.appendChild(inp);
          inp.select();
          document.execCommand("copy");
          inp.remove();
        }
        showToastMsg("车牌号已复制");
      });

      // ===== 点击弹字 =====
      const clickTexts = ["苏FA36165", "Xiaomi SU7 Pro", "刘茜美子", "❤️ 刘亦菲", "刘亦菲", "亦菲"];
      document.body.addEventListener("click", (e) => {
        if (e.target.closest(".app-button") || e.target.closest(".viewer") ||
          e.target.closest("#plate") || e.target.closest(".video-controls") ||
          e.target.closest(".video-popup") || e.target.closest(".btn-expand") ||
          e.target.closest(".dynamic-island") || e.target.closest(".app-icon-wrap") ||
          e.target.closest(".center-play-btn") || e.target.closest(".theme-toggle") ||
          e.target.closest(".floating-word")) return;
        const txt = clickTexts[Math.floor(Math.random() * clickTexts.length)];
        const el = document.createElement("div");
        el.className = "click-text-item";
        el.textContent = txt;
        el.style.animation = 'popFloatGrad 4.5s var(--ease) forwards';
        el.style.left = (e.clientX - 40) + "px";
        el.style.top = (e.clientY - 20) + "px";
        document.body.appendChild(el);
        setTimeout(() => { if (el.parentNode) el.remove(); }, 4600);
      });

      // ===== 状态栏时间 =====
      function updateTime() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, "0");
        const m = String(now.getMinutes()).padStart(2, "0");
        $("#statusTime").textContent = h + ":" + m;
      }
      updateTime();
      setInterval(updateTime, 1000);

      // ===== 启动 =====
      setTimeout(() => {
        videoControls.classList.remove('hidden');
        centerPlayBtn.classList.remove('hidden');
        updateCenterPlayBtn();
        if (!mainVideo.paused) startAutoHideTimer();
      }, 500);

      document.addEventListener('visibilitychange', () => { if (!document.hidden) ensureSakura(); });

      window.addEventListener('beforeunload', () => {
        if (glowInterval) clearInterval(glowInterval);
        if (sakuraInterval) clearInterval(sakuraInterval);
        if (islandInterval) clearInterval(islandInterval);
        if (avatarTimer) clearInterval(avatarTimer);
        if (slideTimer) clearInterval(slideTimer);
        stopViewerAutoPlay();
        if (animFrameIdParticles) cancelAnimationFrame(animFrameIdParticles);
        if (animFrameId) cancelAnimationFrame(animFrameId);
      });
    })();
  </script>
</body>
</html>
