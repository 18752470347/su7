<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#EEF2FA">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <title>苏FA36165 · 快速启动</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ===== 全局重置 & 性能优化 ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --text-main: #1D1D1F;
      --text-sub: #555861;
      --text-muted: #8E929C;
      --bg-primary: #f7f9fc;
      --glass-bg: rgba(255, 255, 255, 0.48);
      --glass-border: rgba(255, 255, 255, 0.60);
      --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.08), 0 6px 18px rgba(0, 0, 0, 0.03);
      --card-bg: rgba(255, 255, 255, 0.48);
      --icon-bg: rgba(255, 255, 255, 0.7);
      --status-color: #000;
      --toast-bg: rgba(20, 22, 28, 0.78);
      --viewer-bg: rgba(0, 0, 0, 0.85);
      --plate-text: #fff;
      --plate-bg: linear-gradient(135deg, #34C759, #28A745);
      --name-gradient: linear-gradient(90deg, #FF5C93, #C84870, #4A8DFF, #FF5C93);
      --sub-gradient: linear-gradient(90deg, #FF6D9C, #558EFF);
      --liquid-gradient: radial-gradient(ellipse at 15% 10%, rgba(120,170,255,0.30), transparent 55%),
                          radial-gradient(ellipse at 85% 20%, rgba(255,160,200,0.25), transparent 55%),
                          radial-gradient(ellipse at 20% 85%, rgba(110,230,200,0.22), transparent 55%),
                          radial-gradient(ellipse at 80% 88%, rgba(190,160,255,0.28), transparent 55%);
      --border-light: rgba(255,255,255,0.5);
      --island-bg: #000;
      --island-text: #fff;
      --popup-overlay: rgba(0,0,0,0.85);
      --glow-color: #FF2E63;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --spring: cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 深色模式 */
    html.dark-mode {
      --text-main: #F5F5F7;
      --text-sub: #A1A4AA;
      --text-muted: #6E7278;
      --bg-primary: #0A0A0C;
      --glass-bg: rgba(28, 28, 32, 0.7);
      --glass-border: transparent;
      --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 6px 18px rgba(0, 0, 0, 0.3);
      --card-bg: rgba(28, 28, 32, 0.7);
      --icon-bg: rgba(60, 60, 66, 0.7);
      --status-color: #F5F5F7;
      --toast-bg: rgba(60, 60, 66, 0.85);
      --viewer-bg: rgba(0, 0, 0, 0.92);
      --plate-bg: linear-gradient(135deg, #2E8B57, #1E6B3A);
      --name-gradient: linear-gradient(90deg, #FF7A9E, #D86A8A, #6A9EFF, #FF7A9E);
      --sub-gradient: linear-gradient(90deg, #FF8AAF, #7AA5FF);
      --liquid-gradient: radial-gradient(ellipse at 15% 10%, rgba(60,100,200,0.25), transparent 55%),
                          radial-gradient(ellipse at 85% 20%, rgba(180,100,140,0.20), transparent 55%),
                          radial-gradient(ellipse at 20% 85%, rgba(70,180,150,0.18), transparent 55%),
                          radial-gradient(ellipse at 80% 88%, rgba(130,110,200,0.22), transparent 55%);
      --border-light: transparent;
      --island-bg: #1C1C1E;
      --island-text: #fff;
      --popup-overlay: rgba(0,0,0,0.92);
      --glow-color: #00D4FF;
    }
    html.light-mode {
      --text-main: #1D1D1F;
      --text-sub: #555861;
      --text-muted: #8E929C;
      --bg-primary: #f7f9fc;
      --glass-bg: rgba(255, 255, 255, 0.48);
      --glass-border: rgba(255, 255, 255, 0.60);
      --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.08), 0 6px 18px rgba(0, 0, 0, 0.03);
      --card-bg: rgba(255, 255, 255, 0.48);
      --icon-bg: rgba(255, 255, 255, 0.7);
      --status-color: #000;
      --toast-bg: rgba(20, 22, 28, 0.78);
      --viewer-bg: rgba(0, 0, 0, 0.85);
      --plate-bg: linear-gradient(135deg, #34C759, #28A745);
      --name-gradient: linear-gradient(90deg, #FF5C93, #C84870, #4A8DFF, #FF5C93);
      --sub-gradient: linear-gradient(90deg, #FF6D9C, #558EFF);
      --liquid-gradient: radial-gradient(ellipse at 15% 10%, rgba(120,170,255,0.30), transparent 55%),
                          radial-gradient(ellipse at 85% 20%, rgba(255,160,200,0.25), transparent 55%),
                          radial-gradient(ellipse at 20% 85%, rgba(110,230,200,0.22), transparent 55%),
                          radial-gradient(ellipse at 80% 88%, rgba(190,160,255,0.28), transparent 55%);
      --border-light: rgba(255,255,255,0.5);
      --island-bg: #000;
      --island-text: #fff;
      --popup-overlay: rgba(0,0,0,0.85);
      --glow-color: #FF2E63;
    }

    html {
      width: 100%;
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      transition: background-color 0.3s ease, color 0.3s ease;
      will-change: background-color, color;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-primary);
      -webkit-touch-callout: none;
      overscroll-behavior: none;
      user-select: none;
      margin: 0;
      padding: 0;
      color: var(--text-main);
      transition: background-color 0.3s ease, color 0.3s ease;
      will-change: background-color, color;
    }

    button, img, video {
      -webkit-user-drag: none;
      user-select: none;
    }
    button {
      font: inherit;
      cursor: pointer;
      background: none;
      border: none;
      outline: none;
    }

    /* ===== 背景 (GPU加速) ===== */
    .liquid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateZ(0);
    }
    .liquid-gradient {
      position: absolute;
      width: 140vw;
      height: 140vh;
      top: -20vh;
      left: -20vw;
      background: var(--liquid-gradient);
      animation: liquidFlow 22s ease-in-out infinite alternate;
      filter: blur(72px);
      -webkit-filter: blur(72px);
      transition: background 0.6s ease;
      will-change: transform;
      transform: translateZ(0);
    }
    @keyframes liquidFlow {
      0% { transform: translate(0,0) rotate(0deg) scale(1.03); }
      50% { transform: translate(40px, -30px) rotate(4deg) scale(1.08); }
      100% { transform: translate(-30px, 40px) rotate(-4deg) scale(1.03); }
    }

    /* ===== 樱花 ===== */
    .sakura-container {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
      overflow: hidden;
      transform: translateZ(0);
    }
    .sakura {
      position: absolute;
      background: #ffc8d8;
      border-radius: 50% 0 50% 50%;
      opacity: 0.72;
      will-change: transform, opacity;
      transform: translateZ(0);
      box-shadow: 0 2px 6px rgba(255, 180, 200, 0.3);
      transition: opacity 0.3s ease;
    }
    @keyframes sakuraFall {
      0% { transform: translateY(-8vh) rotate(0deg) translateX(0px); opacity: 0.9; }
      30% { transform: translateY(30vh) rotate(240deg) translateX(20px); }
      70% { transform: translateY(70vh) rotate(520deg) translateX(-20px); }
      100% { transform: translateY(105vh) rotate(720deg) translateX(0px); opacity: 0; }
    }

    /* ===== 页面入场 ===== */
    @keyframes pageSpringIn {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes cardSpringIn {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== iOS状态栏 ===== */
    .ios-status-bar {
      position: relative;
      width: 100%;
      padding: calc(var(--safe-top) + 6px) 16px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--status-color);
      z-index: 3;
      transition: color 0.3s ease;
      min-height: 44px;
    }
    .ios-status-left {
      flex: 1;
      text-align: left;
      font-weight: 600;
      letter-spacing: 0.3px;
      font-variant-numeric: tabular-nums;
    }

    /* ===== 灵动岛 ===== */
    .dynamic-island {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 36px;
      padding: 0 16px;
      min-width: 60px;
      background: var(--island-bg);
      border-radius: 20px;
      color: var(--island-text);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2px;
      position: relative;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.08);
      flex-shrink: 0;
      margin: 0 8px;
      overflow: hidden;
      transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                  padding 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                  border-radius 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: default;
      pointer-events: none;
      animation: islandBreath 2s ease-in-out infinite alternate;
      width: auto;
    }
    .dynamic-island::before {
      content: '';
      position: absolute;
      inset: -12px;
      border-radius: 30px;
      background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
      opacity: 0.25;
      z-index: -1;
      filter: blur(16px);
      transition: background 0.6s ease, opacity 0.4s ease;
      animation: islandOuterPulse 2.4s ease-in-out infinite alternate;
      will-change: transform, opacity;
    }
    .dynamic-island::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 22px;
      padding: 2px;
      background: var(--glow-color);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      transition: background 0.6s ease;
      opacity: 0.7;
      animation: borderPulse 2s ease-in-out infinite alternate;
    }
    @keyframes borderPulse {
      0% { opacity: 0.4; }
      100% { opacity: 0.9; }
    }
    @keyframes islandBreath {
      0% { box-shadow: 0 0 20px rgba(0, 122, 255, 0.15), inset 0 0 20px rgba(0, 122, 255, 0.05); }
      100% { box-shadow: 0 0 40px rgba(0, 212, 255, 0.35), inset 0 0 30px rgba(0, 212, 255, 0.12); }
    }
    @keyframes islandOuterPulse {
      0% { transform: scale(0.92); opacity: 0.15; }
      100% { transform: scale(1.15); opacity: 0.35; }
    }

    .island-text-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: relative;
      white-space: nowrap;
    }
    .island-text-scroll {
      display: inline-block;
      text-align: center;
      font-weight: 600;
      font-size: 13px;
      background: linear-gradient(90deg, #FF5C93, #FFD046, #4A8DFF, #FF5C93);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: textGradientScroll 3s ease-in-out infinite;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      will-change: transform, opacity;
      transition: opacity 0.3s ease;
    }
    .island-text-scroll.rolling {
      animation: textRollUp 0.8s ease-in-out forwards, textGradientScroll 3s ease-in-out infinite;
    }
    @keyframes textRollUp {
      0% { transform: translateY(100%); opacity: 0; }
      30% { opacity: 1; }
      100% { transform: translateY(0%); opacity: 1; }
    }
    @keyframes textGradientScroll {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .ios-status-right {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
    }
    .signal-icon {
      width: 18px;
      height: 12px;
      fill: var(--status-color);
      transition: fill 0.3s ease;
      flex-shrink: 0;
    }

    .page {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 470px;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      animation: pageSpringIn .75s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .wrap-inner {
      width: 100%;
      padding-bottom: calc(var(--safe-bottom));
    }

    /* ===== 视频卡片 ===== */
    .video-card {
      position: relative;
      width: 100%;
      margin-bottom: 24px;
      border-radius: 32px;
      box-shadow: var(--glass-shadow);
      overflow: hidden;
      isolation: isolate;
      animation: cardSpringIn .7s cubic-bezier(0.22, 1, 0.36, 1) 0.14s both;
      background: #090D17;
      transition: height 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      transform: translateZ(0);
    }
    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 7.2;
      border-radius: 32px;
      overflow: hidden;
      background: #090D17;
      transition: aspect-ratio 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .video-box.normal {
      aspect-ratio: 16 / 9.2;
    }
    .video-box video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      -webkit-object-fit: cover;
      background: #090D17;
    }
    .video-play {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #1D1D1F;
      background: rgba(255, 255, 255, .72);
      border: 1px solid rgba(255, 255, 255, .9);
      box-shadow: 0 12px 32px rgba(0, 0, 0, .28), inset 0 1px 0 rgba(255, 255, 255, .9);
      backdrop-filter: blur(18px) saturate(160%);
      -webkit-backdrop-filter: blur(18px) saturate(160%);
      pointer-events: none;
      transition: opacity .28s ease, transform .28s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 2;
      width: 64px;
      height: 64px;
    }
    .video-card.playing .video-play {
      opacity: 0;
      transform: translate(-50%, -50%) scale(0.72);
    }

    .video-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 12px 14px 14px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.65));
      z-index: 3;
      opacity: 1;
      transition: opacity 0.35s ease;
      pointer-events: auto;
    }
    .video-controls.hidden-controls {
      opacity: 0;
      pointer-events: none;
    }
    .progress-wrap {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.25);
      border-radius: 99px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: height 0.15s;
    }
    .progress-wrap:hover { height: 6px; }
    .progress-bar {
      height: 100%;
      border-radius: inherit;
      background: #fff;
      width: 0%;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .control-row button {
      color: #fff;
      font-size: 18px;
      padding: 4px;
      transition: opacity 0.2s;
      opacity: 0.9;
    }
    .control-row button:active { opacity: 0.5; }
    .video-time {
      margin-left: auto;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .video-popup-trigger {
      color: #fff;
      font-size: 15px;
      padding: 4px;
      opacity: 0.9;
      transition: opacity 0.2s, transform 0.2s;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .video-popup-trigger:active {
      opacity: 0.5;
      transform: scale(0.88);
    }

    /* ===== 视频弹出播放器 (副视频) ===== */
    .video-popup {
      position: fixed;
      inset: 0;
      z-index: 10050;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--popup-overlay);
      backdrop-filter: blur(20px) saturate(120%);
      -webkit-backdrop-filter: blur(20px) saturate(120%);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.35s ease, visibility 0.35s ease;
      padding: 20px;
    }
    .video-popup.active {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .video-popup-inner {
      position: relative;
      width: 100%;
      max-width: 800px;
      background: #000;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 40px 80px rgba(0,0,0,0.6);
      transform: scale(0.92);
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                  width 0.4s cubic-bezier(0.22, 1, 0.36, 1),
                  height 0.4s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .video-popup.active .video-popup-inner {
      transform: scale(1);
    }
    .video-popup-inner video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }
    .video-popup-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10;
      transition: background 0.2s, opacity 0.4s ease;
      opacity: 1;
    }
    .video-popup-close:active {
      background: rgba(255,255,255,0.3);
      transform: scale(0.92);
    }
    .video-popup-close.hidden-controls {
      opacity: 0;
      pointer-events: none;
    }
    .video-popup-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 16px 20px 20px;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 14px;
      color: #fff;
      opacity: 1;
      transition: opacity 0.4s ease;
    }
    .video-popup-controls.hidden-controls {
      opacity: 0;
      pointer-events: none;
    }
    .video-popup-controls button {
      color: #fff;
      font-size: 20px;
      padding: 4px;
      opacity: 0.9;
    }
    .video-popup-controls button:active { opacity: 0.5; }
    .video-popup-controls .popup-progress-wrap {
      flex: 1;
      height: 4px;
      background: rgba(255,255,255,0.25);
      border-radius: 99px;
      cursor: pointer;
      position: relative;
    }
    .video-popup-controls .popup-progress-bar {
      height: 100%;
      border-radius: inherit;
      background: #fff;
      width: 0%;
    }
    .video-popup-controls .popup-time {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2px;
      min-width: 100px;
      text-align: right;
    }
    .popup-nav-btn {
      font-size: 18px !important;
    }

    /* ===== 头像 ===== */
    .avatar {
      position: relative;
      width: 66px;
      height: 66px;
      margin-bottom: 12px;
      border-radius: 50%;
      cursor: zoom-in;
      isolation: isolate;
      transform: translateZ(0);
    }
    .avatar::after {
      content: "";
      position: absolute;
      inset: -18px;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
      opacity: 0.35;
      z-index: -3;
      animation: avatarOuterPulse 2s ease-in-out infinite alternate;
      filter: blur(12px);
      transition: background 0.4s ease;
      will-change: transform, opacity;
    }
    @keyframes avatarOuterPulse {
      0% { transform: scale(0.92); opacity: 0.25; }
      100% { transform: scale(1.15); opacity: 0.55; }
    }
    .avatar::before {
      content: "";
      position: absolute;
      inset: -5px;
      z-index: -1;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--glow-color), #FFD046, #00FFA3, #00D4FF, #7B61FF, var(--glow-color));
      animation: avatarRotateBreath 2.5s linear infinite;
      filter: blur(3px);
      -webkit-filter: blur(3px);
      transition: background 0.4s ease;
      will-change: transform;
    }
    @keyframes avatarRotateBreath {

      function rollText() {

        void islandText.offsetWidth;

      // ===== 静态呼吸灯颜色 =====
      function randomColor() {
        const colors = [
          '#FF2E63', '#00D4FF', '#7B61FF', '#FFD046', '#00FFA3',
          '#FF6B6B', '#4ECDC4', '#FF9F43', '#A29BFE', '#FD79A8',
          '#00CEC9', '#E17055', '#6C5CE7', '#FDCB6E', '#00B894'
        ];
        return colors[Math.floor(Math.random() * colors.length)];
      }

      function updateGlowColor() {
        const color = randomColor();
        document.documentElement.style.setProperty('--glow-color', color);
      }

      // ===== 工具函数 =====
      function formatTime(s) {
        if (isNaN(s) || !isFinite(s)) return "00:00";
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60);
        return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
      }

      function showToast(text) {
        toast.textContent = text;
        toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove("show"), 1300);
      }

      function toggleVideo() {
        if (mainVideo.paused) {
          mainVideo.play().catch(() => showToast("请点击播放"));
        } else {
          mainVideo.pause();
        }
      }

      function showControls() {
        videoControls.classList.remove("hidden-controls");
        clearTimeout(hideControlTimer);
        if (!mainVideo.paused) {
          hideControlTimer = setTimeout(() => {
            videoControls.classList.add("hidden-controls");
          }, HIDE_DELAY);
        }
      }

      function prevVideo() {
        if (videoList.length === 0) return;
        currentVideoIndex = (currentVideoIndex - 1 + videoList.length) % videoList.length;
        const src = videoList[currentVideoIndex];
        mainVideo.src = src;
        mainVideo.play().catch(() => showToast("请手动播放"));
        popupVideo.src = src;
        updatePopupSize(src);
      }

      function nextVideo() {
        if (videoList.length === 0) return;
        currentVideoIndex = (currentVideoIndex + 1) % videoList.length;
        const src = videoList[currentVideoIndex];
        mainVideo.src = src;
        mainVideo.play().catch(() => showToast("请手动播放"));
        popupVideo.src = src;
        updatePopupSize(src);
      }

      function updateVolumeIcon() {
        if (mainVideo.muted || mainVideo.volume <= 0) {
          videoMuteBtn.innerHTML = `<i class="fa-solid fa-volume-xmark"></i>`;
        } else if (mainVideo.volume < 0.5) {
          videoMuteBtn.innerHTML = `<i class="fa-solid fa-volume-low"></i>`;
        } else {
          videoMuteBtn.innerHTML = `<i class="fa-solid fa-volume-high"></i>`;
        }
      }

      // ===== 副视频自适应比例 =====
      function updatePopupSize(src) {
        const video = popupVideo;
        if (video.videoWidth > 0 && video.videoHeight > 0) {
          setPopupAspectRatio(video.videoWidth, video.videoHeight);
        } else {
          video.addEventListener('loadedmetadata', function onMeta() {
            setPopupAspectRatio(video.videoWidth, video.videoHeight);
            video.removeEventListener('loadedmetadata', onMeta);
          });
        }
      }

      function setPopupAspectRatio(w, h) {
        if (w === 0 || h === 0) return;
        const ratio = w / h;
        const maxWidth = Math.min(800, window.innerWidth - 40);
        const maxHeight = Math.min(600, window.innerHeight - 100);
        let width = maxWidth;
        let height = width / ratio;
        if (height > maxHeight) {
          height = maxHeight;
          width = height * ratio;
        }
        popupInner.style.width = width + 'px';
        popupInner.style.height = height + 'px';
        popupInner.style.maxWidth = 'none';
      }

      window.addEventListener('resize', () => {
        if (videoPopup.classList.contains('active')) {
          const video = popupVideo;
          if (video.videoWidth > 0 && video.videoHeight > 0) {
            setPopupAspectRatio(video.videoWidth, video.videoHeight);
          }
        }
      });

      // ===== 副视频控件切换 =====
      function togglePopupControls() {
        popupControlsVisible = !popupControlsVisible;
        if (popupControlsVisible) {
          popupControls.classList.remove("hidden-controls");
          popupClose.classList.remove("hidden-controls");
          clearTimeout(popupHideTimer);
        } else {
          popupControls.classList.add("hidden-controls");
          popupClose.classList.add("hidden-controls");
          clearTimeout(popupHideTimer);
        }
      }

      // ===== 弹出播放器 =====
      function openPopup() {
        const src = mainVideo.src;
        if (!src) return;
        popupVideo.src = src;
        popupVideo.currentTime = mainVideo.currentTime;
        mainVideo.muted = true;
        if (!mainVideo.paused) {
          popupVideo.play().catch(() => {});
        }
        videoPopup.classList.add('active');
        document.body.style.overflow = 'hidden';
        popupMuteBtn.innerHTML = popupVideo.muted ? `<i class="fa-solid fa-volume-xmark"></i>` : `<i class="fa-solid fa-volume-high"></i>`;
        popupTotalTime.textContent = formatTime(popupVideo.duration);
        if (popupVideo.videoWidth > 0 && popupVideo.videoHeight > 0) {
          setPopupAspectRatio(popupVideo.videoWidth, popupVideo.videoHeight);
        } else {
          popupVideo.addEventListener('loadedmetadata', function onMeta() {
            setPopupAspectRatio(popupVideo.videoWidth, popupVideo.videoHeight);
            popupVideo.removeEventListener('loadedmetadata', onMeta);
          });
        }
        popupControlsVisible = true;
        popupControls.classList.remove("hidden-controls");
        popupClose.classList.remove("hidden-controls");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden-controls");
          popupClose.classList.add("hidden-controls");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      }

      function closePopup() {
        videoPopup.classList.remove('active');
        document.body.style.overflow = '';
        mainVideo.muted = false;
        if (!popupVideo.paused) {
          mainVideo.currentTime = popupVideo.currentTime;
          mainVideo.play().catch(() => {});
        }
        popupVideo.pause();
        popupVideo.src = '';
        updateVolumeIcon();
        popupControls.classList.remove("hidden-controls");
        popupClose.classList.remove("hidden-controls");
        popupControlsVisible = true;
        clearTimeout(popupHideTimer);
        popupInner.style.width = '';
        popupInner.style.height = '';
      }

      // ===== 副视频点击事件 =====
      popupVideo.addEventListener('click', (e) => {
        e.stopPropagation();
        togglePopupControls();
      });

      // ===== 樱花 =====
      function createSakura() {
        const sakura = document.createElement("div");
        sakura.className = "sakura";
        const size = Math.random() * 10 + 4;
        sakura.style.width = size + "px";
        sakura.style.height = size + "px";
        sakura.style.left = Math.random() * 100 + "%";
        const dur = Math.random() * 6 + 5;
        sakura.style.animation = `sakuraFall ${dur}s linear forwards`;
        sakura.style.opacity = '0.72';
        sakuraContainer.appendChild(sakura);

        let frameId = null;
        const check = () => {
          if (!sakura.parentNode) return;
          const rect = sakura.getBoundingClientRect();
          const videoRect = videoCard.getBoundingClientRect();
          const cardRect = document.querySelector('.main-card').getBoundingClientRect();
          const isOverVideo = !(rect.right < videoRect.left || rect.left > videoRect.right ||
            rect.bottom < videoRect.top || rect.top > videoRect.bottom);
          const isOverCard = !(rect.right < cardRect.left || rect.left > cardRect.right ||
            rect.bottom < cardRect.top || rect.top > cardRect.bottom);
          sakura.style.opacity = isOverVideo ? '0' : '0.72';
          frameId = requestAnimationFrame(check);
        };
        check();

        setTimeout(() => {
          if (frameId) cancelAnimationFrame(frameId);
          if (sakura.parentNode) sakura.remove();
        }, dur * 1000);
      }

      // ===== 主视频事件 =====
      if (videoList.length > 0) {
        mainVideo.src = videoList[0];
        popupVideo.src = videoList[0];
      }

      videoCard.addEventListener("click", e => {
        if (e.target.closest(".video-controls") || e.target.closest(".video-popup-trigger")) return;
        e.stopPropagation();
        toggleVideo();
      });

      videoBox.addEventListener("touchstart", showControls);
      videoBox.addEventListener("touchmove", showControls);
      videoBox.addEventListener("mousemove", showControls);

      videoPlayBtn.onclick = (e) => { e.stopPropagation();
        toggleVideo(); };

      let volumeDragActive = false;
      let volumeStartY = 0;
      let volumeStartVal = 0;
      videoMuteBtn.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        volumeDragActive = true;
        volumeStartY = e.touches[0].clientY;
        volumeStartVal = mainVideo.volume;
      }, { passive: true });
      videoMuteBtn.addEventListener('touchmove', (e) => {
        if (!volumeDragActive) return;
        e.preventDefault();
        const dy = volumeStartY - e.touches[0].clientY;
        let newVol = volumeStartVal + dy / 800;
        newVol = Math.max(0, Math.min(1, newVol));
        mainVideo.volume = newVol;
        updateVolumeIcon();
      }, { passive: false });
      videoMuteBtn.addEventListener('touchend', () => { volumeDragActive = false; });
      videoMuteBtn.addEventListener('touchcancel', () => { volumeDragActive = false; });
      videoMuteBtn.onclick = (e) => {
        if (volumeDragActive) return;
        e.stopPropagation();
        mainVideo.muted = !mainVideo.muted;
        updateVolumeIcon();
      };

      videoPrevBtn.onclick = (e) => { e.stopPropagation();
        prevVideo(); };
      videoNextBtn.onclick = (e) => { e.stopPropagation();
        nextVideo(); };

      mainVideo.addEventListener('loadedmetadata', () => {
        totalTimeEl.textContent = formatTime(mainVideo.duration);
      });
      mainVideo.addEventListener('timeupdate', () => {
        const percent = (mainVideo.currentTime / mainVideo.duration) * 100;
        progressBar.style.width = percent + "%";
        currentTimeEl.textContent = formatTime(mainVideo.currentTime);
      });
      progressWrap.addEventListener("click", (e) => {
        const rect = progressWrap.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const ratio = Math.max(0, Math.min(1, x / rect.width));
        mainVideo.currentTime = ratio * mainVideo.duration;
      });
      mainVideo.addEventListener("play", () => {
        videoCard.classList.add("playing");
        videoPlayBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
        clearTimeout(hideControlTimer);
        hideControlTimer = setTimeout(() => {
          videoControls.classList.add("hidden-controls");
        }, HIDE_DELAY);
      });
      mainVideo.addEventListener("pause", () => {
        videoCard.classList.remove("playing");
        videoPlayBtn.innerHTML = `<i class="fa-solid fa-play"></i>`;
        showControls();
      });
      mainVideo.addEventListener("ended", () => {
        nextVideo();
      });

      // ===== 弹出播放器事件 =====
      // 副视频循环播放：通过 loop 属性实现，同时监听 ended 事件作为后备
      popupVideo.loop = true;
      popupVideo.addEventListener('ended', () => {
        // 如果 loop 属性失效，手动重新播放
        if (!popupVideo.paused) {
          popupVideo.play().catch(() => {});
        }
      });

      popupTrigger.addEventListener('click', (e) => {
        e.stopPropagation();
        openPopup();
      });

      popupClose.addEventListener('click', (e) => {
        e.stopPropagation();
        closePopup();
      });

      videoPopup.addEventListener('click', (e) => {
        if (e.target === videoPopup) {
          if (popupControlsVisible) {
            popupControls.classList.add("hidden-controls");
            popupClose.classList.add("hidden-controls");
            popupControlsVisible = false;
            clearTimeout(popupHideTimer);
          }
        }
      });

      popupPlayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (popupVideo.paused) {
          popupVideo.play().catch(() => {});
        } else {
          popupVideo.pause();
        }
        popupControlsVisible = true;
        popupControls.classList.remove("hidden-controls");
        popupClose.classList.remove("hidden-controls");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden-controls");
          popupClose.classList.add("hidden-controls");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      popupPrevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (videoList.length === 0) return;
        currentVideoIndex = (currentVideoIndex - 1 + videoList.length) % videoList.length;
        const src = videoList[currentVideoIndex];
        mainVideo.src = src;
        popupVideo.src = src;
        popupVideo.play().catch(() => {});
        mainVideo.muted = true;
        updatePopupSize(src);
        popupControlsVisible = true;
        popupControls.classList.remove("hidden-controls");
        popupClose.classList.remove("hidden-controls");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden-controls");
          popupClose.classList.add("hidden-controls");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      popupNextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (videoList.length === 0) return;
        currentVideoIndex = (currentVideoIndex + 1) % videoList.length;
        const src = videoList[currentVideoIndex];
        mainVideo.src = src;
        popupVideo.src = src;
        popupVideo.play().catch(() => {});
        mainVideo.muted = true;
        updatePopupSize(src);
        popupControlsVisible = true;
        popupControls.classList.remove("hidden-controls");
        popupClose.classList.remove("hidden-controls");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden-controls");
          popupClose.classList.add("hidden-controls");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      popupMuteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        popupVideo.muted = !popupVideo.muted;
        popupMuteBtn.innerHTML = popupVideo.muted ? `<i class="fa-solid fa-volume-xmark"></i>` : `<i class="fa-solid fa-volume-high"></i>`;
        popupControlsVisible = true;
        popupControls.classList.remove("hidden-controls");
        popupClose.classList.remove("hidden-controls");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden-controls");
          popupClose.classList.add("hidden-controls");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      popupVideo.addEventListener('loadedmetadata', () => {
        popupTotalTime.textContent = formatTime(popupVideo.duration);
        if (popupVideo.videoWidth > 0 && popupVideo.videoHeight > 0) {
          setPopupAspectRatio(popupVideo.videoWidth, popupVideo.videoHeight);
        }
      });
      popupVideo.addEventListener('timeupdate', () => {
        const percent = (popupVideo.currentTime / popupVideo.duration) * 100;
        popupProgressBar.style.width = percent + "%";
        popupCurrentTime.textContent = formatTime(popupVideo.currentTime);
        if (!popupVideo.paused) {
          mainVideo.currentTime = popupVideo.currentTime;
        }
      });
      popupProgressWrap.addEventListener('click', (e) => {
        e.stopPropagation();
        const rect = popupProgressWrap.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const ratio = Math.max(0, Math.min(1, x / rect.width));
        popupVideo.currentTime = ratio * popupVideo.duration;
        popupControlsVisible = true;
        popupControls.classList.remove("hidden-controls");
        popupClose.classList.remove("hidden-controls");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden-controls");
          popupClose.classList.add("hidden-controls");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      popupVideo.addEventListener('play', () => {
        popupPlayBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
        mainVideo.currentTime = popupVideo.currentTime;
        mainVideo.play().catch(() => {});
        mainVideo.muted = true;
        popupControlsVisible = true;
        popupControls.classList.remove("hidden-controls");
        popupClose.classList.remove("hidden-controls");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden-controls");
          popupClose.classList.add("hidden-controls");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });
      popupVideo.addEventListener('pause', () => {
        popupPlayBtn.innerHTML = `<i class="fa-solid fa-play"></i>`;
        popupControlsVisible = true;
        popupControls.classList.remove("hidden-controls");
        popupClose.classList.remove("hidden-controls");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden-controls");
          popupClose.classList.add("hidden-controls");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      // ===== 头像轮播 =====
      function changeAvatar() {
        if (avatarImages.length === 0) return;
        avatarIndex = (avatarIndex + 1) % avatarImages.length;
        avatarImg.src = avatarImages[avatarIndex];
      }
      if (avatarImages.length > 0) {
        avatarImg.src = avatarImages[0];
      }
      setInterval(changeAvatar, 10000);

      // ===== 右侧图片轮播 =====
      function changeSlide() {
        if (slideImages.length === 0) return;
        slideIndex = (slideIndex + 1) % slideImages.length;
        platePhotoImg.src = slideImages[slideIndex];
      }
      if (slideImages.length > 0) {
        platePhotoImg.src = slideImages[0];
      }
      setInterval(changeSlide, 2000);

      // ===== 复制车牌 =====
      $("#plate").addEventListener("click", async (event) => {
        event.stopPropagation();
        const text = "苏FA36165";
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const input = document.createElement("input");
          input.value = text;
          input.style.position = "fixed";
          input.style.opacity = "0";
          document.body.appendChild(input);
          input.select();
          document.execCommand("copy");
          input.remove();
        }
        showToast("车牌号已复制");
      });

      // ===== APP跳转 =====
      function jumpToApp(key) {
        const config = APP_CONFIG[key];
        if (!config) return;
        const button = document.querySelector(`[data-app="${key}"]`);
        if (!button || button.classList.contains("loading")) return;
        const originalHTML = button.innerHTML;
        button.classList.add("loading");
        button.innerHTML = `
            <div class="app-icon-wrap"><i class="fa-solid fa-spinner fa-spin"></i></div>
            <span class="app-label">打开中</span>
          `;
        window.location.href = config.scheme;
        setTimeout(() => {
          button.classList.remove("loading");
          button.innerHTML = originalHTML;
        }, 2200);
      }
      $$(".app-button").forEach(btn => {
        btn.addEventListener("click", e => {
          e.stopPropagation();
          jumpToApp(btn.dataset.app);
        });
      });

      // ===== 图片查看器 =====
      function openViewer(gallery, startIndex, alt) {
        if (!gallery || gallery.length === 0) return;
        viewerGallery = gallery;
        viewerGalleryIndex = startIndex;
        viewerImg.src = viewerGallery[viewerGalleryIndex];
        viewerImg.alt = alt || "原图";
        viewer.classList.add("show");
        viewer.setAttribute("aria-hidden", "false");
        document.body.style.overflow = "hidden";
        // 更新提示文字
        viewerHint.textContent = '左右滑动切换 · 长按保存';
      }

      function closeViewer() {
        viewer.classList.remove("show");
        viewer.setAttribute("aria-hidden", "true");
        document.body.style.overflow = "";
        setTimeout(() => {
          if (!viewer.classList.contains("show")) viewerImg.src = "";
        }, 280);
      }

      function viewerPrevImage() {
        viewerGalleryIndex = (viewerGalleryIndex - 1 + viewerGallery.length) % viewerGallery.length;
        viewerImg.src = viewerGallery[viewerGalleryIndex];
      }

      function viewerNextImage() {
        viewerGalleryIndex = (viewerGalleryIndex + 1) % viewerGallery.length;
        viewerImg.src = viewerGallery[viewerGalleryIndex];
      }

      $("#avatar").addEventListener("click", (e) => {
        e.stopPropagation();
        openViewer(avatarImages, avatarIndex, "头像原图");
      });
      $("#platePhoto").addEventListener("click", (e) => {
        e.stopPropagation();
        openViewer(slideImages, slideIndex, "图片原图");
      });
      $("#viewerClose").addEventListener("click", (e) => {
        e.stopPropagation();
        closeViewer();
      });
      viewer.addEventListener("click", (e) => {
        if (e.target === viewer || e.target === viewerContent) closeViewer();
      });

      let longPressTimer = null;
      viewerImg.addEventListener('touchstart', () => {
        longPressTimer = setTimeout(() => {
          const a = document.createElement('a');
          a.href = viewerImg.src;
          a.download = 'preview-image';
          document.body.appendChild(a);
          a.click();
          a.remove();
          showToast("开始下载图片");
        }, 600);
      }, { passive: true });
      viewerImg.addEventListener('touchend', () => { clearTimeout(longPressTimer); });
      viewerImg.addEventListener('touchcancel', () => { clearTimeout(longPressTimer); });

      let slideStartX = 0,
        slideStartY = 0,
        slideIsHorizontal = null;
      viewerContent.addEventListener("touchstart", (e) => {
        slideStartX = e.touches[0].clientX;
        slideStartY = e.touches[0].clientY;
        slideIsHorizontal = null;
      }, { passive: true });
      viewerContent.addEventListener("touchmove", (e) => {
        const dx = e.touches[0].clientX - slideStartX;
        const dy = e.touches[0].clientY - slideStartY;
        if (slideIsHorizontal === null) {
          slideIsHorizontal = Math.abs(dx) > Math.abs(dy);
        }
      }, { passive: true });
      viewerContent.addEventListener("touchend", (e) => {
        const dx = e.changedTouches[0].clientX - slideStartX;
        if (Math.abs(dx) > 50) {
          if (dx > 0) viewerPrevImage();
          else viewerNextImage();
        }
      }, { passive: true });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && viewer.classList.contains("show")) closeViewer();
        if (e.key === "Escape" && videoPopup.classList.contains('active')) closePopup();
      });
      document.addEventListener("gesturestart", e => e.preventDefault());
      document.addEventListener("gesturechange", e => e.preventDefault());
      document.addEventListener("gestureend", e => e.preventDefault());

      // ===== 点击弹字 =====
      const clickTextPool = ["苏FA36165", "Xiaomi SU7 Pro", "刘茜美子"];
      document.body.addEventListener("click", (e) => {
        if (e.target.closest(".app-button") || e.target.closest(".viewer") ||
          e.target.closest("#plate") || e.target.closest(".video-controls") ||
          e.target.closest(".video-popup") || e.target.closest(".video-popup-trigger") ||
          e.target.closest(".dynamic-island")) return;
        const txt = clickTextPool[Math.floor(Math.random() * clickTextPool.length)];
        const span = document.createElement("div");
        span.className = "click-text-item";
        span.innerText = txt;
        span.style.left = e.clientX + "px";
        span.style.top = e.clientY + "px";
        document.body.appendChild(span);
        setTimeout(() => {
          if (span.parentNode) span.remove();
        }, 4700);
      });

      // ===== 状态栏时间 =====
      function updateStatusTime() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, "0");
        const m = String(now.getMinutes()).padStart(2, "0");
        const s = String(now.getSeconds()).padStart(2, "0");
        $("#statusTime").innerText = h + ":" + m + ":" + s;
      }
      updateStatusTime();
      setInterval(updateStatusTime, 1000);

      // ===== 视频高度切换 =====
      videoCard.addEventListener('dblclick', (e) => {
        if (e.target.closest('.video-controls') || e.target.closest('.video-popup-trigger')) return;
        if (videoBox.classList.contains('tall')) {
          videoBox.classList.remove('tall');
          videoBox.classList.add('normal');
        } else {
          videoBox.classList.remove('normal');
          videoBox.classList.add('tall');
        }
      });

      // ===== 深色模式 =====
      function applyThemeBasedOnTime() {
        const now = new Date();
        const hours = now.getHours();
        const isDark = (hours >= 19 || hours < 7);
        const html = document.documentElement;
        if (isDark) {
          html.classList.remove('light-mode');
          html.classList.add('dark-mode');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0A0A0C');
        } else {
          html.classList.remove('dark-mode');
          html.classList.add('light-mode');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#EEF2FA');
        }
      }
      applyThemeBasedOnTime();
      setInterval(applyThemeBasedOnTime, 600000);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) applyThemeBasedOnTime();
      });

      // ===== 启动定时任务 =====
      glowInterval = setInterval(updateGlowColor, 1000);
      setTimeout(updateGlowColor, 50);

      sakuraInterval = setInterval(createSakura, 150);
      for (let i = 0; i < 5; i++) setTimeout(createSakura, i * 100);

      setTimeout(showControls, 500);

      window.addEventListener('beforeunload', () => {
        if (glowInterval) clearInterval(glowInterval);
        if (sakuraInterval) clearInterval(sakuraInterval);
        if (textRollInterval) clearInterval(textRollInterval);
      });
    })();
  </script>
</body>
</html>
