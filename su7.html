<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF2FA">
<meta name="color-scheme" content="light">
<meta name="format-detection" content="telephone=no">
<title>苏FA36165 · 快速启动</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { width: 100%; min-height: 100%; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
width: 100%;
min-height: 100vh;
min-height: 100dvh;
overflow-x: hidden;
overflow-y: auto;
font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
background: #f7f9fc;
-webkit-tap-highlight-color: transparent;
-webkit-touch-callout: none;
overscroll-behavior-x: none;
user-select: none;
}
:root {
--text-main: #1D1D1F;
--text-sub: #555861;
--text-muted: #8E929C;
--blue: #1677FF;
--green: #18A864;
--red: #FF3B30;
--glass-bg: rgba(255,255,255,0.42);
--glass-strong: rgba(255,255,255,0.65);
--glass-border: rgba(255,255,255,0.6);
--glass-shadow: 0 24px 60px rgba(0,0,0,0.12), 0 8px 24px rgba(0,0,0.06);
--radius-xl: 32px;
--radius-lg: 24px;
--radius-md: 18px;
--safe-top: env(safe-area-inset-top, 0px);
--safe-bottom: env(safe-area-inset-bottom, 0px);
--spring: cubic-bezier(0.22, 1, 0.36, 1);
}
button, img, video { -webkit-user-drag: none; }
button { font: inherit; }
/* 液态动态渐变背景 Liquid Glass */
.liquid-bg {
position: fixed;
inset: 0;
z-index: 0;
overflow: hidden;
pointer-events: none;
}
.liquid-gradient {
position: absolute;
width: 140vw;
height: 140vh;
top: -20vh;
left: -20vw;
background: radial-gradient(ellipse at 15% 10%, rgba(120,170,255,0.45), transparent 55%),
radial-gradient(ellipse at 85% 20%, rgba(255,160,200,0.38), transparent 55%),
radial-gradient(ellipse at 20% 85%, rgba(110,230,200,0.36), transparent 55%),
radial-gradient(ellipse at 80% 88%, rgba(190,160,255,0.40), transparent 55%);
animation: liquidFlow 22s ease-in-out infinite alternate;
filter: blur(60px);
}
@keyframes liquidFlow {
0% { transform: translate(0,0) rotate(0deg) scale(1.05); }
50% { transform: translate(40px, -30px) rotate(4deg) scale(1.12); }
100% { transform: translate(-30px, 40px) rotate(-4deg) scale(1.05); }
}
/* 页面入场动画 弹簧 */
@keyframes pageSpringIn {
from { opacity: 0; transform: translateY(14px) scale(0.98); }
to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes cardSpringIn {
from { opacity: 0; transform: translateY(18px) scale(0.97); }
to { opacity: 1; transform: translateY(0) scale(1); }
}
.page {
position: relative;
z-index: 2;
width: 100%;
max-width: 470px;
min-height: 100vh;
min-height: 100dvh;
margin: 0 auto;
padding: 16px;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
animation: pageSpringIn .75s var(--spring) both;
}
.wrap-inner { width:100%; padding-top: calc(var(--safe-top)); padding-bottom: calc(var(--safe-bottom)); }
/* 视频卡片 */
.video-card {
position: relative;
width: 100%;
margin-bottom: 24px;
border-radius: var(--radius-xl);
box-shadow: var(--glass-shadow);
overflow: hidden;
isolation: isolate;
animation: cardSpringIn .7s var(--spring) 0.14s both;
}
.video-box {
position: relative;
width: 100%;
aspect-ratio: 16 / 7.2; /* 修改：拉高视频容器高度 */
border-radius: var(--radius-xl);
overflow: hidden;
background: #090D17;
}
.video-box video {
display: block;
width: 100%;
height: 100%;
object-fit: cover;
background: #090D17;
}
.video-play {
position: absolute;
left: 50%;
top: 50%;
width: 64px;
height: 64px;
transform: translate(-50%,-50%);
display: flex;
align-items: center;
justify-content: center;
border-radius: 50%;
color: #1D1D1F;
background: rgba(255,255,255,.72);
border: 1px solid rgba(255,255,255,.9);
box-shadow: 0 12px 32px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.9);
backdrop-filter: blur(18px) saturate(160%);
-webkit-backdrop-filter: blur(18px) saturate(160%);
pointer-events: none;
transition: opacity .28s ease, transform .28s var(--spring);
z-index: 2;
}
.video-card.playing .video-play { opacity: 0; transform: translate(-50%,-50%) scale(0.72); }
/* ========= 视频自定义控件 ========= */
.video-controls {
position: absolute;
bottom: 0;
left: 0;
width: 100%;
padding: 12px 14px;
background: linear-gradient(transparent, rgba(0,0,0,0.65));
z-index: 3;
opacity: 1;
transition: opacity 0.35s ease;
pointer-events: auto;
}
.video-controls.hidden-controls{ opacity: 0; pointer-events: none; }
.progress-wrap {
width: 100%;
height: 4px;
background: rgba(255,255,255,0.25);
border-radius: 99px;
cursor: pointer;
margin-bottom: 10px;
}
.progress-bar { height: 100%; border-radius: inherit; background: #fff; width:0%; }
.control-row { display:flex; align-items:center; gap:14px; }
.control-row button { color:#fff; border:none; background:none; font-size:18px; cursor:pointer; }
.video-time { margin-left:auto; color:#fff; font-size:13px; }
/* ========== 头像旋转渐变发光边框特效【升级炫酷版】 ========== */
.avatar {
position: relative;
width: 66px;
height: 66px;
margin-bottom: 12px;
border-radius: 50%;
cursor: zoom-in;
isolation: isolate;
}
.avatar::before {
content: "";
position: absolute;
inset: -5px;
z-index: -1;
border-radius: 50%;
background: linear-gradient(45deg,#FF2E63,#00D4FF,#7B61FF,#FFD046,#00FFA3,#FF2E63);
background-size:400% 400%;
animation: avatarRotateBorder 1.6s linear infinite;
filter: blur(2px);
}
@keyframes avatarRotateBorder{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}
.avatar img {
display: block;
width: 100%;
height: 100%;
border-radius: 50%;
object-fit: cover;
/* 移除白色边框 */
transition: transform .2s var(--spring), filter .2s ease;
}
.avatar:active img { transform: scale(.92); filter: brightness(.9); }
/* 主液态玻璃卡片 加大padding拉高卡片整体高度 */
.main-card {
position: relative;
width: 100%;
padding: 28px 20px 30px;
border-radius: var(--radius-xl);
background: var(--glass-bg);
border: 1px solid var(--glass-border);
box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.5);
backdrop-filter: blur(32px) saturate(185%);
-webkit-backdrop-filter: blur(32px) saturate(185%);
overflow: hidden;
animation: cardSpringIn .7s var(--spring) 0.20s both;
}
@supports not ( backdrop-filter: blur(10px) ) {
.main-card { background: rgba(255,255,255,.86); }
}
.profile-row {
display: grid;
grid-template-columns: minmax(0,1fr) auto;
align-items: start;
gap: 16px;
width: 100%;
}
.profile-left { min-width: 0; display: flex; flex-direction: column; align-items: center; }
.plate {
padding: 6px 14px;
margin-bottom: 11px;
border-radius: 8px;
background: linear-gradient(135deg, #14994F, #08763C);
color: #000000;
font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
font-size: 17px;
font-weight: 700;
letter-spacing: 1.6px;
box-shadow: 0 6px 18px rgba(15,135,70,.28), inset 0 1px 0 rgba(255,255,255,.38);
border: 1px solid rgba(255,255,255,.7);
cursor: pointer;
transition: transform .18s var(--spring);
}
.plate:active { transform: scale(.93); }
.name {
max-width: 100%;
font-size: 12.5px;
line-height: 1.5;
font-weight: 800;
letter-spacing: .5px;
text-align: center;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
background: linear-gradient(90deg, #FF5C93, #C84870, #4A8DFF, #FF5C93);
background-size: 300% 100%;
-webkit-background-clip: text;
background-clip: text;
color: transparent;
animation: textGradient 7s ease-in-out infinite;
}
.subtitle {
max-width: 100%;
margin-top: 5px;
font-size: 11.5px;
line-height: 1.6;
font-weight: 700;
letter-spacing: .35px;
text-align: center;
background: linear-gradient(90deg, #FF6D9C, #558EFF);
-webkit-background-clip: text;
background-clip: text;
color: transparent;
white-space:normal;
}
@keyframes textGradient {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}
/* 右侧图片容器放大，移除白色边框 */
.plate-photo {
width: 110px;
flex-shrink: 0;
border-radius: 12px;
overflow: hidden;
cursor: zoom-in;
/* 移除白色轮廓边框 */
box-shadow: 0 10px 22px rgba(35,75,85,.20);
background: rgba(255,255,255,.25);
transition: transform .2s var(--spring), filter .2s ease;
}
.plate-photo:active { transform: scale(.93); filter: brightness(.9); }
.plate-photo img {
display: block;
width: 100%;
aspect-ratio: 9 / 16;
object-fit: cover;
}
/* ========= APP宫格布局 修改为一行4个 ========= */
.buttons {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap:18px 10px;
margin-top:26px;
}
.app-button {
--icon-color: #1677FF;
display:flex;
flex-direction:column;
align-items:center;
gap:8px;
border:none;
background:transparent;
cursor: pointer;
-webkit-tap-highlight-color: transparent;
touch-action: manipulation;
}
.app-icon-wrap{
width:54px;
height:54px;
display:flex;
align-items:center;
justify-content:center;
border-radius:18px;
background: rgba(255,255,255,.65);
box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 4px 10px rgba(50,65,100,.10);
font-size:19px;
color:var(--icon-color);
backdrop-filter: blur(24px) saturate(170%);
-webkit-backdrop-filter: blur(24px) saturate(170%);
transition: transform .2s var(--spring);
}
.app-button:active .app-icon-wrap{ transform: scale(0.92); }
.app-label { font-size:11px; font-weight:500; color:var(--text-main); text-align:center; line-height:1.2; }
.app-button.loading .app-icon-wrap{ opacity:0.65; }
.app-button.loading .app-label{ font-size:10px; }
/* Toast */
.toast {
position: fixed;
z-index: 10001;
left: 50%;
bottom: calc(44px + var(--safe-bottom));
transform: translate(-50%, 18px) scale(.94);
padding: 10px 18px;
border-radius: 12px;
color: #fff;
background: rgba(20,22,28,.76);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
font-size: 13px;
opacity: 0;
pointer-events: none;
transition: opacity .24s ease, transform .24s var(--spring);
}
.toast.show { opacity: 1; transform: translate(-50%,0) scale(1); }
/* 图片查看器 */
.viewer {
position: fixed;
inset: 0;
z-index: 10000;
display: flex;
align-items: center;
justify-content: center;
background: rgba(5,8,18,.86);
backdrop-filter: blur(24px) saturate(120%);
-webkit-backdrop-filter: blur(24px) saturate(120%);
opacity: 0;
visibility: hidden;
pointer-events: none;
transition: opacity .26s ease, visibility .26s ease;
}
.viewer.show { opacity: 1; visibility: visible; pointer-events: auto; }
.viewer-content {
position: relative;
width: 100%;
height: 100%;
display: flex;
align-items: center;
justify-content: center;
overflow: hidden;
touch-action: none;
overscroll-behavior: none;
}
.viewer-img {
display: block;
max-width: 94vw;
max-height: 86vh;
width: auto;
height: auto;
object-fit: contain;
border-radius: 14px;
box-shadow: 0 34px 90px rgba(0,0,0,.55);
transform: translate3d(0,0,0) scale(.94);
opacity: 0;
transition: transform .32s var(--spring), opacity .24s ease;
will-change: transform;
user-select: none;
}
.viewer.show .viewer-img { opacity: 1; transform: translate3d(var(--move-x,0px), var(--move-y,0px), 0) scale(var(--scale,1)); }
.viewer-close {
position: fixed;
z-index: 10003;
top: calc(16px + var(--safe-top));
right: calc(16px + env(safe-area-inset-right,0px));
width: 46px;
height: 46px;
display: flex;
align-items: center;
justify-content: center;
border-radius: 50%;
border: 1px solid rgba(255,255,255,.24);
background: rgba(255,255,255,.14);
color: #fff;
backdrop-filter: blur(18px);
-webkit-backdrop-filter: blur(18px);
font-size: 19px;
cursor: pointer;
-webkit-tap-highlight-color: transparent;
}
.viewer-close:active { transform: scale(.9); }
.viewer-hint {
position: fixed;
z-index: 10003;
left: 50%;
bottom: calc(22px + var(--safe-bottom));
transform: translateX(-50%);
color: rgba(255,255,255,.74);
font-size: 11.5px;
letter-spacing: .08em;
white-space: nowrap;
text-shadow: 0 2px 6px rgba(0,0,0,.6);
pointer-events: none;
}
/* 小屏幕适配 */
@media (max-width: 380px) {
.page { padding-left:12px; padding-right:12px; }
.main-card { padding: 24px 16px 25px; }
.avatar { width: 58px; height: 58px; }
.plate-photo { width: 96px; }
.buttons{ gap:14px 8px; }
.app-icon-wrap { width:48px; height:48px; font-size:17px; }
.app-label { font-size:10px; }
.video-box { aspect-ratio:16/7.8; }
}
/* 减少动画 */
@media (prefers-reduced-motion: reduce) {
*, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
.liquid-gradient { display:none; }
}
/* ========== 樱花飘落 ========== */
.sakura-container { position: fixed; inset: 0; z-index:1; pointer-events: none; overflow:hidden; }
.sakura { position:absolute; background:#ffc8d8; border-radius: 50% 0 50% 50%; opacity:0.75; will-change: transform; }
@keyframes sakuraFall {
0% {transform: translateY(-8vh) rotate(0deg); opacity:0.9;}
100% {transform: translateY(105vh) rotate(720deg); opacity:0;}
}
/* ========== 点击弹出渐变文字（延长消失时间） ========== */
.click-text-item {
position:fixed;
z-index:999;
pointer-events:none;
font-weight:700;
background: linear-gradient(90deg,#ff6492,#628cff,#ffb258);
background-size:200% 100%;
-webkit-background-clip:text;
background-clip:text;
color:transparent;
animation: popTextAnim 6s ease-out forwards, textShine 2.5s linear infinite;
}
@keyframes popTextAnim {
0% {transform:translateY(0) scale(1); opacity:1;}
100% {transform:translateY(-140px) scale(1.08); opacity:0;}
}
@keyframes textShine {
0% {background-position:0% 50%;}
100% {background-position:200% 50%;}
}
</style>
</head>
<body>
<div class="liquid-bg">
<div class="liquid-gradient"></div>
</div>

<script>
const APP_CONFIG = {
custom1: {scheme: "anywhere://open?sid=0444", name: "LX Music", icon: "fa-solid fa-music"},
custom2: {scheme: "anywhere://open?sid=2848", name: "A+系统", icon: "fa-solid fa-plus"},
custom7: {scheme: "anywhere://open?sid=5395", name: "汽水音乐", icon: "fa-solid fa-music"},
custom3: {scheme: "anywhere://open?sid=0451", name: "YouTube", icon: "fa-brands fa-youtube"},
custom4: {scheme: "anywhere://open?sid=2305", name: "FlClash", icon: "fa-solid fa-globe"},
custom5: {scheme: "anywhere://open?sid=7535", name: "高德地图", icon: "fa-solid fa-map-location-dot"},
custom6: {scheme: "anywhere://open?sid=5181", name: "抖音", icon: "fa-brands fa-tiktok"},
custom8: {scheme: "anywhere://open?sid=9850", name: "酷狗音乐", icon: "fa-solid fa-headphones-simple"}
};
const $ = selector => document.querySelector(selector);
const $$ = selector => document.querySelectorAll(selector);
const toast = $("#toast");
const viewer = $("#viewer");
const viewerContent = $("#viewerContent");
const viewerImg = $("#viewerImg");
const viewerHint = $("#viewerHint");
const mainVideo = $("#mainVideo");
const videoCard = $("#videoCard");
const videoBox = $(".video-box");
const videoPlayBtn = $("#videoPlayBtn");
const videoPrevBtn = $("#videoPrevBtn");
const videoNextBtn = $("#videoNextBtn");
const videoMuteBtn = $("#videoMuteBtn");
const videoControls = $("#videoControls");
const progressWrap = $("#progressWrap");
const progressBar = $("#progressBar");

if(isNaN(s)) return "00:00";
const m = Math.floor(s / 60);
const sec = Math.floor(s % 60);
return String(m).padStart(2,"0") + ":" + String(sec).padStart(2,"0");
}

let volumeDragActive = false;
let volumeStartY = 0;
let volumeStartVal = 0;

// 触摸开始
videoMuteBtn.addEventListener('touchstart', (e)=>{
e.stopPropagation();
volumeDragActive = true;
volumeStartY = e.touches[0].clientY;
volumeStartVal = mainVideo.volume;

e.preventDefault();
const dy = volumeStartY - e.touches[0].clientY;
// 每滑动80像素音量变化0.1
const deltaVol = dy / 800;
let newVol = volumeStartVal + deltaVol;
newVol = Math.max(0, Math.min(1, newVol));
mainVideo.volume = newVol;
// 更新图标
updateVolumeIcon();
});
// 触摸结束
videoMuteBtn.addEventListener('touchend', (e)=>{
e.stopPropagation();
volumeDragActive = false;
});
videoMuteBtn.addEventListener('touchcancel', ()=>{
volumeDragActive = false;
});

e.stopPropagation();
mainVideo.muted = !mainVideo.muted;

};

let scale = 1, translateX = 0, translateY = 0;
let pinchStartDistance = 0, pinchStartScale = 1;
let dragging = false, dragStartX=0,dragStartY=0,dragOriginX=0,dragOriginY=0;
let lastTap = 0;
// 左右滑动变量
let slideStartX = 0;
let slideStartY = 0;
let slideIsHorizontal = false;
function updateViewer(){
viewerImg.style.setProperty("--scale",scale);
viewerImg.style.setProperty("--move-x",`${translateX}px`);
viewerImg.style.setProperty("--move-y",`${translateY}px`);
}
function resetViewer(){ scale=1;translateX=0;translateY=0;updateViewer(); }
// 打开图片预览，传入图库数组和当前索引
function openViewer(gallery, startIndex, alt){
if(!gallery || gallery.length===0) return;
viewerGallery = gallery;
viewerGalleryIndex = startIndex;
resetViewer();
viewerImg.src = viewerGallery[viewerGalleryIndex];
viewerImg.alt = alt||"原图";
viewer.classList.add("show");
viewer.setAttribute("aria-hidden","false");
document.body.style.overflow="hidden";
}
function closeViewer(){
viewer.classList.remove("show");
viewer.setAttribute("aria-hidden","true");
document.body.style.overflow="";
resetViewer();
setTimeout(()=>{if(!viewer.classList.contains("show")) viewerImg.src="";},280);
}
// 切换预览图片
function viewerPrevImage(){
viewerGalleryIndex--;
if(viewerGalleryIndex<0) viewerGalleryIndex = viewerGallery.length -1;
resetViewer();
viewerImg.src = viewerGallery[viewerGalleryIndex];
}
function viewerNextImage(){
viewerGalleryIndex++;
if(viewerGalleryIndex >= viewerGallery.length) viewerGalleryIndex = 0;
resetViewer();
viewerImg.src = viewerGallery[viewerGalleryIndex];
}

// =========左右滑动手势=========
viewerContent.addEventListener("touchstart",e=>{
slideStartX = e.touches[0].clientX;
slideStartY = e.touches[0].clientY;
slideIsHorizontal = null;
if(e.touches.length<2) pinchStartDistance=0;
if(e.touches.length===2){
e.preventDefault();
pinchStartDistance = touchDistance(e.touches);
pinchStartScale = scale;
dragging = false;
return;
}
if(e.touches.length===1 && scale>1){
dragging = true;
dragStartX = e.touches[0].clientX;
dragStartY = e.touches[0].clientY;
dragOriginX = translateX;
dragOriginY = translateY;
}
},{passive:false});
viewerContent.addEventListener("touchmove",e=>{
const dx = e.touches[0].clientX - slideStartX;
const dy = e.touches[0].clientY - slideStartY;
if(slideIsHorizontal === null){
slideIsHorizontal = Math.abs(dx) > Math.abs(dy);
}
// 缩放状态下不触发左右滑动
if(scale > 1) {
if(e.touches.length===2){
e.preventDefault();
const dist = touchDistance(e.touches);
if(pinchStartDistance>0){
scale = Math.max(1,Math.min(4, pinchStartScale * (dist/pinchStartDistance)));
if(scale===1){ translateX=0; translateY=0; }
updateViewer();
}
return;
}
if(e.touches.length===1 && dragging && scale>1){
e.preventDefault();
translateX = dragOriginX + e.touches[0].clientX - dragStartX;
translateY = dragOriginY + e.touches[0].clientY - dragStartY;
updateViewer();
}
return;
}
// 缩放=1，允许左右滑动切换图片
if(slideIsHorizontal){ e.preventDefault(); }
},{passive:false});
viewerContent.addEventListener("touchend",e=>{
if(scale>1) {
if(e.touches.length<2) pinchStartDistance=0;
if(e.touches.length===0) dragging=false;
return;
}
const dx = e.changedTouches[0].clientX - slideStartX;
// 滑动阈值，大于50px判定切换
const threshold = 50;
if(Math.abs(dx) > threshold){
if(dx>0){ // 右滑，上一张
viewerPrevImage();
}else{ //左滑，下一张
viewerNextImage();
}
}
},{passive:true});
viewerContent.addEventListener("wheel",e=>{
if(!viewer.classList.contains("show")) return;
e.preventDefault();
scale += e.deltaY>0 ? -0.15 : 0.15;
scale = Math.max(1,Math.min(4,scale));
if(scale===1){ translateX=0; translateY=0; }
updateViewer();
},{passive:false});
document.addEventListener("keydown",e=>{
if(e.key==="Escape" && viewer.classList.contains("show")) closeViewer();
});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("gesturechange",e=>e.preventDefault());
document.addEventListener("gestureend",e=>e.preventDefault());
// ========== 樱花生成（高密度） ==========
const sakuraBox = $("#sakuraBox");
function createSakura(){
const sakura = document.createElement("div");
sakura.className = "sakura";
const size = Math.random()*12 +5;
sakura.style.width = size+"px";
sakura.style.height = size+"px";
sakura.style.left = Math.random()*100 +"%";
const dur = Math.random()*7 +6;
sakura.style.animation = `sakuraFall ${dur}s linear forwards`;
sakuraBox.appendChild(sakura);
setTimeout(()=>sakura.remove(), dur*1000);
}
setInterval(createSakura,120);
// ========== 点击页面弹出渐变文字 ==========
const textPool = ["苏FA36165","Xiaomi SU7 Pro","刘茜美子"];
document.body.addEventListener("click",(e)=>{
if(e.target.closest(".app-button") || e.target.closest(".viewer") || e.target.closest("#plate") || e.target.closest(".video-controls")) return;
const txt = textPool[Math.floor(Math.random()*textPool.length)];
const span = document.createElement("div");
span.className = "click-text-item";
span.innerText = txt;
span.style.left = e.clientX +"px";
span.style.top = e.clientY +"px";
document.body.appendChild(span);
setTimeout(()=>span.remove(), 6000);
});
function touchDistance(touches) {
const dx = touches[0].clientX - touches[1].clientX;
const dy = touches[0].clientY - touches[1].clientY;
return Math.sqrt(dx*dx + dy*dy);
}
