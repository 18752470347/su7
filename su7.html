<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#EFF2FA">
<meta name="format-detection" content="telephone=no">
<title>苏FA36165 | 应用快速启动</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --bg-top: #F1F4FB;
    --bg-bottom: #E7EBF6;
    --t1: #1D1D1F;
    --t2: #48484A;
    --t3: #8E8E93;
    --acc: #007AFF;
    --acc-h: #3395FF;
    --red: #FF3B30;
    --sakura: #FFAFC2;
    --glass: rgba(255,255,255,0.55);
    --glass-line: rgba(255,255,255,0.75);
    --hairline: rgba(60,70,100,0.10);
    --shadow: 0 24px 60px rgba(40,55,90,0.16), 0 2px 10px rgba(40,55,90,0.06);
    --blur: blur(28px) saturate(180%);
    --slow-speed: 45s;
    --normal-slow: 30s;
    --disp: -apple-system, 'SF Pro Display', 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
    --body: var(--disp);
}
body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: var(--body);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    background:
        radial-gradient(58% 50% at 12% 6%, rgba(176,202,255,0.55), transparent 62%),
        radial-gradient(52% 46% at 90% 10%, rgba(255,198,224,0.50), transparent 62%),
        radial-gradient(58% 52% at 6% 96%, rgba(186,240,226,0.55), transparent 62%),
        radial-gradient(50% 50% at 94% 94%, rgba(214,196,255,0.55), transparent 62%),
        linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    background-attachment: fixed;
    position: relative;
    overflow-x: hidden;
    overflow-y: auto;
    color: var(--t2);
    animation: bodyFadeIn 0.8s ease-out forwards;
    opacity: 0;
    will-change: opacity;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
}
@keyframes bodyFadeIn { to { opacity: 1; } }
@keyframes gradientShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}
/* ================= 舞台布局 ================= */
.stage {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;
    margin: auto;
    padding: 40px 16px calc(100px + env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
}
/* ================= 视频容器 ================= */
.external-video-wrap {
    position: relative;
    width: 100%;
    max-width: min(460px, calc(100vw - 32px));
    margin-bottom: 24px;
    border-radius: 26px;
    padding: 2px;
    background: linear-gradient(160deg, rgba(255,255,255,0.92), rgba(255,255,255,0.35));
    box-shadow: var(--shadow), inset 0 0 0 1px var(--hairline);
    cursor: pointer;
    animation: cardIn 0.8s ease-out forwards;
    opacity: 0;
    overflow: hidden;
}
.external-video-wrap video {
    width: 100%;
    display: block;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 24px;
    background: #0A0E1A;
    -webkit-playsinline: true;
    -webkit-user-select: none;
    user-select: none;
}
.video-state {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: rgba(255,255,255,0.74);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.9);
    box-shadow: 0 10px 30px rgba(20,30,60,0.28), inset 0 1px 0 rgba(255,255,255,0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1D1D1F;
    font-size: 22px;
    padding-left: 4px;
    transition: opacity 0.35s ease, transform 0.35s ease;
    pointer-events: none;
}
.external-video-wrap.playing .video-state {
    opacity: 0;
    transform: translate(-50%, -50%) scale(0.72);
}
/* ================= 应用玻璃卡片 ================= */
.app-jump-container {
    position: relative;
    width: 100%;
    max-width: min(430px, calc(100vw - 32px));
    padding: 26px 20px 22px;
    border-radius: 30px;
    background: var(--glass);
    backdrop-filter: var(--blur);
    -webkit-backdrop-filter: var(--blur);
    border: 1px solid var(--glass-line);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.9);
    overflow: hidden;
    animation: cardIn 0.8s ease-out 0.15s forwards;
    opacity: 0;
}
.app-jump-container::before {
    content: "";
    position: absolute;
    top: 0;
    left: 8%;
    right: 8%;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.95), transparent);
    z-index: 1;
}
@keyframes cardIn { 0% { opacity: 0; transform: translateY(24px) scale(0.98); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
/* 头像+车牌区域：头像左对齐，车牌右对齐 */
.plate-wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-bottom: 18px;
}
/* 头像容器：正圆形，宽高相等 */
.avatar-box {
    position: relative;
    width: 64px;
    height: 64px;
    max-width: 64px;
    max-height: 64px;
    flex-shrink: 0;
    border-radius: 50%;
    overflow: visible;
}
.avatar-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    object-position: center;
    background: #ddd;
}
.crown-icon {
    position: absolute;
    top: -6px;
    left: -4px;
    font-size: 20px;
    color: #FFD700;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.35));
    z-index: 3;
}
/* 头像后方右侧渐变文字：刘茜美子 · 去有风的地方遇见你【已缩小字号】 */
.avatar-name-bg {
    position: absolute;
    left: 72px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 13px;
    font-weight: 900;
    white-space: nowrap;
    background: linear-gradient(90deg, #ff6b9d, #c44569, #54a0ff, #ff6b9d);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 0.7px;
    z-index: 2;
    animation: gradientShift 6s ease-in-out infinite;
}
/* 头像下方渐变文字 */
.avatar-subtitle {
    width: 100%;
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    margin-top: 8px;
    margin-bottom: 20px;
    background: linear-gradient(90deg,#ff6b9d,#c44569,#54a0ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    white-space: nowrap;
}
/* 新能源绿色车牌【已缩小优化】 */
.car-plate {
    position: relative;
    width: auto;
    max-width: 170px;
    padding: 7px 12px;
    background: linear-gradient(180deg, #1FD8A3 0%, #00B87C 100%);
    border: 1px solid rgba(255,255,255,0.85);
    border-radius: 8px;
    box-shadow: 0 6px 16px rgba(0,120,80,0.25), inset 0 1px 2px rgba(255,255,255,0.4);
    text-align: center;
    flex-shrink: 0;
    margin-left: auto;
}
.car-plate::before {
    content: "";
    position: absolute;
    inset: 3.5px;
    border: 1px solid rgba(255,255,255,0.22);
    border-radius: 6px;
    pointer-events: none;
}
.plate-text {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #111111;
    font-family: "Heiti SC", "Microsoft YaHei", "PingFang SC", sans-serif;
    text-shadow: none;
    -webkit-font-smoothing: antialiased;
}
/* ================= 按钮组 ================= */
.btn-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
}
.app-jump-btn {
    position: relative;
    width: 100%;
    min-height: 56px;
    padding: 8px 16px 8px 10px;
    display: flex;
    align-items: center;
    gap: 13px;
    background: rgba(255,255,255,0.50);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid rgba(255,255,255,0.75);
    border-radius: 18px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
    color: var(--t1);
    font-family: var(--body);
    font-size: 14.5px;
    font-weight: 500;
    cursor: pointer;
    text-align: left;
    overflow: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    opacity: 0;
    animation: btnIn 0.55s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    transition: transform 0.22s cubic-bezier(0.4, 0, 0.2, 1), background 0.22s, border-color 0.22s, box-shadow 0.22s;
    will-change: transform;
}
.btn-group .app-jump-btn:nth-child(1) { animation-delay: 0.20s; }
.btn-group .app-jump-btn:nth-child(2) { animation-delay: 0.26s; }
.btn-group .app-jump-btn:nth-child(3) { animation-delay: 0.32s; }
.btn-group .app-jump-btn:nth-child(4) { animation-delay: 0.38s; }
.btn-group .app-jump-btn:nth-child(5) { animation-delay: 0.44s; }
.btn-group .app-jump-btn:nth-child(6) { animation-delay: 0.50s; }
.btn-group .app-jump-btn:nth-child(7) { animation-delay: 0.56s; }
@keyframes btnIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.app-jump-btn .btn-ic {
    flex: 0 0 auto;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    background: color-mix(in srgb, var(--ic) 16%, #FFFFFF);
    color: var(--ic);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.75), 0 2px 6px rgba(40,55,90,0.10);
    transition: transform 0.22s, background 0.22s;
}
.app-jump-btn .btn-label { flex: 1 1 auto; }
.app-jump-btn .btn-arrow {
    flex: 0 0 auto;
    font-size: 12px;
    color: var(--t3);
    opacity: 0.6;
    transition: transform 0.22s, opacity 0.22s;
}
.app-jump-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.78);
    border-color: color-mix(in srgb, var(--ic) 45%, #FFFFFF);
    transform: translateY(-2px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 12px 26px rgba(40,55,90,0.16);
}
.app-jump-btn:hover:not(:disabled) .btn-ic { transform: scale(1.07); }
.app-jump-btn:hover:not(:disabled) .btn-arrow { transform: translateX(3px); opacity: 1; }
.app-jump-btn:active:not(:disabled) { transform: scale(0.985); }
.app-jump-btn:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.app-jump-btn:disabled { opacity: 0.55; cursor: default; }
.app-jump-btn:active:not(:disabled)::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(0,122,255,0.22) 0%, transparent 62%);
    animation: energyBurst 0.45s ease-out;
    pointer-events: none;
}
@keyframes energyBurst { 0% { opacity: 1; transform: scale(0.2); } 100% { opacity: 0; transform: scale(2.2); } }
/* 提示 */
.tips {
    font-size: 11.5px;
    color: var(--t3);
    text-align: center;
    letter-spacing: 0.06em;
    line-height: 1.6;
    font-weight: 500;
    opacity: 0;
    animation: fadeText 0.8s ease-out 0.9s forwards;
}
@keyframes fadeText { to { opacity: 1; } }
/* ================= 背景装饰 ================= */
.bg-decoration {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 1;
}
.blob {
    position: absolute;
    border-radius: 50%;
    will-change: transform;
}
.blob-a {
    width: 380px; height: 380px;
    top: -90px; left: -110px;
    background: radial-gradient(circle, rgba(128,168,255,0.80) 0%, rgba(128,168,255,0) 68%);
    animation: blobDriftA 22s ease-in-out infinite alternate;
}
.blob-b {
    width: 340px; height: 340px;
    top: 6%; right: -100px;
    background: radial-gradient(circle, rgba(255,156,204,0.70) 0%, rgba(255,156,204,0) 68%);
    animation: blobDriftB 26s ease-in-out infinite alternate;
}
.blob-c {
    width: 400px; height: 400px;
    bottom: -140px; left: -120px;
    background: radial-gradient(circle, rgba(142,232,208,0.72) 0%, rgba(142,232,208,0) 68%);
    animation: blobDriftC 24s ease-in-out infinite alternate;
}
.blob-d {
    width: 360px; height: 360px;
    bottom: 4%; right: -90px;
    background: radial-gradient(circle, rgba(188,164,255,0.70) 0%, rgba(188,164,255,0) 68%);
    animation: blobDriftD 28s ease-in-out infinite alternate;
}
@keyframes blobDriftA { from { transform: translate(0,0) scale(1); } to { transform: translate(70px,50px) scale(1.14); } }
@keyframes blobDriftB { from { transform: translate(0,0) scale(1); } to { transform: translate(-60px,60px) scale(1.1); } }
@keyframes blobDriftC { from { transform: translate(0,0) scale(1); } to { transform: translate(60px,-50px) scale(1.16); } }
@keyframes blobDriftD { from { transform: translate(0,0) scale(1); } to { transform: translate(-55px,-45px) scale(1.12); } }
.halo {
    position: absolute;
    inset: -20%;
    background: radial-gradient(58% 42% at 50% 0%, rgba(255,255,255,0.85), transparent 70%);
    animation: haloPulse 14s ease-in-out infinite alternate;
}
@keyframes haloPulse { from { opacity: 0.75; } to { opacity: 1; } }
/* ================= 粒子 ================= */
.particle-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
}
.text-particle {
    position: absolute;
    font-weight: 800;
    white-space: nowrap;
    pointer-events: none;
    will-change: transform, opacity;
    -webkit-font-smoothing: antialiased;
    text-shadow: 0 0 8px rgba(255,255,255,0.95), 0 1px 3px rgba(20,30,60,0.18);
}
.data-particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: #0A84FF;
    border-radius: 50%;
    opacity: 0.5;
    animation: dataFlow 30s linear infinite;
    box-shadow: 0 0 4px rgba(10,132,255,0.5);
}
@keyframes dataFlow { 0% { transform: translateY(100vh) translateX(0); opacity: 0; } 10% { opacity: 0.5; } 90% { opacity: 0.5; } 100% { transform: translateY(-100vh) translateX(15px); opacity: 0; } }
@keyframes particleFloatUp { 0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 1; } 100% { transform: translateY(-180px) rotate(180deg) scale(0.6); opacity: 0; } }
@keyframes particleBurst {
    0%   { transform: translate(0,0) scale(0.5); opacity: 1; }
    100% { transform: translate(var(--px, 0px), var(--py, 0px)) scale(1.05); opacity: 0; }
}
.snowflake {
    position: absolute;
    top: -10%;
    background: #FFFFFF;
    border-radius: 50%;
    opacity: 0.8;
    animation: snowfall calc(45s + 8s) linear infinite;
    box-shadow: 0 0 4px rgba(60,90,150,0.30);
    will-change: transform, opacity;
}
@keyframes snowfall { 0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; } 10%,90% { opacity: 0.8; } 100% { transform: translateY(110vh) translateX(30px) rotate(360deg); opacity: 0; } }
.sakura {
    position: absolute;
    top: -14%;
    width: 18px;
    height: 18px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g fill='%23FFB9CE'><path d='M50 52C50 36 40 22 24 24 10 26 8 42 18 50 26 56 40 56 50 52Z' transform='rotate(0 50 50)'/><path d='M50 52C50 36 40 22 24 24 10 26 8 42 18 50 26 56 40 56 50 52Z' transform='rotate(72 50 50)'/><path d='M50 52C50 36 40 22 24 24 10 26 8 42 18 50 26 56 40 56 50 52Z' transform='rotate(144 50 50)'/><path d='M50 52C50 36 40 22 24 24 10 26 8 42 18 50 26 56 40 56 50 52Z' transform='rotate(216 50 50)'/><path d='M50 52C50 36 40 22 24 24 10 26 8 42 18 50 26 56 40 56 50 52Z' transform='rotate(288 50 50)'/></g><circle cx='50' cy='50' r='5.5' fill='%23FF7BA0'/><circle cx='47.5' cy='48' r='1.6' fill='%23FFE3EB'/></svg>");
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    opacity: 0.85;
    animation: sakuraFall calc(45s + 6s) cubic-bezier(0.45,0.05,0.55,0.95) infinite;
    filter: drop-shadow(0 1px 2px rgba(255,140,175,0.30));
    will-change: transform, opacity;
}
@keyframes sakuraFall {
    0%   { transform: translate3d(0,-4vh,0) rotate(0deg); opacity: 0; }
    8%   { opacity: 0.9; }
    50%  { transform: translate3d(var(--sway, 0px), 52vh, 0) rotate(190deg); }
    100% { transform: translate3d(calc(var(--sway, 0px) * -1), 116vh, 0) rotate(360deg); opacity: 0; }
}
/* ================= 深色模式 ================= */
@media (prefers-color-scheme: dark) {
    :root {
        --bg-top: #1B2030;
        --bg-bottom: #11141F;
        --t1: #F5F5F7;
        --t2: #B7B7BD;
        --t3: #8E8E93;
        --acc: #0A84FF;
        --acc-h: #409CFF;
        --sakura: #FF8FB0;
        --glass: rgba(32,36,50,0.55);
        --glass-line: rgba(255,255,255,0.16);
        --hairline: rgba(255,255,255,0.10);
        --shadow: 0 24px 60px rgba(0,0,0,0.45), 0 2px 10px rgba(0,0,0,0.2);
        --blur: blur(28px) saturate(170%);
    }
    .blob-a { background: radial-gradient(circle, rgba(70,100,190,0.55), rgba(70,100,190,0) 68%); }
    .blob-b { background: radial-gradient(circle, rgba(190,90,140,0.5), rgba(190,90,140,0) 68%); }
    .blob-c { background: radial-gradient(circle, rgba(60,150,130,0.5), rgba(60,150,130,0) 68%); }
    .blob-d { background: radial-gradient(circle, rgba(110,95,180,0.5), rgba(110,95,180,0) 68%); }
    .halo { background: radial-gradient(58% 42% at 50% 0%, rgba(120,150,220,0.35), transparent 70%); }
    .app-jump-btn { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.14); box-shadow: inset 0 1px 0 rgba(255,255,255,0.08); }
    .app-jump-btn:hover:not(:disabled) { background: rgba(255,255,255,0.14); border-color: color-mix(in srgb, var(--ic) 50%, #3A3F52); box-shadow: inset 0 1px 0 rgba(255,255,255,0.12), 0 12px 26px rgba(0,0,0,0.35); }
    .app-jump-btn .btn-ic { background: color-mix(in srgb, var(--ic) 22%, #232839); }
    .video-state { background: rgba(255,255,255,0.18); border-color: rgba(255,255,255,0.28); color: #FFFFFF; box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.22); }
    .text-particle { text-shadow: 0 0 8px rgba(0,0,0,0.6), 0 1px 3px rgba(0,0,0.5); }
    .snowflake { background: #C7CCDA; box-shadow: 0 0 4px rgba(255,255,255,0.18); }
}
/* ================= 小屏适配 ================= */
@media (max-width: 480px) {
    .stage { padding: 28px 14px calc(84px + env(safe-area-inset-bottom)); }
    .app-jump-container { border-radius: 26px; padding: 22px 16px 18px; }
    .external-video-wrap { border-radius: 22px; }
    .external-video-wrap video { border-radius: 20px; }
    .plate-wrap { gap: 10px; }
    .avatar-box { width: 56px; height: 56px; max-width: 56px; max-height: 56px; }
    .crown-icon { font-size: 17px; }
    .avatar-name-bg {
        font-size: 12px;
        left: 64px;
        letter-spacing: 0.5px;
    }
    .car-plate { max-width:154px; padding:6px 10px; }
    .plate-text { font-size:13px; }
}
@media (max-width: 380px) {
    .stage { padding: 24px 12px calc(76px + env(safe-area-inset-bottom)); }
    .app-jump-container { padding: 20px 14px 16px; border-radius: 24px; }
    .app-jump-btn { min-height: 52px; font-size: 13.5px; }
    .app-jump-btn .btn-ic { width: 36px; height: 36px; font-size: 16px; }
    .avatar-box { width: 50px; height: 50px; max-width: 50px; max-height: 50px; }
    .avatar-name-bg {
        font-size: 10.5px;
        left: 58px;
        letter-spacing: 0.4px;
    }
    .car-plate { max-width:136px; padding:5px 8px; }
    .plate-text { font-size:12px; }
}
/* ================= 减少动态偏好 ================= */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
    }
    .blob, .data-particle, .snowflake, .sakura, .text-particle { display: none !important; }
}
</style>
</head>
<body>
<div class="particle-layer" id="particleLayer"></div>
<div class="bg-decoration">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
    <div class="blob blob-d"></div>
    <div class="halo"></div>
</div>
<main class="stage">
    <div class="external-video-wrap" id="videoWrap">
        <video id="mainVideo" src="https://gerenboke-1311553598.cos.ap-nanjing.myqcloud.com/su7/%E5%BE%AE%E4%BF%A1%E8%A7%86%E9%A2%912026-08-29_125335_129.mp4" loop playsinline webkit-playsinline preload="metadata">你的浏览器不支持视频</video>
        <div class="video-state" id="videoState"><i class="fa-solid fa-play"></i></div>
    </div>
    <section class="app-jump-container">
        <div class="plate-wrap">
            <!-- 头像区域，src替换为你的外链头像地址 -->
            <div class="avatar-box">
                <i class="fa-solid fa-crown crown-icon"></i>
                <span class="avatar-name-bg">刘茜美子・去有风的地方遇见你</span>
                <img class="avatar-img" src="https://gerenboke-1311553598.cos.ap-nanjing.myqcloud.com/su7/%E5%BE%AE%E4%BF%A1%E5%9B%BE%E7%89%87_20260822152043_404_1539.jpg" alt="头像">
            </div>
            <div class="car-plate"><span class="plate-text">苏FA36165</span></div>
        </div>
        <!-- 头像下方渐变文字 -->
        <div class="avatar-subtitle">你好,我叫许红豆 丨 风乍起,吹邹一江春水</div>
        <div class="btn-group">
            <button class="app-jump-btn" data-app="custom2" style="--ic:#FF8A4C">
                <span class="btn-ic"><i class="fa-solid fa-plus"></i></span>
                <span class="btn-label">打开 A➕ 系统</span>
                <i class="fa-solid fa-chevron-right btn-arrow"></i>
            </button>
            <button class="app-jump-btn" data-app="custom7" style="--ic:#FFB03C">
                <span class="btn-ic"><i class="fa-solid fa-music"></i></span>
                <span class="btn-label">打开汽水音乐</span>
                <i class="fa-solid fa-chevron-right btn-arrow"></i>
            </button>
            <button class="app-jump-btn" data-app="custom1" style="--ic:#3DDC84">
                <span class="btn-ic"><i class="fa-solid fa-music"></i></span>
                <span class="btn-label">打开 LX Music</span>
                <i class="fa-solid fa-chevron-right btn-arrow"></i>
            </button>
            <button class="app-jump-btn" data-app="custom3" style="--ic:#FF3B5C">
                <span class="btn-ic"><i class="fa-brands fa-youtube"></i></span>
                <span class="btn-label">打开 YouTube</span>
                <i class="fa-solid fa-chevron-right btn-arrow"></i>
            </button>
            <button class="app-jump-btn" data-app="custom4" style="--ic:#38E1FF">
                <span class="btn-ic"><i class="fa-solid fa-globe"></i></span>
                <span class="btn-label">打开 FlClash</span>
                <i class="fa-solid fa-chevron-right btn-arrow"></i>
            </button>
            <button class="app-jump-btn" data-app="custom5" style="--ic:#4DA3FF">
                <span class="btn-ic"><i class="fa-solid fa-map-location-dot"></i></span>
                <span class="btn-label">打开高德地图</span>
                <i class="fa-solid fa-chevron-right btn-arrow"></i>
            </button>
            <button class="app-jump-btn" data-app="custom6" style="--ic:#A3B8FF">
                <span class="btn-ic"><i class="fa-brands fa-tiktok"></i></span>
                <span class="btn-label">打开抖音</span>
                <i class="fa-solid fa-chevron-right btn-arrow"></i>
            </button>
        </div>
        <p class="tips" id="tips">苏FA36165 · 去有风的地方遇见你</p>
    </section>
</main>
<script>
const APP_CONFIG_MAP = {
    custom1: { scheme: "anywhere://open?sid=0444", timeout: 1800, name: "LX Music", icon: "fa-solid fa-music" },
    custom2: { scheme: "anywhere://open?sid=2848", timeout: 1800, name: "A➕系统", icon: "fa-solid fa-plus" },
    custom7: { scheme: "anywhere://open?sid=5395", timeout: 1800, name: "汽水音乐", icon: "fa-solid fa-music" },
    custom3: { scheme: "anywhere://open?sid=0451", timeout: 1800, name: "YouTube", icon: "fa-brands fa-youtube" },
    custom4: { scheme: "anywhere://open?sid=2305", timeout: 1800, name: "FlClash", icon: "fa-solid fa-globe" },
    custom5: { scheme: "anywhere://open?sid=7535", timeout: 1800, name: "高德地图", icon: "fa-solid fa-map-location-dot" },
    custom6: { scheme: "anywhere://open?sid=5181", timeout: 1800, name: "抖音", icon: "fa-brands fa-tiktok" }
};
const CONFIG = {
    PARTICLE_TEXT: "苏FA36165",
    BURST_COUNT_PER_CLICK: 10,
    SNOWFLAKE_COUNT: 20,
    SAKURA_COUNT: 80,
    DATA_PARTICLE_COUNT: 10
};
const particleLayer = document.getElementById("particleLayer");
const bgDecoration = document.querySelector(".bg-decoration");
function createSu7Particle(x, y) {
    const burst = CONFIG.BURST_COUNT_PER_CLICK;
    for (let i = 0; i < burst; i++) {
        const particle = document.createElement("div");
        particle.className = "text-particle";
        particle.innerText = CONFIG.PARTICLE_TEXT;
        const randomSize = Math.floor(Math.random() * 9) + 14;
        const hue = Math.floor(Math.random() * 360);
        const randomColor = "hsl(" + hue + ", 82%, 58%)";
        const angle = (Math.PI * 2 * i) / burst + (Math.random() - 0.5) * 0.8;
        const dist = 55 + Math.random() * 95;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist - 55;
        const randomDuration = (0.9 + Math.random() * 0.8).toFixed(2);
        particle.style.fontSize = randomSize + "px";
        particle.style.color = randomColor;
        particle.style.textShadow = "0 0 7px " + randomColor + ", 0 1px 2px rgba(255,255,255,0.9)";
        particle.style.left = x + "px";
        particle.style.top = y + "px";
        particle.style.setProperty("--px", dx.toFixed(1) + "px");
        particle.style.setProperty("--py", dy.toFixed(1) + "px");
        particle.style.animation = "particleBurst " + randomDuration + "s cubic-bezier(0.15,0.85,0.35,1) forwards";
        particleLayer.appendChild(particle);
        setTimeout(() => {
            if (particle.parentNode) particleLayer.removeChild(particle);
        }, randomDuration * 1000 + 80);
    }
}
function createSnowflakes() {
    for (let i = 0; i < CONFIG.SNOWFLAKE_COUNT; i++) {
        const el = document.createElement("div");
        el.className = "snowflake";
        const size = Math.random() * 4 + 2;
        el.style.width = el.style.height = size + "px";
        el.style.left = (Math.random() * 100) + "%";
        el.style.animationDuration = (Math.random() * 10 + 10) + "s";
        el.style.animationDelay = (Math.random() * 12) + "s";
        bgDecoration.appendChild(el);
    }
}
function createSakura() {
    for (let i = 0; i < CONFIG.SAKURA_COUNT; i++) {
        const el = document.createElement("div");
        el.className = "sakura";
        const size = Math.random() * 12 + 14;
        el.style.width = el.style.height = size + "px";
        el.style.left = (Math.random() * 100) + "%";
        el.style.top = (-Math.random() * 50) + "%";
        el.style.setProperty("--sway", (Math.random() * 120 - 60).toFixed(1) + "px");
        el.style.animationDuration = (Math.random() * 8 + 10) + "s";
        el.style.animationDelay = (Math.random() * 20) + "s";
        el.style.opacity = (Math.random() * 0.4 + 0.6).toFixed(2);
        bgDecoration.appendChild(el);
    }
}
function createDataParticles() {
    for (let i = 0; i < CONFIG.DATA_PARTICLE_COUNT; i++) {
        const el = document.createElement("div");
        el.className = "data-particle";
        el.style.left = (Math.random() * 100) + "%";
        el.style.animationDuration = (Math.random() * 10 + 15) + "s";
        el.style.animationDelay = (Math.random() * 12) + "s";
        bgDecoration.appendChild(el);
    }
}
function jumpToApp(appKey) {
    const cfg = APP_CONFIG_MAP[appKey];
    if (!cfg) return;
    const btn = document.querySelector('[data-app="' + appKey + '"]');
    const tips = document.getElementById("tips");
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    btn.innerHTML = '<span class="btn-ic"><i class="fa-solid fa-spinner fa-spin"></i></span><span class="btn-label">正在打开 ' + cfg.name + "…</span>";
    tips.textContent = "若长时间未跳转，请检查是否已安装「" + cfg.name + "」";
    setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = '<span class="btn-ic"><i class="' + cfg.icon + '"></i></span><span class="btn-label">打开' + cfg.name + "</span><i class='fa-solid fa-chevron-right btn-arrow'></i>";
        tips.textContent = "苏FA36165 · 私人应用快速跳转工具";
    }, cfg.timeout);
    try {
        window.location.href = cfg.scheme;
    } catch (err) {
        const iframe = document.createElement("iframe");
        iframe.style.display = "none";
        iframe.src = cfg.scheme;
        document.body.appendChild(iframe);
        setTimeout(() => iframe.remove(), 100);
    }
}
window.addEventListener("load", () => {
    createSnowflakes();
    createSakura();
    createDataParticles();
});
document.addEventListener("click", e => {
    createSu7Particle(e.clientX, e.clientY);
});
document.querySelectorAll(".app-jump-btn").forEach(btn => {
    btn.addEventListener("click", e => {
        e.stopPropagation();
        jumpToApp(btn.dataset.app);
    });
});
const mainVideo = document.getElementById("mainVideo");
const videoWrap = document.getElementById("videoWrap");
const videoState = document.getElementById("videoState");
function toggleVideo() {
    if (mainVideo.paused) {
        mainVideo.play().catch(() => {});
        videoWrap.classList.add("playing");
    } else {
        mainVideo.pause();
        videoWrap.classList.remove("playing");
    }
}
videoWrap.addEventListener("click", e => {
    e.stopPropagation();
    toggleVideo();
});
mainVideo.addEventListener("play", () => videoWrap.classList.add("playing"));
mainVideo.addEventListener("pause", () => videoWrap.classList.remove("playing"));
</script>
</body>
</html>
