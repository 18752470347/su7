<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#EEF2FA">
    <meta name="color-scheme" content="light">
    <meta name="format-detection" content="telephone=no">
    <title>苏FA36165 · 快速启动</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            width: 100%;
            min-height: 100%;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: #f7f9fc;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            overscroll-behavior-x: none;
            user-select: none;
        }

        :root {
            --text-main: #1D1D1F;
            --text-sub: #555861;
            --text-muted: #8E929C;
            --blue: #1677FF;
            --green: #18A864;
            --red: #FF3B30;
            --glass-bg: rgba(255,255,255,0.42);
            --glass-strong: rgba(255,255,255,0.65);
            --glass-border: rgba(255,255,255,0.6);
            --glass-shadow: 0 24px 60px rgba(0,0,0,0.12), 0 8px 24px rgba(0,0,0,0.06);
            --radius-xl: 32px;
            --radius-lg: 24px;
            --radius-md: 18px;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --spring: cubic-bezier(0.22, 1, 0.36, 1);
        }

        button, img, video {
            -webkit-user-drag: none;
        }
        button {
            font: inherit;
        }

        /* 液态动态渐变背景 Liquid Glass */
        .liquid-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }
        .liquid-gradient {
            position: absolute;
            width: 140vw;
            height: 140vh;
            top: -20vh;
            left: -20vw;
            background:
                radial-gradient(ellipse at 15% 10%, rgba(120,170,255,0.45), transparent 55%),
                radial-gradient(ellipse at 85% 20%, rgba(255,160,200,0.38), transparent 55%),
                radial-gradient(ellipse at 20% 85%, rgba(110,230,200,0.36), transparent 55%),
                radial-gradient(ellipse at 80% 88%, rgba(190,160,255,0.40), transparent 55%);
            animation: liquidFlow 22s ease-in-out infinite alternate;
            filter: blur(60px);
        }

        @keyframes liquidFlow {
            0% { transform: translate(0,0) rotate(0deg) scale(1.05); }
            50% { transform: translate(40px, -30px) rotate(4deg) scale(1.12); }
            100% { transform: translate(-30px, 40px) rotate(-4deg) scale(1.05); }
        }

        /* 页面入场动画 弹簧 */
        @keyframes pageSpringIn {
            from {
                opacity: 0;
                transform: translateY(14px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes cardSpringIn {
            from {
                opacity: 0;
                transform: translateY(18px) scale(0.97);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .page {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 470px;
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0 auto;
            padding: calc(32px + var(--safe-top)) 16px calc(70px + var(--safe-bottom));
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: pageSpringIn .75s var(--spring) both;
        }

        /* 视频卡片 */
        .video-card {
            position: relative;
            width: 100%;
            margin-bottom: 20px;
            padding: 3px;
            border-radius: var(--radius-xl);
            background: linear-gradient(145deg, rgba(255,255,255,0.85), rgba(255,255,255,0.22));
            box-shadow: var(--glass-shadow);
            overflow: hidden;
            isolation: isolate;
            animation: cardSpringIn .7s var(--spring) 0.14s both;
        }
        .video-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: calc(var(--radius-xl) - 3px);
            overflow: hidden;
            background: #090D17;
        }
        .video-box video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #090D17;
        }
        .video-play {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 64px;
            height: 64px;
            transform: translate(-50%,-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #1D1D1F;
            background: rgba(255,255,255,.72);
            border: 1px solid rgba(255,255,255,.9);
            box-shadow: 0 12px 32px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.9);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            pointer-events: none;
            transition: opacity .28s ease, transform .28s var(--spring);
        }
        .video-card.playing .video-play {
            opacity: 0;
            transform: translate(-50%,-50%) scale(0.72);
        }

        /* 主液态玻璃卡片 */
        .main-card {
            position: relative;
            width: 100%;
            padding: 24px 18px 20px;
            border-radius: var(--radius-xl);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow), inset 0 1px 0 rgba(255,255,255,0.5);
            backdrop-filter: blur(32px) saturate(185%);
            -webkit-backdrop-filter: blur(32px) saturate(185%);
            overflow: hidden;
            animation: cardSpringIn .7s var(--spring) 0.20s both;
        }
        @supports not ( backdrop-filter: blur(10px) ) {
            .main-card {
                background: rgba(255,255,255,.86);
            }
        }

        .profile-row {
            display: grid;
            grid-template-columns: minmax(0,1fr) auto;
            align-items: start;
            gap: 14px;
            width: 100%;
        }
        .profile-left {
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .avatar {
            position: relative;
            width: 66px;
            height: 66px;
            margin-bottom: 12px;
            border-radius: 50%;
            cursor: zoom-in;
            isolation: isolate;
        }
        .avatar::before {
            content: "";
            position: absolute;
            inset: -4px;
            z-index: -1;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffffff, rgba(255,255,255,.2));
            box-shadow: 0 10px 24px rgba(60,70,110,.16);
        }
        .avatar img {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,.9);
            transition: transform .2s var(--spring), filter .2s ease;
        }
        .avatar:active img {
            transform: scale(.92);
            filter: brightness(.9);
        }
        .crown {
            position: absolute;
            z-index: 4;
            left: -6px;
            top: -10px;
            color: #FFD43B;
            font-size: 21px;
            transform: rotate(-18deg);
            filter: drop-shadow(0 2px 3px rgba(0,0,0,.28));
            pointer-events: none;
        }

        .plate {
            padding: 6px 14px;
            margin-bottom: 11px;
            border-radius: 8px;
            background: linear-gradient(135deg, #14994F, #08763C);
            color: #fff;
            font-family: "Space Grotesk", Inter, sans-serif;
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 1.6px;
            box-shadow: 0 6px 18px rgba(15,135,70,.28), inset 0 1px 0 rgba(255,255,255,.38);
            border: 1px solid rgba(255,255,255,.7);
            cursor: pointer;
            transition: transform .18s var(--spring);
        }
        .plate:active {
            transform: scale(.93);
        }

        .name {
            max-width: 100%;
            font-size: 12.5px;
            line-height: 1.5;
            font-weight: 800;
            letter-spacing: .5px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: linear-gradient(90deg, #FF5C93, #C84870, #4A8DFF, #FF5C93);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: textGradient 7s ease-in-out infinite;
        }
        .subtitle {
            max-width: 100%;
            margin-top: 5px;
            font-size: 11.5px;
            line-height: 1.5;
            font-weight: 700;
            letter-spacing: .35px;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: linear-gradient(90deg, #FF6D9C, #558EFF);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        @keyframes textGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .plate-photo {
            width: 92px;
            flex-shrink: 0;
            border-radius: 12px;
            overflow: hidden;
            cursor: zoom-in;
            border: 1px solid rgba(255,255,255,.9);
            box-shadow: 0 10px 22px rgba(35,75,85,.20);
            background: rgba(255,255,255,.25);
            transition: transform .2s var(--spring), filter .2s ease;
        }
        .plate-photo:active {
            transform: scale(.93);
            filter: brightness(.9);
        }
        .plate-photo img {
            display: block;
            width: 100%;
            aspect-ratio: 9 / 16;
            object-fit: cover;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 22px;
        }
        .app-button {
            --icon-color: #1677FF;
            position: relative;
            display: flex;
            align-items: center;
            gap: 14px;
            width: 100%;
            min-height: 58px;
            padding: 8px 14px 8px 10px;
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            background: var(--glass-bg);
            color: var(--text-main);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.5);
            backdrop-filter: blur(24px) saturate(170%);
            -webkit-backdrop-filter: blur(24px) saturate(170%);
            cursor: pointer;
            text-align: left;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: transform .2s var(--spring), background .2s ease, box-shadow .2s ease;
        }
        @supports not ( backdrop-filter: blur(10px) ) {
            .app-button {
                background: rgba(255,255,255,.82);
            }
        }
        @media (hover: none) {
            .app-button:active {
                transform: scale(.97);
                background: var(--glass-strong);
                box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
            }
        }
        @media (hover: hover) {
            .app-button:hover {
                transform: translateY(-3px);
                background: var(--glass-strong);
                box-shadow: var(--glass-shadow);
            }
        }
        .app-icon {
            flex: 0 0 auto;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            color: var(--icon-color);
            background: rgba(255,255,255,.65);
            box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 4px 10px rgba(50,65,100,.10);
            font-size: 17px;
        }
        .app-label {
            flex: 1;
            min-width: 0;
            font-size: 14.5px;
            font-weight: 600;
            line-height: 1.4;
        }
        .app-arrow {
            flex: 0 0 auto;
            color: var(--text-muted);
            font-size: 12px;
            opacity: .7;
            transition: transform .2s var(--spring);
        }
        .app-button:hover .app-arrow {
            transform: translateX(4px);
        }
        .app-button.loading {
            pointer-events: none;
            opacity: .7;
        }

        .tips {
            margin-top: 18px;
            font-size: 11px;
            line-height: 1.6;
            text-align: center;
            color: var(--text-muted);
            letter-spacing: .06em;
        }

        /* Toast */
        .toast {
            position: fixed;
            z-index: 10001;
            left: 50%;
            bottom: calc(44px + var(--safe-bottom));
            transform: translate(-50%, 18px) scale(.94);
            padding: 10px 18px;
            border-radius: 12px;
            color: #fff;
            background: rgba(20,22,28,.76);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            font-size: 13px;
            opacity: 0;
            pointer-events: none;
            transition: opacity .24s ease, transform .24s var(--spring);
        }
        .toast.show {
            opacity: 1;
            transform: translate(-50%,0) scale(1);
        }

        /* 图片查看器 */
        .viewer {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(5,8,18,.86);
            backdrop-filter: blur(24px) saturate(120%);
            -webkit-backdrop-filter: blur(24px) saturate(120%);
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .26s ease, visibility .26s ease;
        }
        .viewer.show {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }
        .viewer-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            touch-action: none;
            overscroll-behavior: none;
        }
        .viewer-img {
            display: block;
            max-width: 94vw;
            max-height: 86vh;
            width: auto;
            height: auto;
            object-fit: contain;
            border-radius: 14px;
            box-shadow: 0 34px 90px rgba(0,0,0,.55);
            transform: translate3d(0,0,0) scale(.94);
            opacity: 0;
            transition: transform .32s var(--spring), opacity .24s ease;
            will-change: transform;
            user-select: none;
        }
        .viewer.show .viewer-img {
            opacity: 1;
            transform: translate3d(var(--move-x,0px), var(--move-y,0px), 0) scale(var(--scale,1));
        }
        .viewer-close {
            position: fixed;
            z-index: 10003;
            top: calc(16px + var(--safe-top));
            right: calc(16px + env(safe-area-inset-right,0px));
            width: 46px;
            height: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,.24);
            background: rgba(255,255,255,.14);
            color: #fff;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            font-size: 19px;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .viewer-close:active {
            transform: scale(.9);
        }
        .viewer-hint {
            position: fixed;
            z-index: 10003;
            left: 50%;
            bottom: calc(22px + var(--safe-bottom));
            transform: translateX(-50%);
            color: rgba(255,255,255,.74);
            font-size: 11.5px;
            letter-spacing: .08em;
            white-space: nowrap;
            text-shadow: 0 2px 6px rgba(0,0,0,.6);
            pointer-events: none;
        }

        /* 小屏幕适配 */
        @media (max-width: 380px) {
            .page {
                padding-left: 13px;
                padding-right: 13px;
            }
            .main-card {
                padding: 21px 14px 17px;
            }
            .avatar {
                width: 58px;
                height: 58px;
            }
            .plate-photo {
                width: 80px;
            }
            .app-button {
                min-height: 54px;
            }
            .app-icon {
                width: 38px;
                height: 38px;
            }
            .app-label {
                font-size:13.5px;
            }
        }

        /* 减少动画 */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
            }
            .liquid-gradient { display:none; }
        }
    </style>
</head>

<script>
const APP_CONFIG = {
    custom1: {scheme: "anywhere://open?sid=0444", name: "LX Music", icon: "fa-solid fa-music"},
    custom2: {scheme: "anywhere://open?sid=2848", name: "A➕系统", icon: "fa-solid fa-plus"},
    custom7: {scheme: "anywhere://open?sid=5395", name: "汽水音乐", icon: "fa-solid fa-music"},
    custom3: {scheme: "anywhere://open?sid=0451", name: "YouTube", icon: "fa-brands fa-youtube"},
    custom4: {scheme: "anywhere://open?sid=2305", name: "FlClash", icon: "fa-solid fa-globe"},
    custom5: {scheme: "anywhere://open?sid=7535", name: "高德地图", icon: "fa-solid fa-map-location-dot"},
    custom6: {scheme: "anywhere://open?sid=5181", name: "抖音", icon: "fa-brands fa-tiktok"}
};

const $ = selector => document.querySelector(selector);
const $$ = selector => document.querySelectorAll(selector);
const toast = $("#toast");
const tips = $("#tips");
const viewer = $("#viewer");
const viewerContent = $("#viewerContent");
const viewerImg = $("#viewerImg");
const mainVideo = $("#mainVideo");
const videoCard = $("#videoCard");

let toastTimer = null;
function showToast(text) {
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove("show"),1300);
}

$("#plate").addEventListener("click", async event=>{
    event.stopPropagation();
    const text = "苏FA36165";
    try{
        await navigator.clipboard.writeText(text);
    }catch{
        const input = document.createElement("input");
        input.value = text;
        input.style.position="fixed";input.style.opacity="0";
        document.body.appendChild(input);
        input.select();
        document.execCommand("copy");
        input.remove();
    }
    showToast("车牌号已复制");
});

function jumpToApp(key){
    const config = APP_CONFIG[key];
    if(!config) return;
    const button = document.querySelector(`[data-app="${key}"]`);
    if(!button || button.classList.contains("loading")) return;
    button.classList.add("loading");
    const originalHTML = button.innerHTML;
    button.innerHTML = `
        <span class="app-icon"><i class="fa-solid fa-spinner fa-spin"></i></span>
        <span class="app-label">正在打开 ${config.name}…</span>
        <i class="fa-solid fa-chevron-right app-arrow"></i>
    `;
    tips.textContent = `正在尝试打开「${config.name}」`;
    let finished = false;
    const restore = ()=>{
        if(finished) return;
        finished=true;
        button.classList.remove("loading");
        button.innerHTML = originalHTML;
        tips.textContent = "苏FA36165 · 去有风的地方遇见你";
    };
    document.addEventListener("visibilitychange", ()=>{
        if(document.visibilityState==="hidden") clearTimeout(timer);
    },{once:true});
    const timer = setTimeout(restore,1800);
    try{ window.location.href = config.scheme; }catch{ restore(); }
}

$$(".app-button").forEach(btn=>{
    btn.addEventListener("click",e=>{
        e.stopPropagation();
        jumpToApp(btn.dataset.app);
    })
});

function toggleVideo(){
    if(mainVideo.paused){
        const p = mainVideo.play();
        if(p) p.catch(()=>showToast("请再次点击播放视频"));
    }else{
        mainVideo.pause();
    }
}
videoCard.addEventListener("click",e=>{e.stopPropagation();toggleVideo()});
mainVideo.addEventListener("play",()=>videoCard.classList.add("playing"));
mainVideo.addEventListener("pause",()=>videoCard.classList.remove("playing"));

let scale = 1, translateX = 0, translateY = 0;
let pinchStartDistance = 0, pinchStartScale = 1;
let dragging = false, dragStartX=0,dragStartY=0,dragOriginX=0,dragOriginY=0;
let lastTap = 0;

function updateViewer(){
    viewerImg.style.setProperty("--scale",scale);
    viewerImg.style.setProperty("--move-x",`${translateX}px`);
    viewerImg.style.setProperty("--move-y",`${translateY}px`);
}
function resetViewer(){
    scale=1;translateX=0;translateY=0;updateViewer();
}
function touchDistance(touches){
    if(touches.length<2) return 0;
    const dx = touches[0].clientX - touches[1].clientX;
    const dy = touches[0].clientY - touches[1].clientY;
    return Math.hypot(dx,dy);
}
function openViewer(src,alt){
    if(!src) return;
    resetViewer();
    viewerImg.src = src;
    viewerImg.alt = alt||"原图";
    viewer.classList.add("show");
    viewer.setAttribute("aria-hidden","false");
    document.body.style.overflow="hidden";
}
function closeViewer(){
    viewer.classList.remove("show");
    viewer.setAttribute("aria-hidden","true");
    document.body.style.overflow="";
    resetViewer();
    setTimeout(()=>{if(!viewer.classList.contains("show")) viewerImg.src="";},280);
}

$("#avatar").addEventListener("click",e=>{e.stopPropagation();openViewer($("#avatarImg").src,"头像原图")});
$("#platePhoto").addEventListener("click",e=>{e.stopPropagation();openViewer($("#platePhotoImg").src,"图片原图")});
$("#viewerClose").addEventListener("click",e=>{e.stopPropagation();closeViewer()});
viewer.addEventListener("click",e=>{if(e.target===viewer||e.target===viewerContent) closeViewer()});

viewerImg.addEventListener("click",e=>{
    e.stopPropagation();
    const now = performance.now();
    if(now-lastTap<320){
        scale = scale<=1.05 ? 2 : 1;
        updateViewer();
    }
    lastTap = now;
});

viewerContent.addEventListener("touchstart",e=>{
    if(e.touches.length===2){
        e.preventDefault();
        pinchStartDistance = touchDistance(e.touches);
        pinchStartScale = scale;
        dragging = false;
        return;
    }
    if(e.touches.length===1 && scale>1){
        dragging = true;
        dragStartX = e.touches[0].clientX;
        dragStartY = e.touches[0].clientY;
        dragOriginX = translateX;
        dragOriginY = translateY;
    }
},{passive:false});

viewerContent.addEventListener("touchmove",e=>{
    if(e.touches.length===2){
        e.preventDefault();
        const dist = touchDistance(e.touches);
        if(pinchStartDistance>0){
            scale = Math.max(1,Math.min(4, pinchStartScale * (dist/pinchStartDistance)));
            if(scale===1){ translateX=0; translateY=0; }
            updateViewer();
        }
        return;
    }
    if(e.touches.length===1 && dragging && scale>1){
        e.preventDefault();
        translateX = dragOriginX + e.touches[0].clientX - dragStartX;
        translateY = dragOriginY + e.touches[0].clientY - dragStartY;
        updateViewer();
    }
},{passive:false});

viewerContent.addEventListener("touchend",e=>{
    if(e.touches.length<2) pinchStartDistance=0;
    if(e.touches.length===0) dragging=false;
},{passive:true});

viewerContent.addEventListener("wheel",e=>{
    if(!viewer.classList.contains("show")) return;
    e.preventDefault();
    scale += e.deltaY>0 ? -0.15 : 0.15;
    scale = Math.max(1,Math.min(4,scale));
    if(scale===1){ translateX=0; translateY=0; }
    updateViewer();
},{passive:false});

document.addEventListener("keydown",e=>{
    if(e.key==="Escape" && viewer.classList.contains("show")) closeViewer();
});
document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("gesturechange",e=>e.preventDefault());
document.addEventListener("gestureend",e=>e.preventDefault());
</script>
</body>
</html>
