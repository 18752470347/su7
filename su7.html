<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#EEF2FA">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <title>苏FA36165 · 快速启动</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ===== 全局重置 ===== */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --text-main: #1C1C1E;
      --text-sub: #3A3A3C;
      --text-muted: #8E8E93;
      --bg-primary: #F2F2F7;
      --bg-secondary: #FFFFFF;
      --glass-bg: rgba(255, 255, 255, 0.48);
      --glass-border: rgba(255, 255, 255, 0.60);
      --glass-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      --card-bg: rgba(255, 255, 255, 0.48);
      --icon-bg: rgba(255, 255, 255, 0.7);
      --status-color: #1C1C1E;
      --toast-bg: rgba(20, 22, 28, 0.78);
      --viewer-bg: rgba(0, 0, 0, 0.85);
      --plate-text: #fff;
      --plate-bg: linear-gradient(135deg, #34C759, #28A745);
      --name-gradient: linear-gradient(90deg, #FF5C93, #C84870, #4A8DFF, #FF5C93);
      --sub-gradient: linear-gradient(90deg, #FF6D9C, #558EFF);
      --liquid-gradient: radial-gradient(ellipse at 15% 10%, rgba(120, 170, 255, 0.30), transparent 55%),
        radial-gradient(ellipse at 85% 20%, rgba(255, 160, 200, 0.25), transparent 55%),
        radial-gradient(ellipse at 20% 85%, rgba(110, 230, 200, 0.22), transparent 55%),
        radial-gradient(ellipse at 80% 88%, rgba(190, 160, 255, 0.28), transparent 55%);
      --border-light: rgba(255, 255, 255, 0.5);
      --island-bg: #000;
      --island-text: #fff;
      --popup-overlay: rgba(0, 0, 0, 0.85);
      --glow-color: #FF2E63;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* 深色模式 */
    html.dark-mode {
      --text-main: #F5F5F7;
      --text-sub: #A1A1A6;
      --text-muted: #6E6E73;
      --bg-primary: #0A0A0C;
      --bg-secondary: #1C1C1E;
      --glass-bg: rgba(44, 44, 46, 0.65);
      --glass-border: transparent;
      --glass-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
      --card-bg: rgba(44, 44, 46, 0.65);
      --icon-bg: rgba(60, 60, 66, 0.7);
      --status-color: #F5F5F7;
      --toast-bg: rgba(60, 60, 66, 0.85);
      --viewer-bg: rgba(0, 0, 0, 0.92);
      --plate-bg: linear-gradient(135deg, #2E8B57, #1E6B3A);
      --name-gradient: linear-gradient(90deg, #FF7A9E, #D86A8A, #6A9EFF, #FF7A9E);
      --sub-gradient: linear-gradient(90deg, #FF8AAF, #7AA5FF);
      --liquid-gradient: radial-gradient(ellipse at 15% 10%, rgba(60, 100, 200, 0.25), transparent 55%),
        radial-gradient(ellipse at 85% 20%, rgba(180, 100, 140, 0.20), transparent 55%),
        radial-gradient(ellipse at 20% 85%, rgba(70, 180, 150, 0.18), transparent 55%),
        radial-gradient(ellipse at 80% 88%, rgba(130, 110, 200, 0.22), transparent 55%);
      --border-light: transparent;
      --island-bg: #1C1C1E;
      --island-text: #fff;
      --popup-overlay: rgba(0, 0, 0, 0.92);
      --glow-color: #00D4FF;
    }
    html.light-mode {
      --text-main: #1C1C1E;
      --text-sub: #3A3A3C;
      --text-muted: #8E8E93;
      --bg-primary: #F2F2F7;
      --bg-secondary: #FFFFFF;
      --glass-bg: rgba(255, 255, 255, 0.48);
      --glass-border: rgba(255, 255, 255, 0.60);
      --glass-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
      --card-bg: rgba(255, 255, 255, 0.48);
      --icon-bg: rgba(255, 255, 255, 0.7);
      --status-color: #1C1C1E;
      --toast-bg: rgba(20, 22, 28, 0.78);
      --viewer-bg: rgba(0, 0, 0, 0.85);
      --plate-bg: linear-gradient(135deg, #34C759, #28A745);
      --name-gradient: linear-gradient(90deg, #FF5C93, #C84870, #4A8DFF, #FF5C93);
      --sub-gradient: linear-gradient(90deg, #FF6D9C, #558EFF);
      --liquid-gradient: radial-gradient(ellipse at 15% 10%, rgba(120, 170, 255, 0.30), transparent 55%),
        radial-gradient(ellipse at 85% 20%, rgba(255, 160, 200, 0.25), transparent 55%),
        radial-gradient(ellipse at 20% 85%, rgba(110, 230, 200, 0.22), transparent 55%),
        radial-gradient(ellipse at 80% 88%, rgba(190, 160, 255, 0.28), transparent 55%);
      --border-light: rgba(255, 255, 255, 0.5);
      --island-bg: #000;
      --island-text: #fff;
      --popup-overlay: rgba(0, 0, 0, 0.85);
      --glow-color: #FF2E63;
    }

    html {
      width: 100%;
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      transition: background-color 0.3s ease, color 0.3s ease;
      will-change: background-color, color;
    }

    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
      background: var(--bg-primary);
      -webkit-touch-callout: none;
      overscroll-behavior: none;
      user-select: none;
      margin: 0;
      padding: 0;
      color: var(--text-main);
      transition: background-color 0.3s ease, color 0.3s ease;
      will-change: background-color, color;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button,
    img,
    video {
      -webkit-user-drag: none;
      user-select: none;
    }
    button {
      font: inherit;
      cursor: pointer;
      background: none;
      border: none;
      outline: none;
    }

    /* ===== 背景 ===== */
    .liquid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateZ(0);
    }
    .liquid-gradient {
      position: absolute;
      width: 140vw;
      height: 140vh;
      top: -20vh;
      left: -20vw;
      background: var(--liquid-gradient);
      animation: liquidFlow 22s ease-in-out infinite alternate;
      filter: blur(72px);
      -webkit-filter: blur(72px);
      transition: background 0.6s ease;
      will-change: transform;
      transform: translateZ(0);
    }
    @keyframes liquidFlow {
      0% {
        transform: translate(0, 0) rotate(0deg) scale(1.03);
      }
      50% {
        transform: translate(40px, -30px) rotate(4deg) scale(1.08);
      }
      100% {
        transform: translate(-30px, 40px) rotate(-4deg) scale(1.03);
      }
    }

    /* ===== 樱花 ===== */
    .sakura-container {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
      overflow: hidden;
      transform: translateZ(0);
    }
    .sakura {
      position: absolute;
      background: #ffc8d8;
      border-radius: 50% 0 50% 50%;
      opacity: 0.72;
      will-change: transform, opacity;
      transform: translateZ(0);
      box-shadow: 0 2px 6px rgba(255, 180, 200, 0.3);
      transition: opacity 0.3s ease;
    }
    @keyframes sakuraFall {
      0% {
        transform: translateY(0) rotate(0deg) translateX(0px);
        opacity: 0.9;
      }
      30% {
        transform: translateY(30vh) rotate(240deg) translateX(20px);
      }
      70% {
        transform: translateY(70vh) rotate(520deg) translateX(-20px);
      }
      100% {
        transform: translateY(105vh) rotate(720deg) translateX(0px);
        opacity: 0;
      }
    }

    /* ===== 页面入场 ===== */
    @keyframes pageSpringIn {
      from {
        opacity: 0;
        transform: translateY(14px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    @keyframes cardSpringIn {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ===== 主容器 ===== */
    .app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 470px;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 16px 16px 20px;
      position: relative;
      z-index: 2;
      animation: pageSpringIn .75s var(--spring) both;
      gap: 12px;
    }

    /* ===== 状态栏 ===== */
    .status-bar-container {
      width: 100%;
      flex-shrink: 0;
      padding: calc(var(--safe-top) + 4px) 0 6px;
      background: transparent;
      transition: color 0.3s ease;
    }

    .ios-status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--status-color);
      transition: color 0.3s ease;
      min-height: 40px;
    }
    .ios-status-left {
      flex: 1;
      text-align: left;
      font-weight: 600;
      letter-spacing: 0.3px;
      font-variant-numeric: tabular-nums;
      font-size: 15px;
    }

    /* ===== 灵动岛 ===== */
    .dynamic-island {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 34px;
      padding: 0 16px;
      min-width: 56px;
      background: var(--island-bg);
      border-radius: 20px;
      color: var(--island-text);
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.2px;
      position: relative;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 0.5px solid rgba(255, 255, 255, 0.08);
      flex-shrink: 0;
      margin: 0 8px;
      overflow: hidden;
      transition: width 0.4s var(--ease), padding 0.4s var(--ease);
      width: auto;
      pointer-events: none;
    }
    .dynamic-island::before {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 30px;
      background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
      opacity: 0.2;
      z-index: -1;
      filter: blur(16px);
      transition: background 0.6s ease, opacity 0.4s ease;
      animation: islandPulse 2.4s ease-in-out infinite alternate;
    }
    @keyframes islandPulse {
      0% {
        transform: scale(0.92);
        opacity: 0.12;
      }
      100% {
        transform: scale(1.12);
        opacity: 0.3;
      }
    }
    .dynamic-island::after {
      content: '';
      position: absolute;
      inset: -1.5px;
      border-radius: 22px;
      padding: 1.5px;
      background: var(--glow-color);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      transition: background 0.6s ease;
      opacity: 0.5;
      animation: borderPulse 2s ease-in-out infinite alternate;
    }
    @keyframes borderPulse {
      0% {
        opacity: 0.3;
      }
      100% {
        opacity: 0.7;
      }
    }

    .island-text-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      overflow: hidden;
      white-space: nowrap;
    }
    .island-text-scroll {
      display: inline-block;
      text-align: center;
      font-weight: 600;
      font-size: 12px;
      background: linear-gradient(90deg, #FF6B9E, #FFD966, #6AA9FF, #FF6B9E);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: textShine 4s ease-in-out infinite;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .island-text-scroll.rolling {
      animation: textRoll 0.6s var(--spring) forwards, textShine 4s ease-in-out infinite;
    }
    @keyframes textRoll {
      0% {
        transform: translateY(100%);
        opacity: 0;
      }
      30% {
        opacity: 1;
      }
      100% {
        transform: translateY(0%);
        opacity: 1;
      }
    }
    @keyframes textShine {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .ios-status-right {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
    }
    .signal-icon {
      width: 18px;
      height: 12px;
      fill: var(--status-color);
      transition: fill 0.3s ease;
      flex-shrink: 0;
    }

    /* ===== 视频卡片 ===== */
    .video-player-container {
      width: 100%;
      flex-shrink: 0;
      border-radius: 28px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      background: #0A0A0C;
      animation: cardSpringIn .7s var(--ease) 0.14s both;
    }
    html.dark-mode .video-player-container {
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }
    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0A0A0C;
      overflow: hidden;
    }
    .video-box video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      -webkit-object-fit: cover;
      background: #0A0A0C;
    }

    .video-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 12px 14px 14px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.65));
      z-index: 3;
      opacity: 1;
      transition: opacity 0.35s ease;
      pointer-events: auto;
    }
    .video-controls.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .progress-track {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 99px;
      cursor: pointer;
      margin-bottom: 10px;
      transition: height 0.15s;
    }
    .progress-track:hover {
      height: 5px;
    }
    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: #fff;
      width: 0%;
      transition: width 0.1s linear;
    }

    .controls-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .controls-row button {
      color: #fff;
      font-size: 17px;
      padding: 4px;
      opacity: 0.85;
      transition: opacity 0.2s;
    }
    .controls-row button:active {
      opacity: 0.5;
    }
    .controls-time {
      margin-left: auto;
      color: #fff;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-expand {
      color: #fff;
      font-size: 14px;
      padding: 4px;
      opacity: 0.85;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-expand:active {
      opacity: 0.5;
      transform: scale(0.88);
    }

    /* ===== 主卡片 ===== */
    .main-card-container {
      width: 100%;
      flex-shrink: 0;
      animation: cardSpringIn .7s var(--ease) 0.20s both;
    }
    .main-card {
      width: 100%;
      padding: 24px 18px 26px;
      border-radius: 28px;
      background: var(--bg-secondary);
      border: 0.5px solid var(--glass-border);
      box-shadow: var(--glass-shadow), inset 0 0.5px 0 rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      overflow: hidden;
      transition: background 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
      transform: translateZ(0);
    }
    html.dark-mode .main-card {
      border-color: rgba(255, 255, 255, 0.06);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    /* ===== Profile Row ===== */
    .profile-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 14px;
      width: 100%;
      flex-shrink: 0;
    }
    .profile-left {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== Avatar ===== */
    .avatar {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      margin-bottom: 10px;
      cursor: zoom-in;
      flex-shrink: 0;
      isolation: isolate;
    }
    .avatar::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background: var(--glow-color);
      opacity: 0.15;
      filter: blur(16px);
      z-index: -1;
      transition: background 0.6s ease, opacity 0.4s;
      animation: avatarPulse 2.4s ease-in-out infinite alternate;
    }
    @keyframes avatarPulse {
      0% {
        transform: scale(0.92);
        opacity: 0.1;
      }
      100% {
        transform: scale(1.12);
        opacity: 0.25;
      }
    }
    .avatar::before {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--glow-color), #FFD046, #00D4FF, #7B61FF, var(--glow-color));
      animation: avatarRotate 3s linear infinite;
      filter: blur(2px);
      z-index: -1;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      padding: 2px;
    }
    @keyframes avatarRotate {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s var(--spring), filter 0.2s;
      position: relative;
      z-index: 1;
    }
    .avatar:active img {
      transform: scale(0.92);
    }

    .plate {
      padding: 4px 14px;
      border-radius: 6px;
      background: var(--plate-bg);
      color: var(--plate-text);
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1.6px;
      box-shadow: 0 4px 12px rgba(52, 199, 89, 0.25);
      border: 0.5px solid rgba(255, 255, 255, 0.3);
      cursor: pointer;
      transition: transform 0.18s var(--spring);
    }
    .plate:active {
      transform: scale(0.93);
    }

    .name {
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      margin-top: 6px;
      background: var(--name-gradient);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: textGradient 8s ease-in-out infinite;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @keyframes textGradient {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }

    .subtitle {
      font-size: 11px;
      font-weight: 600;
      text-align: center;
      margin-top: 3px;
      background: var(--sub-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.5;
    }

    /* ===== 右侧图片 ===== */
    .plate-photo {
      width: 100px;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
      cursor: zoom-in;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
      transition: transform 0.2s var(--spring);
      position: relative;
    }
    .plate-photo:active {
      transform: scale(0.93);
    }
    .plate-photo img {
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      -webkit-object-fit: cover;
      display: block;
    }

    /* ===== APP宫格 ===== */
    .apps-scroll-wrapper {
      width: 100%;
      overflow: hidden;
      position: relative;
      margin-top: 22px;
    }
    .apps-track {
      display: flex;
      transition: transform 0.4s var(--ease);
      will-change: transform;
    }
    .apps-page {
      flex: 0 0 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px 8px;
      padding: 0 2px;
      min-height: 120px;
      -webkit-user-select: none;
      user-select: none;
    }
    .apps-page[data-page="1"] {
      display: none;
    }

    .app-button {
      --icon-color: #007AFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      border: none;
      background: transparent;
      cursor: pointer;
      touch-action: manipulation;

      function createSakura() {
        const el = document.createElement("div");
        el.className = "sakura";
        const size = Math.random() * 10 + 4;
        el.style.width = size + "px";
        el.style.height = size + "px";
        const rect = mainCard.getBoundingClientRect();
        el.style.left = (rect.left + Math.random() * rect.width) + "px";
        el.style.top = (rect.top - 20 + Math.random() * 20) + "px";
        const dur = Math.random() * 6 + 5;
        el.style.animation = `sakuraFall ${dur}s linear forwards`;
        sakuraBox.appendChild(el);
        setTimeout(() => { if (el.parentNode) el.remove(); }, dur * 1000 + 200);
      }

        return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
      }

          hideControlTimer = setTimeout(() => {
            videoControls.classList.add("hidden");
          }, HIDE_DELAY);
        }
      }

      function prevVideo() {
        if (videoList.length === 0) return;
        currentVideoIndex = (currentVideoIndex - 1 + videoList.length) % videoList.length;
        const src = videoList[currentVideoIndex];
        mainVideo.src = src;
        progressFill.style.width = '0%';
        curTime.textContent = '00:00';
        mainVideo.play().catch(() => showToastMsg("请手动播放"));
        popupVideo.src = src;
        showControls();
      }

      function nextVideo() {
        if (videoList.length === 0) return;
        currentVideoIndex = (currentVideoIndex + 1) % videoList.length;
        const src = videoList[currentVideoIndex];
        mainVideo.src = src;
        progressFill.style.width = '0%';
        curTime.textContent = '00:00';
        mainVideo.play().catch(() => showToastMsg("请手动播放"));
        popupVideo.src = src;
        showControls();
      }

      function updateMuteIcon() {
        if (mainVideo.muted || mainVideo.volume <= 0) {
          videoMuteBtn.innerHTML = `<i class="fa-solid fa-volume-xmark"></i>`;
        } else if (mainVideo.volume < 0.5) {
          videoMuteBtn.innerHTML = `<i class="fa-solid fa-volume-low"></i>`;
        } else {
          videoMuteBtn.innerHTML = `<i class="fa-solid fa-volume-high"></i>`;
        }
      }

      // ============================================================
      // 弹出播放器
      // ============================================================
      function togglePopupControls() {
        popupControlsVisible = !popupControlsVisible;
        popupControls.classList.toggle("hidden", !popupControlsVisible);
        popupClose.classList.toggle("hidden", !popupControlsVisible);
        clearTimeout(popupHideTimer);
      }

      function openPopup() {
        const src = mainVideo.src;
        if (!src) return;
        popupVideo.src = src;
        popupVideo.currentTime = mainVideo.currentTime;
        mainVideo.muted = true;
        if (!mainVideo.paused) {
          popupVideo.play().catch(() => {});
        } else {
          popupVideo.pause();
        }
        videoPopup.classList.add('active');
        document.body.style.overflow = 'hidden';
        popupMuteBtn.innerHTML = popupVideo.muted ? `<i class="fa-solid fa-volume-xmark"></i>` :
          `<i class="fa-solid fa-volume-high"></i>`;
        popupTotTime.textContent = formatTime(popupVideo.duration);
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      }

      function closePopup() {
        videoPopup.classList.remove('active');
        document.body.style.overflow = '';
        mainVideo.muted = false;
        if (!popupVideo.paused) {
          mainVideo.currentTime = popupVideo.currentTime;
          mainVideo.play().catch(() => {});
        }
        popupVideo.pause();
        popupVideo.src = '';
        updateMuteIcon();
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        popupControlsVisible = true;
        clearTimeout(popupHideTimer);
      }

      // ============================================================
      // 图片查看器 - 自动轮播功能 (无指示器)
      // ============================================================
      function startViewerAutoPlay() {
        stopViewerAutoPlay();
        if (!viewerGallery || viewerGallery.length <= 1) return;
        viewerAutoPlayTimer = setInterval(() => {
          if (isViewerInteracting) return;
          viewerGalleryIndex = (viewerGalleryIndex + 1) % viewerGallery.length;
          viewerImg.src = viewerGallery[viewerGalleryIndex];
        }, 3000);
      }

      function stopViewerAutoPlay() {
        if (viewerAutoPlayTimer) {
          clearInterval(viewerAutoPlayTimer);
          viewerAutoPlayTimer = null;
        }
      }

      function resetViewerAutoPlay() {
        stopViewerAutoPlay();
        if (viewer.classList.contains('show') && viewerGallery && viewerGallery.length > 1) {
          startViewerAutoPlay();
        }
      }

      function openViewer(gallery, idx, alt) {
        if (!gallery || gallery.length === 0) return;
        stopViewerAutoPlay();

        viewerGallery = gallery;
        viewerGalleryIndex = idx;
        viewerImg.src = viewerGallery[viewerGalleryIndex];
        viewerImg.alt = alt || "原图";
        viewer.classList.add("show");
        document.body.style.overflow = "hidden";
        viewerHint.textContent = '左右滑动切换 · 长按保存';

        if (viewerGallery.length > 1) {
          setTimeout(() => {
            if (viewer.classList.contains('show')) {
              startViewerAutoPlay();
            }
          }, 1500);
        }

        isViewerInteracting = false;
      }

      function closeViewer() {
        stopViewerAutoPlay();
        viewer.classList.remove("show");
        document.body.style.overflow = "";
        isViewerInteracting = false;
        setTimeout(() => {
          if (!viewer.classList.contains("show")) {
            viewerImg.src = "";
          }
        }, 280);
      }

      function viewerPrev() {
        if (!viewerGallery || viewerGallery.length === 0) return;
        isViewerInteracting = true;
        viewerGalleryIndex = (viewerGalleryIndex - 1 + viewerGallery.length) % viewerGallery.length;
        viewerImg.src = viewerGallery[viewerGalleryIndex];
        resetViewerAutoPlay();
        setTimeout(() => { isViewerInteracting = false; }, 300);
      }

      function viewerNext() {
        if (!viewerGallery || viewerGallery.length === 0) return;
        isViewerInteracting = true;
        viewerGalleryIndex = (viewerGalleryIndex + 1) % viewerGallery.length;
        viewerImg.src = viewerGallery[viewerGalleryIndex];
        resetViewerAutoPlay();
        setTimeout(() => { isViewerInteracting = false; }, 300);
      }

      // ============================================================
      // 事件绑定
      // ============================================================

      // 主视频
      videoCard.addEventListener("click", e => {
        if (e.target.closest(".video-controls") || e.target.closest(".btn-expand")) return;
        e.stopPropagation();
        toggleVideo();
      });

      videoBox.addEventListener("touchstart", showControls);
      videoBox.addEventListener("touchmove", showControls);
      videoBox.addEventListener("mousemove", showControls);

      videoPlayBtn.onclick = (e) => { e.stopPropagation();
        toggleVideo(); };
      videoPrevBtn.onclick = (e) => { e.stopPropagation();
        prevVideo(); };
      videoNextBtn.onclick = (e) => { e.stopPropagation();
        nextVideo(); };
      expandBtn.onclick = (e) => { e.stopPropagation();
        openPopup(); };

      // 音量
      let volDrag = false,
        volStartY = 0,
        volStartVal = 0;
      videoMuteBtn.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        volDrag = true;
        volStartY = e.touches[0].clientY;
        volStartVal = mainVideo.volume;
      }, { passive: true });
      videoMuteBtn.addEventListener('touchmove', (e) => {
        if (!volDrag) return;
        e.preventDefault();
        const dy = volStartY - e.touches[0].clientY;
        let v = Math.max(0, Math.min(1, volStartVal + dy / 800));
        mainVideo.volume = v;
        updateMuteIcon();
      }, { passive: false });
      videoMuteBtn.addEventListener('touchend', () => { volDrag = false; });
      videoMuteBtn.addEventListener('touchcancel', () => { volDrag = false; });
      videoMuteBtn.onclick = (e) => {
        if (volDrag) return;
        e.stopPropagation();
        mainVideo.muted = !mainVideo.muted;
        updateMuteIcon();
        showControls();
      };

      mainVideo.addEventListener('loadedmetadata', () => {
        totTime.textContent = formatTime(mainVideo.duration);
        if (mainVideo.currentTime > 0) {
          const p = (mainVideo.currentTime / mainVideo.duration) * 100;
          progressFill.style.width = p + "%";
          curTime.textContent = formatTime(mainVideo.currentTime);
        }
      });

      mainVideo.addEventListener('timeupdate', () => {
        if (mainVideo.duration > 0) {
          const p = (mainVideo.currentTime / mainVideo.duration) * 100;
          progressFill.style.width = p + "%";
          curTime.textContent = formatTime(mainVideo.currentTime);
        }
      });

      progressTrack.addEventListener("click", (e) => {
        const rect = progressTrack.getBoundingClientRect();
        const r = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        mainVideo.currentTime = r * mainVideo.duration;
        showControls();
      });

      mainVideo.addEventListener("play", () => {
        videoPlayBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
        showControls();
        if (videoPopup.classList.contains('active') && popupVideo.src === mainVideo.src) {
          popupVideo.play().catch(() => {});
        }
      });

      mainVideo.addEventListener("pause", () => {
        videoPlayBtn.innerHTML = `<i class="fa-solid fa-play"></i>`;
        videoControls.classList.remove("hidden");
        clearTimeout(hideControlTimer);
        if (videoPopup.classList.contains('active') && popupVideo.src === mainVideo.src) {
          popupVideo.pause();
        }
      });

      mainVideo.addEventListener("ended", () => {
        nextVideo();
      });

      // ============================================================
      // 弹出播放器事件
      // ============================================================
      popupVideo.removeAttribute('loop');
      popupVideo.addEventListener('ended', () => {
        if (videoList.length > 0) {
          currentVideoIndex = (currentVideoIndex + 1) % videoList.length;
          const src = videoList[currentVideoIndex];
          mainVideo.src = src;
          popupVideo.src = src;
          popupVideo.play().catch(() => {});
          mainVideo.play().catch(() => {});
          mainVideo.muted = true;
          progressFill.style.width = '0%';
          curTime.textContent = '00:00';
          popupControlsVisible = true;
          popupControls.classList.remove("hidden");
          popupClose.classList.remove("hidden");
          clearTimeout(popupHideTimer);
          popupHideTimer = setTimeout(() => {
            popupControls.classList.add("hidden");
            popupClose.classList.add("hidden");
            popupControlsVisible = false;
          }, POPUP_HIDE_DELAY);
        }
      });

      popupVideo.addEventListener('click', (e) => { e.stopPropagation();
        togglePopupControls(); });
      popupClose.addEventListener('click', (e) => { e.stopPropagation();
        closePopup(); });
      videoPopup.addEventListener('click', (e) => {
        if (e.target === videoPopup && popupControlsVisible) {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
          clearTimeout(popupHideTimer);
        }
      });

      popupPlayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (popupVideo.paused) popupVideo.play().catch(() => {});
        else popupVideo.pause();
        if (!popupVideo.paused) {
          mainVideo.currentTime = popupVideo.currentTime;
          mainVideo.play().catch(() => {});
          mainVideo.muted = true;
        } else {
          mainVideo.pause();
        }
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      popupPrevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (videoList.length === 0) return;
        currentVideoIndex = (currentVideoIndex - 1 + videoList.length) % videoList.length;
        const src = videoList[currentVideoIndex];
        mainVideo.src = src;
        popupVideo.src = src;
        popupVideo.play().catch(() => {});
        mainVideo.muted = true;
        progressFill.style.width = '0%';
        curTime.textContent = '00:00';
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      popupNextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (videoList.length === 0) return;
        currentVideoIndex = (currentVideoIndex + 1) % videoList.length;
        const src = videoList[currentVideoIndex];
        mainVideo.src = src;
        popupVideo.src = src;
        popupVideo.play().catch(() => {});
        mainVideo.muted = true;
        progressFill.style.width = '0%';
        curTime.textContent = '00:00';
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      popupMuteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        popupVideo.muted = !popupVideo.muted;
        popupMuteBtn.innerHTML = popupVideo.muted ? `<i class="fa-solid fa-volume-xmark"></i>` :
          `<i class="fa-solid fa-volume-high"></i>`;
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      popupVideo.addEventListener('loadedmetadata', () => {
        popupTotTime.textContent = formatTime(popupVideo.duration);
      });
      popupVideo.addEventListener('timeupdate', () => {
        const p = (popupVideo.currentTime / popupVideo.duration) * 100;
        popupProgressBar.style.width = p + "%";
        popupCurTime.textContent = formatTime(popupVideo.currentTime);
        if (!popupVideo.paused) {
          mainVideo.currentTime = popupVideo.currentTime;
        }
      });
      popupProgressWrap.addEventListener('click', (e) => {
        const rect = popupProgressWrap.getBoundingClientRect();
        const r = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        popupVideo.currentTime = r * popupVideo.duration;
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      popupVideo.addEventListener('play', () => {
        popupPlayBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
        mainVideo.currentTime = popupVideo.currentTime;
        mainVideo.play().catch(() => {});
        mainVideo.muted = true;
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });
      popupVideo.addEventListener('pause', () => {
        popupPlayBtn.innerHTML = `<i class="fa-solid fa-play"></i>`;
        mainVideo.pause();
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      // ============================================================
      // 图片查看器事件绑定
      // ============================================================
      let vStartX = 0,
        vStartY = 0,
        vIsHoriz = null;
      viewer.addEventListener("touchstart", (e) => {
        isViewerInteracting = true;
        vStartX = e.touches[0].clientX;
        vStartY = e.touches[0].clientY;
        vIsHoriz = null;
      }, { passive: true });

      viewer.addEventListener("touchmove", (e) => {
        if (!viewer.classList.contains('show')) return;
        const dx = e.touches[0].clientX - vStartX;
        const dy = e.touches[0].clientY - vStartY;
        if (vIsHoriz === null) {
          vIsHoriz = Math.abs(dx) > Math.abs(dy);
        }
        if (vIsHoriz) {
          e.preventDefault();
        }
      }, { passive: false });

      viewer.addEventListener("touchend", (e) => {
        if (!viewer.classList.contains('show')) return;
        const dx = e.changedTouches[0].clientX - vStartX;
        if (Math.abs(dx) > 50) {
          if (dx > 0) viewerNext();
          else viewerPrev();
        }
        setTimeout(() => {
          isViewerInteracting = false;
          resetViewerAutoPlay();
        }, 500);
      }, { passive: true });

      viewer.addEventListener('wheel', (e) => {
        if (!viewer.classList.contains('show')) return;
        e.preventDefault();
        if (e.deltaX > 30 || e.deltaY > 30) {
          viewerNext();
        } else if (e.deltaX < -30 || e.deltaY < -30) {
          viewerPrev();
        }
        resetViewerAutoPlay();
      }, { passive: false });

      document.addEventListener('keydown', (e) => {
        if (!viewer.classList.contains('show')) return;
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          viewerPrev();
          resetViewerAutoPlay();
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          viewerNext();
          resetViewerAutoPlay();
        } else if (e.key === 'Escape') {
          closeViewer();
        }
      });

      $("#avatar").addEventListener("click", (e) => {
        e.stopPropagation();
        openViewer(avatarImages, avatarIndex, "头像原图");
      });
      $("#platePhoto").addEventListener("click", (e) => {
        e.stopPropagation();
        openViewer(slideImages, slideIndex, "图片原图");
      });

      viewerClose.addEventListener("click", closeViewer);
      viewer.addEventListener("click", (e) => {
        if (e.target === viewer) closeViewer();
      });

      // 长按保存
      let lpTimer = null;
      viewerImg.addEventListener('touchstart', () => {
        lpTimer = setTimeout(() => {
          const a = document.createElement('a');
          a.href = viewerImg.src;
          a.download = 'preview-image';
          document.body.appendChild(a);
          a.click();
          a.remove();
          showToastMsg("开始下载图片");
        }, 600);
      }, { passive: true });
      viewerImg.addEventListener('touchend', () => { clearTimeout(lpTimer); });
      viewerImg.addEventListener('touchcancel', () => { clearTimeout(lpTimer); });

      // ============================================================
      // APP跳转
      // ============================================================
      function jumpToApp(key) {
        if (isJumping) return;
        const config = APP_CONFIG[key];
        if (!config) return;
        const item = document.querySelector(`[data-app="${key}"]`);
        if (!item || item.classList.contains("loading")) return;

        isJumping = true;
        jumpOverlay.classList.add('active');

        item.classList.add("loading");
        const orig = item.innerHTML;
        item.innerHTML =
          `<div class="app-icon-wrap"><i class="fa-solid fa-spinner fa-spin"></i></div><span class="app-label">打开中</span>`;

        let unloaded = false;
        const onUnload = () => { unloaded = true;
          isJumping = false;
          window.removeEventListener('beforeunload', onUnload);
          document.removeEventListener('visibilitychange', onVis); };
        const onVis = () => {
          if (!document.hidden && !unloaded) {
            jumpOverlay.classList.remove('active');
            if (document.body.contains(item)) { item.classList.remove("loading");
              item.innerHTML = orig; }
            isJumping = false;
            window.removeEventListener('beforeunload', onUnload);
            document.removeEventListener('visibilitychange', onVis);
          }
        };
        window.addEventListener('beforeunload', onUnload);
        document.addEventListener('visibilitychange', onVis);

        try {
          const win = window.open(config.scheme, '_blank');
          if (!win || win.closed) window.location.href = config.scheme;
        } catch (e) {
          jumpOverlay.classList.remove('active');
          item.classList.remove("loading");
          item.innerHTML = orig;
          isJumping = false;
          window.removeEventListener('beforeunload', onUnload);
          document.removeEventListener('visibilitychange', onVis);
          return;
        }

        setTimeout(() => {
          if (!unloaded && isJumping) {
            jumpOverlay.classList.remove('active');
            if (document.body.contains(item)) { item.classList.remove("loading");
              item.innerHTML = orig; }
            isJumping = false;
            window.removeEventListener('beforeunload', onUnload);
            document.removeEventListener('visibilitychange', onVis);
          }
        }, 2800);
      }

      $$(".app-button").forEach(el => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          jumpToApp(el.dataset.app);
        });
      });

      // ============================================================
      // 复制车牌
      // ============================================================
      $("#plate").addEventListener("click", async (e) => {
        e.stopPropagation();
        const txt = "苏FA36165";
        try { await navigator.clipboard.writeText(txt); } catch {
          const inp = document.createElement("input");
          inp.value = txt;
          inp.style.cssText = "position:fixed;opacity:0;";
          document.body.appendChild(inp);
          inp.select();
          document.execCommand("copy");
          inp.remove();
        }
        showToastMsg("车牌号已复制");
      });

      // ============================================================
      // 点击弹字
      // ============================================================
      const clickTexts = ["苏FA36165", "Xiaomi SU7 Pro", "刘茜美子"];
      document.body.addEventListener("click", (e) => {
        if (e.target.closest(".app-button") || e.target.closest(".viewer") ||
          e.target.closest("#plate") || e.target.closest(".video-controls") ||
          e.target.closest(".video-popup") || e.target.closest(".btn-expand") ||
          e.target.closest(".dynamic-island") || e.target.closest(".app-icon-wrap")) return;
        const txt = clickTexts[Math.floor(Math.random() * clickTexts.length)];
        const el = document.createElement("div");
        el.className = "click-text-item";
        el.textContent = txt;
        el.style.left = e.clientX + "px";
        el.style.top = e.clientY + "px";
        document.body.appendChild(el);
        setTimeout(() => { if (el.parentNode) el.remove(); }, 4500);
      });

      // ============================================================
      // 状态栏时间
      // ============================================================
      function updateTime() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, "0");
        const m = String(now.getMinutes()).padStart(2, "0");
        $("#statusTime").textContent = h + ":" + m;
      }
      updateTime();
      setInterval(updateTime, 1000);

      // ============================================================
      // 深色模式
      // ============================================================
      function applyTheme() {
        const h = new Date().getHours();
        const dark = (h >= 19 || h < 7);
        const html = document.documentElement;
        html.classList.toggle('dark-mode', dark);
        html.classList.toggle('light-mode', !dark);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#0A0A0C' : '#EEF2FA');
      }
      applyTheme();
      setInterval(applyTheme, 600000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) applyTheme(); });

      // ============================================================
      // 启动
      // ============================================================
      setTimeout(showControls, 500);

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) ensureSakura();
      });

      window.addEventListener('beforeunload', () => {
        if (glowInterval) clearInterval(glowInterval);
        if (sakuraInterval) clearInterval(sakuraInterval);
        if (textRollInterval) clearInterval(textRollInterval);
        if (avatarTimer) clearInterval(avatarTimer);
        if (slideTimer) clearInterval(slideTimer);
        stopViewerAutoPlay();
      });
    })();
  </script>
</body>
</html>
