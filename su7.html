<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0A0A0C">
  <meta name="color-scheme" content="dark">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>苏FA36165 · 快速启动</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ===== 全局重置 ===== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --text-main: #F5F5F7;
      --text-sub: #A1A1A6;
      --text-muted: #6E6E73;
      --bg-primary: #0A0A0C;
      --bg-secondary: rgba(20, 20, 24, 0.75);
      --glass-bg: rgba(44, 44, 46, 0.45);
      --glass-border: rgba(255, 255, 255, 0.06);
      --glass-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      --icon-bg: rgba(60, 60, 66, 0.5);
      --status-color: #F5F5F7;
      --toast-bg: rgba(60, 60, 66, 0.85);
      --viewer-bg: rgba(0, 0, 0, 0.92);
      --plate-text: #fff;
      --plate-bg: linear-gradient(135deg, #00D4FF, #7B61FF);
      --name-gradient: linear-gradient(90deg, #FF7A9E, #D86A8A, #6A9EFF, #FF7A9E);
      --sub-gradient: linear-gradient(90deg, #FF8AAF, #7AA5FF);
      --liquid-gradient: radial-gradient(ellipse at 15% 10%, rgba(60, 100, 200, 0.25), transparent 55%),
        radial-gradient(ellipse at 85% 20%, rgba(180, 100, 140, 0.20), transparent 55%),
        radial-gradient(ellipse at 20% 85%, rgba(70, 180, 150, 0.18), transparent 55%),
        radial-gradient(ellipse at 80% 88%, rgba(130, 110, 200, 0.22), transparent 55%);
      --border-light: transparent;
      --island-bg: rgba(20, 20, 24, 0.8);
      --island-text: #fff;
      --popup-overlay: rgba(0, 0, 0, 0.92);
      --glow-color: #00D4FF;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    html {
      width: 100%;
      min-height: 100%;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      background-color: #0A0A0C;
    }
    body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
      background: #0A0A0C;
      -webkit-touch-callout: none;
      overscroll-behavior: none;
      user-select: none;
      margin: 0;
      padding: 0;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-overflow-scrolling: touch;
    }
    button, img, video { -webkit-user-drag: none; user-select: none; }
    button { font: inherit; cursor: pointer; background: none; border: none; outline: none; }

    /* ===== 背景 ===== */
    .liquid-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
      transform: translateZ(0);
    }
    .liquid-gradient {
      position: absolute;
      width: 120vw;
      height: 120vh;
      top: -10vh;
      left: -10vw;
      background: var(--liquid-gradient);
      filter: blur(60px);
      -webkit-filter: blur(60px);
      will-change: transform;
      transform: translateZ(0);
      animation: liquidFlow 18s ease-in-out infinite alternate;
    }
    @keyframes liquidFlow {
      0% { transform: translate(0, 0) rotate(0deg) scale(1.02); }
      100% { transform: translate(-20px, 20px) rotate(-3deg) scale(1.02); }
    }

    /* ===== 樱花 ===== */
    .sakura-container {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;
      overflow: hidden;
      transform: translateZ(0);
    }
    .sakura {
      position: absolute;
      background: rgba(255, 200, 216, 0.35);
      border-radius: 50% 0 50% 50%;
      opacity: 0.5;
      will-change: transform;
      transform: translateZ(0);
    }
    @keyframes sakuraFall {
      0% { transform: translateY(0) rotate(0deg) translateX(0px); opacity: 0.6; }
      100% { transform: translateY(105vh) rotate(720deg) translateX(0px); opacity: 0; }
    }

    /* ===== 页面入场 ===== */
    @keyframes pageSpringIn {
      from { opacity: 0; transform: translateY(16px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes cardSpringIn {
      from { opacity: 0; transform: translateY(18px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ===== 主容器 ===== */
    .app-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 470px;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 12px 16px 16px;
      position: relative;
      z-index: 2;
      animation: pageSpringIn .7s var(--spring) both;
      gap: 12px;
    }

    /* ===== 状态栏 ===== */
    .status-bar-container {
      width: 100%;
      flex-shrink: 0;
      padding: calc(var(--safe-top) + 2px) 0 4px;
    }
    .ios-status-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--status-color);
      min-height: 36px;
    }
    .ios-status-left {
      flex: 1;
      text-align: left;
      font-weight: 600;
      letter-spacing: 0.2px;
      font-size: 14px;
    }
    .dynamic-island {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 30px;
      padding: 0 14px;
      min-width: 50px;
      background: rgba(20, 20, 24, 0.8);
      border-radius: 18px;
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 0.5px solid rgba(255,255,255,0.06);
      flex-shrink: 0;
      margin: 0 6px;
      overflow: hidden;
      pointer-events: none;
    }
    .dynamic-island::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 26px;
      background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
      opacity: 0.15;
      z-index: -1;
      filter: blur(12px);
      animation: islandPulse 2.8s ease-in-out infinite alternate;
    }
    @keyframes islandPulse {
      0% { transform: scale(0.94); opacity: 0.10; }
      100% { transform: scale(1.10); opacity: 0.22; }
    }
    .island-text-scroll {
      display: inline-block;
      font-weight: 600;
      font-size: 11px;
      background: linear-gradient(90deg, #FF6B9E, #FFD966, #6AA9FF, #FF6B9E);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: textShine 5s ease-in-out infinite;
      white-space: nowrap;
    }
    @keyframes textShine {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .ios-status-right {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 3px;
    }
    .signal-icon {
      width: 16px;
      height: 11px;
      fill: var(--status-color);
      flex-shrink: 0;
    }

    /* ===== 视频卡片 ===== */
    .video-player-container {
      width: 100%;
      flex-shrink: 0;
      border-radius: 24px;
      overflow: hidden;
      background: #0A0A0C;
      animation: cardSpringIn .6s var(--ease) 0.12s both;
      border: 0.5px solid rgba(255,255,255,0.04);
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
      will-change: transform;
      position: relative;
    }
    .video-box {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #0A0A0C;
      overflow: hidden;
    }
    .video-box video {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      -webkit-object-fit: cover;
      background: #0A0A0C;
    }

    /* ===== 中央播放按钮（自适应大小） ===== */
    .center-play-btn {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 20%;
      aspect-ratio: 1 / 1;
      max-width: 80px;
      min-width: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border: 2px solid rgba(255, 255, 255, 0.25);
      color: #fff;
      font-size: clamp(18px, 5vw, 36px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      transition: opacity 0.3s ease, transform 0.3s ease, background 0.3s ease;
      cursor: pointer;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
    }
    .center-play-btn:active {
      transform: translate(-50%, -50%) scale(0.88);
      background: rgba(255, 255, 255, 0.25);
    }
    .center-play-btn.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .center-play-btn i {
      margin-left: 4px;
    }

    /* ===== 视频控制栏 ===== */
    .video-controls {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 10px 12px 12px;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.75));
      z-index: 3;
      opacity: 1;
      transition: opacity 0.35s ease;
      pointer-events: auto;
    }
    .video-controls.hidden {
      opacity: 0;
      pointer-events: none;
    }
    .progress-track {
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 99px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #00D4FF, #7B61FF);
      width: 0%;
      transition: width 0.08s linear;
    }
    .controls-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .controls-row button {
      color: #fff;
      font-size: 15px;
      padding: 3px;
      opacity: 0.8;
      transition: opacity 0.15s;
    }
    .controls-row button:active { opacity: 0.4; }
    .controls-time {
      margin-left: auto;
      color: #fff;
      font-size: 11px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-expand {
      color: #fff;
      font-size: 13px;
      padding: 3px;
      opacity: 0.8;
    }
    .btn-expand:active { opacity: 0.4; transform: scale(0.9); }

    /* ===== 主卡片 ===== */
    .main-card-container {
      width: 100%;
      flex-shrink: 0;
      animation: cardSpringIn .6s var(--ease) 0.18s both;
    }
    .main-card {
      width: 100%;
      padding: 20px 16px 22px;
      border-radius: 24px;
      background: var(--bg-secondary);
      border: 0.5px solid var(--glass-border);
      box-shadow: var(--glass-shadow);
      backdrop-filter: blur(16px) saturate(180%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      overflow: visible;
      transition: box-shadow 0.3s ease;
      transform: translateZ(0);
      position: relative;
    }
    .main-card::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: 25px;
      background: conic-gradient(from 0deg, #00D4FF, #7B61FF, #FF6B9E, #FFD966, #00D4FF);
      opacity: 0.06;
      z-index: -1;
      animation: borderGlow 8s linear infinite;
      filter: blur(6px);
    }
    @keyframes borderGlow {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* ===== Profile Row ===== */
    .profile-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: start;
      gap: 12px;
      width: 100%;
      flex-shrink: 0;
    }
    .profile-left {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ===== Avatar ===== */
    .avatar {
      position: relative;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      margin-bottom: 8px;
      cursor: zoom-in;
      flex-shrink: 0;
    }
    .avatar::after {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      background: var(--glow-color);
      opacity: 0.10;
      filter: blur(14px);
      z-index: -1;
      animation: avatarPulse 2.8s ease-in-out infinite alternate;
    }
    @keyframes avatarPulse {
      0% { transform: scale(0.94); opacity: 0.08; }
      100% { transform: scale(1.10); opacity: 0.18; }
    }
    .avatar::before {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--glow-color), #FFD046, #00D4FF, #7B61FF, var(--glow-color));
      animation: avatarRotate 4s linear infinite;
      filter: blur(2px);
      z-index: -1;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      padding: 2px;
    }
    @keyframes avatarRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid rgba(255,255,255,0.12);
      box-shadow: 0 2px 16px rgba(0,0,0,0.3);
      position: relative;
      z-index: 1;
    }

    /* ===== 车牌 ===== */
    .plate {
      padding: 3px 14px;
      border-radius: 6px;
      background: var(--plate-bg);
      color: var(--plate-text);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1.8px;
      box-shadow: 0 3px 18px rgba(0, 212, 255, 0.20);
      border: 0.5px solid rgba(255,255,255,0.10);
      cursor: pointer;
      transition: transform 0.15s var(--spring);
      position: relative;
      overflow: hidden;
    }
    .plate::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: translateX(-100%);
      animation: plateShine 4s ease-in-out infinite;
    }
    @keyframes plateShine {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(100%); }
      100% { transform: translateX(100%); }
    }
    .plate:active { transform: scale(0.94); }

    .name {
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      margin-top: 5px;
      background: var(--name-gradient);
      background-size: 300% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: textGradient 10s ease-in-out infinite;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    @keyframes textGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .subtitle {
      font-size: 10px;
      font-weight: 600;
      text-align: center;
      margin-top: 2px;
      background: var(--sub-gradient);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      line-height: 1.4;
    }

    /* ===== 右侧图片 ===== */
    .plate-photo {
      width: 88px;
      flex-shrink: 0;
      border-radius: 10px;
      overflow: hidden;
      cursor: zoom-in;
      box-shadow: 0 3px 16px rgba(0,0,0,0.3);
      border: 0.5px solid rgba(255,255,255,0.04);
      transition: transform 0.15s var(--spring);
    }
    .plate-photo:active { transform: scale(0.94); }
    .plate-photo img {
      width: 100%;
      aspect-ratio: 9 / 16;
      object-fit: cover;
      -webkit-object-fit: cover;
      display: block;
    }

    /* ===== APP宫格 ===== */
    .apps-scroll-wrapper {
      width: 100%;
      overflow: visible;
      position: relative;
      margin-top: 18px;
      z-index: 10;
    }
    .apps-track {
      display: flex;
      transition: transform 0.35s var(--ease);
      will-change: transform;
    }
    .apps-page {
      flex: 0 0 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px 6px;
      padding: 0 2px;
      min-height: 100px;
    }
    .apps-page[data-page="1"] { display: none; }

    .app-button {
      --icon-color: #00D4FF;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      background: transparent;
      cursor: pointer;
      transition: transform 0.2s ease;
      position: relative;
      z-index: 10;
    }
    .app-button:active { transform: scale(0.92); }
    .app-icon-wrap {
      position: relative;
      width: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 14px;
      background: var(--icon-bg);
      box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.05), 0 3px 12px rgba(0,0,0,0.3);
      font-size: 20px;
      color: var(--icon-color);
      backdrop-filter: blur(12px) saturate(170%);
      -webkit-backdrop-filter: blur(12px) saturate(170%);
      border: 0.5px solid rgba(255,255,255,0.04);
      transition: transform 0.15s var(--spring), box-shadow 0.3s ease;
      z-index: 10;
    }
    .app-icon-wrap::after {
      content: '';
      position: absolute;
      inset: -2px;
      border-radius: 16px;
      background: conic-gradient(from 0deg, var(--icon-color), transparent, var(--icon-color));
      opacity: 0;
      transition: opacity 0.3s ease;
      z-index: -1;
      filter: blur(6px);
    }
    .app-button:hover .app-icon-wrap::after { opacity: 0.25; }
    .app-button:hover .app-icon-wrap {
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.12);
      transform: scale(1.04);
    }
    .app-button:active .app-icon-wrap { transform: scale(0.88); }
    .app-button.loading .app-icon-wrap { opacity: 0.5; }
    .app-label {
      font-size: 9px;
      font-weight: 500;
      color: var(--text-sub);
      text-align: center;
      line-height: 1.2;
      letter-spacing: 0.1px;
    }

    /* ===== Toast ===== */
    .toast {
      position: fixed;
      z-index: 10001;
      left: 50%;
      bottom: calc(36px + var(--safe-bottom));
      transform: translate(-50%, 20px) scale(0.94);
      padding: 8px 18px;
      border-radius: 10px;
      color: #fff;
      background: var(--toast-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-size: 13px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s var(--ease), transform 0.25s var(--spring);
      border: 0.5px solid rgba(255,255,255,0.06);
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

    /* ===== 图片查看器 ===== */
    .viewer {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--viewer-bg);
      backdrop-filter: blur(24px) saturate(120%);
      -webkit-backdrop-filter: blur(24px) saturate(120%);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.25s var(--ease), visibility 0.25s var(--ease);
    }
    .viewer.show { opacity: 1; visibility: visible; pointer-events: auto; }
    .viewer-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      padding: 16px;
    }
    .viewer-img {
      max-width: 94vw;
      max-height: 70vh;
      object-fit: contain;
      border-radius: 10px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      opacity: 0;
      transition: opacity 0.25s var(--ease);
      touch-action: none;
    }
    .viewer.show .viewer-img { opacity: 1; }
    .viewer-close {
      position: fixed;
      top: calc(12px + var(--safe-top));
      right: calc(12px + env(safe-area-inset-right, 0px));
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 0.5px solid rgba(255,255,255,0.06);
      color: #fff;
      font-size: 17px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 10003;
    }
    .viewer-close:active { background: rgba(255,255,255,0.12); transform: scale(0.9); }
    .viewer-hint {

        el.style.width = size + "px";
        el.style.height = size + "px";

        el.style.left = (rect.left + Math.random() * rect.width) + "px";

        const dur = Math.random() * 5 + 4;
        el.style.animation = `sakuraFall ${dur}s linear forwards`;
        sakuraBox.appendChild(el);
        setTimeout(() => { if (el.parentNode) el.remove(); }, dur * 1000 + 100);
      }

      }

      function closePopup() {
        videoPopup.classList.remove('active');
        document.body.style.overflow = '';
        mainVideo.muted = false;
        if (!popupVideo.paused) {
          mainVideo.currentTime = popupVideo.currentTime;
          mainVideo.play().catch(() => {});
        }
        popupVideo.pause();
        popupVideo.src = '';
        updateMuteIcon();
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        popupControlsVisible = true;
        clearTimeout(popupHideTimer);
      }

      // ============================================================
      // 图片查看器
      // ============================================================
      function updateViewerCounter() {
        if (viewerGallery && viewerGallery.length > 0) {
          viewerCounter.textContent = (viewerGalleryIndex + 1) + ' / ' + viewerGallery.length;
        } else {
          viewerCounter.textContent = '1 / 1';
        }
      }

      function startViewerAutoPlay() {
        stopViewerAutoPlay();
        if (!viewerGallery || viewerGallery.length <= 1) return;
        viewerAutoPlayTimer = setInterval(() => {
          if (isViewerInteracting) return;
          viewerGalleryIndex = (viewerGalleryIndex + 1) % viewerGallery.length;
          viewerImg.src = viewerGallery[viewerGalleryIndex];
          updateViewerCounter();
        }, 3500);
      }

      function stopViewerAutoPlay() {
        if (viewerAutoPlayTimer) {
          clearInterval(viewerAutoPlayTimer);
          viewerAutoPlayTimer = null;
        }
      }

      function resetViewerAutoPlay() {
        stopViewerAutoPlay();
        if (viewer.classList.contains('show') && viewerGallery && viewerGallery.length > 1) {
          startViewerAutoPlay();
        }
      }

      function openViewer(gallery, idx, alt) {
        if (!gallery || gallery.length === 0) return;
        stopViewerAutoPlay();

        viewerGallery = gallery;
        viewerGalleryIndex = idx;
        viewerImg.src = viewerGallery[viewerGalleryIndex];
        viewerImg.alt = alt || "原图";
        viewer.classList.add("show");
        document.body.style.overflow = "hidden";
        viewerHint.textContent = '左右滑动切换 · 长按保存';
        updateViewerCounter();

        if (viewerGallery.length > 1) {
          setTimeout(() => {
            if (viewer.classList.contains('show')) {
              startViewerAutoPlay();
            }
          }, 1200);
        }

        isViewerInteracting = false;
      }

      function closeViewer() {
        stopViewerAutoPlay();
        viewer.classList.remove("show");
        document.body.style.overflow = "";
        isViewerInteracting = false;
        setTimeout(() => {
          if (!viewer.classList.contains("show")) {
            viewerImg.src = "";
          }
        }, 250);
      }

      function viewerPrev() {
        if (!viewerGallery || viewerGallery.length === 0) return;
        isViewerInteracting = true;
        viewerGalleryIndex = (viewerGalleryIndex - 1 + viewerGallery.length) % viewerGallery.length;
        viewerImg.src = viewerGallery[viewerGalleryIndex];
        updateViewerCounter();
        resetViewerAutoPlay();
        setTimeout(() => { isViewerInteracting = false; }, 300);
      }

      function viewerNext() {
        if (!viewerGallery || viewerGallery.length === 0) return;
        isViewerInteracting = true;
        viewerGalleryIndex = (viewerGalleryIndex + 1) % viewerGallery.length;
        viewerImg.src = viewerGallery[viewerGalleryIndex];
        updateViewerCounter();
        resetViewerAutoPlay();
        setTimeout(() => { isViewerInteracting = false; }, 300);
      }

      // ============================================================
      // 事件绑定
      // ============================================================

      // 中央播放按钮
      centerPlayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleVideo();
      });

      // 主视频点击 - 点击空白区域切换控件显示/隐藏
      videoBox.addEventListener("click", function(e) {
        // 如果点击的是控件区域、按钮或中央播放按钮，不处理
        if (e.target.closest(".video-controls") || e.target.closest(".btn-expand") || e.target.closest(".center-play-btn")) {
          return;
        }
        e.stopPropagation();
        toggleControlsVisibility();
      });

      videoPlayBtn.onclick = (e) => { e.stopPropagation();
        toggleVideo(); };
      videoPrevBtn.onclick = (e) => { e.stopPropagation();
        prevVideo(); };
      videoNextBtn.onclick = (e) => { e.stopPropagation();
        nextVideo(); };
      expandBtn.onclick = (e) => { e.stopPropagation();
        openPopup(); };

      // 音量
      let volDrag = false,
        volStartY = 0,
        volStartVal = 0;
      videoMuteBtn.addEventListener('touchstart', (e) => {
        e.stopPropagation();
        volDrag = true;
        volStartY = e.touches[0].clientY;
        volStartVal = mainVideo.volume;
      }, { passive: true });
      videoMuteBtn.addEventListener('touchmove', (e) => {
        if (!volDrag) return;
        e.preventDefault();
        const dy = volStartY - e.touches[0].clientY;
        let v = Math.max(0, Math.min(1, volStartVal + dy / 800));
        mainVideo.volume = v;
        updateMuteIcon();
      }, { passive: false });
      videoMuteBtn.addEventListener('touchend', () => { volDrag = false; });
      videoMuteBtn.addEventListener('touchcancel', () => { volDrag = false; });
      videoMuteBtn.onclick = (e) => {
        if (volDrag) return;
        e.stopPropagation();
        mainVideo.muted = !mainVideo.muted;
        updateMuteIcon();
        showControls();
      };

      mainVideo.addEventListener('loadedmetadata', () => {
        totTime.textContent = formatTime(mainVideo.duration);
        if (mainVideo.currentTime > 0) {
          const p = (mainVideo.currentTime / mainVideo.duration) * 100;
          progressFill.style.width = p + "%";
          curTime.textContent = formatTime(mainVideo.currentTime);
        }
        updateCenterPlayBtn();
      });

      mainVideo.addEventListener('timeupdate', () => {
        if (mainVideo.duration > 0) {
          const p = (mainVideo.currentTime / mainVideo.duration) * 100;
          progressFill.style.width = p + "%";
          curTime.textContent = formatTime(mainVideo.currentTime);
        }
      });

      progressTrack.addEventListener("click", (e) => {
        const rect = progressTrack.getBoundingClientRect();
        const r = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        mainVideo.currentTime = r * mainVideo.duration;
        showControls();
      });

      mainVideo.addEventListener("play", () => {
        updatePlayBtnIcon();
        updateCenterPlayBtn();
        // 播放时显示控件
        videoControls.classList.remove('hidden');
        centerPlayBtn.classList.remove('hidden');
        controlsVisible = true;
        clearTimeout(hideControlTimer);
        // 设置自动隐藏
        hideControlTimer = setTimeout(() => {
          videoControls.classList.add("hidden");
          controlsVisible = false;
          if (!mainVideo.paused) {
            centerPlayBtn.classList.add("hidden");
          }
        }, HIDE_DELAY);
        if (videoPopup.classList.contains('active') && popupVideo.src === mainVideo.src) {
          popupVideo.play().catch(() => {});
        }
      });

      mainVideo.addEventListener("pause", () => {
        updatePlayBtnIcon();
        centerPlayBtn.classList.remove('hidden');
        centerPlayBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        videoControls.classList.remove("hidden");
        controlsVisible = true;
        clearTimeout(hideControlTimer);
        if (videoPopup.classList.contains('active') && popupVideo.src === mainVideo.src) {
          popupVideo.pause();
        }
      });

      mainVideo.addEventListener("ended", () => {
        nextVideo();
      });

      // ============================================================
      // 弹出播放器事件
      // ============================================================
      popupVideo.removeAttribute('loop');
      popupVideo.addEventListener('ended', () => {
        if (videoList.length > 0) {
          currentVideoIndex = (currentVideoIndex + 1) % videoList.length;
          const src = videoList[currentVideoIndex];
          mainVideo.src = src;
          popupVideo.src = src;
          popupVideo.play().catch(() => {});
          mainVideo.play().catch(() => {});
          mainVideo.muted = true;
          progressFill.style.width = '0%';
          curTime.textContent = '00:00';
          updateCenterPlayBtn();
          updatePlayBtnIcon();
          popupControlsVisible = true;
          popupControls.classList.remove("hidden");
          popupClose.classList.remove("hidden");
          clearTimeout(popupHideTimer);
          popupHideTimer = setTimeout(() => {
            popupControls.classList.add("hidden");
            popupClose.classList.add("hidden");
            popupControlsVisible = false;
          }, POPUP_HIDE_DELAY);
        }
      });

      popupVideo.addEventListener('click', (e) => { e.stopPropagation();
        togglePopupControls(); });
      popupClose.addEventListener('click', (e) => { e.stopPropagation();
        closePopup(); });
      videoPopup.addEventListener('click', (e) => {
        if (e.target === videoPopup && popupControlsVisible) {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
          clearTimeout(popupHideTimer);
        }
      });

      popupPlayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (popupVideo.paused) popupVideo.play().catch(() => {});
        else popupVideo.pause();
        if (!popupVideo.paused) {
          mainVideo.currentTime = popupVideo.currentTime;
          mainVideo.play().catch(() => {});
          mainVideo.muted = true;
        } else {
          mainVideo.pause();
        }
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      popupPrevBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (videoList.length === 0) return;
        currentVideoIndex = (currentVideoIndex - 1 + videoList.length) % videoList.length;
        const src = videoList[currentVideoIndex];
        mainVideo.src = src;
        popupVideo.src = src;
        popupVideo.play().catch(() => {});
        mainVideo.muted = true;
        progressFill.style.width = '0%';
        curTime.textContent = '00:00';
        updateCenterPlayBtn();
        updatePlayBtnIcon();
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      popupNextBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (videoList.length === 0) return;
        currentVideoIndex = (currentVideoIndex + 1) % videoList.length;
        const src = videoList[currentVideoIndex];
        mainVideo.src = src;
        popupVideo.src = src;
        popupVideo.play().catch(() => {});
        mainVideo.muted = true;
        progressFill.style.width = '0%';
        curTime.textContent = '00:00';
        updateCenterPlayBtn();
        updatePlayBtnIcon();
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      popupMuteBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        popupVideo.muted = !popupVideo.muted;
        popupMuteBtn.innerHTML = popupVideo.muted ? `<i class="fa-solid fa-volume-xmark"></i>` :
          `<i class="fa-solid fa-volume-high"></i>`;
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      popupVideo.addEventListener('loadedmetadata', () => {
        popupTotTime.textContent = formatTime(popupVideo.duration);
      });
      popupVideo.addEventListener('timeupdate', () => {
        const p = (popupVideo.currentTime / popupVideo.duration) * 100;
        popupProgressBar.style.width = p + "%";
        popupCurTime.textContent = formatTime(popupVideo.currentTime);
        if (!popupVideo.paused) {
          mainVideo.currentTime = popupVideo.currentTime;
        }
      });
      popupProgressWrap.addEventListener('click', (e) => {
        const rect = popupProgressWrap.getBoundingClientRect();
        const r = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        popupVideo.currentTime = r * popupVideo.duration;
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      popupVideo.addEventListener('play', () => {
        popupPlayBtn.innerHTML = `<i class="fa-solid fa-pause"></i>`;
        mainVideo.currentTime = popupVideo.currentTime;
        mainVideo.play().catch(() => {});
        mainVideo.muted = true;
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });
      popupVideo.addEventListener('pause', () => {
        popupPlayBtn.innerHTML = `<i class="fa-solid fa-play"></i>`;
        mainVideo.pause();
        popupControlsVisible = true;
        popupControls.classList.remove("hidden");
        popupClose.classList.remove("hidden");
        clearTimeout(popupHideTimer);
        popupHideTimer = setTimeout(() => {
          popupControls.classList.add("hidden");
          popupClose.classList.add("hidden");
          popupControlsVisible = false;
        }, POPUP_HIDE_DELAY);
      });

      // ============================================================
      // 图片查看器事件绑定
      // ============================================================
      let vStartX = 0,
        vStartY = 0,
        vIsHoriz = null;

      viewer.addEventListener("touchstart", (e) => {
        isViewerInteracting = true;
        vStartX = e.touches[0].clientX;
        vStartY = e.touches[0].clientY;
        vIsHoriz = null;
      }, { passive: true });

      viewer.addEventListener("touchmove", (e) => {
        if (!viewer.classList.contains('show')) return;
        const dx = e.touches[0].clientX - vStartX;
        const dy = e.touches[0].clientY - vStartY;
        if (vIsHoriz === null) {
          vIsHoriz = Math.abs(dx) > Math.abs(dy);
        }
        if (vIsHoriz) {
          e.preventDefault();
        }
      }, { passive: false });

      viewer.addEventListener("touchend", (e) => {
        if (!viewer.classList.contains('show')) return;
        const dx = e.changedTouches[0].clientX - vStartX;
        if (Math.abs(dx) > 40) {
          if (dx < 0) {
            viewerNext();
          } else {
            viewerPrev();
          }
        }
        setTimeout(() => {
          isViewerInteracting = false;
          resetViewerAutoPlay();
        }, 400);
      }, { passive: true });

      viewer.addEventListener('wheel', (e) => {
        if (!viewer.classList.contains('show')) return;
        e.preventDefault();
        if (e.deltaX > 30 || e.deltaY > 30) {
          viewerNext();
        } else if (e.deltaX < -30 || e.deltaY < -30) {
          viewerPrev();
        }
        resetViewerAutoPlay();
      }, { passive: false });

      document.addEventListener('keydown', (e) => {
        if (!viewer.classList.contains('show')) return;
        if (e.key === 'ArrowLeft') {
          e.preventDefault();
          viewerPrev();
          resetViewerAutoPlay();
        } else if (e.key === 'ArrowRight') {
          e.preventDefault();
          viewerNext();
          resetViewerAutoPlay();
        } else if (e.key === 'Escape') {
          closeViewer();
        }
      });

      $("#avatar").addEventListener("click", (e) => {
        e.stopPropagation();
        openViewer(avatarImages, avatarIndex, "头像原图");
      });
      $("#platePhoto").addEventListener("click", (e) => {
        e.stopPropagation();
        openViewer(slideImages, slideIndex, "图片原图");
      });

      viewerClose.addEventListener("click", closeViewer);
      viewer.addEventListener("click", (e) => {
        if (e.target === viewer) closeViewer();
      });

      // 长按保存
      let lpTimer = null;
      viewerImg.addEventListener('touchstart', () => {
        lpTimer = setTimeout(() => {
          const a = document.createElement('a');
          a.href = viewerImg.src;
          a.download = 'preview-image';
          document.body.appendChild(a);
          a.click();
          a.remove();
          showToastMsg("开始下载图片");
        }, 600);
      }, { passive: true });
      viewerImg.addEventListener('touchend', () => { clearTimeout(lpTimer); });
      viewerImg.addEventListener('touchcancel', () => { clearTimeout(lpTimer); });

      // ============================================================
      // APP跳转
      // ============================================================
      function jumpToApp(key) {
        if (isJumping) return;
        const config = APP_CONFIG[key];
        if (!config) return;
        const item = document.querySelector(`[data-app="${key}"]`);
        if (!item || item.classList.contains("loading")) return;

        isJumping = true;
        item.classList.add("loading");
        const orig = item.innerHTML;
        item.innerHTML =
          `<div class="app-icon-wrap"><i class="fa-solid fa-spinner fa-spin"></i></div><span class="app-label">打开中</span>`;

        let unloaded = false;
        const onUnload = () => { unloaded = true;
          isJumping = false;
          window.removeEventListener('beforeunload', onUnload);
          document.removeEventListener('visibilitychange', onVis); };
        const onVis = () => {
          if (!document.hidden && !unloaded) {
            if (document.body.contains(item)) { item.classList.remove("loading");
              item.innerHTML = orig; }
            isJumping = false;
            window.removeEventListener('beforeunload', onUnload);
            document.removeEventListener('visibilitychange', onVis);
          }
        };
        window.addEventListener('beforeunload', onUnload);
        document.addEventListener('visibilitychange', onVis);

        try {
          const win = window.open(config.scheme, '_blank');
          if (!win || win.closed) window.location.href = config.scheme;
        } catch (e) {
          item.classList.remove("loading");
          item.innerHTML = orig;
          isJumping = false;
          window.removeEventListener('beforeunload', onUnload);
          document.removeEventListener('visibilitychange', onVis);
          return;
        }

        setTimeout(() => {
          if (!unloaded && isJumping) {
            if (document.body.contains(item)) { item.classList.remove("loading");
              item.innerHTML = orig; }
            isJumping = false;
            window.removeEventListener('beforeunload', onUnload);
            document.removeEventListener('visibilitychange', onVis);
          }
        }, 2800);
      }

      $$(".app-button").forEach(el => {
        el.addEventListener("click", (e) => {
          e.stopPropagation();
          jumpToApp(el.dataset.app);
        });
      });

      // ============================================================
      // 复制车牌
      // ============================================================
      $("#plate").addEventListener("click", async (e) => {
        e.stopPropagation();
        const txt = "苏FA36165";
        try { await navigator.clipboard.writeText(txt); } catch {
          const inp = document.createElement("input");
          inp.value = txt;
          inp.style.cssText = "position:fixed;opacity:0;";
          document.body.appendChild(inp);
          inp.select();
          document.execCommand("copy");
          inp.remove();
        }
        showToastMsg("车牌号已复制");
      });

      // ============================================================
      // 点击弹字
      // ============================================================
      const clickTexts = ["苏FA36165", "Xiaomi SU7 Pro", "刘茜美子"];
      document.body.addEventListener("click", (e) => {
        if (e.target.closest(".app-button") || e.target.closest(".viewer") ||
          e.target.closest("#plate") || e.target.closest(".video-controls") ||
          e.target.closest(".video-popup") || e.target.closest(".btn-expand") ||
          e.target.closest(".dynamic-island") || e.target.closest(".app-icon-wrap") ||
          e.target.closest(".center-play-btn")) return;
        const txt = clickTexts[Math.floor(Math.random() * clickTexts.length)];
        const el = document.createElement("div");
        el.className = "click-text-item";
        el.textContent = txt;
        el.style.left = (e.clientX - 40) + "px";
        el.style.top = (e.clientY - 20) + "px";
        document.body.appendChild(el);
        setTimeout(() => { if (el.parentNode) el.remove(); }, 4200);
      });

      // ============================================================
      // 状态栏时间
      // ============================================================
      function updateTime() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, "0");
        const m = String(now.getMinutes()).padStart(2, "0");
        $("#statusTime").textContent = h + ":" + m;
      }
      updateTime();
      setInterval(updateTime, 1000);

      // ============================================================
      // 深色模式（固定深色炫酷）
      // ============================================================
      document.documentElement.classList.add('dark-mode');

      // ============================================================
      // 启动
      // ============================================================
      setTimeout(() => {
        // 初始显示控件
        videoControls.classList.remove('hidden');
        centerPlayBtn.classList.remove('hidden');
        controlsVisible = true;
        updateCenterPlayBtn();
        // 如果视频在播放，设置自动隐藏
        if (!mainVideo.paused) {
          hideControlTimer = setTimeout(() => {
            videoControls.classList.add("hidden");
            controlsVisible = false;
            if (!mainVideo.paused) {
              centerPlayBtn.classList.add("hidden");
            }
          }, HIDE_DELAY);
        }
      }, 500);

      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) ensureSakura();
      });

      window.addEventListener('beforeunload', () => {
        if (glowInterval) clearInterval(glowInterval);
        if (sakuraInterval) clearInterval(sakuraInterval);
        if (textRollInterval) clearInterval(textRollInterval);
        if (avatarTimer) clearInterval(avatarTimer);
        if (slideTimer) clearInterval(slideTimer);
        stopViewerAutoPlay();
      });
    })();
  </script>
</body>
</html>
