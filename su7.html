/* ============================================================================
   21 资料卡文字收小 / 座右铭轮播 / 定位实时刷新
   ---------------------------------------------------------------------------- */

/* 三行文字略微收小：15px → 14px。行高仍走 --profile-line，
   三行整体高度不变，依旧与头像同心，不会把资料卡顶高 */
.profile-row{--profile-font:14px}
@media (max-width:360px){.profile-row{--profile-font:13px}}
@media (min-width:768px) and (hover:hover) and (pointer:fine){.profile-row{--profile-font:16px}}

/* 座右铭每 10 秒换一句：先淡出再淡入。
   这行是渐变文字（background-clip:text），直接替换内容会在重绘时抖一下 */
.profile-row .subtitle .line-2{
  transition:opacity .34s cubic-bezier(.4,0,.2,1),transform .34s cubic-bezier(.4,0,.2,1);
  will-change:opacity;
}
.profile-row .subtitle .line-2.motto-out{opacity:0;transform:translateY(-2px)}

/* 定位文字实时刷新：换字前先压暗，避免文字硬切显得闪烁 */
.top-right .weather-location{transition:opacity .2s ease}
.top-right .weather-location.loc-updating{opacity:.35}

/* ============================================================================
   22 手机端省电与流畅度（小米 18 Pro · 安卓 Chrome 重点）
   ----------------------------------------------------------------------------
   ① 毛玻璃降档：安卓 GPU 每帧都要重算一次 backdrop blur，半径越大越费电。
      手机上 18px→13px、saturate 200%→168%，肉眼几乎无差，功耗能降一档。
   ② 堆叠图只留 4 层合成：149 个 .stack-img 每个都带 translateZ(0)，
      等于 149 个独立合成层、149 份显存纹理 —— 这是安卓上最容易被忽略的
      卡顿/发热源。不在台面上的图直接 display:none，图层立刻释放。
   ③ 静置冻结：60 秒无交互后暂停所有无限循环的装饰动画。停掉后合成器不再
      每帧提交，屏幕刷新率能落回 1~10Hz，这才是「挂一天不发烫」的关键。
      这组动画只在冻结时暂停（animation-play-state），不销毁、不跳帧，
      任意触摸 / 滚动 / 按键立即从原位继续。
   ========================================================================== */
@media (max-width:560px){
  :root{--glass-blur:13px;--glass-sat:168%}
}

/* 只有 active / pile / pile2 / pile3 四张参与渲染 */
.top-card .stack-img.hidden{display:none}

html.power-idle .avatar-halo,
html.power-idle .avatar-center::before,
html.power-idle .avatar-orbit,
html.power-idle .dynamic-island::before,
html.power-idle .island-grad,
html.power-idle .profile-row .name,
html.power-idle .profile-row .subtitle .line-1,
html.power-idle .profile-row .subtitle .line-2{
  animation-play-state:paused!important;
}
/* 冻结期间把常驻合成层也撤掉，唤醒时 Chrome 会自动重建 */
html.power-idle .avatar-halo,
html.power-idle .avatar-center::before,
html.power-idle .avatar-orbit{will-change:auto}

/* ============================================================================
   23 地点搜索：省 / 市 / 县 / 镇 / 村
   ----------------------------------------------------------------------------
   搜索结果左侧是名称 + 层级标签（省/市/区县/镇/村），右侧是上级路径。
   远程补全（GeoNames）命中村镇时标签用蓝紫区分，提示这条来自在线地名库。
   ========================================================================== */
.city-item{min-height:46px;padding:10px 16px}
.city-item .city-name{
  display:flex;align-items:center;gap:6px;min-width:0;flex:0 1 auto;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.city-lv{
  flex:0 0 auto;font-style:normal;font-size:10px;line-height:1;
  padding:3px 5px;border-radius:5px;letter-spacing:0;font-weight:600;
  background:rgba(120,132,190,.14);color:#5A6080;
}
html.dark-mode .city-lv{background:rgba(150,165,255,.16);color:#C3C9F0}
.city-lv.lv-far{background:rgba(91,108,255,.15);color:#4E5BE0}
html.dark-mode .city-lv.lv-far{background:rgba(120,140,255,.24);color:#AAB6FF}
.city-item .city-province{
  flex:0 1 auto;max-width:52%;font-size:12.5px;letter-spacing:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right;
}
.city-empty{padding:24px 16px;text-align:center;color:var(--label-3);font-size:13px;line-height:19px}

/* ============================================================================
   24 顶栏（图片卡）高度 +6px
   ----------------------------------------------------------------------------
   原公式上限是 29.4svh 与 clamp 的 254 / 240 / 228 三档，实测 393×852 下
   29.4svh=250.5 才是真正的天花板（clamp 的 254 根本没摸到），所以只调 clamp
   不动 svh 是白调。这里把「视口高比例」和「像素档」一起抬 6px 左右：
   · 29.4svh → 30.2svh（852 高时 +6.5px）
   · 矮屏档 28.6svh → 29.4svh（730 高时 +5.8px）
   · clamp 228/64vw/254 → 234/65.4vw/260
   图片卡与右列同处一行 grid，会一起变高，天气/日历留白也更舒服。
   底部原本还有 20~50px 余量，加高后仍然一屏不滚动（见 25 节验证数据）。
   ========================================================================== */
@supports (height:100svh){
  .top-card{height:min(clamp(234px,65.4vw,260px),30.2svh)}
  @media (min-width:400px){.top-card{height:min(260px,30.2svh)}}
  @media (max-width:390px){.top-card{height:min(clamp(234px,65.4vw,246px),30.2svh)}}
  @media (max-width:352px){.top-card{height:min(234px,30.2svh)}}
  @media (max-height:760px){.top-card{height:min(clamp(234px,65.4vw,260px),29.4svh)}}
  /* 宽屏 + 矮视口（如 430×780）本来就贴边，这里回到原尺寸，只加不减 */
  @media (min-width:396px) and (max-height:800px){.top-card{height:min(254px,29.4svh)}}
}
/* 不支持 svh 的浏览器（极旧内核）走固定档 */
@supports not (height:100svh){
  .top-card{height:clamp(234px,65.4vw,260px)}
}

/* ============================================================================
   25 天气弹层：实时 / 未来 7 天 双页
   ----------------------------------------------------------------------------
   原来点天气卡只能看 7 天列表，当前实时细项（体感/湿度/风/气压/能见度/紫外线）
   只在卡片那 2×3 的 9px 小字里，看不清。这里加一个分段控件：
   「实时」页 = 大温度 + 今日高低温 + 六宫格 + 日出日落进度 + 更新时间/刷新
   「7 天」页 = 原来的列表，保持不变。
   ========================================================================== */
.wx-tabs{
  display:grid;grid-template-columns:1fr 1fr;gap:4px;margin:2px 0 10px;padding:3px;
  border-radius:13px;background:var(--fill-2);
}
.wx-tab{
  height:30px;border-radius:10px;font-size:12.5px;font-weight:700;letter-spacing:-.1px;
  color:var(--label-2);background:transparent;
  transition:color .18s var(--ease),background .22s var(--ease),box-shadow .22s var(--ease);
}
.wx-tab.on{
  color:var(--label);background:var(--card-bg);
  box-shadow:0 .5px 1px rgba(20,24,60,.10),0 3px 10px -5px rgba(60,80,180,.45),
             inset 0 0 0 .5px var(--card-line);
}
html.dark-mode .wx-tab.on{
  background:rgba(255,255,255,.11);
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.10),0 3px 10px -5px rgba(0,0,0,.7);
}
.wx-tab:active{transform:scale(.97)}

/* 两个页面互斥：面板类名决定显示哪一页 */
.weather-sheet-panel .wx-now{display:none}
.weather-sheet-panel.tab-now .wx-now{display:block}
.weather-sheet-panel.tab-now .wx7-list{display:none}

.wx-hero-hl{
  display:flex;align-items:baseline;gap:7px;margin-left:2px;
  font-size:12.5px;font-weight:700;color:var(--label-2);
  font-variant-numeric:tabular-nums;
}
.wx-hero-hl .hl-hi{color:#FF7A47}
.wx-hero-hl .hl-lo{color:#4E9BFF}
html.dark-mode .wx-hero-hl .hl-hi{color:#FF9B6B}
html.dark-mode .wx-hero-hl .hl-lo{color:#7FBAFF}

/* 六宫格：体感 / 湿度 / 风 / 气压 / 能见度 / 紫外线 */
.wx-now-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wx-now-cell{
  display:flex;flex-direction:column;gap:4px;padding:9px 10px;border-radius:14px;
  background:var(--card-bg);
  box-shadow:inset 0 0 0 .5px var(--card-line),0 8px 18px -16px rgba(70,90,190,.85);
}
.wx-now-cell span{font-size:10.5px;font-weight:700;color:var(--label-2);letter-spacing:-.1px}
.wx-now-cell b{
  font-size:15px;font-weight:700;color:var(--label);letter-spacing:-.4px;
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.wx-now-cell b i{font-style:normal;font-size:10px;font-weight:700;color:var(--label-3);margin-left:2px}
html.dark-mode .wx-now-cell b i{color:#AEB6E0}

/* 日出 / 日落：与天气卡同一套描边图标 + 当日进度 */
.wx-now-sun{
  display:flex;align-items:center;gap:8px;margin:12px 2px 0;
  font-size:11.5px;font-weight:700;color:var(--label-2);
  font-variant-numeric:tabular-nums;
}
.wx-now-sun .wns-ico{
  width:13px;height:13px;flex:0 0 auto;
  fill:none;stroke:currentColor;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;
}
.wx-now-sun .rise .wns-ico{color:#FFA733}
.wx-now-sun .set .wns-ico{color:#FF7A9E}
html.dark-mode .wx-now-sun .rise .wns-ico{color:#FFC24D}
html.dark-mode .wx-now-sun .set .wns-ico{color:#FF97B2}
.wns-line{
  position:relative;flex:1 1 auto;height:3px;border-radius:3px;
  background:rgba(138,144,184,.26);
}
html.dark-mode .wns-line{background:rgba(200,205,240,.20)}
.wns-line i{
  position:absolute;left:0;top:0;bottom:0;border-radius:3px;
  background:linear-gradient(90deg,rgba(255,167,51,.9),rgba(255,122,158,.9));
  transition:width .6s var(--ease);
}
.wns-line u{
  position:absolute;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
  background:#FFF;box-shadow:0 0 6px 1.5px rgba(255,150,90,.85);
  transition:left .6s var(--ease);
}
.wx-now-meta{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:12px 2px 0;font-size:11px;font-weight:600;color:var(--label-3);
}
.wx-now-refresh{
  display:flex;align-items:center;gap:5px;height:28px;padding:0 13px;border-radius:14px;
  background:linear-gradient(120deg,rgba(122,140,255,.20),rgba(168,85,247,.16));
  color:#4E58D6;font-size:11.5px;font-weight:700;letter-spacing:-.1px;
  transition:transform .18s var(--ease),opacity .18s var(--ease);
}
html.dark-mode .wx-now-refresh{
  color:#A9B4FF;background:linear-gradient(120deg,rgba(122,140,255,.26),rgba(168,85,247,.20));
}
.wx-now-refresh:active{transform:scale(.95);opacity:.75}
.wx-now-refresh[disabled]{opacity:.45}

/* ============================================================================
   26 月历：点标题手动选年 / 月
   ----------------------------------------------------------------------------
   标题改成按钮：点一下把 7 列日期网格换成「年份步进 + 12 个月」。
   年份 ‹‹ / ‹ / › / ›› 分别 ±10 / ±1，月份 4×3 排布。
   当前正在看的月份 = 渐变填充；今天所在月份 = 粉红描边。
   ========================================================================== */
.month-calendar-title{
  display:inline-flex;align-items:center;gap:6px;
  background:none;border:none;padding:0;cursor:pointer;
  color:var(--label-2);-webkit-text-fill-color:currentColor;
}
.month-calendar-title span{
  background:var(--grad-cool);
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent;
}
/* 小三角：不用 FA（这套只内联了 29 个图标，没有 chevron-down） */
.month-calendar-title::after{
  content:'';width:0;height:0;margin-top:2px;
  border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid currentColor;opacity:.55;
  transition:transform .24s var(--ease);
}
.month-calendar-panel.picking .month-calendar-title::after{transform:rotate(180deg)}
.month-calendar-title:active{opacity:.6}

.mc-picker{display:none;padding:2px 0 4px}
.month-calendar-panel.picking .mc-picker{display:block}
.month-calendar-panel.picking .month-calendar-weekdays,
.month-calendar-panel.picking .month-calendar-days,
.month-calendar-panel.picking .month-calendar-legend{display:none}

.mc-picker-bar{display:flex;align-items:center;justify-content:center;gap:9px;margin:2px 0 14px}
.mc-picker-bar button{
  width:30px;height:30px;border-radius:50%;background:var(--fill-2);color:var(--label-2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;
  transition:transform .18s var(--ease),opacity .18s var(--ease);
}
.mc-picker-bar button.jump{font-size:9.5px;letter-spacing:-.5px}
.mc-picker-bar button:active{transform:scale(.9);opacity:.6}
.mc-year{
  min-width:96px;text-align:center;font-size:16px;font-weight:700;color:var(--label);
  letter-spacing:-.3px;font-variant-numeric:tabular-nums;
}
.mc-months{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mc-month{
  height:44px;border-radius:13px;background:var(--fill-2);
  color:var(--label);font-size:13px;font-weight:700;letter-spacing:-.2px;
  font-variant-numeric:tabular-nums;
  transition:transform .16s var(--ease),box-shadow .2s var(--ease);
}
.mc-month:active{transform:scale(.94)}
.mc-month.now{box-shadow:inset 0 0 0 1.5px rgba(255,77,126,.55);color:#FF4D7E}
html.dark-mode .mc-month.now{color:#FF7C9C;box-shadow:inset 0 0 0 1.5px rgba(255,124,156,.55)}
.mc-month.cur{

/* ============================================================================
   28 状态栏：电池百分比 + 信号/无线强度
   ----------------------------------------------------------------------------
   电池：navigator.getBattery() 直接给 level/charging，百分比画在电池内腔里。
   信号：浏览器读不到 dBm，用 Network Information API 的 effectiveType /
        downlink / rtt 折算 1~4 格；四根柱子按可用格数调透明度。
   无线：connection.type === 'wifi' 时显示，移动网络时整个图标隐藏
        （iPhone 在纯蜂窝下本来也不显示 Wi-Fi）。
   ========================================================================== */
/* 百分比画进电池里（不加 % 号）
   ----------------------------------------------------------------------------
   电池轮廓放大到 34×14，内腔 25.4×9.4，8.4px 的三位数刚好塞得下。
   数字画两层：
     A 用 currentColor —— 露在空腔里的部分
     B 用 --batt-in 并用 fill 区域 clipPath 裁切 —— 被电量填充盖住的那部分翻成反色
   两层完全同位，一旦填充边界切过数字，左侧立刻切成反色，不会出现半截糊字。 */
.ios-status-right .battery-icon{width:34px;height:14px}

园仓库空，埋葬不可用此日，悬绳吊颈祸重重，若是婚姻离别散，夜招浪子入房中，行船必定遭沉没，更生聋哑子孙穷。","{xx.fang}":"房星造作田园进，钱财牛马遍山岗，更招外处田庄宅，荣华富贵福禄康，埋葬若然用此日，高官进职拜君王，嫁娶嫦娥至月殿，三年抱子至朝堂。","{xx.xin}":"心星造作大为凶，更遭刑讼狱囚中，忤逆官非宅产退，埋葬卒暴死相从，婚姻若是用此日，子死儿亡泪满胸，三年之内连遭祸，事事教君没始终。","{xx.tail}":"尾星造作主天恩，富贵荣华福禄增，招财进宝兴家宅，和合婚姻贵子孙，埋葬若能依此日，男清女正子孙兴，开门放水招田宅，代代公侯远播名。","{xx.ji}":"箕星造作主高强，岁岁年年大吉昌，埋葬修坟大吉利，田蚕牛马遍山岗，开门放水招田宅，箧满金银谷满仓，福荫高官加禄位，六亲丰禄乐安康。","{xx.dou}":"斗星造作主招财，文武官员位鼎台，田宅家财千万进，坟堂修筑贵富来，开门放水招牛马，旺蚕男女主和谐，遇此吉宿来照护，时支福庆永无灾。","{xx.niu}":"牛星造作主灾危，九横三灾不可推，家宅不安人口退，田蚕不利主人衰，嫁娶婚姻皆自损，金银财谷渐无之，若是开门并放水，牛猪羊马亦伤悲。","{xx.nv}":"女星造作损婆娘，兄弟相嫌似虎狼，埋葬生灾逢鬼怪，颠邪疾病主瘟惶，为事遭官财失散，泻利留连不可当，开门放水用此日，全家财散主离乡。","{xx.xu}":"虚星造作主灾殃，男女孤眠不一双，内乱风声无礼节，儿孙媳妇伴人床，开门放水遭灾祸，虎咬蛇伤又卒亡，三三五五连年病，家破人亡不可当。","{xx.wei}":"危星不可造高楼，自遭刑吊见血光，三年孩子遭水厄，后生出外永不还，埋葬若还逢此日，周年百日取高堂，三年两载一悲伤，开门放水到官堂。","{xx.shi}":"室星修造进田牛，儿孙代代近王侯，家贵荣华天上至，寿如彭祖八千秋，开门放水招财帛，和合婚姻生贵儿，埋葬若能依此日，门庭兴旺福无休。","{xx.qiang}":"壁星造作主增财，丝蚕大熟福滔天，奴婢自来人口进，开门放水出英贤，埋葬招财官品进，家中诸事乐陶然，婚姻吉利主贵子，早播名誉著祖鞭。","{xx.kui}":"奎星造作得祯祥，家内荣和大吉昌，若是埋葬阴卒死，当年定主两三伤，看看军令刑伤到，重重官事主瘟惶，开门放水遭灾祸，三年两次损儿郎。","{xx.lou}":"娄星修造起门庭，财旺家和事事兴，外进钱财百日进，一家兄弟播高名，婚姻进益生贵子，玉帛金银箱满盈，放水开门皆吉利，男荣女贵寿康宁。","{xx.vei}":"胃星造作事如何，家贵荣华喜气多，埋葬贵临官禄位，夫妇齐眉永保康，婚姻遇此家富贵，三灾九祸不逢他，从此门前多吉庆，儿孙代代拜金阶。","{xx.mao}":"昴星造作进田牛，埋葬官灾不得休，重丧二日三人死，尽卖田园不记增，开门放水招灾祸，三岁孩儿白了头，婚姻不可逢此日，死别生离是可愁。","{xx.bi}":"毕星造作主光前，买得田园有余钱，埋葬此日添官职，田蚕大熟永丰年，开门放水多吉庆，合家人口得安然，婚姻若得逢此日，生得孩儿福寿全。","{xx.zi}":"觜星造作有徒刑，三年必定主伶丁，埋葬卒死多因此，取定寅年使杀人，三丧不止皆由此，一人药毒二人身，家门田地皆退败，仓库金银化作尘。","{xx.can}":"参星造作旺人家，文星照耀大光华，只因造作田财旺，埋葬招疾哭黄沙，开门放水加官职，房房子孙见田加，婚姻许遁遭刑克，男女朝开幕落花。","{xx.jing}":"井星造作旺蚕田，金榜题名第一光，埋葬须防惊卒死，狂颠风疾入黄泉，开门放水招财帛，牛马猪羊旺莫言，贵人田塘来入宅，儿孙兴旺有余钱。","{xx.gui}":"鬼星起造卒人亡，堂前不见主人郎，埋葬此日官禄至，儿孙代代近君王，开门放水须伤死，嫁娶夫妻不久长，修土筑墙伤产女，手扶双女泪汪汪。","{xx.liu}":"柳星造作主遭官，昼夜偷闭不暂安，埋葬瘟惶多疾病，田园退尽守冬寒，开门放水遭聋瞎，腰驼背曲似弓弯，更有棒刑宜谨慎，妇人随客走盘桓。","{xx.xing}":"星宿日好造新房，进职加官近帝王，不可埋葬并放水，凶星临位女人亡，生离死别无心恋，要自归休别嫁郎，孔子九曲殊难度，放水开门天命伤。","{xx.zhang}":"张星日好造龙轩，年年并见进庄田，埋葬不久升官职，代代为官近帝前，开门放水招财帛，婚姻和合福绵绵，田蚕人满仓库满，百般顺意自安然。","{xx.yi}":"翼星不利架高堂，三年二载见瘟惶，埋葬若还逢此日，子孙必定走他乡，婚姻此日不宜利，归家定是不相当，开门放水家须破，少女恋花贪外郎。","{xx.zhen}":"轸星临水造龙宫，代代为官受皇封，富贵荣华增寿禄，库满仓盈自昌隆，埋葬文昌来照助，宅舍安宁不见凶，更有为官沾帝宠，婚姻             function buildStack() {

            // 每次切换 2s 后，把「活跃位置 10 张以外」的 src 卸掉。
            // 不这么做的话翻一圈下来 149 张全在内存里；滑回附近时
            // ensureStackLoaded 会重新取，走 HTTP 缓存几乎无感，而且那时它还是
            // .hidden（display:none），重解码发生在看不见的时候。
            let stackTrimTimer = null;
            function stackTrimLater(activeIndex) {
                clearTimeout(stackTrimTimer);
                stackTrimTimer = setTimeout(function () {
                    const len = stackImgs.length;
                    if (!len) return;
                    for (let d = 10; d < len; d++) {
                        const img = stackImgs[(activeIndex + d) % len];
                        if (img && img.getAttribute('src') && img.dataset.src) {
                            img.removeAttribute('src');
                        }
                    }
                }, 2000);
            }

            function ensureStackLoaded(activeIndex) {
                const len = stackImgs.length;
                // 从 -1 起：往回滑的那一张也提前取回来（0 号往回是最后一张）
                for (let d = -1; d < 7; d++) {
                    const i = ((activeIndex + d) % len + len) % len;
                    const img = stackImgs[i];
                    if (img && !img.getAttribute('src') && img.dataset.src) {
                        img.src = img.dataset.src;
                    }
                }
            }

            let stackPrevActive = -1;

            // 单张图此刻该有的类名
            function stackClassFor(idx, activeIndex, len) {
                if (idx === activeIndex) return 'stack-img active';
                const diff = (idx - activeIndex + len) % len;
                if (diff === 1) return 'stack-img pile';
                if (diff === 2) return 'stack-img pile2';
                if (diff === 3) return 'stack-img pile3';
                return 'stack-img hidden';
            }

            function updateStack(activeIndex) {
                const len = stackImgs.length;
                ensureStackLoaded(activeIndex);
                if (stackPrevActive >= 0 && len > 8) {
                    // 只重算受影响的几张（新旧的 active 附近各 5 张），其余不动。
                    // 原来是每次切换都遍历 149 张、每张做 6 次 classList 操作。
                    const touched = new Set();
                    for (let d = -1; d <= 4; d++) {
                        touched.add((activeIndex + d + len) % len);
                        touched.add((stackPrevActive + d + len) % len);
                    }
                    touched.forEach((i) => {
                        const img = stackImgs[i];
                        if (!img) return;
                        const next = stackClassFor(i, activeIndex, len);
                        if (img.className !== next) img.className = next;
                    });
                } else {
                    stackImgs.forEach((img, idx) => {
                        img.className = stackClassFor(idx, activeIndex, len);
                    });

            /* ------------------------------------------------------------------
               卡片内左右滑动切图
               Pointer Events 一套逻辑同时覆盖手指与鼠标：
                 按下 → 方向判定（竖 >>> 横向不接管，交还页面）
                 拖动 → 当前图跟手位移 + 倾斜 + 缩小，另一张从对侧推上来
                 松手 → 过阈值（卡片宽 20%）换图，否则弹回
               dragged 标记用来吃掉换图后紧跟的那次 click，避免顺带弹出原图。
               ------------------------------------------------------------------ */
            var imgDrag = { on: false, dir: 0, dx: 0, x0: 0, y0: 0, w: 168, moved: false, revived: false };
            var IMG_SLOP = 8;      // 方向死区：小于它算点击（手指抖动的余量）
            var IMG_TRIGGER = .2;  // 换图阈值

            function stackAt(i) {
                var n = slideImages.length;
                if (!n) return null;
                return stackImgs[((i % n) + n) % n] || null;
            }

            // 远处的邻居带着 .hidden（opacity:0!important），内联透明度压不过它，
            // 拖动期间会看不见对侧那张 —— 先摘掉；顺带把还没 src 的图提前取回来，
            // 否则露出来的是 alt 占位而不是照片。松手由 updateStack 复原类名。
            function stackPrepare(i) {
                var img = stackAt(i);
                if (!img) return false;
                if (!img.getAttribute('src') && img.dataset.src) {
                    img.src = img.dataset.src;
                }
                // 给目标图打标：拖动期间只有它和当前图可见
                img.classList.add('stack-in');
                if (img.classList.contains('hidden')) {
                    img.classList.remove('hidden');
                    return true;
                }
                return false;
            }

            // 收掉内联样式，把控制权还给 .stack-img 的类规则；
            // animated=true 时保留 0.46s 过渡，让「弹回 / 换图」是滑过去而不是瞬移
            function stackRelease(img, animated) {
                if (!img) return;
                img.classList.remove('stack-in');
                img.style.transition = animated
                    ? 'transform .46s cubic-bezier(.16,.86,.24,1),opacity .46s ease'
                    : 'none';
                img.style.transform = '';
                img.style.opacity = '';
                img.style.zIndex = '';
                if (animated) setTimeout(function() { img.style.transition = ''; }, 500);
            }

            function stackDragReset(animated) {
                stackRelease(stackAt(slideIndex), animated);
                if (imgDrag.dir) stackRelease(stackAt(slideIndex + imgDrag.dir), animated);
            }

            photoInner.addEventListener('pointerdown', function(e) {
                if (slideImages.length < 2) return;
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                imgDrag.on = true; imgDrag.moved = false; imgDrag.dir = 0; imgDrag.dx = 0;
                imgDrag.x0 = e.clientX; imgDrag.y0 = e.clientY;
                imgDrag.w = photoInner.offsetWidth || 168;
                try { photoInner.setPointerCapture(e.pointerId); } catch (err) {}
            });

            photoInner.addEventListener('pointermove', function(e) {
                if (!imgDrag.on) return;
                var dx = e.clientX - imgDrag.x0;
                var dy = e.clientY - imgDrag.y0;
                if (!imgDrag.dir) {
                    if (Math.abs(dx) < IMG_SLOP && Math.abs(dy) < IMG_SLOP) return;
                    // 以竖向为主：不抢手势，让页面自己处理
                    if (Math.abs(dy) > Math.abs(dx)) { imgDrag.on = false; return; }
                    imgDrag.dir = dx > 0 ? -1 : 1;   // 右滑 = 上一张
                    imgDrag.moved = true;
                    imgDrag.revived = stackPrepare(slideIndex + imgDrag.dir);
                    platePhotoEl.classList.add('dragging');

                    if (TimerManager.tasks.slide) TimerManager.tasks.slide.lastRun = performance.now();
                }
                imgDrag.dx = dx;
                var p = Math.min(1, Math.abs(dx) / (imgDrag.w * .95));
                var cur = stackAt(slideIndex);
                var inc = stackAt(slideIndex + imgDrag.dir);
                if (cur) {
                    cur.style.transition = 'none';
                    cur.style.transform = 'translateX(' + dx.toFixed(1) + 'px) rotate(' +
                        (dx / 34).toFixed(2) + 'deg) scale(' + (1 - p * .07).toFixed(3) + ')';
                    cur.style.opacity = (1 - p * .45).toFixed(3);
                }
                if (inc) {
                    // 对侧那张从堆叠位（90%）推到 100%，越滑越实

                        'px) translateY(' + (8 * (1 - p)).toFixed(1) + 'px) scale(' +
                        (.9 + p * .1).toFixed(3) + ')';

                }
                // 首帧强制一次样式落地：把「摘掉 hidden 后的不透明度」记为过渡起点，
                // 否则松手那一刻会误从 opacity:0 开始淡入，看上去像闪了一下
                if (!imgDrag.flushed) {
                    void photoInner.offsetWidth;
                    imgDrag.flushed = true;
                }
            });

            // 手势中断（竖向滚动抢走 / 来电 / 切后台）：样式归位，不动当前图
            function imgDragAbort() {
                platePhotoEl.classList.remove('dragging');
                photoInner.classList.remove('dragging');
                stackDragReset(true);            // 这里还要用到 dir
                if (imgDrag.revived) { updateStack(slideIndex); imgDrag.revived = false; }
                imgDrag.on = false;
                imgDrag.dx = 0; imgDrag.dir = 0;
            }

            function imgDragEnd() {
                if (!imgDrag.on) return;
                imgDrag.on = false;
                platePhotoEl.classList.remove('dragging');
                photoInner.classList.remove('dragging');
                var dir = imgDrag.dir, dx = imgDrag.dx;
                if (!dir) { imgDrag.dx = 0; return; }
                var far = Math.abs(dx) > Math.max(32, imgDrag.w * IMG_TRIGGER);
                if (far) {

                    // 会从 opacity:0 重新淡入，等于闪一下 —— 这一张改成纯位移接棒
                    var inc = stackAt(slideIndex + dir);

                    if (TimerManager.tasks.slide) TimerManager.tasks.slide.lastRun = performance.now();
                    if (navigator.vibrate) { try { navigator.vibrate(6); } catch (err) {} }
                } else {

                }

            // ===== 灵动岛 =====
            const textPool = ["❤️ 刘亦菲", "苏FA36165", "Xiaomi SU7 Pro", "许红豆", "刘茜美子"];
            let tidx = 0;

            // ===== 头像轮播 =====
            // 双层切换：旧图留在下层（avatar-prev）当底，新图先 decode 再进入，
            // 所以不会出现「先白一帧再出图」的闪烁；同时外圈扫一道光弧。
            let avatarSwapLock = false;
            let avatarArcTimer = null;

            function playAvatarArc() {
                if (!avatarEl) return;
                avatarEl.classList.remove('swapping');
                void avatarEl.offsetWidth;          // 强制回流，让同一动画能连续重播
                avatarEl.classList.add('swapping');

            function swapAvatar(src) {
                if (!src) return;

                // 旧结构没有 prev 层时退化为一句话赋值
                if (!avatarImgPrev) { avatarImg.src = src; return; }
                if (avatarSwapLock) { avatarImg.src = src; return; }

                const base = avatarImg.currentSrc || avatarImg.src;
                if (base) {
                    avatarImgPrev.src = base;
                    avatarImgPrev.style.opacity = '1';
                }

                const run = function() {
                    avatarSwapLock = true;
                    avatarImg.src = src;

                        document.removeEventListener('visibilitychange', onVis);
                    }
                };
                window.addEventListener('beforeunload', onUnload);
                document.addEventListener('visibilitychange', onVis);

                try {
                    window.location.href = config.scheme;
                } catch (e) {
                    isJumping = false;
                    window.removeEventListener('beforeunload', onUnload);
                    document.removeEventListener('visibilitychange', onVis);
                    return;

                setTimeout(() => {
                    if (!unloaded && isJumping) {

            /* ------------------------------------------------------------------
               静置冻结｜60 秒没有任何交互 → 暂停全部无限循环的装饰动画
               （光环呼吸 / 双环旋转 / 岛面扫光 / 三行渐变文字流动）
               冻结后合成器不再每帧提交，屏幕刷新率才能落回 1~10Hz，
               长时间挂着不发烫主要就靠这一下。任意触摸 / 滚动 / 按键立刻解冻，
               动画从暂停的那一帧接着走，不会跳。
               ------------------------------------------------------------------ */
            const IDLE_MS = 60000;
            let idleTimer = null;
            function setIdle(on) {
                document.documentElement.classList.toggle('power-idle', !!on);
            }
            function wakeIdle() {
                if (idleTimer) { clearTimeout(idleTimer); idleTimer = null; }
                setIdle(false);
                idleTimer = setTimeout(function () {
                    idleTimer = null;
                    if (document.hidden) return;
                    setIdle(true);
                }, IDLE_MS);
            }
            ['pointerdown', 'touchstart', 'keydown', 'wheel', 'scroll'].forEach(function (ev) {
                document.addEventListener(ev, wakeIdle, { passive: true });
            });
            wakeIdle();

                if (typeof viewer !== 'undefined' && viewer && viewer.classList.contains('show')) return;
                var k = e.key;
                if (typeof videoPopup !== 'undefined' && videoPopup && videoPopup.classList.contains('active')) {
                    if (k === 'Escape') { closePopup(); return; }
                    if (k === ' ' || k === 'Spacebar') { e.preventDefault(); if (popupVideo.paused) { playWithSound(popupVideo); } else { popupVideo.pause(); } return; }
                    if (k === 'Enter') { e.preventDefault(); if (popupVideo.paused) { playWithSound(popupVideo); } else { popupVideo.pause(); } return; }
                    return;

                function buildPlace(road, town, village, district, city, province) {
                    road = geoClean(road);

                    city = geoClean(city);
                    province = geoClean(province);

                    // 否则位置行像复读：「文峰村 · 文峰镇」「南通市 · 江苏省 · 南通」
                    function dup(a, b) {
                        if (!a || !b) return false;
                        if (a.indexOf(b) >= 0 || b.indexOf(a) >= 0) return true;
                        var tail = /(特别行政区|自治区|自治州|自治县|自治旗|街道|社区|省|市|区|县|旗|镇|乡|村|路|街|道|巷|弄|里)$/;
                        var ac = a.replace(tail, ''), bc = b.replace(tail, '');
                        return ac.length >= 2 && bc.length >= 2 && (ac.indexOf(bc) >= 0 || bc.indexOf(ac) >= 0);
                    }
                    if (village && town && dup(village, town)) town = '';
                    if (town && district && dup(town, district)) district = '';
                    if (district && city && dup(district, city)) city = '';
                    if (city && province && dup(city, province)) province = '';

                    var short, level;
                    if (village) {
                        // 村 · 镇 —— 这就是「精确到村」那一档
                        var up1 = town || district || city;
                        short = up1 ? village + ' · ' + up1 : village;
                        level = 6;
                    } else if (town) {

                        var up2 = district || (/省$/.test(city) ? '' : city);
                        short = up2 ? town + ' · ' + up2 : town;
                        level = 5;
                    } else if (road) {
                        var up3 = district || (/省$/.test(city) ? '' : city);
                        short = up3 ? road + ' · ' + up3 : road;
                        level = 4;
                    } else if (district) {
                        short = district;
                        level = 3;
                    } else if (city) {
                        short = city;
                        level = 2;
                    } else {
                        short = '当前位置';
                        level = 1;
                    }

                    if (short.length > 11 && (village || town)) short = village || town;
                    var full = [province, city, district, town, village, road].filter(Boolean).join(' · ') || short;
                    return {
                        short: short,
                        full: full,
                        displayName: short,
                        road: road,
                        town: town,
                        village: village,
                        district: district,
                        city: city,
                        province: province,
                        level: level
