                        geoRoad,
                        geoPick(a.town, a.suburb, a.city_district),
                        geoPick(a.village, a.hamlet, a.neighbourhood, a.quarter),
                        geoPick(a.district, a.county, a.municipality, cityIsDistrict ? cityRaw : ''),
                        cityIsDistrict ? '' : cityRaw,
                        geoPick(a.state, a.province)
                    );
                    r.src = 'nominatim';
                    return r;
                }

                async function geoBigDataCloud(lat, lon) {
                    var url = 'https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=' + lat +
                        '&longitude=' + lon + '&localityLanguage=zh';
                    var res = await fetch(url, { signal: AbortSignal.timeout(3200) });
                    if (!res.ok) throw new Error('bdc ' + res.status);
                    var data = await res.json();
                    var adm = (data.localityInfo && data.localityInfo.administrative) || [];
                    var road = '', town = '', village = '', district = '', city = '', province = '';
                    // 从最细一级往上扫。BigDataCloud 的 adminLevel 在街道这层不稳
                    // （同一个市里 8/9 都出现过），所以先按名字后缀定性，再用 adminLevel 认区县：
                    //   10 腾飞社区 · 9 江海街道 · 8 文峰街道 · 6 崇川区 · 5 南通市 · 4 江苏省
                    for (var i = adm.length - 1; i >= 0; i--) {
                        var it = adm[i] || {};
                        var n = (it.name || '').trim();
                        if (!n) continue;
                        var lv = it.adminLevel || 0;
                        // 村/社区最细，先判：否则「xx镇」的规则会把「xx村」抢走
                        if (/(社区|村|嘎查|居委会)$/.test(n)) { if (!village) village = n; continue; }
                        if (/(街道|镇|乡|苏木)$/.test(n)) { if (!town) town = n; continue; }
                        if (/(路|街|大道|大街|巷|弄|里|胡同)$/.test(n)) { if (!road) road = n; continue; }
                        // 区县按 adminLevel=6 认，越靠上层越权威：
                        // 「南通经济技术开发区」这类占位会被真正的「崇川区」顶掉
                        if (lv === 6) { district = n; continue; }
                        if (lv === 5) { if (!city) city = n; continue; }
                        if (lv === 4) { if (!province) province = n; continue; }
                        if (!district && /(区|县|旗)$/.test(n)) { district = n; continue; }
                        if (!city && /市$/.test(n)) city = n;
                    }
                    if (!road) {
                        var inf = (data.localityInfo && data.localityInfo.informative) || [];
                        for (var k = 0; k < inf.length; k++) {
                            var it = inf[k] || {};
                            if (/(road|street|highway|route)/i.test(it.description || '') &&
                                /(路|街|大道|大街|巷|弄|里)$/.test(it.name || '')) { road = it.name; break; }
                        }
                    }
                    if (!district) district = data.locality || '';
                    if (!city) city = data.city || '';
                    if (!province) province = data.principalSubdivision || '';
                    var r = buildPlace(road, town, village, district, city, province);
                    r.src = 'bdc';
                    return r;
                }

                // v2：多了 road 字段，换 key 让旧的「只到街道」缓存失效
                var GEO_CACHE_KEY = STORAGE_PREFIX + 'geo_place_v2';

                function readGeoCache(lat, lon) {
                    try {
                        var raw = localStorage.getItem(GEO_CACHE_KEY);
                        if (!raw) return null;
                        var o = JSON.parse(raw);
                        if (!o || !o.d || !o.t) return null;
                        // 位置要「实时」：20 分钟就过期，不能像以前那样缓存 7 天
                        if (Date.now() - o.t > 20 * 60000) return null;
                        // 0.002° ≈ 220m：走出 250m 就算换了路段，必须重新解析，
                        // 否则人已经走到隔壁路，卡片还挂着上一条路名
                        if (Math.abs(o.lat - lat) > 0.002 || Math.abs(o.lon - lon) > 0.002) return null;
                        return o.d;
                    } catch (e) { return null; }
                }

                function writeGeoCache(lat, lon, d) {
                    try {
                        localStorage.setItem(GEO_CACHE_KEY, JSON.stringify({ t: Date.now(), lat: lat, lon: lon, d: d }));
                    } catch (e) {}
                }

                function pickBestPlace(list) {
                    var best = null;
                    for (var i = 0; i < list.length; i++) {
                        var c = list[i];
                        if (!c) continue;
                        if (!best) { best = c; continue; }
                        var cl = c.level || 0, bl = best.level || 0;
                        if (cl > bl) { best = c; continue; }
                        // 同级时优先 Nominatim：BigDataCloud 的中文常返回繁体
                        if (cl === bl && c.src === 'nominatim' && best.src !== 'nominatim') best = c;
                    }
                    return best;
                }

                // 单个请求套超时：超时就当没回来，不拖住整体
                function withTimeout(p, ms) {
                    return Promise.race([
                        p.then(function (v) { return v; }).catch(function () { return null; }),
                        new Promise(function (r) { setTimeout(function () { r(null); }, ms); })
                    ]);
                }

                async function fetchLocationDetails(lat, lon, force) {
                    // force=true 用于实时跟随：位置动了就别再吃缓存，直接重新解析
                    if (!force) {
                        var cached = readGeoCache(lat, lon);
                        if (cached) return cached;
                    }

                    var got = [];
                    function collect(p) {
                        return p.then(function (r) {
                            if (r && r.short) got.push(r);
                        }).catch(function () {});
                    }

                    // 两个源并行发出、并行等待：谁先回来都不浪费，取最细的那个
                    await Promise.all([
                        withTimeout(collect(geoNominatim(lat, lon)), 1500),
                        withTimeout(collect(geoBigDataCloud(lat, lon)), 3400)
                    ]);

                    var best = pickBestPlace(got);
                    if (!best) {
                        best = { short: '当前位置', full: '', displayName: '当前位置', road: '', town: '', village: '', district: '', city: '', province: '', level: 0 };
                    }
                    // 只缓存到街道级以上的结果：只拿到「区县」说明这次坐标太粗，
                    // 缓存下来会让后面更准的定位也被旧结果顶着
                    if (best.level >= 3) writeGeoCache(lat, lon, best);
                    return best;
                }

                // 要「500m 内落到具体某条路」就不能只取第一帧：首帧常是基站定位（1~3km）。
                // 改成 watchPosition 连续采样，取 accuracy 最小的一帧：
                //   ≤120m 直接收工（手机 GPS 的稳定精度，再等只是耗电）
                //   窗口到点还没收敛，就再补一轮（GPS 冷启动常要 10~20s）
                //   maximumAge:0 —— 缓存位置可能已经漂了，宁可多等两秒
                function geoWatchBest(passive, windowMs) {
                    return new Promise(function (resolve, reject) {
                        var best = null, done = false, wid = null, timer = null;
                        function kill() {
                            if (timer) { clearTimeout(timer); timer = null; }
                            try { if (wid !== null) navigator.geolocation.clearWatch(wid); } catch (e) {}
                            wid = null;
                        }
                        function settle(ok, val) {
                            if (done) return;
                            done = true; kill();
                            if (ok) resolve(val); else reject(val);
                        }
                        try {
                            wid = navigator.geolocation.watchPosition(
                                function (pos) {
                                    if (!pos || !pos.coords) return;
                                    if (!best || pos.coords.accuracy < best.coords.accuracy) best = pos;
                                    // 120m 已经远好于 500m 目标，够判定到脚下这条路，没必要再等（省电也省时）
                                    if (best.coords.accuracy <= 120) settle(true, best);
                                },
                                function (err) {
                                    // 已经拿到过定位就先用着，别因为后续报错丢掉结果
                                    if (best) settle(true, best); else settle(false, err);
                                },
                                {
                                    enableHighAccuracy: !passive,
                                    maximumAge: 0,
                                    timeout: passive ? 8000 : 12000
                                }
                            );
                        } catch (e) { settle(false, e); return; }
                        // 采样窗口到点就用手上最准的那帧
                        timer = setTimeout(function () {
                            if (best) settle(true, best); else settle(false, new Error('geo-timeout'));
                        }, windowMs || (passive ? 6000 : 15000));
                    });
                }

                // 目标：水平精度 ≤ 500m —— 只有落在 500m 内，反查出来的路名才是脚下这条。
                // 第一轮不够准就再等一轮；两轮都不够也照用最好的那帧，空白定位更糟。
                function getPositionAccurate() {
                    if (!navigator.geolocation) return Promise.reject(new Error('unsupported'));
                    return geoWatchBest(false, 15000).then(function (first) {
                        geoAccuracy = (first && first.coords && first.coords.accuracy) || 0;
                        if (geoAccuracy <= 500) return first;
                        return geoWatchBest(false, 10000).then(function (second) {
                            if (!second || !second.coords) return first;
                            if (second.coords.accuracy >= geoAccuracy) return first;
                            geoAccuracy = second.coords.accuracy;
                            return second;
                        }, function () { return first; });
                    }).catch(function () {
                        // 高精度彻底拿不到（室内/拒绝/无 GPS）才退到联网粗定位，至少不空着
                        return geoWatchBest(true, 6000).then(function (p) {
                            geoAccuracy = (p && p.coords && p.coords.accuracy) || 0;
                            return p;
                        });
                    });
                }

                /* ------------------------------------------------------------------
                   实时跟随｜位置变了才刷新，不是定时无脑打接口
                   - 位移 > max(250m, 自身误差×1.5) 才算真的动了（静置时 GPS 也会漂几十米）
                   - 精度 > 900m 的帧直接丢：多半是基站兜底，会把路名指到隔壁街
                   - 25 秒内不重复反查，走动时也不会把两个逆地理接口打爆
                   - 只有跨了 5km 才重拉天气；平常换条路只更新文字，省流量也省电
                   - 页面切后台自动停监停，回到前台再续上
                   ------------------------------------------------------------------ */
                var geoAccuracy = 0;      // 最近一次定位的水平精度（米）
                var geoFollow = { wid: null, lat: null, lon: null, at: 0 };
                var geoWeatherAt = { lat: DEFAULT_LAT, lon: DEFAULT_LON };

                function geoDistance(lat1, lon1, lat2, lon2) {
                    var R = 6371000, rad = Math.PI / 180;
                    var dLat = (lat2 - lat1) * rad, dLon = (lon2 - lon1) * rad;
                    var s = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                            Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLon / 2) * Math.sin(dLon / 2);
                    return 2 * R * Math.asin(Math.sqrt(s));
                }

                // 位置行先淡下去再换字，直接替换会显得突兀
                function setLocationText(text, full) {
                    var el = document.getElementById('weatherLocation');
                    if (!el || !text) return;
                    el.classList.add('loc-updating');
                    setTimeout(function () {
                        el.textContent = text;
                        el.title = (full || '') + (geoAccuracy ? ' · 精度 ' + Math.round(geoAccuracy) + 'm' : '');
                        el.classList.remove('loc-updating');
                    }, 200);
                }

                function geoFollowRefresh(lat, lon) {
                    if (Date.now() - geoFollow.at < 25000) return;      // 25s 内不重复反查
                    geoFollow.at = Date.now();
                    fetchLocationDetails(lat, lon, true).then(function (d) {
                        if (isManualCity || !d || !d.short) return;
                        if (d.short !== currentCity) {
                            currentCity = d.short;
                            currentLat = lat;
                            currentLon = lon;
                            setLocationText(d.short, d.full);
                        }
                        // 跨城/跨区才重拉天气，否则一天走动几十次会把接口打爆
                        if (geoDistance(geoWeatherAt.lat, geoWeatherAt.lon, lat, lon) > 5000) {
                            geoWeatherAt = { lat: lat, lon: lon };
                            fetchWeather(lat, lon, d);
                        }
                    }).catch(function () {});
                }

                function startGeoFollow() {
                    if (geoFollow.wid !== null || isManualCity) return;
                    if (!navigator.geolocation) return;
                    try {
                        geoFollow.wid = navigator.geolocation.watchPosition(function (pos) {
                            if (!pos || !pos.coords) return;
                            var la = pos.coords.latitude, lo = pos.coords.longitude;
                            var acc = pos.coords.accuracy || 0;
                            if (acc > 900) return;                       // 太粗，不可信
                            if (geoFollow.lat === null) { geoFollow.lat = la; geoFollow.lon = lo; return; }
                            var d = geoDistance(geoFollow.lat, geoFollow.lon, la, lo);
                            // 阈值取「250m 或自身误差的 1.5 倍」，避免站着不动也一直刷新
                            if (d < Math.max(250, acc * 1.5)) return;
                            geoFollow.lat = la; geoFollow.lon = lo;
                            geoAccuracy = acc;
                            geoFollowRefresh(la, lo);
                        }, function () {}, {
                            enableHighAccuracy: true,
                            maximumAge: 20000,
                            timeout: 30000
                        });
                    } catch (e) { geoFollow.wid = null; }
                }

                function stopGeoFollow() {
                    if (geoFollow.wid === null) return;
                    try { navigator.geolocation.clearWatch(geoFollow.wid); } catch (e) {}
                    geoFollow.wid = null;
                }

                // 切后台就停（长时间开着 GPS 最费电），回前台再跟上
                document.addEventListener('visibilitychange', function () {
                    if (document.hidden) stopGeoFollow();
                    else if (!isManualCity) startGeoFollow();
                });

                async function fetchWeather(lat, lon, cityName) {
                    try {
                        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m,wind_direction_10m,surface_pressure,visibility,is_day,weather_code&hourly=temperature_2m,precipitation_probability,precipitation,weather_code,is_day&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset&timezone=auto&forecast_days=7&forecast_hours=26`;
                        const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const data = await res.json();
                        // 统一从 current 取（current_weather 已弃用），缺字段时抛错走降级
                        const cur = data.current || {};
                        const cw = {
                            temperature: cur.temperature_2m,
                            weathercode: cur.weather_code,
                            is_day: cur.is_day
                        };
                        if (cw.temperature === undefined) throw new Error('no current data');

                        const code = cw.weathercode;
                        const iconClass = WEATHER_ICON_MAP[code] || 'fa-sun';
                        const desc = WEATHER_DESC_MAP[code] || '未知';
                        const temp = Math.round(cw.temperature);
                        // 缓存一份给 7 天面板用
                        window.__wxData = {
                            daily: data.daily || null,
                            hourly: data.hourly || null,
                            ct: cur.time || '',
                            temp: temp,
                            desc: desc,
                            icon: iconClass,
                            city: (cityName && cityName.short) || cityName || '当前位置'
                        };

                        // 夜间把右上角图标换成月亮系，卡片同时加 .night
                        var isNight = (cur.is_day === 0);
                        var iconShow = iconClass;
                        if (isNight) {
                            if (code === 0 || code === 1) iconShow = 'fa-moon';
                            else if (code === 2) iconShow = 'fa-cloud-moon';
                            else if (code === 3) iconShow = 'fa-cloud';
                            else if (code >= 51 && code <= 67) iconShow = 'fa-cloud-moon-rain';
                            else if (code >= 71 && code <= 77) iconShow = 'fa-snowflake';
                            else if (code >= 80 && code <= 82) iconShow = 'fa-cloud-moon-rain';
                            else if (code >= 95) iconShow = 'fa-cloud-bolt';
                        }
                        var wxEl = document.getElementById('weatherWidget');
                        if (wxEl) wxEl.classList.toggle('night', isNight);
                        document.getElementById('weatherIcon').innerHTML = '<i class="fa-solid ' + iconShow + '"></i>';
                        document.getElementById('weatherTemp').textContent = temp + '°C';
                        document.getElementById('weatherDesc').textContent = desc;
                        var locEl = document.getElementById('weatherLocation');
                        var locShort = (cityName && cityName.short) || cityName || '当前位置';
                        var locFull = (cityName && cityName.full) || '';
                        locEl.textContent = locShort;
                        // 手动选城时没有 full，清掉上一次自动定位留下的 title；
                        // 自动定位把水平精度也挂上去，长按能看到是不是真的进了 500m
                        locEl.title = (locFull || '') +
                            (!isManualCity && geoAccuracy ? ' · 精度 ' + Math.round(geoAccuracy) + 'm' : '');

                        let maxTemp = '--', minTemp = '--';
                        if (data.daily && data.daily.temperature_2m_max && data.daily.temperature_2m_max.length > 0) {
                            maxTemp = Math.round(data.daily.temperature_2m_max[0]);
                        }
                        if (data.daily && data.daily.temperature_2m_min && data.daily.temperature_2m_min.length > 0) {
                            minTemp = Math.round(data.daily.temperature_2m_min[0]);
                        }
                        document.getElementById('weatherMaxTemp').textContent = maxTemp + '°';
                        document.getElementById('weatherMinTemp').textContent = minTemp + '°';

                        // ---- 实时细项：体感 / 湿度 / 紫外线 / 能见度 / 风 / 气压 / 日出日落 ----
                        function wxSet(id, v) {
                            var el = document.getElementById(id);
                            if (el) el.textContent = v;
                        }
                        var hum = cur.relative_humidity_2m;
                        var feels = cur.apparent_temperature;
                        var press = cur.surface_pressure;
                        var wspd = cur.wind_speed_10m;
                        var wdeg = cur.wind_direction_10m;
                        var vis = cur.visibility;
                        var daily = data.daily || {};
                        var uv = daily.uv_index_max ? daily.uv_index_max[0] : null;

                        wxSet('wxFeels', (feels === undefined || feels === null) ? '--' : Math.round(feels) + '°');
                        wxSet('wxHumidity', (hum === undefined || hum === null) ? '--' : Math.round(hum) + '%');
                        wxSet('wxUv', (uv === undefined || uv === null) ? '--' : (Math.round(uv * 10) / 10));
                        wxSet('wxUvLv', uvLevel(uv));
                        // 能见度（接口给米）：<10km 保留 1 位小数，≥10km 取整
                        var visText = '--';
                        if (vis !== undefined && vis !== null && !isNaN(vis)) {
                            var vkm = vis / 1000;
                            visText = (vkm >= 10 ? Math.round(vkm) : Math.round(vkm * 10) / 10) + 'km';
                        }
                        wxSet('wxVisibility', visText);
                        wxSet('wxWind', (wdeg === undefined || wdeg === null) ? '--' :
                              degToWindDirection(wdeg).replace('风', '') + ' ' + windToBf(wspd) + '级');
                        wxSet('wxPressure', (press === undefined || press === null) ? '--' :
                              Math.round(press) + ' hPa');
                        wxSet('wxSunrise', fmtHourMin(daily.sunrise ? daily.sunrise[0] : ''));
                        wxSet('wxSunset', fmtHourMin(daily.sunset ? daily.sunset[0] : ''));

                        // 日出→日落 的当日进度：光点落在当前时间的位置
                        var sunPct = null;
                        try {
                            var srIso = daily.sunrise ? daily.sunrise[0] : null;
                            var ssIso = daily.sunset ? daily.sunset[0] : null;
                            if (srIso && ssIso) {
                                var t0 = new Date(srIso).getTime();
                                var t1 = new Date(ssIso).getTime();
                                if (t1 > t0) {
                                    var pg = (Date.now() - t0) / (t1 - t0);
                                    pg = Math.max(0, Math.min(1, pg));
                                    sunPct = pg;
                                    var ln = document.querySelector('.wx-sun-line');
                                    if (ln) ln.style.setProperty('--p', (pg * 100).toFixed(1) + '%');
                                }
                            }
                        } catch (e3) { console.warn('日出进度计算失败:', e3); }

                        // 7 天面板的「实时」页复用这一份数据：直接从刚写好的 DOM 取值，
                        // 免得再算一遍格式（风向/风力/能见度/紫外线等级各有各的写法）
                        if (window.__wxData) {
                            var wxTxt = function (id) {
                                var el = document.getElementById(id);
                                return el ? el.textContent : '--';
                            };
                            window.__wxData.now = {
                                feels: wxTxt('wxFeels'),
                                hum: wxTxt('wxHumidity'),
                                wind: wxTxt('wxWind'),
                                press: wxTxt('wxPressure'),
                                vis: wxTxt('wxVisibility'),
                                uv: wxTxt('wxUv'),
                                uvLv: wxTxt('wxUvLv'),
                                sunrise: wxTxt('wxSunrise'),
                                sunset: wxTxt('wxSunset'),
                                sunPct: sunPct
                            };
                            window.__wxData.max = maxTemp;
                            window.__wxData.min = minTemp;
                            window.__wxData.at = Date.now();
                        }


                    } catch (e) {
                        console.warn('天气获取失败:', e);
                        document.getElementById('weatherDesc').textContent = '获取失败';
                        document.getElementById('weatherMaxTemp').textContent = '--°';
                        document.getElementById('weatherMinTemp').textContent = '--°';
                    }
                }

                function locateAndFetchWeather() {
                    const locEl = document.getElementById('weatherLocation');
                    const descEl = document.getElementById('weatherDesc');

                    if (isManualCity) {
                        fetchWeather(currentLat, currentLon, currentCity);
                        return;
                    }

                    if (!navigator.geolocation) {
                        locEl.textContent = DEFAULT_CITY;
                        descEl.textContent = '定位不支持';
                        currentLat = DEFAULT_LAT;
                        currentLon = DEFAULT_LON;
                        currentCity = DEFAULT_CITY;
                        fetchWeather(DEFAULT_LAT, DEFAULT_LON, DEFAULT_CITY);
                        return;
                    }

                    locEl.textContent = '定位中...';
                    descEl.textContent = '定位中';

                    getPositionAccurate().then(function (position) {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        currentLat = lat;
                        currentLon = lon;
                        locEl.textContent = '解析道路...';
                        // 反查失败不影响天气本身，退回「当前位置」继续
                        return fetchLocationDetails(lat, lon).then(function (details) {
                            currentCity = details.displayName;
                            fetchWeather(lat, lon, details);
                        }, function () {
                            currentCity = '当前位置';
                            fetchWeather(lat, lon, '当前位置');
                        });
                    }).catch(function (error) {
                        console.warn('定位失败:', error && error.message);
                        currentLat = DEFAULT_LAT;
                        currentLon = DEFAULT_LON;
                        currentCity = DEFAULT_CITY;
                        locEl.textContent = DEFAULT_CITY;
                        descEl.textContent = '定位失败';
                        fetchWeather(DEFAULT_LAT, DEFAULT_LON, DEFAULT_CITY);
                        showToastMsg('定位失败，点击天气卡片可手动选择城市');
                    });

                    // 首帧定位之后开启实时跟随：人走动时路名跟着变（切后台自动暂停）
                    startGeoFollow();
                }

                function updateCalendar() {
                    const now = selectedDate;

                    const year = now.getFullYear();
                    const month = now.getMonth() + 1;
                    const date = now.getDate();
                    const dayOfWeek = now.getDay();

                    const weekdaysCN = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                    const weekdaysShort = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

                    document.getElementById('calendarDayNum').textContent = date;
                    document.getElementById('calendarDayLabel').textContent = weekdaysShort[dayOfWeek];
                    document.getElementById('calendarYearMonth').textContent = year + '年' + month + '月';
                    document.getElementById('calendarWeekday').textContent = weekdaysCN[dayOfWeek];

                    const holidayInfo = getHolidayInfo(now);
                    const holidayTagEl = document.getElementById('calendarHolidayTag');
                    const dateBlockEl = document.getElementById('calendarDateBlock');

                    dateBlockEl.classList.remove('holiday', 'workday');
                    holidayTagEl.classList.remove('holiday', 'workday', 'normal');

                    if (holidayInfo.type === 1) {
                        dateBlockEl.classList.add('holiday');
                        holidayTagEl.classList.add('holiday');
                        holidayTagEl.textContent = holidayInfo.name + ' 休';
                    } else if (holidayInfo.type === 3) {
                        dateBlockEl.classList.add('workday');
                        holidayTagEl.classList.add('workday');
                        holidayTagEl.textContent = holidayInfo.name + ' 班';
                    } else if (holidayInfo.type === 2) {
                        holidayTagEl.classList.add('holiday');
                        holidayTagEl.textContent = '周末 休';
                    } else {
                        holidayTagEl.classList.add('normal');
                        holidayTagEl.textContent = '工作日';
                    }

                    if (typeof Solar !== 'undefined') {
                        try {
                            const solar = Solar.fromDate(now);
                            const lunar = solar.getLunar();

                            document.getElementById('calendarLunar').textContent =
                                '农历' + lunar.getMonthInChinese() + '月' + lunar.getDayInChinese();

                            // 今日宜忌（黄历实时推算）
                            try {
                                var yiArr = (typeof lunar.getDayYi === 'function') ? (lunar.getDayYi() || []) : [];
                                var jiArr = (typeof lunar.getDayJi === 'function') ? (lunar.getDayJi() || []) : [];
                                var yiEl = document.getElementById('calYi');
                                var jiEl = document.getElementById('calJi');
                                if (yiEl) yiEl.textContent = yiArr.length ? yiArr.slice(0, 3).join(' ') : '--';
                                if (jiEl) jiEl.textContent = jiArr.length ? jiArr.slice(0, 3).join(' ') : '--';
                            } catch (e2) { console.warn('宜忌推算失败:', e2); }

                        } catch (e) {
                            console.warn('农历获取失败:', e);
                            document.getElementById('calendarLunar').textContent = '农历 --';
                        }
                    } else {
                        document.getElementById('calendarLunar').textContent = '农历 --';
                    }
                }

                const cityPickerOverlay = document.getElementById('cityPickerOverlay');
                const citySearchInput = document.getElementById('citySearchInput');
                const cityListEl = document.getElementById('cityList');

                /* ==================================================================
                   选地点：省 / 市 / 县 / 镇 / 村
                   ------------------------------------------------------------------
                   ① 离线索引（页面末尾 #areaIndex）：全国 34 省 · 363 市 · 2812 区县，
                      每条带中心点。模糊匹配全在本地做，敲一个字就出结果，断网也能用。
                   ② 远程补全（open-meteo 的 GeoNames 库，免密钥）：补 镇 / 村。
                      GeoNames 对国内村镇是抽样覆盖，命中才有，命中就给。
                   ================================================================== */
                var AREA_LIST = null;
                var AREA_TAIL = /(特别行政区|自治区|自治州|自治县|自治旗|地区|新区|开发区|林区|矿区|街道|社区|省|市|区|县|旗|镇|乡|村|盟)$/;

                function areaIndex() {
                    if (AREA_LIST) return AREA_LIST;
                    AREA_LIST = [];
                    var el = document.getElementById('areaIndex');
                    if (!el) return AREA_LIST;
                    var lines = el.textContent.split('\n');
                    var prov = '', cityName = '';
                    for (var i = 0; i < lines.length; i++) {
                        var line = lines[i].replace(/\s+$/, '');
                        if (!line) continue;
                        if (line.charAt(0) === '#') {
                            var p = line.slice(1).split('|');
                            prov = p[0];
                            cityName = '';
                            var pc = (p[1] || '').split(',');
                            if (pc.length === 2 && pc[0]) {
                                AREA_LIST.push({ n: prov, l: 1, lon: +pc[0], lat: +pc[1], p: '', c: '' });
                            }
                            continue;
                        }
                        var seg = line.split('|');
                        cityName = seg[0];
                        var cc = (seg[1] || '').split(',');
                        if (cc.length === 2 && cc[0]) {
                            AREA_LIST.push({ n: cityName, l: 2, lon: +cc[0], lat: +cc[1], p: prov, c: '' });
                        }
                        var ds = seg[2] ? seg[2].split(';') : [];
                        for (var k = 0; k < ds.length; k++) {
                            var cut = ds[k].lastIndexOf(':');
                            if (cut <= 0) continue;
                            var xy = ds[k].slice(cut + 1).split(',');
                            if (xy.length !== 2) continue;
                            AREA_LIST.push({ n: ds[k].slice(0, cut), l: 3, lon: +xy[0], lat: +xy[1], p: prov, c: cityName });
                        }
                    }
                    return AREA_LIST;
                }

                // 全角转半角 + 去多余空格 + 小写：手机上拼音键盘容易带出全角冒号/空格
                function areaNorm(s) {
                    return String(s || '').replace(/[\uFF01-\uFF5E]/g, function (ch) {
                        return String.fromCharCode(ch.charCodeAt(0) - 0xFEE0);
                    }).replace(/\s+/g, ' ').trim().toLowerCase();
                }

                function areaScore(e, q, qb) {
                    var n = e.n, nb = n.replace(AREA_TAIL, '');
                    if (n === q || nb === q) return 1000 - e.l;
                    if (n.indexOf(q) === 0) return 900 - n.length * 6 - e.l;
                    if (nb.indexOf(q) === 0) return 860 - n.length * 6 - e.l;
                    // 单字只认开头，不然「州」能搜出两百个县
                    if (q.length >= 2 && n.indexOf(q) > 0) return 700 - n.length * 6 - e.l;
                    if (q.length >= 2 && nb.indexOf(q) >= 0) return 650 - n.length * 6 - e.l;
                    return 0;
                }

                function searchArea(q) {
                    var list = areaIndex(), hits = [];
                    var tokens = q.split(' ').filter(Boolean);
                    for (var i = 0; i < list.length; i++) {
                        var e = list[i], s = 0;
                        if (tokens.length > 1) {
                            // 多段关键词：每段都要命中（「南通 崇川」这样按市 + 区县找）
                            var hay = e.n + ' ' + e.p + ' ' + e.c;
                            var okAll = true;
                            for (var t = 0; t < tokens.length; t++) {
                                if (hay.indexOf(tokens[t]) < 0) { okAll = false; break; }
                            }
                            s = okAll ? 800 - e.l : 0;
                        } else {
                            s = areaScore(e, q, q);
                        }
                        if (s > 0) hits.push({ e: e, s: s });
                    }
                    hits.sort(function (a, b) { return b.s - a.s; });
                    var out = [];
                    for (var j = 0; j < hits.length && out.length < 12; j++) out.push(hits[j].e);
                    return out;
                }

                var GEO_REMOTE_URL = 'https://geocoding-api.open-meteo.com/v1/search?count=8&language=zh&countryCode=CN&name=';
                var cityQuerySeq = 0;
                var cityRemoteTimer = null;

                function remoteLevel(code) {
                    // GeoNames feature_code：PPLA4 乡镇/街道，PPL 村/居民点，PPLA3 县级市
                    if (code === 'PPLA4' || code === 'PPLA5') return '镇';
                    if (code === 'PPL' || code === 'PPLL' || code === 'PPLX') return '村';
                    if (code === 'PPLA3') return '县级';
                    return '地点';
                }

                function searchRemote(q) {
                    return fetch(GEO_REMOTE_URL + encodeURIComponent(q), { signal: AbortSignal.timeout(4200) })
                        .then(function (r) { return r.ok ? r.json() : null; })
                        .then(function (d) {
                            var out = [];
                            if (!d || !d.results) return out;
                            for (var i = 0; i < d.results.length; i++) {
                                var x = d.results[i];
                                if (x.country_code && x.country_code !== 'CN') continue;
                                out.push({
                                    n: x.name, lon: x.longitude, lat: x.latitude,
                                    p: x.admin1 || '', c: x.admin2 || '',
                                    lvName: remoteLevel(x.feature_code), remote: true
                                });
                            }
                            return out;
                        })
                        .catch(function () { return []; });
                }

                var cityResults = [];

                function cityItemHtml(it, i) {
                    // 直辖市 p 和 c 是同一个名字，只留一份，别显示成「重庆市 · 重庆市」
                    var path = it.p === it.c ? it.p : [it.p, it.c].filter(Boolean).join(' · ');
                    var lvName = it.lvName || (it.l === 3 ? '区县' : it.l === 2 ? '市' : '省');
                    // 名字末尾已经带了这个字就别再挂标签，否则读起来是「文峰村 村」
                    var dupTail = { '省': '省', '市': '市', '区县': '区县旗', '县级': '市县', '镇': '镇乡街道', '村': '村社区' }[lvName] || '';
                    if (dupTail && dupTail.indexOf(it.n.slice(-1)) >= 0) lvName = '';
                    return '<div class="city-item' + (it.remote ? ' remote' : '') + '" data-i="' + i + '">' +
                        '<span class="city-name">' + it.n +
                            (lvName ? '<i class="city-lv' + (it.remote ? ' lv-far' : '') + '">' + lvName + '</i>' : '') +
                        '</span>' +
                        (path ? '<span class="city-province">' + path + '</span>' : '') +
                    '</div>';
                }

                function paintCityItems(list) {
                    cityResults = list;
                    if (!list.length) {
                        cityListEl.innerHTML = '<div class="city-empty">没有匹配的地点<br>试试「县 / 镇 / 村」的全名，例如 崇川区、文峰街道</div>';
                        return;
                    }
                    cityListEl.innerHTML = list.map(cityItemHtml).join('');
                    cityListEl.querySelectorAll('.city-item').forEach(function (el) {
                        el.addEventListener('click', function () {
                            var it = cityResults[+this.dataset.i];
                            if (it) applyCityPick(it);
                        });
                    });
                }

                function applyCityPick(it) {
                    currentLat = it.lat;
                    currentLon = it.lon;
                    currentCity = it.n;
                    isManualCity = true;
                    stopGeoFollow();
                    // 搜索结果的层级已经明确，不再反查覆盖（反查会把「腾飞社区」压回「崇川区」）
                    var full = [it.p, it.c, it.n].filter(Boolean).join(' · ');
                    fetchWeather(it.lat, it.lon, { short: it.n, full: full });
                    closeCityPicker();
                    showToastMsg('已切换到 ' + it.n);
                }

                function renderCityList(filter) {
                    var q = areaNorm(filter);
                    if (!q) {
                        // 空搜索框：先给热门城市（原来的 CITY_LIST），省得每次都要打字
                        paintCityItems(CITY_LIST.map(function (c) {
                            return { n: c.name, lon: c.lon, lat: c.lat, p: c.province, c: '', l: 2 };
                        }));
                        return;
                    }
                    var local = searchArea(q);
                    paintCityItems(local);                 // 本地结果先出，不等网络

                    var seq = ++cityQuerySeq;
                    if (cityRemoteTimer) clearTimeout(cityRemoteTimer);
                    if (q.length < 2) return;              // 单字不远程，省一次请求
                    cityRemoteTimer = setTimeout(function () {
                        searchRemote(q).then(function (remote) {
                            if (seq !== cityQuerySeq) return;   // 用户又敲字了，丢弃旧结果
                            var seen = {}, merged = [];
                            local.concat(remote).forEach(function (it) {
                                var key = it.n + '|' + (it.lon || 0).toFixed(1) + '|' + (it.lat || 0).toFixed(1);
                                if (seen[key]) return;
                                seen[key] = 1;
                                merged.push(it);
                            });
                            paintCityItems(merged.slice(0, 12));
                        });
                    }, 320);
                }

                function openCityPicker() {
                    cityQuerySeq++;                       // 作废上一次没回来的远程结果
                    if (cityRemoteTimer) { clearTimeout(cityRemoteTimer); cityRemoteTimer = null; }
                    citySearchInput.value = '';
                    renderCityList('');
                    cityPickerOverlay.classList.add('show');
                    setTimeout(function() { citySearchInput.focus(); }, 300);
                }

                function closeCityPicker() {
                    cityPickerOverlay.classList.remove('show');
                    citySearchInput.blur();
                }

                // ---- 天气面板：实时 / 未来 7 天 ----
                var weatherSheetOverlay = document.getElementById('weatherSheetOverlay');
                var weatherSheetPanel = weatherSheetOverlay.querySelector('.weather-sheet-panel');
                var wxSheetTitle = document.getElementById('wxSheetTitle');
                var wxSheetCityName = document.getElementById('wxSheetCityName');
                var WX7_WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                var wxSheetTab = 'week';

                // 天气码 → 图标，夜间换月亮系（与天气卡同一套规则）
                function wxIconFor(code, isDay) {
                    var c = WEATHER_ICON_MAP[code] || 'fa-sun';
                    if (isDay === 0) {
                        if (code === 0 || code === 1) return 'fa-moon';
                        if (code === 2) return 'fa-cloud-moon';
                        if (code === 3) return 'fa-cloud';
                        if (code >= 51 && code <= 67) return 'fa-cloud-moon-rain';
                        if (code >= 71 && code <= 77) return 'fa-snowflake';
                        if (code >= 80 && code <= 82) return 'fa-cloud-moon-rain';
                        if (code >= 95) return 'fa-cloud-bolt';
                    }
                    return c;
                }

                // 实时页：六宫格 + 日出日落进度 + 更新时间
                function renderWxNow() {
                    var box = document.getElementById('wxNow');
                    var d = window.__wxData;
                    if (!box) return;
                    if (!d || !d.now) {
                        box.innerHTML = '<div class="wx7-empty">实时数据还没拿到，稍等一下</div>';
                        return;
                    }
                    var n = d.now;
                    // 每格挂一个 data-k：CSS 按类别给标签圆点和单位上色（pro-theme.css 29 节）
                    var cells = [
                        ['feels', '体感温度', n.feels],
                        ['hum', '相对湿度', n.hum],
                        ['wind', '风', n.wind],
                        ['press', '气压', n.press],
                        ['vis', '能见度', n.vis],
                        ['uv', '紫外线', n.uv + (n.uvLv && n.uv !== '--' ? '<i>' + n.uvLv + '</i>' : '')]
                    ];
                    // ---- 未来 24 小时：哪几个小时下雨，一句话 + 横滑带 ----
                    // 起点取接口返回的 current.time（timezone=auto，已是当地整点），
                    // 不用本地时间，避免手机时区和所在地不一致时错位
                    var hoursHtml = '';
                    var H = d.hourly;
                    if (H && H.time && H.time.length) {
                        var ctKey = (d.ct || '').slice(0, 13);
                        var start = 0, hit = false;
                        if (ctKey) {
                            for (var hk = 0; hk < H.time.length; hk++) {
                                if (H.time[hk].slice(0, 13) >= ctKey) { start = hk; hit = true; break; }
                            }
                            if (!hit) start = 0;
                        }
                        var cnt = Math.min(24, H.time.length - start);
                        var firstRain = -1, wetCnt = 0, cellsH = '';
                        for (var hi = 0; hi < cnt; hi++) {
                            var ix = start + hi;
                            var tstr = H.time[ix] || '';
                            var hh = tstr.slice(11, 16);
                            var code = H.weather_code ? H.weather_code[ix] : 0;
                            var pp = H.precipitation_probability ? (H.precipitation_probability[ix] || 0) : 0;
                            var isDay = H.is_day ? H.is_day[ix] : 1;
                            var wet = (code >= 51 && code <= 67) || (code >= 71 && code <= 77) ||
                                      (code >= 80 && code <= 82) || (code >= 95) || pp >= 55;
                            if (wet) { wetCnt++; if (firstRain < 0) firstRain = hi; }
                            var tv = H.temperature_2m ? H.temperature_2m[ix] : null;
                            var tShow = (tv === null || tv === undefined) ? '--' : Math.round(tv) + '°';
                            cellsH += '<div class="wx-hr' + (hi === 0 ? ' on' : '') + (wet ? ' wet' : '') + '">' +
                                '<span class="h-time">' + (hi === 0 ? '现在' : hh) + '</span>' +
                                '<span class="h-ico"><i class="fa-solid ' + wxIconFor(code, isDay) + '"></i></span>' +
                                '<span class="h-temp">' + tShow + '</span>' +
                                '<span class="h-rain">' + (pp >= 20 ? pp + '%' : '') + '</span>' +
                            '</div>';
                        }
                        var headText;
                        if (firstRain >= 0) {
                            headText = '预计 <em>' + (firstRain === 0 ? '当前' : H.time[start + firstRain].slice(11, 16)) +
                                '</em> 起有降水 · 未来 24 小时 <em>' + wetCnt + '</em> 小时有雨';
                        } else {
                            headText = '未来 24 小时无降水';
                        }
                        hoursHtml = '<div class="wx-hours">' +
                            '<div class="wx-hours-head"><i class="fa-solid fa-droplet"></i><span>' + headText + '</span></div>' +
                            '<div class="wx-hours-strip">' + cellsH + '</div>' +
                        '</div>';
                    }

                    var html = hoursHtml + '<div class="wx-now-grid">';
                    for (var i = 0; i < cells.length; i++) {
                        html += '<div class="wx-now-cell" data-k="' + cells[i][0] + '"><span>' + cells[i][1] + '</span><b>' +
                            cells[i][2] + '</b></div>';
                    }
                    html += '</div>';

                    var pct = (n.sunPct === null || n.sunPct === undefined) ? 0 : n.sunPct * 100;
                    html += '<div class="wx-now-sun">' +
                        '<span class="rise"><svg class="wns-ico" viewBox="0 0 24 24" aria-hidden="true">' +
                            '<circle cx="12" cy="12" r="4.3"/>' +
                            '<path d="M12 2.4v2.3M12 19.3v2.3M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6' +
                            'M2.4 12h2.3M19.3 12h2.3M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/></svg></span>' +
                        '<b>' + (n.sunrise || '--:--') + '</b>' +
                        '<span class="wns-line"><i style="width:' + pct.toFixed(1) + '%"></i>' +
                            '<u style="left:' + pct.toFixed(1) + '%"></u></span>' +
                        '<b>' + (n.sunset || '--:--') + '</b>' +
                        '<span class="set"><svg class="wns-ico" viewBox="0 0 24 24" aria-hidden="true">' +
                            '<path d="M20.4 14.7A8.3 8.3 0 0 1 9.4 3.7a8.5 8.5 0 1 0 11 11Z"/></svg></span>' +
                    '</div>';

                    var at = d.at ? new Date(d.at) : null;
                    var hhmm = at ? ('0' + at.getHours()).slice(-2) + ':' + ('0' + at.getMinutes()).slice(-2) : '--:--';
                    html += '<div class="wx-now-meta"><span>更新于 ' + hhmm + '</span>' +
                        '<button class="wx-now-refresh" id="wxNowRefresh" type="button">刷新一下</button></div>';

                    box.innerHTML = html;
                }

                function wxSheetShowTab(tab) {
                    wxSheetTab = (tab === 'now') ? 'now' : 'week';
                    weatherSheetPanel.classList.toggle('tab-now', wxSheetTab === 'now');
                    var btns = document.querySelectorAll('#wxTabs .wx-tab');
                    for (var i = 0; i < btns.length; i++) {
                        btns[i].classList.toggle('on', btns[i].getAttribute('data-tab') === wxSheetTab);
                    }
                    if (wxSheetTitle) {
                        wxSheetTitle.textContent = (wxSheetTab === 'now') ? '实时天气' : '未来 7 天';
                    }
                }

                function renderWeatherSheet() {
                    var hero = document.getElementById('wxHero');
                    var list = document.getElementById('wx7List');
                    var d = window.__wxData;
                    if (!d) {
                        hero.innerHTML = '<div class="wx7-empty">天气数据还没拿到，稍等一下</div>';
                        list.innerHTML = '';
                        renderWxNow();
                        return;
                    }
                    wxSheetCityName.textContent = d.city || '当前';
                    var hl = '';
                    if (d.max !== undefined && d.max !== '--' && d.min !== undefined) {
                        hl = '<span class="wx-hero-hl"><span class="hl-hi">最高 ' + d.max + '°</span>' +
                            '<span class="hl-lo">最低 ' + d.min + '°</span></span>';
                    }
                    hero.innerHTML =
                        '<div class="ws-main"><span class="ws-temp">' + d.temp + '°</span>' +
                        '<span class="ws-desc">' + d.desc + '</span>' + hl + '</div>' +
                        '<div class="ws-city"><i class="fa-solid fa-location-dot"></i>' + (d.city || '') + '</div>';

                    renderWxNow();
                    wxSheetShowTab(wxSheetTab);

                    var day = d.daily;
                    if (!day || !day.time || !day.time.length) {
                        list.innerHTML = '<div class="wx7-empty">暂无多日预报</div>';
                        return;
                    }
                    var mx = day.temperature_2m_max || [];
                    var mn = day.temperature_2m_min || [];
                    var codes = day.weathercode || day.weather_code || [];
                    var pops = day.precipitation_probability_max || [];
                    var lo = Infinity, hi = -Infinity;
                    for (var k = 0; k < mn.length; k++) {
                        if (mn[k] < lo) lo = mn[k];
                        if (mx[k] > hi) hi = mx[k];
                    }
                    if (!isFinite(lo) || !isFinite(hi)) { lo = 0; hi = 1; }
                    var span = Math.max(hi - lo, 1);

                    var html = '';
                    for (var i = 0; i < day.time.length; i++) {
                        var dt = new Date(day.time[i] + 'T00:00:00');
                        var label = i === 0 ? '今天' : (i === 1 ? '明天' : WX7_WEEK[dt.getDay()]);
                        var l = Math.round(mn[i]), h = Math.round(mx[i]);
                        var left = (l - lo) / span * 100;
                        var width = Math.max((h - l) / span * 100, 7);
                        var ic = WEATHER_ICON_MAP[codes[i]] || 'fa-sun';
                        var pop = (pops[i] === undefined || pops[i] === null) ? '' :
                            '<i class="fa-solid fa-droplet"></i>' + Math.round(pops[i]) + '%';
                        html += '<div class="wx7-row' + (i === 0 ? ' today' : '') + '">' +
                            '<div class="wx7-day"><b>' + label + '</b><span>' + (dt.getMonth() + 1) + '/' + dt.getDate() + '</span></div>' +
                            '<div class="wx7-ico"><i class="fa-solid ' + ic + '"></i></div>' +
                            '<div class="wx7-pop">' + pop + '</div>' +
                            '<div class="wx7-temp">' +
                                '<span class="lo">' + l + '°</span>' +

<script>
/* 状态栏真机数据：电池百分比（画在电池里）、信号格数、Wi-Fi 是否在用
   ----------------------------------------------------------------------------
   电量：navigator.getBattery() 的 level / charging（安卓 Chrome 支持）
   信号：浏览器读不到 dBm，只能拿 Network Information API 的
        effectiveType(4g/3g/2g) + downlink(Mbps) + rtt(ms) 折算 1~4 格
   无线：connection.type === 'wifi' 才显示，纯蜂窝下隐藏（和 iPhone 一致） */
(function () {
    var sig = document.querySelector('.signal-icon');
    var wifi = document.querySelector('.wifi-icon');
    var bat = document.querySelector('.battery-icon');
    var rects = sig ? sig.querySelectorAll('rect') : [];

    /* ---------------- 电池 ---------------- */
    /* 内腔 25.4 宽，满电 25.4、最低留 1.2 的底，避免 0% 时条消失。
       batFill 是填充条，batClipRect 是同一形状的裁切框，一起改宽度，
       这样数字被填充盖住的部分才会正好翻色。 */
    var batFill = document.getElementById('batFill');
    var batClip = document.getElementById('batClipRect');
    var batTxt = document.getElementById('batTxt');
    var batTxtIn = document.getElementById('batTxtIn');

    function paintBattery(level, charging) {
        if (!bat) return;
        level = Math.max(0, Math.min(1, level));
        var w = (1.2 + 24.2 * level).toFixed(2);
        if (batFill) batFill.setAttribute('width', w);
        if (batClip) batClip.setAttribute('width', w);
