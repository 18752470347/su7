    <style>
        /* ===== 全局重置 & 变量 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
            width: 100%;
            min-height: 100%;
            background: #F2F2F7;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 2px);
        }
        :root {
            --text-main: #1C1C1E;
            --text-sub: #3A3A3C;
            --text-muted: #8E8E93;
            --bg-primary: #F2F2F7;
            --glass-bg: rgba(255, 255, 255, 0.28);
            --glass-border: rgba(255, 255, 255, 0.65);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.02);
            --icon-bg: rgba(255, 255, 255, 0.75);
            --status-color: #1C1C1E;
            --toast-bg: rgba(20, 22, 28, 0.78);
            --viewer-bg: rgba(0, 0, 0, 0.85);
            --name-gradient: linear-gradient(90deg, #FF1744, #FF6D00, #FFD600, #00E676, #00B0FF, #AA00FF, #FF1744);
            --line1-gradient: linear-gradient(90deg, #FF3D71, #FF8A00, #FFD600, #00E5A0, #00B4FF, #B44CFF, #FF3D71);
            --line2-gradient: linear-gradient(90deg, #00B4FF, #6A5CFF, #FF3D71, #FFD600, #00E676, #00B4FF);
            --island-bg: rgba(255, 255, 255, 0.8);
            --island-text: #1C1C1E;
            --glow-color: #FF2E63;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --card-radius: 20px;
            --icon-radius: 14px;
            --avatar-size: 62px;
            --plate-size: 74px;
            --shadow-medium: 0 12px 48px rgba(0, 0, 0, 0.10);
            --shadow-strong: 0 20px 60px rgba(0, 0, 0, 0.15);
            --transition-smooth: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --status-btn-size: 30px;
            --status-btn-gap: 6px;
            --vh: 1vh;
            --weather-temp-color: #0A0A0C;
            --weather-desc-color: #FF6B00;
            --weather-loc-color: #1C1C1E;
            --weather-wind-color: #007AFF;
            --weather-minmax-color: #8E8E93;
            --calendar-year-color: #0A0A0C;
            --calendar-weekday-color: #FF3B30;
            --calendar-lunar-color: #7B61FF;
            --app-label-color: #1C1C1E;
        }
        html.dark-mode {
            --text-main: #F5F5F7;
            --text-sub: #A1A1A6;
            --text-muted: #6E6E73;
            --bg-primary: #0A0A0C;
            --glass-bg: rgba(44, 44, 46, 0.25);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.2);
            --icon-bg: rgba(60, 60, 66, 0.55);
            --status-color: #F5F5F7;
            --toast-bg: rgba(60, 60, 66, 0.85);
            --viewer-bg: rgba(0, 0, 0, 0.92);
            --name-gradient: linear-gradient(90deg, #FF4D8D, #FFA000, #FFEA00, #00FFB3, #00C3FF, #D04CFF, #FF4D8D);
            --line1-gradient: linear-gradient(90deg, #FF6BA8, #FFB300, #FFEE58, #33FFC6, #33CCFF, #E066FF, #FF6BA8);
            --line2-gradient: linear-gradient(90deg, #33CCFF, #8B7BFF, #FF6BA8, #FFEE58, #33FFC6, #33CCFF);
            --island-bg: rgba(20, 20, 24, 0.8);
            --island-text: #fff;
            --glow-color: #00D4FF;
            --shadow-medium: 0 12px 48px rgba(0, 0, 0, 0.4);
            --shadow-strong: 0 20px 60px rgba(0, 0, 0, 0.5);
            background-color: #0A0A0C;
            color: #F5F5F7;
            --weather-temp-color: #FFFFFF;
            --weather-desc-color: #FFB84D;
            --weather-loc-color: #F5F5F7;
            --weather-wind-color: #4DA3FF;
            --weather-minmax-color: #A1A1A6;
            --calendar-year-color: #FFFFFF;
            --calendar-weekday-color: #FF6B6B;
            --calendar-lunar-color: #A78BFF;
            --app-label-color: #F5F5F7;
        }
        html.dark-mode body {
            background: #0A0A0C;
            color: #F5F5F7;
        }
        /* 收窄过渡范围：只给容器级元素加过渡，避免 148 张堆叠图同时过渡导致卡顿 */
        html.transitioning body,
        html.transitioning .app-container,
        html.transitioning .top-card,
        html.transitioning .video-player-container,
        html.transitioning .main-card,
        html.transitioning .app-icon-wrap,
        html.transitioning .calendar-date-block,
        html.transitioning .dynamic-island,
        html.transitioning .toast,
        html.transitioning .viewer,
        html.transitioning .video-popup {
            transition: background-color 0.4s var(--ease),
                color 0.4s var(--ease),
                border-color 0.4s var(--ease),
                box-shadow 0.4s var(--ease),
                opacity 0.4s var(--ease),
                transform 0.4s var(--ease);
        }
        button,
        img,
        video {
            -webkit-user-drag: none;
            user-select: none;
        }
        button {
            font: inherit;
            cursor: pointer;
            background: none;
            border: none;
            outline: none;
        }
        img, video, button, .app-button, .plate, .avatar {
            -webkit-touch-callout: none;
        }
        button, .app-button, .plate, .avatar, .status-theme-toggle,
        .center-play-btn, .btn-expand {
            touch-action: manipulation;
        }
        .viewer-img { -webkit-touch-callout: default; }

        /* ===== 星空画布（占位） ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            display: none;
        }

        /* ===== 主容器 ===== */
        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            max-width: 480px;
            padding: calc(var(--safe-top) + 6px) 12px calc(var(--safe-bottom) + 2px);
            position: relative;
            z-index: 2;
            margin: 0 auto;
            gap: 6px;
            flex: 0 0 auto;
            box-sizing: border-box;
        }

        /* ===== 状态栏区域 ===== */
        .status-bar-container {
            width: 100%;
            flex-shrink: 0;
            padding: 0 0 2px;
        }
        .ios-status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            font-weight: 600;
            color: var(--status-color);
            min-height: 30px;
            padding: 0 2px;
        }
        .ios-status-left {
            flex: 1;
            text-align: left;
            font-weight: 600;
            letter-spacing: 0.2px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: var(--status-btn-gap);
            min-width: 0;
        }

        /* 圆形状态按钮 — 仅保留主题切换 */
        .status-theme-toggle {
            width: var(--status-btn-size);
            height: var(--status-btn-size);
            min-width: var(--status-btn-size);
            min-height: var(--status-btn-size);
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            color: var(--status-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            flex-shrink: 0;
            position: relative;
            overflow: visible;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .status-theme-toggle i {
            position: relative;
            z-index: 2;
            font-size: 15px;
            line-height: 1;
            transition: var(--transition-smooth);
        }
        .status-theme-toggle:active { transform: scale(0.85); }

        .status-theme-toggle::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(255, 200, 100, 0.0), rgba(255, 200, 100, 0.15), rgba(255, 200, 100, 0.0), rgba(100, 200, 255, 0.15), rgba(100, 200, 255, 0.0));
            opacity: 0.4;
            filter: blur(6px);
            transform: scale(0.9);
            pointer-events: none;
            z-index: -1;
        }
        html.dark-mode .status-theme-toggle { background: rgba(20, 20, 24, 0.5); border-color: rgba(255, 255, 255, 0.06); }
        html.dark-mode .status-theme-toggle i.fa-circle { color: #FFD93D; }
        .status-theme-toggle i.fa-sun { color: #FFB800; }

        /* ===== 灵动岛 ===== */
        .dynamic-island {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 28px;
            padding: 0 14px;
            min-width: 50px;
            background: var(--island-bg);
            border-radius: 20px;
            color: var(--island-text);
            font-size: 10px;
            font-weight: 500;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            flex-shrink: 0;
            margin: 0 var(--status-btn-gap);
            overflow: hidden;
            pointer-events: none;
            position: relative;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06), inset 0 0.5px 0 rgba(255, 255, 255, 0.5);
        }
        .island-text-scroll {
            display: inline-block;
            font-weight: 600;
            font-size: 10px;
            background: linear-gradient(90deg, #FF6B9E, #FFD966, #6AA9FF, #FF6B9E);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
            position: relative;
            z-index: 1;
        }

        .ios-status-right {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: var(--status-btn-gap);
        }
        .signal-icon { width: 16px; height: 10px; fill: var(--status-color); flex-shrink: 0; opacity: 0.8; margin-left: 2px; }

        /* ===== 天气 + 头像 + 日历 三栏卡片 ===== */
        .top-card {
            width: 100%;
            flex-shrink: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            box-shadow: var(--glass-shadow);
            padding: 8px 8px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            justify-items: center;
            gap: 4px;
            transition: var(--transition-smooth);
            margin-bottom: 0;
            position: relative;
        }

        /* 天气组件 */
        .weather-widget {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 0;
            width: 100%;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            border-radius: 12px;
            padding: 2px;
            transition: var(--transition-smooth);
        }
        .weather-widget:active { transform: scale(0.97); }
        .weather-icon {
            font-size: 24px;
            line-height: 1;
            color: #FF9500;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 14px rgba(255, 149, 0, 0.45));
        }
        html.dark-mode .weather-icon {
            color: #FFD966;
            filter: drop-shadow(0 2px 14px rgba(255, 217, 102, 0.55));
        }
        .weather-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
            align-items: flex-start;
            gap: 1px;
        }
        .weather-temp {
            font-size: 17px;
            font-weight: 900;
            color: var(--weather-temp-color);
            letter-spacing: -0.5px;
            line-height: 1.2;
        }
        .weather-minmax {
            font-size: 10px;
            font-weight: 800;
            color: var(--weather-minmax-color);
            display: flex;
            align-items: center;
            gap: 3px;
            white-space: nowrap;
            line-height: 1.2;
        }
        .weather-minmax .max-temp { color: #FF3B30; }
        html.dark-mode .weather-minmax .max-temp { color: #FF6B6B; }
        .weather-minmax .min-temp { color: #007AFF; }
        html.dark-mode .weather-minmax .min-temp { color: #4DA3FF; }
        .weather-desc {
            font-size: 11px;
            font-weight: 800;
            color: var(--weather-desc-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .weather-location {
            font-size: 10px;
            font-weight: 800;
            color: var(--weather-loc-color);
            display: flex;
            align-items: center;
            gap: 3px;
            margin-top: 1px;
        }
        .weather-location i {
            font-size: 10px;
            color: #FF3B30;
            filter: drop-shadow(0 0 6px rgba(255, 59, 48, 0.6));
        }
        html.dark-mode .weather-location i {
            color: #FF6B6B;
            filter: drop-shadow(0 0 8px rgba(255, 107, 107, 0.7));
        }
        .weather-wind {
            font-size: 10px;
            font-weight: 800;
            color: var(--weather-wind-color);
            display: flex;
            align-items: center;
            gap: 3px;
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .weather-wind i {
            font-size: 10px;
            color: var(--weather-wind-color);
            filter: drop-shadow(0 0 6px rgba(0, 122, 255, 0.5));
        }
        html.dark-mode .weather-wind i {
            filter: drop-shadow(0 0 8px rgba(77, 163, 255, 0.7));
        }

        /* 头像居中 */
        .avatar-center-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 0 2px;
        }
        .avatar-center {
            position: relative;
            width: var(--avatar-size);
            height: var(--avatar-size);
            border-radius: 50%;
            cursor: zoom-in;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .avatar-center::before {
            content: '';
            position: absolute;
            inset: -12px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
            opacity: 0.45;
            z-index: -1;
            filter: blur(24px);
            transform: scale(0.7);
        }
        .avatar-center::after {
            content: '';
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 60%);
            opacity: 0.4;
            z-index: -1;
            filter: blur(32px);
            transform: scale(0.5);
        }
        .avatar-center .avatar-ring {
            position: absolute; inset: -3px; border-radius: 50%;
            background: conic-gradient(from 0deg, var(--glow-color), #FFD046, #00D4FF, #7B61FF, var(--glow-color));
            filter: blur(4px); z-index: -1; opacity: 0.85;
        }
        .avatar-center .avatar-ring-2 {
            position: absolute; inset: -6px; border-radius: 50%;
            background: conic-gradient(from 180deg, #7B61FF, #00D4FF, #FF6B9E, #7B61FF);
            filter: blur(8px); z-index: -2; opacity: 0.4;
        }
        .avatar-center img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
            position: relative; z-index: 1; transition: var(--transition-smooth);
        }
        html.dark-mode .avatar-center img {
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* 日历组件 */
        .calendar-widget {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-width: 0;
            width: 100%;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            border-radius: 12px;
            padding: 2px;
            transition: var(--transition-smooth);
        }
        .calendar-widget:active { transform: scale(0.97); }
        .calendar-date-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: linear-gradient(135deg, #FF2E63, #FF0055);
            color: #fff;
            box-shadow: 0 4px 18px rgba(255, 46, 99, 0.45);
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }
        .calendar-date-block.holiday {
            background: linear-gradient(135deg, #00E676, #00B248);
            box-shadow: 0 4px 18px rgba(0, 230, 118, 0.5);
        }

        /* ===== 城市选择弹窗 ===== */

        }

        .city-picker-panel {

            max-height: 70vh;

        .city-search-input {

            border-radius: 14px;

        .city-item {

        /* ===== 月历展开弹窗 ===== */
        .month-calendar-overlay {
            position: fixed;
            inset: 0;
            z-index: 10100;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s var(--ease), visibility 0.3s var(--ease);
        }
        .month-calendar-overlay.show { opacity: 1; visibility: visible; }
        .month-calendar-panel {
            width: 100%;
            max-width: 480px;
            max-height: 85vh;
            background: var(--bg-primary);
            border-radius: 24px 24px 0 0;
            padding: 20px 20px calc(20px + var(--safe-bottom));
            transform: translateY(100%);
            transition: transform 0.4s var(--spring);
            overflow-y: auto;
        }

        .month-calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .month-calendar-title {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
        }
        .month-calendar-nav { display: flex; gap: 8px; }
        .month-calendar-nav button {

            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: var(--transition-smooth);
        }
        .month-calendar-nav button:active { transform: scale(0.88); }
        .month-calendar-close {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;

        .month-calendar-weekdays {

            font-weight: 600;
            color: var(--text-muted);
            padding: 4px 0;
        }
        .month-calendar-weekdays span.weekend { color: #FF6B9E; }

        .month-calendar-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .month-calendar-day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-main);

        }
        .month-calendar-day:active { transform: scale(0.92); }
        .month-calendar-day.other-month { color: var(--text-muted); opacity: 0.35; }
        .month-calendar-day.today {
            background: rgba(52, 199, 89, 0.15);
            border-color: #34C759;
            font-weight: 700;
            color: #34C759;
        }
        .month-calendar-day.selected {
            background: linear-gradient(135deg, #34C759, #28A745);

            font-weight: 700;
            box-shadow: 0 2px 8px rgba(52, 199, 89, 0.35);

        .month-calendar-day.holiday { color: #34C759; font-weight: 700; }
        .month-calendar-day.workday { color: #FF9500; font-weight: 700; }

        .month-calendar-day .day-tag {

        .month-calendar-day.selected .day-tag.work {
            background: rgba(255, 255, 255, 0.35);
            color: #fff;
        }
        .month-calendar-day .day-festival {
            font-size: 7px;
            font-weight: 700;
            color: #FF6B9E;
            margin-top: 0;
            line-height: 1;
            white-space: nowrap;
            overflow: hidden;
            max-width: 100%;
        }
        .month-calendar-day.selected .day-festival { color: rgba(255, 255, 255, 0.9); }

        /* ===== 视频播放器 ===== */
        .video-player-container {
            width: 100%;
            flex: 0 0 auto;
            border-radius: var(--card-radius);
            overflow: hidden;
            background: #0A0A0C;
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-medium);
            position: relative;
            transition: var(--transition-smooth);
        }
        .video-box {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #0A0A0C;
            overflow: hidden;
            touch-action: pan-y;
            overscroll-behavior: contain;
        }
        .video-box video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #0A0A0C;
            transform: translateZ(0);
            backface-visibility: hidden;
        }

        .hidden {
            opacity: 0 !important;
            pointer-events: none !important;
            transform: translateY(12px) !important;
        }

        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 6px 10px 8px;
            background: transparent;
            z-index: 3;
            transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
        }

        .controls-row { display: flex; align-items: center; gap: 10px; }
        .controls-row button {
            color: rgba(255, 255, 255, 0.95);
            font-size: 16px;
            padding: 2px;
            opacity: 0.95;
            transition: all 0.2s var(--ease);
            border-radius: 0;
            width: auto;
            height: auto;
            min-width: 26px;
            min-height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
            border: none;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
        }
        .controls-row button:active { opacity: 0.7; transform: scale(0.88); }
        .controls-time {
            margin-left: auto;
            color: #fff;
            font-size: 10px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.3px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
            background: transparent;
            padding: 0;
            border-radius: 0;
            border: none;
        }
        .btn-expand {
            color: #fff;
            font-size: 14px;
            padding: 2px;
            opacity: 0.95;
            transition: all 0.2s var(--ease);
            border-radius: 0;
            width: auto;
            height: auto;
            min-width: 26px;
            min-height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
            border: none;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.8);
        }
        .btn-expand:active { opacity: 0.7; transform: scale(0.88); }

        /* ===== 主卡片 ===== */
        .main-card-container {
            width: 100%;
            flex: 0 0 auto;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }
        .main-card {
            width: 100%;
            padding: 10px 12px 12px;
            border-radius: var(--card-radius);
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            overflow: visible;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch;
            transition: var(--transition-smooth);
            gap: 8px;
        }
        .main-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 10%;
            width: 80%;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            opacity: 0.5;
            pointer-events: none;
        }

        .profile-row {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            gap: 16px;
            width: 100%;
            flex-shrink: 0;
        }
        .profile-left {
            flex: 0 1 auto;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 6px;
        }

        .plate-photo {
            width: var(--plate-size);
            flex-shrink: 0;
            border-radius: 10px;
            overflow: visible;
            cursor: zoom-in;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        .plate-photo-inner {
            position: relative; width: 100%; border-radius: 10px;
            box-shadow: var(--shadow-medium);
            aspect-ratio: 9 / 16; overflow: hidden;
            border: 1px solid var(--glass-border);
            transition: var(--transition-smooth);
            z-index: 1;
        }
        .stack-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; border-radius: 10px;
            transition: transform 0.7s var(--spring), opacity 0.7s var(--spring);
            will-change: transform, opacity; backface-visibility: hidden;
            background: rgba(128, 128, 128, 0.08);
            transform: translateZ(0);
        }
        .stack-img.active { transform: scale(1) translateY(0); opacity: 1; z-index: 5; }
        .stack-img.pile { transform: scale(0.90) translateY(8px); opacity: 0.65; z-index: 4; }
        .stack-img.pile2 { transform: scale(0.82) translateY(16px); opacity: 0.35; z-index: 3; }
        .stack-img.pile3 { transform: scale(0.75) translateY(24px); opacity: 0.15; z-index: 2; }
        .stack-img.hidden { transform: scale(0.65) translateY(32px); opacity: 0; z-index: 1; pointer-events: none; }

        /* 主卡片文字 */
        .name {
            font-size: 14px;
            font-weight: 900;
            text-align: center;
            margin-top: 0;
            background: var(--name-gradient);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.5px;
            line-height: 1.3;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.08));
        }
        .subtitle {
            font-size: 12px;
            font-weight: 800;
            text-align: center;
            margin-top: 0;
            line-height: 1.4;
            letter-spacing: 0.3px;
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: center;
        }
        .subtitle .line-1 {
            display: block;
            background: var(--line1-gradient);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.06));
        }
        .subtitle .line-2 {
            display: block;
            background: var(--line2-gradient);
            background-size: 200% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.06));
        }

        /* ===== 应用图标 ===== */
        .apps-scroll-wrapper {
            width: 100%;
            overflow: visible;
            position: relative;
            margin-top: 0;
            z-index: 10;
            flex-shrink: 0;
        }
        .apps-track { display: flex; transition: transform 0.4s var(--ease); will-change: transform; }
        .apps-page {
            flex: 0 0 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px 6px;
            padding: 0;
            min-height: 76px;
        }
        .app-button {
            --icon-color: #00D4FF;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
            background: transparent; cursor: pointer; transition: var(--transition-smooth);
            position: relative; z-index: 10;
            border-radius: 12px;
            padding: 3px 2px 4px;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .app-button:active { transform: scale(0.90); }
        .app-icon-wrap {
            position: relative; width: 46px; height: 46px;
            display: flex; align-items: center; justify-content: center;
            border-radius: var(--icon-radius);
            background: var(--icon-bg);
            box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.08), 0 4px 16px rgba(0, 0, 0, 0.04);
            font-size: 20px; color: var(--icon-color);
            backdrop-filter: blur(14px) saturate(170%);
            -webkit-backdrop-filter: blur(14px) saturate(170%);
            border: 1px solid var(--glass-border);
            transition: var(--transition-smooth); z-index: 10;
            overflow: hidden;
            transform: translateZ(0);
        }
        html.dark-mode .app-icon-wrap {
            box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.12), 0 4px 20px rgba(0, 0, 0, 0.35);
            border-color: rgba(255, 255, 255, 0.10);
        }
        .app-icon-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.45), transparent 70%);
            opacity: 0.7;
            pointer-events: none;
            border-radius: inherit;
        }
        .app-button:active .app-icon-wrap { transform: scale(0.88); }
        .app-button.loading .app-icon-wrap { opacity: 0.6; transform: scale(0.95); }
        .app-label {
            font-size: 9px;
            font-weight: 900;
            color: var(--app-label-color);
            text-align: center;
            line-height: 1.2;
            letter-spacing: 0.2px;
            transition: var(--transition-smooth);
            margin-top: 1px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        }
        html.dark-mode .app-label {
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.5);
        }

        /* ===== VPN 图标 ===== */
        .vpn-icon {
            background: var(--icon-bg) !important;
            border-color: var(--glass-border) !important;
            box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.08), 0 4px 16px rgba(0, 0, 0, 0.04) !important;
            position: relative;
            overflow: hidden;
            transition: var(--transition-smooth);
        }
        html.dark-mode .vpn-icon {
            box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.12), 0 4px 20px rgba(0, 0, 0, 0.35) !important;
        }
        .vpn-svg {
            width: 22px;
            height: 22px;
            color: var(--icon-color);
            position: relative;
            z-index: 2;
            transition: all 0.45s var(--spring);
            filter: none;
        }
        .app-button:active .vpn-svg { transform: scale(0.88); }
        html.dark-mode .vpn-svg {
            color: var(--icon-color);
            filter: drop-shadow(0 0 6px rgba(255, 138, 76, 0.5));
        }
        .app-button.loading .vpn-svg { opacity: 0.3; }

        /* ===== Toast ===== */
        .toast {
            position: fixed; z-index: 10001; left: 50%; bottom: calc(20px + var(--safe-bottom));
            transform: translate(-50%, 20px) scale(0.92);
            padding: 8px 20px; border-radius: 12px;
            color: #fff; background: var(--toast-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none;
            transition: opacity 0.3s var(--ease), transform 0.3s var(--spring);
            border: 0.5px solid rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow-strong);
            max-width: 80vw;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

        /* ===== 图片查看器 ===== */
        .viewer {
            position: fixed; inset: 0; z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            background: var(--viewer-bg);
            backdrop-filter: blur(28px) saturate(120%);
            -webkit-backdrop-filter: blur(28px) saturate(120%);
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: opacity 0.35s var(--ease), visibility 0.35s var(--ease);
        }
        .viewer.show { opacity: 1; visibility: visible; pointer-events: auto; }
        .viewer-content {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; height: 100%; padding: 20px;
        }
        .viewer-img {
            max-width: 94vw; max-height: 72vh; object-fit: contain;
            border-radius: 12px; box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
            opacity: 0; transition: opacity 0.35s var(--ease), transform 0.35s var(--ease);
            touch-action: none; transform: scale(0.96);
        }

            try {
                var k = 'plate_theme_mode';
                var saved = localStorage.getItem(k);
                var sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                var dark = saved ? (saved === 'dark') : !!sys;
                var h = document.documentElement;
                if (dark) h.classList.add('dark-mode');
                var m = document.querySelector('meta[name="theme-color"]');
                if (m) m.setAttribute('content', dark ? '#0A0A0C' : '#F2F2F7');
                var cs = document.querySelector('meta[name="color-scheme"]');
                if (cs) cs.setAttribute('content', dark ? 'dark' : 'light dark');
            } catch (e) {}
        })();

        (function() {
            function setVH() {
                var vh = window.innerHeight * 0.01;
                document.documentElement.style.setProperty('--vh', vh + 'px');
            }
            setVH();
            window.addEventListener('resize', setVH);
            window.addEventListener('orientationchange', function() {
                setTimeout(setVH, 100);
                setTimeout(setVH, 300);
            });
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', setVH);
            }
            if (window.matchMedia) {
                var mq = window.matchMedia('(prefers-color-scheme: dark)');
                var handler = function() {
                    try {
                        var saved = localStorage.getItem('plate_theme_mode');
                        if (saved) return;
                        var h = document.documentElement;
                        if (mq.matches) h.classList.add('dark-mode');
                        else h.classList.remove('dark-mode');
                        var m = document.querySelector('meta[name="theme-color"]');
                        if (m) m.setAttribute('content', mq.matches ? '#0A0A0C' : '#F2F2F7');
                    } catch (e) {}
                };
                if (mq.addEventListener) mq.addEventListener('change', handler);
                else if (mq.addListener) mq.addListener(handler);
            }
        })();

                    const img = document.createElement('img');
                    img.className = 'stack-img';
                    img.dataset.index = idx;
                    img.alt = '堆叠图片';
                    img.draggable = false;
                    img.decoding = 'async';
                    if (idx < STACK_PRELOAD_COUNT) {
                        img.src = url;

                        img.dataset.src = url;
                    }
                    photoInner.appendChild(img);
                    stackImgs.push(img);
                });
                updateStack(0);
            }

            function ensureStackLoaded(activeIndex) {
                const len = stackImgs.length;
                for (let d = 0; d < 8; d++) {
                    const i = (activeIndex + d) % len;
                    const img = stackImgs[i];
                    if (img && !img.getAttribute('src') && img.dataset.src) {
                        img.src = img.dataset.src;
                        img.removeAttribute('data-src');
                    }
                }
            }

            function updateStack(activeIndex) {
                const len = stackImgs.length;
                ensureStackLoaded(activeIndex);
                stackImgs.forEach((img, idx) => {
                    img.classList.remove('active', 'pile', 'pile2', 'pile3', 'hidden');
                    if (idx === activeIndex) {
                        img.classList.add('active');
                    } else {
                        const diff = (idx - activeIndex + len) % len;
                        if (diff === 1) img.classList.add('pile');
                        else if (diff === 2) img.classList.add('pile2');
                        else if (diff === 3) img.classList.add('pile3');
                        else img.classList.add('hidden');
                    }
                });
                slideIndex = activeIndex;
                try { localStorage.setItem(STORAGE_PREFIX + 'slide_index', String(slideIndex)); } catch (e) {}
            }

            videoBox.addEventListener('touchmove', (e) => {
                if (!isSwiping) return;
                const dx = e.touches[0].clientX - startX;
                const dy = e.touches[0].clientY - startY;
                // 只在判定为横向滑动后才锁定方向并阻止默认行为
                if (!swipeDirectionLocked) {
                    if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
                        if (Math.abs(dx) > Math.abs(dy) * 1.2) {
                            swipeDirectionLocked = true;

                            // 纵向滑动：放弃拦截，允许页面滚动

                    } else {

                // 懒设：仅在打开弹窗时设置 popupVideo.src

            function jumpToApp(key) {
                if (isJumping) return;
                const config = APP_CONFIG[key];
                if (!config) return;
                const item = document.querySelector(`[data-app="${key}"]`);
                if (!item || item.classList.contains("loading")) return;

                isJumping = true;

                let unloaded = false;
                const onUnload = () => {
                    unloaded = true;
                    isJumping = false;
                    window.removeEventListener('beforeunload', onUnload);
                    document.removeEventListener('visibilitychange', onVis);
                };
                const onVis = () => {
                    if (!document.hidden && !unloaded) {
                        isJumping = false;
                        window.removeEventListener('beforeunload', onUnload);
                        document.removeEventListener('visibilitychange', onVis);
                    }
                };
                window.addEventListener('beforeunload', onUnload);
                document.addEventListener('visibilitychange', onVis);

                try {
                    window.location.href = config.scheme;
                } catch (e) {
                    isJumping = false;
                    window.removeEventListener('beforeunload', onUnload);
                    document.removeEventListener('visibilitychange', onVis);
                    return;
                }

                setTimeout(() => {
                    if (!unloaded && isJumping) {
                        isJumping = false;
                        window.removeEventListener('beforeunload', onUnload);
                        document.removeEventListener('visibilitychange', onVis);
                    }
                }, 3000);
            }
            $$(".app-button").forEach(el => { el.addEventListener("click", (e) => { e.stopPropagation();

                if (typeof viewer !== 'undefined' && viewer && viewer.classList.contains('show')) return;

                    if (k === ' ' || k === 'Spacebar') { e.preventDefault(); if (popupVideo.paused) { playWithSound(popupVideo); } else { popupVideo.pause(); } return; }
                    if (k === 'Enter') { e.preventDefault(); if (popupVideo.paused) { playWithSound(popupVideo); } else { popupVideo.pause(); } return; }

                const HOLIDAY_DATA_2027 = [
                    { date: '2027-01-01', name: '元旦', type: 1, rest: 1 },

                    { date: '2027-05-08', name: '劳动节调休', type: 3, rest: 0 },
                    { date: '2027-06-09', name: '端午节', type: 1, rest: 1 },
                    { date: '2027-09-15', name: '中秋节', type: 1, rest: 1 },

                    { date: '2027-10-09', name: '国庆节调休', type: 3, rest: 0 }
                ];

                const ALL_HOLIDAYS = HOLIDAY_DATA_2026.concat(HOLIDAY_DATA_2027);
                const HOLIDAY_MAP = new Map();
                ALL_HOLIDAYS.forEach(function(item) {
                    HOLIDAY_MAP.set(item.date, item);
                });

                function getHolidayInfo(date) {
                    var year = date.getFullYear();
                    var month = String(date.getMonth() + 1).padStart(2, '0');
                    var day = String(date.getDate()).padStart(2, '0');
                    var dateStr = year + '-' + month + '-' + day;

                    if (year >= 2026 && year <= 2027 && HOLIDAY_MAP.has(dateStr)) {
                        return HOLIDAY_MAP.get(dateStr);
                    }

                    var dow = date.getDay();
                    if (dow === 0 || dow === 6) {
                        return { date: dateStr, name: '周末', type: 2, rest: 1 };
                    }

                    return { date: dateStr, name: '工作日', type: 0, rest: 0 };
                }

                function getFestivalName(date) {
                    if (typeof Solar === 'undefined') return '';
                    try {
                        var solar = Solar.fromDate(date);
                        var lunar = solar.getLunar();
                        var jieQi = lunar.getJieQi();
                        if (jieQi) return jieQi;
                        var festivals = lunar.getFestivals();
                        if (festivals && festivals.length > 0) return festivals[0];
                        var otherFestivals = lunar.getOtherFestivals();
                        if (otherFestivals && otherFestivals.length > 0) return otherFestivals[0];
                        return '';
                    } catch (e) {
                        return '';
                    }
                }

                async function fetchLocationDetails(lat, lon) {
                    try {
                        const res = await fetch(
                            `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`,
                            { signal: AbortSignal.timeout(6000) }
                        );
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const data = await res.json();
                        var district = data.locality || data.localityInfo?.administrative?.[2]?.name || '';
                        var city = data.city || data.principalSubdivision || '';
                        var displayName = district || city || '当前位置';
                        return {
                            district: district,
                            city: city,
                            displayName: displayName
                        };
                    } catch (e) {
                        console.warn('位置信息获取失败:', e);
                        return { district: '', city: '', displayName: '当前位置' };
                    }
                }

                async function fetchWeather(lat, lon, cityName) {
                    try {
                        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=1`;
                        const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const data = await res.json();
                        const cw = data.current_weather;
                        if (!cw) throw new Error('no current_weather');

                        const code = cw.weathercode;
                        const iconClass = WEATHER_ICON_MAP[code] || 'fa-sun';
                        const desc = WEATHER_DESC_MAP[code] || '未知';
                        const temp = Math.round(cw.temperature);
                        const windspeed = cw.windspeed;
                        const winddirection = cw.winddirection;

                        document.getElementById('weatherIcon').innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
                        document.getElementById('weatherTemp').textContent = temp + '°C';
                        document.getElementById('weatherDesc').textContent = desc;
                        document.getElementById('weatherLocation').textContent = cityName || '当前位置';

                        let maxTemp = '--', minTemp = '--';
                        if (data.daily && data.daily.temperature_2m_max && data.daily.temperature_2m_max.length > 0) {
                            maxTemp = Math.round(data.daily.temperature_2m_max[0]);
                        }
                        if (data.daily && data.daily.temperature_2m_min && data.daily.temperature_2m_min.length > 0) {
                            minTemp = Math.round(data.daily.temperature_2m_min[0]);
                        }
                        document.getElementById('weatherMaxTemp').textContent = maxTemp + '°';
                        document.getElementById('weatherMinTemp').textContent = minTemp + '°';

                        var windDir = degToWindDirection(winddirection);
                        var windText = '';
                        if (windspeed !== undefined && windspeed !== null) {
                            windText = windDir + ' ' + windspeed + ' km/h';
                        } else {
                            windText = windDir;
                        }
                        document.getElementById('weatherWindText').textContent = windText;

                    } catch (e) {
                        console.warn('天气获取失败:', e);
                        document.getElementById('weatherDesc').textContent = '获取失败';
                        document.getElementById('weatherWindText').textContent = '--';
                        document.getElementById('weatherMaxTemp').textContent = '--°';
                        document.getElementById('weatherMinTemp').textContent = '--°';
                    }
                }

                function locateAndFetchWeather() {
                    const locEl = document.getElementById('weatherLocation');
                    const descEl = document.getElementById('weatherDesc');

                    if (isManualCity) {
                        fetchWeather(currentLat, currentLon, currentCity);
                        return;
                    }

                    if (!navigator.geolocation) {
                        locEl.textContent = DEFAULT_CITY;
                        descEl.textContent = '定位不支持';
                        currentLat = DEFAULT_LAT;
                        currentLon = DEFAULT_LON;
                        currentCity = DEFAULT_CITY;
                        fetchWeather(DEFAULT_LAT, DEFAULT_LON, DEFAULT_CITY);
                        return;
                    }

                    locEl.textContent = '定位中...';
                    descEl.textContent = '定位中';

                    navigator.geolocation.getCurrentPosition(
                        async function (position) {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            const details = await fetchLocationDetails(lat, lon);
                            currentLat = lat;
                            currentLon = lon;
                            currentCity = details.displayName;
                            fetchWeather(lat, lon, details.displayName);
                        },
                        function (error) {
                            console.warn('定位失败:', error.message);
                            currentLat = DEFAULT_LAT;
                            currentLon = DEFAULT_LON;
                            currentCity = DEFAULT_CITY;
                            locEl.textContent = DEFAULT_CITY;
                            descEl.textContent = '定位失败';
                            fetchWeather(DEFAULT_LAT, DEFAULT_LON, DEFAULT_CITY);
                            showToastMsg('定位失败，点击天气卡片可手动选择城市');
                        },
                        {
                            enableHighAccuracy: false,
                            timeout: 10000,
                            maximumAge: 600000
                        }
                    );
                }

                function updateCalendar() {
                    const now = selectedDate;

                    const year = now.getFullYear();
                    const month = now.getMonth() + 1;
                    const date = now.getDate();
                    const dayOfWeek = now.getDay();

                    const weekdaysCN = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                    const weekdaysShort = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];

                    document.getElementById('calendarDayNum').textContent = date;
                    document.getElementById('calendarDayLabel').textContent = weekdaysShort[dayOfWeek];
                    document.getElementById('calendarYearMonth').textContent = year + '年' + month + '月';
                    document.getElementById('calendarWeekday').textContent = weekdaysCN[dayOfWeek];

                    const holidayInfo = getHolidayInfo(now);
                    const holidayTagEl = document.getElementById('calendarHolidayTag');
                    const dateBlockEl = document.getElementById('calendarDateBlock');

                    dateBlockEl.classList.remove('holiday', 'workday');
                    holidayTagEl.classList.remove('holiday', 'workday', 'normal');

                    if (holidayInfo.type === 1) {
                        dateBlockEl.classList.add('holiday');
                        holidayTagEl.classList.add('holiday');
                        holidayTagEl.textContent = holidayInfo.name + ' 休';
                    } else if (holidayInfo.type === 3) {
                        dateBlockEl.classList.add('workday');
                        holidayTagEl.classList.add('workday');
                        holidayTagEl.textContent = holidayInfo.name + ' 班';
                    } else if (holidayInfo.type === 2) {
                        holidayTagEl.classList.add('holiday');
                        holidayTagEl.textContent = '周末 休';
                    } else {
                        holidayTagEl.classList.add('normal');
                        holidayTagEl.textContent = '工作日';
                    }

                    if (typeof Solar !== 'undefined') {
                        try {
                            const solar = Solar.fromDate(now);
                            const lunar = solar.getLunar();

                            document.getElementById('calendarLunar').textContent =
                                '农历' + lunar.getMonthInChinese() + '月' + lunar.getDayInChinese();

                        } catch (e) {
                            console.warn('农历获取失败:', e);
                            document.getElementById('calendarLunar').textContent = '农历 --';
                        }
                    } else {
                        document.getElementById('calendarLunar').textContent = '农历 --';
                    }
                }

                const cityPickerOverlay = document.getElementById('cityPickerOverlay');
                const citySearchInput = document.getElementById('citySearchInput');
                const cityListEl = document.getElementById('cityList');

                function renderCityList(filter) {
                    var keyword = (filter || '').trim().toLowerCase();
                    var filtered = CITY_LIST;

                    if (keyword) {
                        filtered = CITY_LIST.filter(function(c) {
                            return c.name.toLowerCase().includes(keyword) ||
                                   c.province.toLowerCase().includes(keyword);
                        });
                    }

                    if (filtered.length === 0) {
                        cityListEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:14px;">未找到匹配的城市</div>';
                        return;
                    }

                    cityListEl.innerHTML = filtered.map(function(c) {
                        return '<div class="city-item" data-lat="' + c.lat + '" data-lon="' + c.lon + '" data-name="' + c.name + '">' +
                            '<span>' + c.name + '</span>' +
                            '<span class="city-province">' + c.province + '</span>' +
                        '</div>';
                    }).join('');

                    cityListEl.querySelectorAll('.city-item').forEach(function(el) {
                        el.addEventListener('click', function() {
                            var lat = parseFloat(this.dataset.lat);
                            var lon = parseFloat(this.dataset.lon);
                            var name = this.dataset.name;

                            currentLat = lat;
                            currentLon = lon;
                            currentCity = name;
                            isManualCity = true;

                            fetchLocationDetails(lat, lon).then(function(details) {
                                var displayName = details.district || details.city || name;
                                currentCity = displayName;
                                fetchWeather(lat, lon, displayName);
                            });

                            closeCityPicker();
                            showToastMsg('已切换到 ' + name);
                        });
                    });
                }

                function openCityPicker() {
                    citySearchInput.value = '';
                    renderCityList('');
                    cityPickerOverlay.classList.add('show');
                    setTimeout(function() { citySearchInput.focus(); }, 300);
                }

                function closeCityPicker() {
                    cityPickerOverlay.classList.remove('show');
                    citySearchInput.blur();
                }

                document.getElementById('weatherWidget').addEventListener('click', function(e) {
                    e.stopPropagation();
                    openCityPicker();
                });

                document.getElementById('cityPickerClose').addEventListener('click', closeCityPicker);

                cityPickerOverlay.addEventListener('click', function(e) {
                    if (e.target === cityPickerOverlay) closeCityPicker();
                });

                citySearchInput.addEventListener('input', function() {
                    renderCityList(this.value);
                });

                const monthCalendarOverlay = document.getElementById('monthCalendarOverlay');
                const monthCalendarTitle = document.getElementById('monthCalendarTitle');
                const monthCalendarDays = document.getElementById('monthCalendarDays');

                let monthCalendarYear = new Date().getFullYear();
                let monthCalendarMonth = new Date().getMonth();

                function renderMonthCalendar() {
                    monthCalendarTitle.textContent = monthCalendarYear + '年' + (monthCalendarMonth + 1) + '月';

                    var firstDay = new Date(monthCalendarYear, monthCalendarMonth, 1);
                    var lastDay = new Date(monthCalendarYear, monthCalendarMonth + 1, 0);
                    var daysInMonth = lastDay.getDate();
                    var startDayOfWeek = firstDay.getDay();

                    var prevMonthLastDay = new Date(monthCalendarYear, monthCalendarMonth, 0).getDate();

                    var html = '';

                    for (var i = startDayOfWeek - 1; i >= 0; i--) {
                        var d = prevMonthLastDay - i;
                        html += '<div class="month-calendar-day other-month">' +
                            '<span>' + d + '</span>' +
                        '</div>';
                    }

                    for (var d = 1; d <= daysInMonth; d++) {
                        var date = new Date(monthCalendarYear, monthCalendarMonth, d);
                        var holidayInfo = getHolidayInfo(date);
                        var festivalName = getFestivalName(date);
                        var classes = 'month-calendar-day';

                        var isToday = (date.getFullYear() === new Date().getFullYear() &&
                                       date.getMonth() === new Date().getMonth() &&
                                       date.getDate() === new Date().getDate());
                        var isSelected = (date.getFullYear() === selectedDate.getFullYear() &&
                                          date.getMonth() === selectedDate.getMonth() &&
                                          date.getDate() === selectedDate.getDate());

                        if (isToday) classes += ' today';
                        if (isSelected) classes += ' selected';
                        if (holidayInfo.type === 1) classes += ' holiday';
                        if (holidayInfo.type === 3) classes += ' workday';

                        var lunarText = '';
                        if (typeof Solar !== 'undefined') {
                            try {
                                var solar = Solar.fromDate(date);
                                var lunar = solar.getLunar();
                                lunarText = lunar.getDayInChinese();
                            } catch (e) {}
                        }

                        var tagHtml = '';
                        if (holidayInfo.type === 1) {
                            tagHtml = '<span class="day-tag rest">休</span>';
                        } else if (holidayInfo.type === 3) {
                            tagHtml = '<span class="day-tag work">班</span>';
                        }

                        var festivalHtml = '';
                        if (festivalName) {
                            festivalHtml = '<span class="day-festival">' + festivalName + '</span>';
                        }

                        html += '<div class="' + classes + '" data-date="' + date.getTime() + '">' +
                            tagHtml +
                            '<span>' + d + '</span>' +
                            '<span class="day-lunar">' + lunarText + '</span>' +
                            festivalHtml +
                        '</div>';
                    }

                    var totalCells = startDayOfWeek + daysInMonth;
                    var remaining = (7 - (totalCells % 7)) % 7;
                    for (var i = 1; i <= remaining; i++) {
                        html += '<div class="month-calendar-day other-month">' +
                            '<span>' + i + '</span>' +
                        '</div>';
                    }

                    monthCalendarDays.innerHTML = html;

                    monthCalendarDays.querySelectorAll('.month-calendar-day[data-date]').forEach(function(el) {
                        el.addEventListener('click', function() {
                            var timestamp = parseInt(this.dataset.date);
                            selectedDate = new Date(timestamp);
                            isManualDate = true;
                            updateCalendar();
                            closeMonthCalendar();
                            showToastMsg('已切换到 ' + selectedDate.getFullYear() + '年' + (selectedDate.getMonth() + 1) + '月' + selectedDate.getDate() + '日');
                        });
                    });
                }

                function openMonthCalendar() {
                    monthCalendarYear = selectedDate.getFullYear();
                    monthCalendarMonth = selectedDate.getMonth();
                    renderMonthCalendar();
                    monthCalendarOverlay.classList.add('show');
                }

                function closeMonthCalendar() {
                    monthCalendarOverlay.classList.remove('show');
                }

                document.getElementById('monthCalendarClose').addEventListener('click', closeMonthCalendar);

                monthCalendarOverlay.addEventListener('click', function(e) {
                    if (e.target === monthCalendarOverlay) closeMonthCalendar();
                });

                document.getElementById('monthPrevBtn').addEventListener('click', function() {
                    monthCalendarMonth--;
                    if (monthCalendarMonth < 0) {
                        monthCalendarMonth = 11;
                        monthCalendarYear--;
                    }
                    renderMonthCalendar();
                });

                document.getElementById('monthNextBtn').addEventListener('click', function() {
                    monthCalendarMonth++;
                    if (monthCalendarMonth > 11) {
                        monthCalendarMonth = 0;
                        monthCalendarYear++;
                    }
                    renderMonthCalendar();
                });

                var calendarLongPressTimer = null;
                var calendarLongPressTriggered = false;

                document.getElementById('calendarWidget').addEventListener('touchstart', function(e) {
                    calendarLongPressTriggered = false;
                    calendarLongPressTimer = setTimeout(function() {
                        calendarLongPressTriggered = true;
                        openMonthCalendar();
                    }, 500);
                }, { passive: true });

                document.getElementById('calendarWidget').addEventListener('touchend', function(e) {
                    clearTimeout(calendarLongPressTimer);
                });

                document.getElementById('calendarWidget').addEventListener('touchcancel', function(e) {
                    clearTimeout(calendarLongPressTimer);
                });

                document.getElementById('calendarWidget').addEventListener('contextmenu', function(e) {
                    e.preventDefault();
                    openMonthCalendar();
                });

                locateAndFetchWeather();
                updateCalendar();

                TimerManager.add('weather', function() {
                    if (document.hidden) return;
                    if (!isManualCity) {
                        locateAndFetchWeather();
                    } else {
                        fetchWeather(currentLat, currentLon, currentCity);
                    }
                }, 1800000);

                TimerManager.add('calendar', function() {
                    if (document.hidden) return;
                    if (!isManualDate) {
                        selectedDate = new Date();
                        updateCalendar();
                    }
                }, 300000);

            })();

        })();
    </script>
