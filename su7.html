                    const holidayTagEl = document.getElementById('calendarHolidayTag');
                    const dateBlockEl = document.getElementById('calendarDateBlock');

                    dateBlockEl.classList.remove('holiday', 'workday');
                    holidayTagEl.classList.remove('holiday', 'workday', 'normal');

                    if (holidayInfo.type === 1) {
                        dateBlockEl.classList.add('holiday');
                        holidayTagEl.classList.add('holiday');
                        holidayTagEl.textContent = holidayInfo.name + ' 休';
                    } else if (holidayInfo.type === 3) {
                        dateBlockEl.classList.add('workday');
                        holidayTagEl.classList.add('workday');
                        holidayTagEl.textContent = holidayInfo.name + ' 班';
                    } else if (holidayInfo.type === 2) {
                        holidayTagEl.classList.add('holiday');
                        holidayTagEl.textContent = '周末 休';
                    } else {
                        holidayTagEl.classList.add('normal');
                        holidayTagEl.textContent = '工作日';
                    }

                    if (typeof Solar !== 'undefined') {
                        try {
                            const solar = Solar.fromDate(now);
                            const lunar = solar.getLunar();

                            document.getElementById('calendarLunar').textContent =
                                '农历' + lunar.getMonthInChinese() + '月' + lunar.getDayInChinese();

                            const yi = lunar.getDayYi();
                            document.getElementById('almanacYi').textContent =
                                yi && yi.length ? yi.slice(0, 6).join(' · ') : '诸事不宜';

                            const ji = lunar.getDayJi();
                            document.getElementById('almanacJi').textContent =
                                ji && ji.length ? ji.slice(0, 6).join(' · ') : '诸事不宜';

                        } catch (e) {
                            console.warn('农历获取失败:', e);
                            document.getElementById('calendarLunar').textContent = '农历 --';
                            document.getElementById('almanacYi').textContent = '--';
                            document.getElementById('almanacJi').textContent = '--';
                        }
                    } else {
                        document.getElementById('calendarLunar').textContent = '农历 --';
                        document.getElementById('almanacYi').textContent = '--';
                        document.getElementById('almanacJi').textContent = '--';
                    }
                }

                const cityPickerOverlay = document.getElementById('cityPickerOverlay');
                const citySearchInput = document.getElementById('citySearchInput');
                const cityListEl = document.getElementById('cityList');

                function renderCityList(filter) {
                    var keyword = (filter || '').trim().toLowerCase();
                    var filtered = CITY_LIST;

                    if (keyword) {
                        filtered = CITY_LIST.filter(function(c) {
                            return c.name.toLowerCase().includes(keyword) ||
                                   c.province.toLowerCase().includes(keyword);
                        });
                    }

                    if (filtered.length === 0) {
                        cityListEl.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);font-size:14px;">未找到匹配的城市</div>';
                        return;
                    }

                    cityListEl.innerHTML = filtered.map(function(c) {
                        return '<div class="city-item" data-lat="' + c.lat + '" data-lon="' + c.lon + '" data-name="' + c.name + '">' +
                            '<span>' + c.name + '</span>' +
                            '<span class="city-province">' + c.province + '</span>' +
                        '</div>';
                    }).join('');

                    cityListEl.querySelectorAll('.city-item').forEach(function(el) {
                        el.addEventListener('click', function() {
                            var lat = parseFloat(this.dataset.lat);
                            var lon = parseFloat(this.dataset.lon);
                            var name = this.dataset.name;

                            currentLat = lat;
                            currentLon = lon;
                            currentCity = name;
                            isManualCity = true;

                            fetchLocationDetails(lat, lon).then(function(details) {
                                var displayName = details.district || details.city || name;
                                currentCity = displayName;
                                fetchWeather(lat, lon, displayName);
                            });

                            closeCityPicker();
                            showToastMsg('已切换到 ' + name);
                        });
                    });
                }

                function openCityPicker() {
                    citySearchInput.value = '';
                    renderCityList('');
                    cityPickerOverlay.classList.add('show');
                    setTimeout(function() { citySearchInput.focus(); }, 300);
                }

                function closeCityPicker() {
                    cityPickerOverlay.classList.remove('show');
                    citySearchInput.blur();
                }

                document.getElementById('weatherWidget').addEventListener('click', function(e) {
                    e.stopPropagation();
                    openCityPicker();
                });

                document.getElementById('cityPickerClose').addEventListener('click', closeCityPicker);

                cityPickerOverlay.addEventListener('click', function(e) {
                    if (e.target === cityPickerOverlay) closeCityPicker();
                });

                citySearchInput.addEventListener('input', function() {
                    renderCityList(this.value);
                });

                const datePickerOverlay = document.getElementById('datePickerOverlay');
                const datePickerYear = document.getElementById('datePickerYear');
                const datePickerMonth = document.getElementById('datePickerMonth');
                const datePickerDay = document.getElementById('datePickerDay');

                function initDatePicker() {
                    datePickerYear.innerHTML = '';
                    for (var y = 2020; y <= 2030; y++) {
                        var opt = document.createElement('option');
                        opt.value = y;
                        opt.textContent = y + '年';
                        datePickerYear.appendChild(opt);
                    }

                    datePickerMonth.innerHTML = '';
                    for (var m = 1; m <= 12; m++) {
                        var opt = document.createElement('option');
                        opt.value = m;
                        opt.textContent = m + '月';
                        datePickerMonth.appendChild(opt);
                    }

                    updateDayOptions();

                    datePickerYear.addEventListener('change', updateDayOptions);
                    datePickerMonth.addEventListener('change', updateDayOptions);
                }

                function updateDayOptions() {
                    var year = parseInt(datePickerYear.value);
                    var month = parseInt(datePickerMonth.value);
                    var daysInMonth = new Date(year, month, 0).getDate();

                    datePickerDay.innerHTML = '';
                    for (var d = 1; d <= daysInMonth; d++) {
                        var opt = document.createElement('option');
                        opt.value = d;
                        opt.textContent = d + '日';
                        datePickerDay.appendChild(opt);
                    }
                }

                function setDatePickerValues(date) {
                    datePickerYear.value = date.getFullYear();
                    datePickerMonth.value = date.getMonth() + 1;
                    updateDayOptions();
                    datePickerDay.value = date.getDate();
                }

                function openDatePicker() {
                    setDatePickerValues(selectedDate);
                    datePickerOverlay.classList.add('show');
                }

                function closeDatePicker() {
                    datePickerOverlay.classList.remove('show');
                }

                document.getElementById('calendarWidget').addEventListener('click', function(e) {
                    e.stopPropagation();
                    openDatePicker();
                });

                document.getElementById('datePickerClose').addEventListener('click', closeDatePicker);

                datePickerOverlay.addEventListener('click', function(e) {
                    if (e.target === datePickerOverlay) closeDatePicker();
                });

                document.getElementById('datePickerConfirm').addEventListener('click', function() {
                    var year = parseInt(datePickerYear.value);
                    var month = parseInt(datePickerMonth.value) - 1;
                    var day = parseInt(datePickerDay.value);

                    selectedDate = new Date(year, month, day);
                    isManualDate = true;
                    updateCalendar();
                    closeDatePicker();
                    showToastMsg('已切换到 ' + year + '年' + (month + 1) + '月' + day + '日');
                });

                document.getElementById('datePickerReset').addEventListener('click', function() {
                    selectedDate = new Date();
                    isManualDate = false;
                    updateCalendar();
                    closeDatePicker();
                    showToastMsg('已回到今天');
                });

                const monthCalendarOverlay = document.getElementById('monthCalendarOverlay');
                const monthCalendarTitle = document.getElementById('monthCalendarTitle');
                const monthCalendarDays = document.getElementById('monthCalendarDays');

                let monthCalendarYear = new Date().getFullYear();
                let monthCalendarMonth = new Date().getMonth();

                function renderMonthCalendar() {
                    monthCalendarTitle.textContent = monthCalendarYear + '年' + (monthCalendarMonth + 1) + '月';

                    var firstDay = new Date(monthCalendarYear, monthCalendarMonth, 1);
                    var lastDay = new Date(monthCalendarYear, monthCalendarMonth + 1, 0);
                    var daysInMonth = lastDay.getDate();
                    var startDayOfWeek = firstDay.getDay();

                    var prevMonthLastDay = new Date(monthCalendarYear, monthCalendarMonth, 0).getDate();

                    var html = '';

                    for (var i = startDayOfWeek - 1; i >= 0; i--) {
                        var d = prevMonthLastDay - i;
                        html += '<div class="month-calendar-day other-month">' +
                            '<span>' + d + '</span>' +
                        '</div>';
                    }

                    for (var d = 1; d <= daysInMonth; d++) {
                        var date = new Date(monthCalendarYear, monthCalendarMonth, d);
                        var holidayInfo = getHolidayInfo(date);
                        var festivalName = getFestivalName(date);
                        var classes = 'month-calendar-day';

                        var isToday = (date.getFullYear() === new Date().getFullYear() &&
                                       date.getMonth() === new Date().getMonth() &&
                                       date.getDate() === new Date().getDate());
                        var isSelected = (date.getFullYear() === selectedDate.getFullYear() &&
                                          date.getMonth() === selectedDate.getMonth() &&
                                          date.getDate() === selectedDate.getDate());

                        if (isToday) classes += ' today';
                        if (isSelected) classes += ' selected';
                        if (holidayInfo.type === 1) classes += ' holiday';
                        if (holidayInfo.type === 3) classes += ' workday';

                        var lunarText = '';
                        if (typeof Solar !== 'undefined') {
                            try {
                                var solar = Solar.fromDate(date);
                                var lunar = solar.getLunar();
                                lunarText = lunar.getDayInChinese();
                            } catch (e) {}
                        }

                        var tagHtml = '';
                        if (holidayInfo.type === 1) {
                            tagHtml = '<span class="day-tag rest">休</span>';
                        } else if (holidayInfo.type === 3) {
                            tagHtml = '<span class="day-tag work">班</span>';
                        }

                        var festivalHtml = '';
                        if (festivalName) {
                            festivalHtml = '<span class="day-festival">' + festivalName + '</span>';
                        }

                        html += '<div class="' + classes + '" data-date="' + date.getTime() + '">' +
                            tagHtml +
                            '<span>' + d + '</span>' +
                            '<span class="day-lunar">' + lunarText + '</span>' +
                            festivalHtml +
                        '</div>';
                    }

                    var totalCells = startDayOfWeek + daysInMonth;
                    var remaining = (7 - (totalCells % 7)) % 7;
                    for (var i = 1; i <= remaining; i++) {
                        html += '<div class="month-calendar-day other-month">' +
                            '<span>' + i + '</span>' +
                        '</div>';
                    }

                    monthCalendarDays.innerHTML = html;

                    monthCalendarDays.querySelectorAll('.month-calendar-day[data-date]').forEach(function(el) {
                        el.addEventListener('click', function() {
                            var timestamp = parseInt(this.dataset.date);
                            selectedDate = new Date(timestamp);
                            isManualDate = true;
                            updateCalendar();
                            closeMonthCalendar();
                            showToastMsg('已切换到 ' + selectedDate.getFullYear() + '年' + (selectedDate.getMonth() + 1) + '月' + selectedDate.getDate() + '日');
                        });
                    });
                }

                function openMonthCalendar() {
                    monthCalendarYear = selectedDate.getFullYear();
                    monthCalendarMonth = selectedDate.getMonth();
                    renderMonthCalendar();
                    monthCalendarOverlay.classList.add('show');
                }

                function closeMonthCalendar() {
                    monthCalendarOverlay.classList.remove('show');
                }

                document.getElementById('monthCalendarClose').addEventListener('click', closeMonthCalendar);

                monthCalendarOverlay.addEventListener('click', function(e) {
                    if (e.target === monthCalendarOverlay) closeMonthCalendar();
                });

                document.getElementById('monthPrevBtn').addEventListener('click', function() {
                    monthCalendarMonth--;
                    if (monthCalendarMonth < 0) {
                        monthCalendarMonth = 11;
                        monthCalendarYear--;
                    }
                    renderMonthCalendar();
                });

                document.getElementById('monthNextBtn').addEventListener('click', function() {
                    monthCalendarMonth++;
                    if (monthCalendarMonth > 11) {
                        monthCalendarMonth = 0;
                        monthCalendarYear++;
                    }
                    renderMonthCalendar();
                });

                var calendarLongPressTimer = null;
                var calendarLongPressTriggered = false;

                document.getElementById('calendarWidget').addEventListener('touchstart', function(e) {
                    calendarLongPressTriggered = false;
                    calendarLongPressTimer = setTimeout(function() {
                        calendarLongPressTriggered = true;
                        openMonthCalendar();
                    }, 500);
                }, { passive: true });

                document.getElementById('calendarWidget').addEventListener('touchend', function(e) {
                    clearTimeout(calendarLongPressTimer);
                    if (!calendarLongPressTriggered) {
                        e.preventDefault();
                        openDatePicker();
                    }
                });

                document.getElementById('calendarWidget').addEventListener('touchcancel', function(e) {
                    clearTimeout(calendarLongPressTimer);
                });

                document.getElementById('calendarWidget').addEventListener('contextmenu', function(e) {
                    e.preventDefault();
                    openMonthCalendar();
                });

                initDatePicker();
                locateAndFetchWeather();
                updateCalendar();

                setInterval(function() {
                    if (!isManualCity) {
                        locateAndFetchWeather();
                    } else {
                        fetchWeather(currentLat, currentLon, currentCity);
                    }
                }, 900000);

                setInterval(function() {
                    if (!isManualDate) {
                        selectedDate = new Date();
                        updateCalendar();
                    }
                }, 60000);

            })();

        })();
    </script>
</body>
</html>
