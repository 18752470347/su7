    <style>
        /* ===== 全局重置 & 变量 ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
            width: 100%;
            min-height: 100%;
            background: #F2F2F7;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        body {
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
        :root {
            --text-main: #1C1C1E;
            --text-sub: #3A3A3C;
            --text-muted: #8E8E93;
            --bg-primary: #F2F2F7;
            --bg-secondary: rgba(255, 255, 255, 0.35);
            --glass-bg: rgba(255, 255, 255, 0.28);
            --glass-border: rgba(255, 255, 255, 0.65);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.06), 0 2px 8px rgba(0, 0, 0, 0.02);
            --icon-bg: rgba(255, 255, 255, 0.55);
            --status-color: #1C1C1E;
            --toast-bg: rgba(20, 22, 28, 0.78);
            --viewer-bg: rgba(0, 0, 0, 0.85);
            --plate-bg: linear-gradient(135deg, #34C759, #28A745);
            --name-gradient: linear-gradient(90deg, #FF5C93, #C84870, #4A8DFF, #FF5C93);
            --sub-gradient: linear-gradient(90deg, #FF6D9C, #558EFF);
            --island-bg: rgba(255, 255, 255, 0.8);
            --island-text: #1C1C1E;
            --popup-overlay: rgba(0, 0, 0, 0.85);
            --glow-color: #FF2E63;
            --sakura-color: rgba(255, 80, 120, 0.55);
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
            --ease: cubic-bezier(0.22, 1, 0.36, 1);
            --card-radius: 24px;
            --icon-radius: 16px;
            --avatar-size: 72px;
            --plate-size: 86px;
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.06);
            --shadow-medium: 0 12px 48px rgba(0, 0, 0, 0.10);
            --shadow-strong: 0 20px 60px rgba(0, 0, 0, 0.15);
            --transition-smooth: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            --status-btn-size: 34px;
            --status-btn-gap: 8px;
            --vh: 1vh;
        }
        html.dark-mode {
            --text-main: #F5F5F7;
            --text-sub: #A1A1A6;
            --text-muted: #6E6E73;
            --bg-primary: #0A0A0C;
            --bg-secondary: rgba(20, 20, 24, 0.30);
            --glass-bg: rgba(44, 44, 46, 0.25);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glass-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), 0 2px 8px rgba(0, 0, 0, 0.2);
            --icon-bg: rgba(60, 60, 66, 0.35);
            --status-color: #F5F5F7;
            --toast-bg: rgba(60, 60, 66, 0.85);
            --viewer-bg: rgba(0, 0, 0, 0.92);
            --plate-bg: linear-gradient(135deg, #00D4FF, #7B61FF);
            --name-gradient: linear-gradient(90deg, #FF7A9E, #D86A8A, #6A9EFF, #FF7A9E);
            --sub-gradient: linear-gradient(90deg, #FF8AAF, #7AA5FF);
            --island-bg: rgba(20, 20, 24, 0.8);
            --island-text: #fff;
            --popup-overlay: rgba(0, 0, 0, 0.92);
            --glow-color: #00D4FF;
            --sakura-color: rgba(255, 200, 216, 0.45);
            --shadow-soft: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-medium: 0 12px 48px rgba(0, 0, 0, 0.4);
            --shadow-strong: 0 20px 60px rgba(0, 0, 0, 0.5);
            background-color: #0A0A0C;
            color: #F5F5F7;
        }
        html.dark-mode body {
            background: #0A0A0C;
            color: #F5F5F7;
        }
        html.dark-mode .sakura {
            background: rgba(255, 200, 216, 0.45);
            box-shadow: 0 0 20px rgba(255, 200, 216, 0.15);
        }
        html.transitioning {
            transition: background-color 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), color 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        html.transitioning * {
            transition: background-color 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                color 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                border-color 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                box-shadow 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                fill 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                opacity 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                backdrop-filter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1),
                -webkit-backdrop-filter 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        button,
        img,
        video {
            -webkit-user-drag: none;
            user-select: none;
        }
        button {
            font: inherit;
            cursor: pointer;
            background: none;
            border: none;
            outline: none;
        }
        img, video, button, .app-button, .plate, .avatar {
            -webkit-touch-callout: none;
        }
        button, .app-button, .plate, .avatar, .status-btn,
        .status-theme-toggle, .status-meteor-toggle, .status-word-toggle, .status-sakura-toggle,
        .center-play-btn, .btn-expand {
            touch-action: manipulation;
        }
        .viewer-img { -webkit-touch-callout: default; }

        /* ===== 星空画布 ===== */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            display: block;
            contain: strict;
        }
        .sakura-container {
            position: fixed;
            inset: 0;
            z-index: 999;
            pointer-events: none;
            overflow: hidden;
            transform: translateZ(0);
            contain: layout style paint;
        }
        .sakura {
            position: absolute;
            background: var(--sakura-color);
            border-radius: 50% 0 50% 50%;
            opacity: 0.6;
            will-change: transform, opacity;
            transform: translateZ(0);
            box-shadow: 0 0 16px rgba(255, 180, 200, 0.15);
        }
        @keyframes sakuraFall {
            0% { transform: translateY(0) rotate(0deg) translateX(0px); opacity: 0.7; }
            100% { transform: translateY(105vh) rotate(720deg) translateX(0px); opacity: 0; }
        }
        @keyframes pageSpringIn {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes cardSpringIn {
            from { opacity: 0; transform: translateY(24px) scale(0.94); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ===== 主容器 ===== */
        .app-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            width: 100%;
            max-width: 480px;
            padding: calc(var(--safe-top) + 12px) 14px calc(var(--safe-bottom) + 24px);
            position: relative;
            z-index: 2;
            animation: pageSpringIn .8s var(--spring) both;
            margin: 0 auto;
            gap: 8px;
            flex: 0 0 auto;
            box-sizing: border-box;
        }

        /* ===== 状态栏区域 ===== */
        .status-bar-container {
            width: 100%;
            flex-shrink: 0;
            padding: 0 0 2px;
        }
        .ios-status-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            font-weight: 600;
            color: var(--status-color);
            min-height: 34px;
            padding: 0 2px;
        }
        .ios-status-left {
            flex: 1;
            text-align: left;
            font-weight: 600;
            letter-spacing: 0.2px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: var(--status-btn-gap);
            min-width: 0;
        }
        .status-btn,
        .status-theme-toggle,
        .status-sakura-toggle,
        .status-meteor-toggle,
        .status-word-toggle {
            width: var(--status-btn-size);
            height: var(--status-btn-size);
            min-width: var(--status-btn-size);
            min-height: var(--status-btn-size);
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            border: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            color: var(--status-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            flex-shrink: 0;
            position: relative;
            overflow: visible;
            margin: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .status-btn i,
        .status-theme-toggle i,
        .status-sakura-toggle i,
        .status-meteor-toggle i,
        .status-word-toggle i {
            position: relative;
            z-index: 2;
            font-size: 15px;
            line-height: 1;
            transition: var(--transition-smooth);
        }
        .status-theme-toggle i { font-size: 16px; }
        .status-btn:active,
        .status-theme-toggle:active,
        .status-sakura-toggle:active,
        .status-meteor-toggle:active,
        .status-word-toggle:active { transform: scale(0.85); }

        .status-theme-toggle::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, rgba(255, 200, 100, 0.0), rgba(255, 200, 100, 0.15), rgba(255, 200, 100, 0.0), rgba(100, 200, 255, 0.15), rgba(100, 200, 255, 0.0));
            opacity: 0.4;
            filter: blur(6px);
            transform: scale(0.9);
            animation: ringOrbit 6s linear infinite;
            pointer-events: none;
            z-index: -1;
        }
        @keyframes ringOrbit { 0% { transform: scale(0.9) rotate(0deg); } 100% { transform: scale(0.9) rotate(360deg); } }
        html.dark-mode .status-theme-toggle { background: rgba(20, 20, 24, 0.5); border-color: rgba(255, 255, 255, 0.06); }
        html.dark-mode .status-theme-toggle i.fa-circle { color: #FFD93D; }
        .status-theme-toggle i.fa-sun { color: #FFB800; }

        .status-sakura-toggle.active { background: rgba(255, 150, 200, 0.08); border-color: rgba(255, 150, 200, 0.2); }
        .status-sakura-toggle.active i { color: #FF8AB4; }
        .status-sakura-toggle.inactive i { color: #8E8E93; opacity: 0.4; }
        .status-meteor-toggle.active { background: rgba(255, 215, 0, 0.08); border-color: rgba(255, 215, 0, 0.2); }
        .status-meteor-toggle.active i { color: #FFD93D; }
        .status-meteor-toggle.inactive i { color: #8E8E93; opacity: 0.4; }
        .status-word-toggle.active { background: rgba(255, 100, 150, 0.08); border-color: rgba(255, 100, 150, 0.2); }
        .status-word-toggle.active i { color: #FF6B9E; }
        .status-word-toggle.inactive i { color: #8E8E93; opacity: 0.4; }

        /* ===== 灵动岛 ===== */
        .dynamic-island {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            height: 32px;
            padding: 0 16px;
            min-width: 55px;
            background: var(--island-bg);
            border-radius: 22px;
            color: var(--island-text);
            font-size: 11px;
            font-weight: 500;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            flex-shrink: 0;
            margin: 0 var(--status-btn-gap);
            overflow: hidden;
            pointer-events: none;
            position: relative;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06), inset 0 0.5px 0 rgba(255, 255, 255, 0.5);
        }
        .island-text-scroll {
            display: inline-block;
            font-weight: 600;
            font-size: 11px;
            background: linear-gradient(90deg, #FF6B9E, #FFD966, #6AA9FF, #FF6B9E);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            white-space: nowrap;
            position: relative;
            z-index: 1;
            animation: textShine 2.5s ease-in-out infinite, scrollUp 2s ease-in-out infinite;
        }
        @keyframes textShine { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes scrollUp { 0% { transform: translateY(100%); opacity: 0; } 10% { transform: translateY(0); opacity: 1; } 90% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-100%); opacity: 0; } }

        .ios-status-right {
            flex: 1;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: var(--status-btn-gap);
        }
        .signal-icon { width: 18px; height: 12px; fill: var(--status-color); flex-shrink: 0; opacity: 0.8; margin-left: 2px; }

        /* ===== 天气 + 头像 + 日历 三栏卡片 ===== */
        .top-card {
            width: 100%;
            flex-shrink: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(24px) saturate(180%);
            -webkit-backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            box-shadow: var(--glass-shadow);
            padding: 12px 10px;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            justify-items: center;
            gap: 6px;
            animation: cardSpringIn .7s var(--ease) 0.08s both;
            transition: var(--transition-smooth);
            margin-bottom: 2px;
            position: relative;
        }

        /* 天气组件 */
        .weather-widget {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-width: 0;
            width: 100%;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            border-radius: 12px;
            padding: 4px;
            transition: var(--transition-smooth);
        }
        .weather-widget:active { transform: scale(0.97); }
        .weather-icon {
            font-size: 26px;
            line-height: 1;
            color: #FFB800;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 12px rgba(255, 184, 0, 0.25));
        }
        .weather-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
            align-items: flex-start;
        }
        .weather-temp {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.5px;
            line-height: 1.2;
        }
        .weather-desc {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .weather-location {
            font-size: 9px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 2px;
            margin-top: 1px;
        }
        .weather-location i {
            font-size: 7px;
        }
        .weather-wind {
            font-size: 9px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 2px;
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .weather-wind i {
            font-size: 8px;
            color: #4DA3FF;
        }

        /* 头像居中 */
        .avatar-center-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 0 4px;
        }
        .avatar-center {
            position: relative;
            width: var(--avatar-size);
            height: var(--avatar-size);
            border-radius: 50%;
            cursor: zoom-in;
            flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .avatar-center::before {
            content: '';
            position: absolute;
            inset: -14px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
            opacity: 0.45;
            z-index: -1;
            filter: blur(24px);
            animation: glowPulse 1.8s ease-in-out infinite alternate;
            transform: scale(0.7);
        }
        @keyframes glowPulse { 0% { transform: scale(0.6); opacity: 0.25; filter: blur(20px); } 100% { transform: scale(1.5); opacity: 0.75; filter: blur(36px); } }
        .avatar-center::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 60%);
            opacity: 0.4;
            z-index: -1;
            filter: blur(32px);
            animation: glowPulse2 2.4s ease-in-out infinite alternate;
            transform: scale(0.5);
        }
        @keyframes glowPulse2 { 0% { transform: scale(0.4); opacity: 0.15; filter: blur(28px); } 100% { transform: scale(1.7); opacity: 0.6; filter: blur(48px); } }
        .avatar-center .avatar-ring {
            position: absolute; inset: -4px; border-radius: 50%;
            background: conic-gradient(from 0deg, var(--glow-color), #FFD046, #00D4FF, #7B61FF, var(--glow-color));

            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            text-align: left;
            gap: 6px;
        }

        /* 右侧图片容器 */
        .plate-photo {
            width: var(--plate-size);
            flex-shrink: 0;
            border-radius: 12px;
            overflow: visible;
            cursor: zoom-in;
            position: relative;
            -webkit-tap-highlight-color: transparent;
        }
        .plate-photo-inner {
            position: relative; width: 100%; border-radius: 12px;
            box-shadow: var(--shadow-medium);
            aspect-ratio: 9 / 16; overflow: hidden;
            border: 1px solid var(--glass-border);
            transition: var(--transition-smooth);
        }
        .stack-img {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; border-radius: 12px;
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
            will-change: transform, opacity; backface-visibility: hidden;
            background: rgba(128, 128, 128, 0.08);
            transform: translateZ(0);
        }
        .stack-img.active { transform: scale(1) translateY(0); opacity: 1; z-index: 5; }
        .stack-img.pile { transform: scale(0.90) translateY(8px); opacity: 0.65; z-index: 4; }
        .stack-img.pile2 { transform: scale(0.82) translateY(16px); opacity: 0.35; z-index: 3; }
        .stack-img.pile3 { transform: scale(0.75) translateY(24px); opacity: 0.15; z-index: 2; }
        .stack-img.hidden { transform: scale(0.65) translateY(32px); opacity: 0; z-index: 1; pointer-events: none; }

        /* 主卡片文字 */
        .name {
            font-size: 15px;
            font-weight: 700;
            text-align: left;
            margin-top: 0;
            background: var(--name-gradient);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: textGradient 3.2s ease-in-out infinite;
            max-width: 100%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.5px;
            line-height: 1.3;
        }
        @keyframes textGradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .subtitle {
            font-size: 13px;
            font-weight: 600;
            text-align: left;
            margin-top: 0;
            background: var(--sub-gradient);
            background-size: 300% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: textGradientSub 3.8s ease-in-out infinite;
            line-height: 1.5;
            letter-spacing: 0.3px;
        }
        @keyframes textGradientSub { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        /* ===== 应用图标 ===== */
        .apps-scroll-wrapper {
            width: 100%;
            overflow: visible;
            position: relative;
            margin-top: 0;
            z-index: 10;
            flex-shrink: 0;
        }
        .apps-track { display: flex; transition: transform 0.4s var(--ease); will-change: transform; }
        .apps-page {
            flex: 0 0 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px 8px;
            padding: 0;
            min-height: 88px;
        }
        .app-button {
            --icon-color: #00D4FF;
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            background: transparent; cursor: pointer; transition: var(--transition-smooth);
            position: relative; z-index: 10;
            border-radius: 14px;
            padding: 4px 2px 6px;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            border: none;
            box-shadow: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .app-button:active { transform: scale(0.90); }
        .app-icon-wrap {
            position: relative; width: 52px; height: 52px;
            display: flex; align-items: center; justify-content: center;
            border-radius: var(--icon-radius);
            background: var(--icon-bg);
            box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.08), 0 4px 16px rgba(0, 0, 0, 0.04);
            font-size: 22px; color: var(--icon-color);
            backdrop-filter: blur(14px) saturate(170%);
            -webkit-backdrop-filter: blur(14px) saturate(170%);
            border: 1px solid var(--glass-border);
            transition: var(--transition-smooth); z-index: 10;
            overflow: hidden;
            transform: translateZ(0);
        }
        .app-icon-wrap::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.35), transparent 70%);
            opacity: 0.6;
            pointer-events: none;
            border-radius: inherit;
        }
        .app-icon-wrap::after {
            content: ''; position: absolute; inset: -3px;
            border-radius: calc(var(--icon-radius) + 2px);
            background: conic-gradient(from 0deg, var(--icon-color), transparent, var(--icon-color));
            opacity: 0; transition: opacity 0.4s ease; z-index: -1; filter: blur(8px);
        }
        .app-button:active .app-icon-wrap { transform: scale(0.88); }
        .app-button.loading .app-icon-wrap { opacity: 0.6; transform: scale(0.95); }
        .app-label {
            font-size: 9px; font-weight: 600; color: var(--text-sub);
            text-align: center; line-height: 1.2; letter-spacing: 0.2px;
            transition: var(--transition-smooth);
            text-shadow: 0 1px 2px rgba(0,0,0,0.02);
            margin-top: 1px;
        }

        /* ===== Connecat VPN 图标 ===== */
        .vpn-icon {
            background: var(--icon-bg) !important;
            border-color: var(--glass-border) !important;
            box-shadow: inset 0 0.5px 0 rgba(255, 255, 255, 0.08), 0 4px 16px rgba(0, 0, 0, 0.04) !important;
            position: relative;
            overflow: hidden;
            transition: var(--transition-smooth);
        }
        .vpn-svg {
            width: 24px;
            height: 24px;
            color: var(--icon-color);
            position: relative;
            z-index: 2;
            transition: all 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            filter: none;
        }
        .vpn-wave {
            transition: none;
            transform-origin: center;
            animation: none;
        }
        .vpn-wave-1, .vpn-wave-3,
        .vpn-wave-2, .vpn-wave-4 {
            animation: none;
        }
        @keyframes vpnWavePulse { }
        .vpn-glow {
            display: none;
        }
        .app-button:active .vpn-svg { transform: scale(0.88); }
        html.dark-mode .vpn-icon {
            background: var(--icon-bg) !important;
            border-color: var(--glass-border) !important;
        }
        html.dark-mode .vpn-svg {
            color: var(--icon-color);
            filter: none;
        }
        .app-button.loading .vpn-svg { opacity: 0.3; }

        /* ===== Toast ===== */
        .toast {
            position: fixed; z-index: 10001; left: 50%; bottom: calc(30px + var(--safe-bottom));
            transform: translate(-50%, 20px) scale(0.92);
            padding: 8px 20px; border-radius: 12px;
            color: #fff; background: var(--toast-bg);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            font-size: 13px; font-weight: 500; opacity: 0; pointer-events: none;
            transition: opacity 0.3s var(--ease), transform 0.3s var(--spring);
            border: 0.5px solid rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow-strong);
            max-width: 80vw;
            text-align: center;
        }
        .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

        /* ===== 图片查看器 ===== */
        .viewer {
            position: fixed; inset: 0; z-index: 10000;
            display: flex; align-items: center; justify-content: center;
            background: var(--viewer-bg);
            backdrop-filter: blur(28px) saturate(120%);
            -webkit-backdrop-filter: blur(28px) saturate(120%);
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: opacity 0.35s var(--ease), visibility 0.35s var(--ease);
        }
        .viewer.show { opacity: 1; visibility: visible; pointer-events: auto; }
        .viewer-content {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            width: 100%; height: 100%; padding: 20px;
        }
        .viewer-img {
            max-width: 94vw; max-height: 72vh; object-fit: contain;
            border-radius: 12px; box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
            opacity: 0; transition: opacity 0.35s var(--ease), transform 0.35s var(--ease);
            touch-action: none; transform: scale(0.96);
        }
        .viewer.show .viewer-img { opacity: 1; transform: scale(1); }
        .viewer-close {
            position: fixed; top: calc(16px + var(--safe-top)); right: calc(16px + env(safe-area-inset-right, 0px));
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06); color: #fff; font-size: 18px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10003; transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .viewer-close:active { transform: scale(0.88); }
        .viewer-hint { color: rgba(255, 255, 255, 0.30); font-size: 12px; margin-top: 14px; letter-spacing: 0.3px; }
        .viewer-counter {
            position: fixed; bottom: calc(28px + var(--safe-bottom)); left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.35); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border-radius: 20px; padding: 5px 20px; color: #fff; font-size: 13px; font-weight: 500;
            border: 0.5px solid rgba(255, 255, 255, 0.04); z-index: 10004;
            opacity: 0; transition: opacity 0.3s ease; pointer-events: none;
        }
        .viewer.show .viewer-counter { opacity: 1; }

        /* ===== 点击弹字 ===== */
        .click-text-item {
            position: fixed; z-index: 10002; pointer-events: none;
            font-weight: 800; font-size: 20px;
            background: linear-gradient(90deg, #00D4FF, #7B61FF, #FF6B9E, #FFD966);
            background-size: 400% 100%;
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: popFloatGrad 4.8s var(--ease) forwards;
            will-change: transform, opacity;
            filter: drop-shadow(0 0 30px rgba(0, 212, 255, 0.15));
            font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
        }
        @keyframes popFloatGrad {
            0% { transform: translateY(0) scale(1.3); opacity: 1; background-position: 0% 50%; }
            20% { background-position: 50% 50%; }
            40% { background-position: 100% 50%; }
            60% { background-position: 50% 50%; }
            80% { background-position: 0% 50%; }
            100% { transform: translateY(-200px) scale(0.4); opacity: 0; background-position: 0% 50%; }
        }

        /* ===== 视频弹窗 ===== */
        .video-popup {
            position: fixed; inset: 0; z-index: 10050;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0, 0, 0, 0.94);
            backdrop-filter: blur(24px) saturate(120%);
            -webkit-backdrop-filter: blur(24px) saturate(120%);
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: opacity 0.4s var(--ease), visibility 0.4s var(--ease);
            padding: 12px;
        }
        .video-popup.active { opacity: 1; visibility: visible; pointer-events: auto; }
        .popup-inner {
            position: relative; width: 100%; max-width: 820px;
            background: #000; border-radius: 16px; overflow: hidden;
            box-shadow: 0 40px 80px rgba(0, 0, 0, 0.6);
            transform: scale(0.92); transition: transform 0.4s var(--spring);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .video-popup.active .popup-inner { transform: scale(1); }
        .popup-inner video {
            display: block; width: 100%; height: auto; max-height: 80vh;
            object-fit: contain; background: #000;
            transform: translateZ(0);
        }
        .popup-close {
            position: absolute; top: 10px; right: 10px; width: 38px; height: 38px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06); color: #fff; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10; opacity: 0.9; transition: all 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .popup-close:active { transform: scale(0.88); }
        .popup-close.hidden { opacity: 0; pointer-events: none; }
        .popup-controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            padding: 10px 14px 12px;
            background: linear-gradient(transparent 0%, rgba(0, 0, 0, 0.80) 100%);
            z-index: 5; display: flex; align-items: center; gap: 8px; color: #fff;
            opacity: 1; transition: opacity 0.4s ease, transform 0.4s ease;
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
        }
        .popup-controls.hidden { opacity: 0; pointer-events: none; transform: translateY(12px); }
        .popup-controls button {
            color: rgba(255, 255, 255, 0.85); font-size: 15px; padding: 4px; opacity: 0.85;
            transition: all 0.2s ease; border-radius: 50%; width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            -webkit-tap-highlight-color: transparent;
        }
        .popup-controls button:active { opacity: 0.4; transform: scale(0.88); }
        .popup-progress-wrap {
            display: none !important;
        }
        .popup-progress-bar {
            display: none !important;
        }
        .popup-time {
            font-size: 11px; font-weight: 500; min-width: 80px; text-align: right;
            color: rgba(255, 255, 255, 0.75); letter-spacing: 0.3px;
        }

        /* ===== 滚动条隐藏 ===== */
        ::-webkit-scrollbar { width: 0; height: 0; background: transparent; }
        * { scrollbar-width: none; }

        /* 兼容回退 */
        @supports not (aspect-ratio: 1 / 1) {
            .video-box { height: 0; padding-bottom: 56.25%; }
            .video-box > video { position: absolute; left: 0; top: 0; }
            .plate-photo-inner { height: 0; padding-bottom: 177.78%; }
            .center-play-btn { height: 54px; }
        }

        /* ===== 漂浮文字 ===== */
        .floating-word {
            position: fixed; font-size: 22px; font-weight: 900;
            font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
            cursor: grab; z-index: 1100; pointer-events: auto;
            transition: none; text-shadow: 0 4px 30px rgba(0, 0, 0, 0.04);
            letter-spacing: 3px; will-change: left, top;
            user-select: none; -webkit-user-select: none;
            filter: drop-shadow(0 2px 16px rgba(0, 0, 0, 0.03));
            touch-action: none; -webkit-touch-callout: none;
        }
        .floating-word:active { cursor: grabbing; }
        .floating-word.following {
            transition: none !important; z-index: 1101;
            filter: drop-shadow(0 8px 48px rgba(0, 0, 0, 0.12));
            cursor: grabbing; transform: scale(1.10);
        }
        .floating-word .char {
            display: inline-block;
            background: linear-gradient(135deg, #FF6B9E, #FFD93D, #6BCB77, #4D96FF, #9B59B6, #FF6B9E);
            background-size: 300% 300%;
            -webkit-background-clip: text; background-clip: text; color: transparent;
            animation: rainbowMove 5s ease-in-out infinite alternate;
            font-weight: 900; transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .floating-word.following .char { transform: scale(1.08); animation-duration: 1.8s; }
        @keyframes rainbowMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .floating-word .char:nth-child(1) { animation-delay: 0s; }
        .floating-word .char:nth-child(2) { animation-delay: 0.3s; }
        .floating-word .char:nth-child(3) { animation-delay: 0.6s; }
        .floating-word.following::after {
            content: ''; position: absolute; inset: -14px; border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.08) 0%, transparent 70%);
            z-index: -1; filter: blur(20px);
            animation: trailPulse 0.9s ease-in-out infinite alternate; pointer-events: none;
        }
        @keyframes trailPulse { 0% { transform: scale(0.7); opacity: 0.2; } 100% { transform: scale(1.5); opacity: 0.6; } }
        .floating-word.hidden-words { visibility: hidden !important; pointer-events: none !important; transition: visibility 0.3s ease; }

        /* 低端机毛玻璃降级 */
        html.low-perf .main-card,
        html.low-perf .video-popup,
        html.low-perf .viewer,
        html.low-perf .top-card,
        html.low-perf .almanac-item { backdrop-filter: blur(6px) !important; -webkit-backdrop-filter: blur(6px) !important; }
        html.low-perf .sakura { display: none !important; }

        /* ===== 触屏设备禁用 hover ===== */
        @media (hover: none), (pointer: coarse) {
            .app-button:hover .app-icon-wrap { transform: none; }
            .app-button:hover .app-icon-wrap::after { opacity: 0; }
            .app-button:hover .app-label { color: var(--text-sub); }
            .plate:hover { transform: none; }
            .main-card:hover { box-shadow: var(--glass-shadow); }
            .avatar-center img:hover { transform: none; }
            .plate-photo-inner:hover { transform: none; }
            .controls-row button:hover, .btn-expand:hover, .popup-controls button:hover { background: transparent; transform: none; }
            .center-play-btn:hover { transform: translate(-50%, -50%); }
        }

        /* ===== 小屏适配 ===== */
        @media (max-width: 380px) {
            :root { --status-btn-size: 30px; --status-btn-gap: 6px; }
            .app-container { padding: calc(var(--safe-top) + 8px) 12px calc(var(--safe-bottom) + 20px); gap: 6px; }
            .main-card { padding: 12px 12px 14px; gap: 10px; }
            :root { --avatar-size: 62px; --plate-size: 76px; }
            .name { font-size: 13px; }
            .subtitle { font-size: 11px; }
            .app-icon-wrap { width: 46px; height: 46px; font-size: 19px; }
            .app-label { font-size: 8px; }
            .apps-page { gap: 8px 6px; min-height: 80px; }
            .dynamic-island { height: 28px; font-size: 10px; padding: 0 12px; min-width: 45px; }
            .center-play-btn { min-width: 38px; font-size: clamp(16px, 4.5vw, 28px); }
            .video-controls { padding: 6px 10px 8px; }
            .controls-row button { font-size: 15px; min-width: 24px; min-height: 24px; }
            .btn-expand { font-size: 13px; min-width: 24px; min-height: 24px; }
            .status-btn i, .status-theme-toggle i, .status-sakura-toggle i, .status-meteor-toggle i, .status-word-toggle i { font-size: 13px; }
            .ios-status-left { font-size: 12px; }
            .top-card { padding: 8px 6px; gap: 4px; }
            .weather-icon { font-size: 22px; }
            .weather-temp { font-size: 15px; }
            .calendar-date-block { width: 36px; height: 36px; }
            .calendar-day-num { font-size: 16px; }
            .almanac-item { padding: 6px 8px; gap: 4px; }
            .almanac-label { font-size: 9px; padding: 1px 5px; }
            .almanac-content { font-size: 10px; }
            .calendar-lunar { font-size: 8px; }
            .weather-wind { font-size: 8px; }
            .profile-row { gap: 8px; }
        }
        @media (max-width: 360px) {
            :root { --plate-size: 68px; --avatar-size: 56px; }
            .main-card { padding: 10px 10px 12px; gap: 8px; }
            .app-icon-wrap { width: 42px; height: 42px; font-size: 17px; }
            .app-label { font-size: 7px; }
            .apps-page { gap: 6px 5px; min-height: 72px; }
            .name { font-size: 12px; }
            .subtitle { font-size: 10px; }
            .weather-icon { font-size: 20px; }
            .weather-temp { font-size: 14px; }
            .weather-desc { font-size: 9px; }
            .calendar-date-block { width: 32px; height: 32px; }
            .calendar-day-num { font-size: 14px; }
            .calendar-year-month { font-size: 10px; }
            .calendar-weekday { font-size: 8px; }
        }

        /* ===== 减少动画 ===== */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
            .sakura { display: none; }
        }

        /* ===== 电脑端适配 ===== */
        @media (min-width: 768px) and (hover: hover) and (pointer: fine) {
            .app-container {
                max-width: 640px;
                padding: 32px 28px 40px;
                gap: 12px;
            }
            .video-player-container { border-radius: 22px; max-height: 320px; }
            .video-box { aspect-ratio: 16 / 9; }
            .main-card { padding: 32px 40px 36px; border-radius: 28px; gap: 16px; }
            .profile-row { gap: 24px; }
            :root { --avatar-size: 96px; --plate-size: 120px; }
            .name { font-size: 20px; }
            .subtitle { font-size: 16px; line-height: 1.6; }
            .apps-scroll-wrapper { margin-top: 8px; }
            .apps-page { gap: 22px 16px; min-height: 130px; }
            .app-button { padding: 8px 4px 10px; border-radius: 18px; gap: 6px; }
            .app-icon-wrap { width: 68px; height: 68px; font-size: 28px; border-radius: 22px; }
            .vpn-svg { width: 32px; height: 32px; }
            .app-label { font-size: 12px; margin-top: 4px; }
            .dynamic-island { height: 42px; padding: 0 28px; font-size: 15px; min-width: 86px; }
            .island-text-scroll { font-size: 15px; }
            .status-btn, .status-theme-toggle, .status-sakura-toggle, .status-meteor-toggle, .status-word-toggle {
                width: 44px; height: 44px; min-width: 44px; min-height: 44px;
            }
            .status-btn i, .status-theme-toggle i, .status-sakura-toggle i, .status-meteor-toggle i, .status-word-toggle i { font-size: 20px; }
            .status-theme-toggle i { font-size: 22px; }
            .ios-status-left { font-size: 16px; }
            .center-play-btn { max-width: 96px; min-width: 64px; font-size: clamp(28px, 4.5vw, 44px); }
            .controls-row button { font-size: 20px; min-width: 34px; min-height: 34px; }
            .btn-expand { font-size: 18px; min-width: 34px; min-height: 34px; }
            .controls-time { font-size: 15px; gap: 10px; }
            .video-controls { padding: 14px 20px 16px; }
            .floating-word { font-size: 34px; }

var CORE = ['./'];

self.addEventListener('install', function (e) {

});

self.addEventListener('activate', function (e) {

        caches.keys().then(function (keys) {
            return Promise.all(keys.filter(function (k) { return k !== VERSION; }).map(function (k) { return caches.delete(k); }));
        }).then(function () { return self.clients.claim(); })
    );
});

self.addEventListener('fetch', function (e) {
    var req = e.request;
    if (req.method !== 'GET') return;
    var url = new URL(req.url);

    if (req.mode === 'navigate') {
        e.respondWith(
            fetch(req).then(function (res) {
                var copy = res.clone();
                caches.open(VERSION).then(function (c) { c.put(SHELL, copy); });
                return res;
            }).catch(function () {
                return caches.match(SHELL).then(function (r) { return r || Response.error(); });
            })
        );
        return;
    }

    if (req.destination === 'image' || req.destination === 'video' || req.destination === 'font' ||
        req.destination === 'style' || req.destination === 'script' || /\.jpg|\.jpeg|\.png|\.webp|\.mp4|\.webm/i.test(url.pathname)) {

    <script>
        (function() {
            'use strict';

            // ================================================================
            //  ⚡ 性能参数
            // ================================================================
            const TARGET_FPS = 30;
            const FRAME_INTERVAL = 1000 / TARGET_FPS;
            const STAR_COUNT = 380;
            const METEOR_SPAWN_INTERVAL_MIN = 10;
            const METEOR_SPAWN_INTERVAL_MAX = 30;
            const MAX_METEORS = 10;
            const SAKURA_INTERVAL_MS = 320;
            const SAKURA_MAX = 10;
            const STACK_PRELOAD_COUNT = 6;

            const isAndroid = /Android/i.test(navigator.userAgent);
            const isChrome = /Chrome/i.test(navigator.userAgent) && !/Edge|Edg/i.test(navigator.userAgent);

            // ================================================================
            //  🌌 星空 + 流星雨系统
            // ================================================================
            const canvas = document.getElementById('particles-canvas');
            const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
            let w, h;
            let animFrameId = null;

            let meteorEnabled = true;
            const METEOR_STORAGE_KEY = 'meteor_enabled';
            try {
                const saved = localStorage.getItem(METEOR_STORAGE_KEY);
                if (saved !== null) meteorEnabled = saved === 'true';
            } catch (e) {}

            function resizeCanvas() {
                w = canvas.width = window.innerWidth;
                h = canvas.height = window.innerHeight;
            }
            resizeCanvas();

            function isDarkMode() {
                return document.documentElement.classList.contains('dark-mode');
            }

            const starSpriteCache = new Map();
            function getStarSprite(hue, sat) {
                const hh = Math.round(hue / 15) * 15;
                const ss = Math.round(sat / 20) * 20;
                const key = hh + '_' + ss;
                let c = starSpriteCache.get(key);
                if (c) return c;
                const S = 64, R = 32;
                c = document.createElement('canvas');
                c.width = S;
                c.height = S;
                const cc = c.getContext('2d');
                const g = cc.createRadialGradient(R, R, 0, R, R, R);
                g.addColorStop(0, 'hsla(' + hh + ',' + ss + '%,100%,1)');
                g.addColorStop(0.22, 'hsla(' + hh + ',' + ss + '%,92%,0.55)');
                g.addColorStop(0.55, 'hsla(' + hh + ',' + ss + '%,88%,0.16)');
                g.addColorStop(1, 'hsla(' + hh + ',' + ss + '%,85%,0)');
                cc.fillStyle = g;
                cc.beginPath();
                cc.arc(R, R, R, 0, Math.PI * 2);
                cc.fill();
                starSpriteCache.set(key, c);
                return c;
            }

            const stars = [];
            class Star {
                constructor() {
                    this.x = Math.random() * w;
                    this.y = Math.random() * h;
                    this.size = 0.6 + Math.random() * 2.8;
                    this.baseBrightness = 0.3 + Math.random() * 0.6;
                    this.twinkleSpeed = 0.015 + Math.random() * 0.03;
                    this.twinkleOffset = Math.random() * Math.PI * 2;
                    this.hue = 200 + Math.random() * 40;
                    this.saturation = 50 + Math.random() * 40;
                    this.sprite = getStarSprite(this.hue, this.saturation);
                    this.hueInt = this.hue | 0;
                    this.satInt = this.saturation | 0;
                }
                draw(time, dark) {
                    const brightnessScale = dark ? 1.2 : 1.8;
                    let opacity = this.baseBrightness * brightnessScale *
                        (0.55 + 0.45 * Math.sin(time * this.twinkleSpeed + this.twinkleOffset));
                    if (opacity <= 0.035) return;
                    if (opacity > 1) opacity = 1;
                    const size = this.size * (dark ? 1.1 : 0.9);
                    const glowR = size * 3.2;
                    ctx.globalAlpha = opacity * 0.5;
                    ctx.drawImage(this.sprite, this.x - glowR, this.y - glowR, glowR * 2, glowR * 2);
                    ctx.globalAlpha = opacity;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                    ctx.fillStyle = 'hsl(' + this.hueInt + ',' + this.satInt + '%,' + (dark ? 92 : 95) + '%)';
                    ctx.fill();
                }
            }

            class CardMeteor {
                constructor() {
                    if (!cardRect) {
                        this.x = Math.random() * w;
                        this.y = Math.random() * h;
                    } else {
                        const side = Math.floor(Math.random() * 4);
                        const margin = 10,
                            pad = 20;
                        switch (side) {
                            case 0:
                                this.x = cardRect.left + pad + Math.random() * (cardRect.width - pad * 2);
                                this.y = cardRect.top - margin;
                                break;
                            case 1:
                                this.x = cardRect.right + margin;
                                this.y = cardRect.top + pad + Math.random() * (cardRect.height - pad * 2);
                                break;
                            case 2:
                                this.x = cardRect.left + pad + Math.random() * (cardRect.width - pad * 2);
                                this.y = cardRect.bottom + margin;
                                break;
                            case 3:
                                this.x = cardRect.left - margin;
                                this.y = cardRect.top + pad + Math.random() * (cardRect.height - pad * 2);
                                break;
                        }
                    }
                    const speed = 4 + Math.random() * 4;
                    const angle = Math.random() * Math.PI * 2;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    if (cardRect) {
                        const cx = cardRect.left + cardRect.width / 2;
                        const cy = cardRect.top + cardRect.height / 2;
                        const dx = cx - this.x,
                            dy = cy - this.y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist > 10) {
                            const bias = 0.3 + Math.random() * 0.3;
                            const targetAngle = Math.atan2(dy, dx);
                            let currentAngle = Math.atan2(this.vy, this.vx);
                            let diff = targetAngle - currentAngle;
                            while (diff > Math.PI) diff -= 2 * Math.PI;
                            while (diff < -Math.PI) diff += 2 * Math.PI;
                            const newAngle = currentAngle + diff * bias;
                            this.vx = Math.cos(newAngle) * speed;
                            this.vy = Math.sin(newAngle) * speed;
                        }
                    }
                    this.tailLength = 30 + Math.random() * 50;
                    this.life = 1.0;
                    this.decay = 0.003 + Math.random() * 0.004;
                    this.hue = 200 + Math.random() * 30;
                    this.saturation = 80 + Math.random() * 20;
                    this.lightness = 85 + Math.random() * 15;
                    this.size = 1.2 + Math.random() * 1.8;
                }
                update() {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.life -= this.decay;
                    if (cardRect) {
                        const margin = 50;
                        if (this.x < cardRect.left - margin || this.x > cardRect.right + margin ||
                            this.y < cardRect.top - margin || this.y > cardRect.bottom + margin) {
                            this.life = 0;
                            return false;
                        }
                    } else {
                        if (this.x < -100 || this.x > w + 100 || this.y < -100 || this.y > h + 100) {
                            this.life = 0;
                            return false;
                        }
                    }
                    return this.life > 0;
                }
                draw() {
                    const dark = isDarkMode();
                    const lifeFactor = Math.max(0, this.life);
                    const alpha = lifeFactor * (dark ? 0.9 : 1.1);
                    const tailX = this.x - this.vx * this.tailLength * 0.5;
                    const tailY = this.y - this.vy * this.tailLength * 0.5;
                    const grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
                    const hue = this.hue + 10,
                        sat = this.saturation,
                        light = this.lightness;
                    grad.addColorStop(0, `hsla(${hue}, ${sat}%, ${light + 5}%, ${alpha * 0.95})`);
                    grad.addColorStop(0.15, `hsla(${hue}, ${sat}%, ${light}%, ${alpha * 0.8})`);
                    grad.addColorStop(0.5, `hsla(${this.hue}, ${sat - 10}%, ${light - 10}%, ${alpha * 0.4})`);
                    grad.addColorStop(1, `hsla(${this.hue - 10}, ${sat - 20}%, ${light - 25}%, 0)`);
                    ctx.beginPath();
                    ctx.moveTo(this.x, this.y);
                    ctx.lineTo(tailX, tailY);
                    ctx.strokeStyle = grad;
                    ctx.lineWidth = this.size * lifeFactor * 1.2 + 0.3;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                    const glowSize = this.size * (3 + lifeFactor * 2);
                    const glowGrad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, glowSize);
                    const glowAlpha = alpha * (dark ? 0.35 : 0.4);
                    glowGrad.addColorStop(0, `hsla(${hue + 10}, 100%, 98%, ${glowAlpha})`);
                    glowGrad.addColorStop(0.3, `hsla(${hue + 5}, 90%, 90%, ${glowAlpha * 0.5})`);
                    glowGrad.addColorStop(1, `hsla(${hue}, 80%, 80%, 0)`);
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, glowSize, 0, Math.PI * 2);
                    ctx.fillStyle = glowGrad;
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * lifeFactor * 0.7 + 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = `hsla(${hue + 15}, 100%, 100%, ${alpha * 0.95})`;
                    ctx.fill();
                    if (lifeFactor > 0.3) {
                        ctx.beginPath();
                        ctx.arc(this.x - this.size * 0.15, this.y - this.size * 0.15, this.size * 0.2 * lifeFactor, 0, Math
                            .PI * 2);
                        ctx.fillStyle = `rgba(255,255,255,${alpha * 0.5})`;
                        ctx.fill();
                    }
                }
            }

            let time = 0;

                if (lastFrameTs === 0) { lastFrameTs = now; return; }
                const delta = now - lastFrameTs;
                if (delta < FRAME_INTERVAL) return;
                lastFrameTs = now;
                const step = Math.min(3, delta / 16.67);

                time += step;
                const dark = isDarkMode();
                ctx.clearRect(0, 0, w, h);

                        Math.random() * (METEOR_SPAWN_INTERVAL_MAX - METEOR_SPAWN_INTERVAL_MIN);
                    if (meteorSpawnCounter > interval && meteors.length < MAX_METEORS) {
                        meteors.push(new CardMeteor());
                        meteorSpawnCounter = 0;

                    for (let i = meteors.length - 1; i >= 0; i--) {
                        const m = meteors[i];

            function playWithSound(videoEl) {
                if (!videoEl) return;
                videoEl.muted = false;
                if (videoEl.volume <= 0) videoEl.volume = 1;
                var p = videoEl.play();
                if (p && typeof p.catch === 'function') {

                    });
                }
            }

            // ---- 堆叠图片（懒加载）----
            let stackImgs = [];

            function buildStack() {
                photoInner.innerHTML = '';
                stackImgs = [];
                slideImages.forEach((url, idx) => {
                    const img = document.createElement('img');
                    img.className = 'stack-img';
                    img.dataset.index = idx;
                    img.alt = '堆叠图片';
                    img.draggable = false;
                    img.decoding = 'async';
                    if (idx < STACK_PRELOAD_COUNT) {
                        img.src = url;
                    } else {
                        img.dataset.src = url;
                    }
                    photoInner.appendChild(img);
                    stackImgs.push(img);
                });
                updateStack(0);
            }

            function ensureStackLoaded(activeIndex) {
                const len = stackImgs.length;
                for (let d = 0; d < 5; d++) {
                    const i = (activeIndex + d) % len;
                    const img = stackImgs[i];
                    if (img && !img.getAttribute('src') && img.dataset.src) {
                        img.src = img.dataset.src;
                        img.removeAttribute('data-src');
                    }
                }
            }

            function updateStack(activeIndex) {
                const len = stackImgs.length;
                ensureStackLoaded(activeIndex);
                stackImgs.forEach((img, idx) => {
                    img.classList.remove('active', 'pile', 'pile2', 'pile3', 'hidden');
                    if (idx === activeIndex) {
                        img.classList.add('active');
                    } else {
                        const diff = (idx - activeIndex + len) % len;
                        if (diff === 1) img.classList.add('pile');
                        else if (diff === 2) img.classList.add('pile2');
                        else if (diff === 3) img.classList.add('pile3');
                        else img.classList.add('hidden');
                    }
                });
                slideIndex = activeIndex;
                try { localStorage.setItem(STORAGE_PREFIX + 'slide_index', String(slideIndex)); } catch (e) {}
            }

            function nextSlide() {
                if (slideImages.length < 2) return;
                updateStack((slideIndex + 1) % slideImages.length);
            }
            buildStack();
            photoInner.addEventListener('click', function(e) { e.stopPropagation();
                openViewer(slideImages, slideIndex, '图片原图'); });
            if (slideImages.length > 1) slideTimer = setInterval(nextSlide, 3800);
            try {
                const si = localStorage.getItem(STORAGE_PREFIX + 'slide_index');
                if (si !== null) { const idx = parseInt(si, 10); if (!isNaN(idx) && idx >= 0 && idx < slideImages.length)
                        updateStack(idx); }
            } catch (e) {}

            function toggleTheme() {

                const metaTheme = document.querySelector('meta[name="theme-color"]');
                const metaColorScheme = document.querySelector('meta[name="color-scheme"]');
                if (isDark) {
                    html.classList.remove('dark-mode');
                    statusThemeIcon.className = 'fa-regular fa-sun';
                    if (metaTheme) metaTheme.setAttribute('content', '#F2F2F7');
                    if (metaColorScheme) metaColorScheme.setAttribute('content', 'light');
                    try { localStorage.setItem('plate_theme_mode', 'light'); } catch (e) {}
                    showToastMsg('☀️ 已切换到浅色模式');
                } else {
                    html.classList.add('dark-mode');
                    statusThemeIcon.className = 'fa-solid fa-circle';
                    if (metaTheme) metaTheme.setAttribute('content', '#0A0A0C');
                    if (metaColorScheme) metaColorScheme.setAttribute('content', 'dark');
                    try { localStorage.setItem('plate_theme_mode', 'dark'); } catch (e) {}
                    showToastMsg('🌕 已切换到深色模式');
                }
                setTimeout(() => html.classList.remove('transitioning'), 800);
            }

            // ===== 工具函数 =====
            function formatTime(s) {
                if (isNaN(s) || !isFinite(s)) return "00:00";
                const m = Math.floor(s / 60);
                const sec = Math.floor(s % 60);
                return String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
            }

            function showToastMsg(msg) {
                toast.textContent = msg;
                toast.classList.add("show");
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => toast.classList.remove("show"), 1500);
            }

            function startAutoHideTimer() {

                        centerPlayBtn.classList.add("hidden");
                    }, HIDE_DELAY);

            }

            function showControls() {
                videoControls.classList.remove("hidden");

                const isHidden = videoControls.classList.contains('hidden');

            function switchVideo(index) {
                if (videoList.length === 0) return;
                currentVideoIndex = (index + videoList.length) % videoList.length;
                const src = videoList[currentVideoIndex];

                mainVideo.src = src;
                progressFill.style.width = '0%';
                curTime.textContent = '00:00';
                totTime.textContent = formatTime(mainVideo.duration);

                if (isPopupMode) {
                    popupVideo.src = src;
                    popupVideo.currentTime = 0;
                    playWithSound(popupVideo);
                    mainVideo.pause();
                    mainVideo.muted = true;
                } else {
                    mainVideo.muted = false;
                    if (mainVideo.volume <= 0) mainVideo.volume = 1;
                    playWithSound(mainVideo);
                    popupVideo.src = src;
                }

                updateCenterPlayBtn();
                updatePlayBtnIcon();
                showControls();
                saveCarouselState();

                async function fetchLocationDetails(lat, lon) {
                    try {

                            `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`,

                        const data = await res.json();

                        var city = data.city || data.principalSubdivision || '';
                        var displayName = district || city || '当前位置';
                        return {
                            district: district,
                            city: city,
                            displayName: displayName
                        };
                    } catch (e) {
                        console.warn('位置信息获取失败:', e);
                        return { district: '', city: '', displayName: '当前位置' };
                    }
                }

                async function fetchWeather(lat, lon, cityName) {
                    try {
                        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
                        const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const data = await res.json();
                        const cw = data.current_weather;
                        if (!cw) throw new Error('no current_weather');

                        const code = cw.weathercode;
                        const iconClass = WEATHER_ICON_MAP[code] || 'fa-sun';
                        const desc = WEATHER_DESC_MAP[code] || '未知';
                        const temp = Math.round(cw.temperature);
                        const windspeed = cw.windspeed;
                        const winddirection = cw.winddirection;

                        document.getElementById('weatherIcon').innerHTML = `<i class="fa-solid ${iconClass}"></i>`;
                        document.getElementById('weatherTemp').textContent = temp + '°C';
                        document.getElementById('weatherDesc').textContent = desc;
                        document.getElementById('weatherLocation').textContent = cityName || '当前位置';

                        var windDir = degToWindDirection(winddirection);
                        var windText = '';
                        if (windspeed !== undefined && windspeed !== null) {
                            windText = windDir + ' ' + windspeed + ' km/h';
                        } else {
                            windText = windDir;
                        }
                        document.getElementById('weatherWindText').textContent = windText;

                    } catch (e) {
                        console.warn('天气获取失败:', e);
                        document.getElementById('weatherDesc').textContent = '获取失败';
                        document.getElementById('weatherWindText').textContent = '--';
                    }
                }

                    const descEl = document.getElementById('weatherDesc');

                        return;
                    }

                    if (!navigator.geolocation) {
                        locEl.textContent = DEFAULT_CITY;
                        descEl.textContent = '定位不支持';
                        currentLat = DEFAULT_LAT;
                        currentLon = DEFAULT_LON;
                        currentCity = DEFAULT_CITY;
                        fetchWeather(DEFAULT_LAT, DEFAULT_LON, DEFAULT_CITY);
                        return;
                    }

                    locEl.textContent = '定位中...';
                    descEl.textContent = '定位中';

                    navigator.geolocation.getCurrentPosition(
                        async function (position) {
                            const lat = position.coords.latitude;
                            const lon = position.coords.longitude;
                            const details = await fetchLocationDetails(lat, lon);
                            currentLat = lat;
                            currentLon = lon;
                            currentCity = details.displayName;
                            fetchWeather(lat, lon, details.displayName);

                    const weekdaysShort = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
