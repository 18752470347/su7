<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f2847">
    <title>苏FA36165 | 应用快速启动</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --snow-white: #FFFFFF;
            --ice-blue: #E6F0FF;
            --sky-blue: #B3D4FF;
            --tech-blue: #2288ff;
            --deep-red: #CC0000;
            --red: #E63946;
            --light-red: #FF6B6B;
            --sakura-pink: #FFB7C5;
            --sakura-light: #FFE4E9;
            --text-dark: #333333;
            --text-gray: #666666;
            --card-bg: rgba(255, 255, 255, 0.94);
            --card-shadow: 0 8px 32px rgba(204, 0, 0, 0.22);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --slow-speed: 36s;
            --normal-slow: 24s;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --card-bg: rgba(12, 16, 24, 0.92);
                --text-dark: #FFFFFF;
                --text-gray: #b0b4ba;
                --card-shadow: 0 8px 32px rgba(34, 136, 255, 0.25);
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(180deg, #061428 0%, #184075 35%, #74b8ff 75%, #ffffff 100%);
            position: relative;
            overflow: hidden;
            animation: bodyFadeIn 1s ease-out forwards;
            opacity: 0;
            will-change: opacity;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: linear-gradient(180deg, #02050a 0%, #081a36 40%, #102b4d 80%, #06101c 100%);
            }
        }

        @keyframes bodyFadeIn {
            to { opacity: 1; }
        }

        .outer-su7-title {
            font-size: 32px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 24px;
            background: linear-gradient(90deg, #ff0000,#ff8800,#ffff00,#00ff66,#00ccff,#9933ff,#ff0000);
            background-size: 700% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: logoRainbow var(--slow-speed) linear infinite;
            text-shadow:0 0 12px rgba(220,0,0,0.5);
            z-index: 10;
        }
        @keyframes logoRainbow { to { background-position: 700% 0; } }

        .bg-decoration {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
            transform: translate(var(--move-x,0), var(--move-y,0));
            transition: transform 0.1s linear;
            will-change: transform;
        }

        .tech-grid {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(rgba(34,136,255,0.12) 1px, transparent 1px),
                linear-gradient(90deg, rgba(34,136,255,0.12) 1px, transparent 1px);
            background-size: 40px 40px;
            opacity: 0.7;
            animation: gridPulse var(--normal-slow) ease-in-out infinite;
        }
        @keyframes gridPulse {
            0%,100% { opacity: 0.4; }
            50% { opacity: 0.8; }
        }

        .particle-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 999;
        }
        .text-particle {
            position: absolute;
            font-weight: 900;
            white-space: nowrap;
            pointer-events: none;
            will-change: transform, opacity;
        }

        /* 修改：旋转从720度改为180度，旋转速度变慢 */
        @keyframes particleFloatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-220px) rotate(180deg) scale(0.6);
                opacity: 0;
            }
        }

        .tech-track {
            position: absolute;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(34,136,255,0.75), transparent);
            animation: trackRun var(--slow-speed) linear infinite;
            opacity: 0.5;
            will-change: transform;
        }
        .tech-track:nth-child(1) {top:15%; width:25%; animation-delay:0s;}
        .tech-track:nth-child(2) {top:32%; width:40%; animation-delay:1.5s;}
        .tech-track:nth-child(3) {top:55%; width:30%; animation-delay:3s;}
        .tech-track:nth-child(4) {top:72%; width:45%; animation-delay:4.5s;}
        @keyframes trackRun {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100vw); }
        }

        .snow-hill {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: linear-gradient(180deg, transparent 0%, #FFFFFF 100%);
            opacity: 0.85;
        }
        @media (prefers-color-scheme: dark) {
            .snow-hill { opacity: 0.15; }
        }
        .snow-hill-2, .snow-hill-3 {
            position: absolute;
            bottom: 0;
            border-radius: 50% 50% 0 0;
            animation: hillSlowFloat var(--slow-speed) ease-in-out infinite alternate;
            opacity: 0.7;
        }
        .snow-hill-2 {
            left: -10%;
            width: 60%;
            height: 30%;
            background: #F8FAFF;
        }
        .snow-hill-3 {
            right: -5%;
            width: 50%;
            height: 25%;
            background: #F0F5FF;
            animation-direction: alternate-reverse;
            animation-duration: calc(var(--slow-speed) + 3s);
        }
        @media (prefers-color-scheme: dark) {
            .snow-hill-2, .snow-hill-3 { opacity: 0.12; }
        }
        @keyframes hillSlowFloat {
            from { transform: translateY(0); }
            to { transform: translateY(-12px); }
        }

        .moon {
            position: absolute;
            top: 10%;
            right: 15%;
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #FFFFFF 0%, #F0F8FF 50%, transparent 70%);
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.8);
            animation: moonGlow var(--normal-slow) ease-in-out infinite alternate, moonSlightMove var(--slow-speed) ease infinite;
            will-change: transform, box-shadow;
        }
        .moon::before{
            content:"";
            position:absolute;
            inset:-30px;
            background:conic-gradient(from 0deg, transparent 170deg, rgba(34,136,255,0.4) 180deg, transparent 190deg);
            animation: moonRaySpin var(--slow-speed) linear infinite;
            border-radius:50%;
            will-change: transform;
        }
        @keyframes moonRaySpin {
            to { transform: rotate(360deg); }
        }
        @keyframes moonGlow {
            from { 
                box-shadow: 0 0 40px rgba(255, 255, 255, 0.6);
                transform: scale(0.95);
            }
            to { 
                box-shadow: 0 0 80px rgba(255, 255, 255, 0.9);
                transform: scale(1.05);
            }
        }
        @keyframes moonSlightMove {
            0%,100% { transform: translate(0,0); }
            50% { transform: translate(-8px,6px); }
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #FFFFFF;
            border-radius: 50%;
            animation: starTwinkle 4s ease-in-out infinite;
            will-change: opacity, transform;
        }
        .star:nth-child(1) { top:15%; left:20%; animation-delay:0s; }
        .star:nth-child(2) { top:25%; left:40%; animation-delay:0.8s; }
        .star:nth-child(3) { top:10%; left:60%; animation-delay:1.6s; }
        .star:nth-child(4) { top:30%; left:80%; animation-delay:2.4s; }
        .star:nth-child(5) { top:20%; left:10%; animation-delay:3.2s; }
        .star:nth-child(6) { top:35%; left:30%; animation-delay:4s; }
        @keyframes starTwinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.4); }
        }

        .snowflake {
            position: absolute;
            top: -10%;
            background: #FFFFFF;
            border-radius: 50%;
            opacity: 0.8;
            animation: snowfall calc(var(--slow-speed) + 4s) linear infinite;
            box-shadow: 0 0 5px rgba(255, 255, 255, 0.8);
            will-change: transform, opacity;
        }
        @keyframes snowfall {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10%,90% { opacity: 0.8; }
            100% { transform: translateY(110vh) translateX(40px) rotate(360deg); opacity: 0; }
        }

        .sakura {
            position: absolute;
            top: -10%;
            width: 14px;
            height: 14px;
            background: var(--sakura-pink);
            border-radius: 50% 0 50% 50%;
            opacity: 0.7;
            animation: sakuraFall calc(var(--slow-speed) + 6s) linear infinite;
            box-shadow: 0 0 4px rgba(255, 183, 197, 0.7);
            will-change: transform, opacity;
        }
        @keyframes sakuraFall {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            10%,90% { opacity: 0.7; }
            100% { transform: translateY(110vh) translateX(-50px) rotate(360deg); opacity: 0; }
        }

        .su7-silhouette {
            position: absolute;
            bottom: 5%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            max-width: 600px;
            height: 180px;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 180"><path d="M50 120 Q80 60 150 60 Q220 60 250 80 Q280 100 350 100 Q420 100 480 70 Q520 50 550 60 L560 120 Z" fill="rgba(204,0,0,0.2)"/></svg>') no-repeat center bottom/contain;
            animation: silhouetteFloat var(--slow-speed) ease-in-out infinite alternate, carBreathLight 6s ease-in-out infinite;
            opacity: 0.6;
            overflow:hidden;
            will-change: transform, filter;
        }
        .su7-silhouette::after{
            content:"";
            position:absolute;
            top:0;
            left:-100%;
            width:80%;
            height:100%;
            background:linear-gradient(90deg, transparent, rgba(34,136,255,0.35), transparent);
            animation: carScanLight var(--slow-speed) linear infinite 2s;
            will-change: left;
        }
        @keyframes carScanLight { to { left:100%; } }
        @keyframes silhouetteFloat {
            from { transform: translateX(-50%) translateY(0); }
            to { transform: translateX(-50%) translateY(-10px); }
        }
        @keyframes carBreathLight {
            0%,100% { filter: drop-shadow(0 0 3px rgba(204,0,0,0.2)); }
            50% { filter: drop-shadow(0 0 12px rgba(204,0,0,0.5)); }
        }

        .ambient-light {
            position: absolute;
            bottom: 20px;
            left: 10%;
            width: 80%;
            height: 4px;
            background: linear-gradient(90deg, var(--deep-red), var(--red), var(--light-red), var(--sakura-pink), var(--red), var(--deep-red));
            background-size: 200% 100%;
            border-radius: 2px;
            animation: ambientFlow var(--slow-speed) linear infinite, lightPulse 4s ease-in-out infinite;
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.6);
            will-change: background-position, box-shadow;
        }
        @keyframes ambientFlow { to { background-position: 200% 0; } }
        @keyframes lightPulse {
            0%,100% { box-shadow: 0 0 12px rgba(204, 0, 0, 0.4); }
            50% { box-shadow: 0 0 22px rgba(204, 0, 0, 0.7); }
        }

        /* 卡片宽度再次缩小到260px，内边距精简 */
        .app-jump-container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            width: 100%;
            max-width: 260px;
            padding: 18px 14px;
            border-radius: 28px;
            box-shadow: var(--card-shadow);
            position: relative;
            z-index: 10;
            overflow: hidden;
            will-change: transform, opacity;
            animation: cardIn 0.9s ease-out forwards, cardFloat var(--normal-slow) ease-in-out infinite 1s;
        }
        .app-jump-container::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 28px;
            padding: 2px;
            background: linear-gradient(90deg, #2288ff, #ff3366, #ffdd00, #29e090, #9155ff, #2288ff);
            background-size: 400% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: borderMarquee var(--slow-speed) linear infinite;
            z-index: -1;
        }
        @keyframes borderMarquee {
            0% { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }

        .app-jump-container::after {
            content: "";
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(34,136,255,0.22), transparent, rgba(230,57,70,0.15), transparent);
            animation: cardShine var(--slow-speed) linear infinite 2s;
            will-change: left;
            z-index: -1;
        }
        @keyframes cardShine { to { left: 150%; } }
        @keyframes cardIn {
            0% { opacity: 0; transform: translateY(40px) scale(0.94); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes cardFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .plate-wrap {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }
        .car-plate {
            background: linear-gradient(180deg, #0077FF 0%, #0055CC 100%);
            border: 4px solid #C8A951;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25), inset 0 0 10px rgba(255,255,255,0.15);
            text-align: center;
            position: relative;
            width: 100%;
            max-width: 200px;
            padding: 8px 12px;
        }
        .car-plate::before {
            content: '';
            position: absolute;
            inset: 2px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px;
        }
        .plate-text {
            font-size: 15px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            color: var(--deep-red);
            text-align: center;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(204,0,0,0.3);
        }
        .title i {
            font-size: 20px;
            line-height: 1;
            animation: carIconDrive 2s ease-in-out infinite;
            display: inline-flex;
            align-items: center;
        }
        .title-text-wrap {
            display: inline-flex;
            overflow: hidden;
            align-items: center;
            line-height: 1;
        }
        .title-text-wrap span {
            opacity: 0;
            animation: wordFadeUp 0.6s ease-out forwards;
            line-height: 1;
        }
        @keyframes wordFadeUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes carIconDrive {
            0%, 100% { transform: translateX(0); }
            50% { transform: translateX(4px); }
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .app-jump-btn {
            position: relative;
            width: 100%;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(90deg, #ff2e5c, #ff9138, #ffdd33, #29e090, #00b8ff, #9155ff, #ff2e5c);
            background-size: 600% 100%;
            color: #fff;
            border: none;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            overflow: hidden;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 4px 18px rgba(255, 60, 120, 0.3);
            animation: btnSlide 0.7s ease-out forwards, rainbowRun var(--slow-speed) linear infinite;
            opacity: 0;
            transition: var(--transition);
            will-change: transform, box-shadow;
        }
        @keyframes rainbowRun { to { background-position: 600% 0; } }
        .app-jump-btn:nth-child(1) { animation-delay: 0.5s, 0s; }
        .app-jump-btn:nth-child(2) { animation-delay: 0.6s, 0s; }
        .app-jump-btn:nth-child(3) { animation-delay: 0.7s, 0s; }
        .app-jump-btn:nth-child(4) { animation-delay: 0.8s, 0s; }
        .app-jump-btn:nth-child(5) { animation-delay: 0.9s, 0s; }
        @keyframes btnSlide {
            0% { opacity: 0; transform: translateX(-30px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        .app-jump-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s ease;
            will-change: left;
        }
        .app-jump-btn::after {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 60%);
            transform: scale(0);
            opacity: 0;
            will-change: transform, opacity;
        }
        .app-jump-btn:active:not(:disabled)::after {
            animation: btnRipple 0.5s ease-out;
        }
        @keyframes btnRipple {
            to { transform: scale(2); opacity: 0; }
        }
        .app-jump-btn:hover:not(:disabled)::before { left: 100%; }
        .app-jump-btn:hover:not(:disabled) {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 8px 30px rgba(255, 80, 140, 0.45), 0 0 35px rgba(0, 180, 255, 0.25);
        }
        .app-jump-btn:active:not(:disabled) {
            transform: scale(0.97) translateY(0);
            box-shadow: 0 2px 10px rgba(255, 60, 120, 0.25);
        }
        .app-jump-btn:disabled {
            background: #777 !important;
            animation: none !important;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }
        .app-jump-btn i {
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .tips {
            font-size: 12px;
            color: var(--text-dark);
            font-weight: 500;
            text-align: center;
            line-height: 1.6;
            opacity: 0;
            animation: fadeText 1s ease-out 0.9s forwards;
        }
        @keyframes fadeText { to { opacity: 1; } }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @media (max-width: 375px) {
            .outer-su7-title { font-size: 24px; margin-bottom: 14px; }
            .app-jump-container { padding: 16px 12px; max-width: 240px; }
            .title { font-size: 20px; }
            .app-jump-btn { height: 46px; font-size: 13px; gap: 6px; }
            .app-jump-btn i { font-size: 14px; }
            .text-particle { font-size: 10px !important; }
            .car-plate { max-width: 180px; }
            .plate-text { font-size: 14px; }
        }
    </style>
</head>
<body>
    <div class="particle-layer" id="particleLayer"></div>

    <div class="bg-decoration">
        <div class="tech-grid"></div>
        <div class="tech-track"></div>
        <div class="tech-track"></div>
        <div class="tech-track"></div>
        <div class="tech-track"></div>

        <div class="snow-hill"></div>
        <div class="snow-hill-2"></div>
        <div class="snow-hill-3"></div>
        
        <div class="moon"></div>
        
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        <div class="star"></div>
        
        <div class="su7-silhouette"></div>
        <div class="ambient-light"></div>
    </div>

    <div class="outer-su7-title">Xiaomi SU7 Pro</div>

    <div class="app-jump-container">
        <div class="plate-wrap">
            <div class="car-plate">
                <div class="plate-text">苏FA36165</div>
            </div>
        </div>

        <h2 class="title">
            <i class="fa-solid fa-car-side"></i>
            <div class="title-text-wrap">
                <span style="animation-delay:0.5s">点</span>
                <span style="animation-delay:0.6s">击</span>
                <span style="animation-delay:0.7s">按</span>
                <span style="animation-delay:0.8s">钮</span>
                <span style="animation-delay:0.9s">跳</span>
                <span style="animation-delay:1s">转</span>
                <span style="animation-delay:1.1s">应</span>
                <span style="animation-delay:1.2s">用</span>
            </div>
        </h2>

        <div class="btn-group">
            <button class="app-jump-btn" data-app="custom2" aria-label="打开A➕系统">
                <i class="fa-solid fa-plus"></i>打开A➕系统
            </button>
            <button class="app-jump-btn" data-app="custom1" aria-label="打开LX Music">
                <i class="fa-solid fa-music"></i>打开LX Music
            </button>
            <button class="app-jump-btn" data-app="custom3" aria-label="打开YouTube">
                <i class="fa-brands fa-youtube"></i>打开YouTube
            </button>
            <button class="app-jump-btn" data-app="custom4" aria-label="打开FlClash">
                <i class="fa-solid fa-globe"></i>打开FlClash
            </button>
            <button class="app-jump-btn" data-app="custom5" aria-label="打开高德地图">
                <i class="fa-solid fa-map-location-dot"></i>打开高德地图
            </button>
        </div>
        <p class="tips" id="tips">狗日的小米&nbsp;&nbsp;日狗的雷军<br>苏FA36165 · 私人应用快速跳转工具</p>
    </div>

    <script>
        const APP_CONFIG_MAP = {
            custom1: {scheme: 'anywhere://open?sid=0444',timeout: 1800,name: 'LX Music',icon: 'fa-music'},
            custom2: {scheme: 'anywhere://open?sid=2848',timeout: 1800,name: 'A+',icon: 'fa-plus'},
            custom3: {scheme: 'anywhere://open?sid=0451',timeout: 1800,name: 'YouTube',icon: 'fa-youtube'},
            custom4: {scheme: 'anywhere://open?sid=2305',timeout: 1800,name: 'FlClash',icon: 'fa-globe'},
            custom5: {scheme: 'anywhere://open?sid=7535',timeout: 1800,name: '高德地图',icon: 'fa-map-location-dot'}
        };
        const PARTICLE_TEXT_LIST = ["XIAOMI SU7 Pro", "苏FA36165"];
        const PARTICLE_COUNT_PER_CLICK = 1;
        const PARTICLE_ANIM_DURATION = 16.0;

        function createSu7Particle(x, y) {
            const particleLayer = document.getElementById('particleLayer');
            for (let i = 0; i < PARTICLE_COUNT_PER_CLICK; i++) {
                const particle = document.createElement('div');
                particle.className = 'text-particle';
                particle.innerText = PARTICLE_TEXT_LIST[Math.floor(Math.random() * PARTICLE_TEXT_LIST.length)];

                const randomSize = Math.floor(Math.random() * 10) + 14;
                const colorArr = ['#cc0000','#ff3366','#2288ff','#ffdd00','#ffffff'];
                const randomColor = colorArr[Math.floor(Math.random() * colorArr.length)];
                const randomDuration = (Math.random() * 4 + PARTICLE_ANIM_DURATION).toFixed(2);
                const offsetX = (Math.random() - 0.5) * 120;

                particle.style.fontSize = `${randomSize}px`;
                particle.style.color = randomColor;
                particle.style.textShadow = `0 0 6px ${randomColor}`;
                particle.style.left = `${x + offsetX}px`;
                particle.style.top = `${y}px`;
                particle.style.animation = `particleFloatUp ${randomDuration}s ease-out forwards`;

                particleLayer.appendChild(particle);
                setTimeout(() => particleLayer.removeChild(particle), randomDuration * 1000);
            }
        }

        function createSnowflakes() {
            const container = document.querySelector('.bg-decoration');
            const count = 28;
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'snowflake';
                const size = Math.random() * 5 + 2;
                el.style.width = el.style.height = `${size}px`;
                el.style.left = `${Math.random() * 100}%`;
                el.style.animationDuration = `${Math.random() * 12 + 8}s`;
                el.style.animationDelay = `${Math.random() * 10}s`;
                container.appendChild(el);
            }
        }

        function createSakura() {
            const container = document.querySelector('.bg-decoration');
            const count = 18;
            for (let i = 0; i < count; i++) {
                const el = document.createElement('div');
                el.className = 'sakura';
                const size = Math.random() * 8 + 6;
                el.style.width = el.style.height = `${size}px`;
                el.style.left = `${Math.random() * 100}%`;
                el.style.animationDuration = `${Math.random() * 18 + 14}s`;
                el.style.animationDelay = `${Math.random() * 15}s`;
                el.style.opacity = Math.random() * 0.4 + 0.5;
                container.appendChild(el);
            }
        }

        function initParallax() {
            const bgWrap = document.querySelector('.bg-decoration');
            const sensitivity = 0.04;
            document.addEventListener('mousemove', e => {
                const x = (e.clientX - window.innerWidth / 2) * sensitivity;
                const y = (e.clientY - window.innerHeight / 2) * sensitivity;
                bgWrap.style.setProperty('--move-x', `${x}px`);
                bgWrap.style.setProperty('--move-y', `${y}px`);
            });
        }

        function jumpToApp(appKey) {
            const cfg = APP_CONFIG_MAP[appKey];
            if (!cfg) return;
            const btn = document.querySelector(`[data-app="${appKey}"]`);
            const tips = document.getElementById('tips');

            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i>正在打开${cfg.name}...`;
            tips.textContent = `若长时间未跳转，请检查是否安装${cfg.name}`;

            const iframe = document.createElement('iframe');
            iframe.style.display = 'none';
            iframe.src = cfg.scheme;
            document.body.appendChild(iframe);

            setTimeout(() => {
                document.body.removeChild(iframe);
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid ${cfg.icon}"></i>打开${cfg.name}`;
                tips.innerHTML = '狗日的小米&nbsp;&nbsp;日狗的雷军<br>苏FA36165 · 私人应用快速跳转工具';
            }, cfg.timeout);
        }

        window.addEventListener('load', function() {
            createSnowflakes();
            createSakura();
            initParallax();
        });

        document.addEventListener('click', e => {
            createSu7Particle(e.clientX, e.clientY);
        });

        document.querySelectorAll('.app-jump-btn').forEach(btn => {
            btn.addEventListener('click', e => {
                e.stopPropagation();
                jumpToApp(btn.dataset.app);
            });
        });
    </script>
</body>
</html>
